<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Champions Penalty — Ліга Чемпіонів</title>
<script>const tgS=document.createElement('script');tgS.src=['https:/','/telegram.org','/js/telegram-web-app.js'].join('');document.head.appendChild(tgS);</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:sans-serif;background:#080e1a;color:#fff;margin:0;padding:8px;display:flex;flex-direction:column;min-height:100vh;user-select:none}
.top-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.tnav{background:#121b2b;border:1px solid #24344d;color:#dce6f7;text-decoration:none;text-align:center;padding:9px 4px;border-radius:11px;font-size:12px;font-weight:bold;cursor:pointer}
.tnav.act{background:#192740;border-color:#feca57;color:#feca57}
.box{background:#111927;border:1px solid #22314a;border-radius:13px;padding:9px 12px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center}
.bar{width:100%;height:5px;background:#1c293d;border-radius:4px;overflow:hidden;margin:5px 0}
.fill{height:100%;background:#1dd1a1;transition:width .3s}
.match-hero{background:linear-gradient(180deg,#152238,#0f1829);border:1.5px solid #2c436b;border-radius:15px;padding:12px;margin-bottom:9px;text-align:center}
.mh-sub{font-size:11px;font-weight:800;color:#70a1ff;letter-spacing:.4px;margin-bottom:5px}
.mh-vs{font-size:15px;font-weight:900;color:#fff;margin-bottom:11px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.btn-blue{width:100%;padding:13px;border-radius:12px;border:none;background:linear-gradient(180deg,#4073e8,#2c54b8);color:#fff;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 4px 14px rgba(44,84,184,.4)}
.btn-blue:active{transform:scale(.98)}
.btn-gold{width:100%;padding:13px;border-radius:12px;border:none;background:linear-gradient(135deg,#feca57,#ff9f43);color:#1c1202;font-weight:900;font-size:14px;cursor:pointer}
.btn-sec{width:100%;padding:9px;border-radius:11px;border:1px solid #2a3c59;background:#152033;color:#9fb0c7;font-weight:bold;font-size:12px;cursor:pointer;margin-top:6px}
.sub-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:9px}
.stab{background:#111927;border:1px solid #22314a;color:#8c9eb5;padding:8px 3px;border-radius:10px;font-size:11px;font-weight:bold;cursor:pointer;text-align:center}
.stab.act{background:#18263d;border-color:#70a1ff;color:#fff}
.stab.done{border-color:#1dd1a1;color:#1dd1a1}
.grp-card{background:#101826;border:1px solid #202f47;border-radius:13px;padding:10px;margin-bottom:8px}
.grp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;font-weight:900;color:#70a1ff}
.grp-h span:last-child{font-size:10px;color:#1dd1a1;font-weight:bold}
.m-item{background:#141e30;border:1px solid #253654;border-radius:11px;padding:9px 11px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.m-item:last-child{margin-bottom:0}
.m-item.me{border-color:#1dd1a1;background:rgba(29,209,161,.12)}
.t-name{display:flex;align-items:center;gap:5px;font-weight:bold}
.t-me{color:#1dd1a1;font-weight:900}
.sc-pill{background:#0c1320;border:1px solid #2c4063;padding:3px 9px;border-radius:8px;font-weight:900;font-size:12px;color:#feca57;min-width:46px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(4,8,16,.88);display:none;align-items:center;justify-content:center;padding:14px;z-index:50}
.modal.open{display:flex}
.mcard-box{background:#121b2b;border:1.5px solid #feca57;border-radius:16px;width:100%;max-width:360px;padding:16px;text-align:center}
</style>
</head>
<body>
<div class="top-nav">
  <a href="index.html" class="tnav" onclick="localStorage.removeItem('pc_play_ucl')">🏠 Головна</a>
  <a href="turnir.html" class="tnav act">🏆 Ліга Чемпіонів</a>
  <a href="statustuca.html" class="tnav">📊 Рейтинг</a>
</div>

<div class="box">
  <div class="row">
    <b style="color:#feca57;font-size:14px">Рівень <span id="lv">1</span> • 🏆 ЛЧ: <span id="cp">0</span></b>
    <b style="color:#feca57;font-size:14px">💰 <span id="cn">20</span></b>
  </div>
  <div class="bar"><div class="fill" id="xb"></div></div>
  <div class="row" style="font-size:11px;color:#8c9eb5">
    <span>XP: <span id="pt">0</span>/<span id="nx">100</span></span>
    <span style="color:#1dd1a1;font-weight:bold">Плей-оф • 1/8 → Фінал ЛЧ</span>
  </div>
</div>

<div id="app"></div>

<div class="modal" id="mConfirm" onclick="if(event.target===this)closeConfirm()">
  <div class="mcard-box">
    <div style="font-size:34px;margin-bottom:6px">🏆</div>
    <h3 style="margin:0 0 6px;color:#feca57;font-size:17px">Вступний внесок у Лігу Чемпіонів</h3>
    <p style="margin:0 0 14px;font-size:13px;color:#b8c6db;line-height:1.4">
      Для участі у розіграші Ліги Чемпіонів (1/8, 1/4, 1/2 та Фінал) потрібно сплатити <b style="color:#feca57">100 💰</b>.<br>
      <span style="font-size:11px;color:#1dd1a1">Нагорода за Кубок ЛЧ: +500 💰 та +1 🏆 трофей!</span>
    </p>
    <div id="confirmErr" style="color:#ff6b81;font-size:12px;font-weight:bold;margin-bottom:8px;display:none"></div>
    <button class="btn-gold" onclick="confirmStartUCL()">✅ Підтвердити та сплатити 100 💰</button>
    <button class="btn-sec" onclick="closeConfirm()">Скасувати</button>
  </div>
</div>
<script>
try{window.Telegram.WebApp.ready();window.Telegram.WebApp.expand();}catch(e){}
const BIN_ID='6b01a76bffd5d16053d39022',API_KEY='$2a$10$FfzYgApncFFRJpoFkrYgyOZHPwjviuwu1N64Suvm4DneHJP..xKna',API_URL=['https:/','/api.jsonbin.io','/v3/b/',BIN_ID].join('');

const CLUBS=[
  {n:'Реал Мадрид',i:'👑',c:'#f5f6fa',dark:'#cfd6de',str:95},{n:'Барселона',i:'🔵🔴',c:'#a50044',dark:'#5e0026',str:92},
  {n:'Баварія',i:'🔴⚪',c:'#dc052d',dark:'#85021a',str:93},{n:'Манчестер Сіті',i:'🩵',c:'#6cabdd',dark:'#386c96',str:94},
  {n:'ПСЖ',i:'🗼',c:'#004170',dark:'#00213b',str:91},{n:'Арсенал',i:'🔫',c:'#ef0107',dark:'#910004',str:90},
  {n:'Інтер Мілан',i:'🐍',c:'#010e80',dark:'#000747',str:90},{n:'Ліверпуль',i:'🦅',c:'#c8102e',dark:'#78081a',str:91},
  {n:'Атлетіко',i:'🔴⚪',c:'#cb3524',dark:'#7d1e13',str:89},{n:'Боруссія Д',i:'🐝',c:'#fde100',dark:'#b5a000',str:87},
  {n:'Ювентус',i:'🦓',c:'#e5e5e5',dark:'#999999',str:87},{n:'Байєр',i:'💊',c:'#e32221',dark:'#8a1110',str:89},
  {n:'Мілан',i:'⚫🔴',c:'#fb090b',dark:'#960304',str:88},{n:'Бенфіка',i:'🦅',c:'#e83030',dark:'#8f1818',str:85},
  {n:'Спортінг',i:'🦁',c:'#008057',dark:'#004730',str:86}
];

const RNDS=[
  {key:'r16',n:'1/8 фіналу',r:60},
  {key:'qf',n:'1/4 фіналу',r:110},
  {key:'sf',n:'Півфінал',r:200},
  {key:'fn',n:'ФІНАЛ ЛЧ',r:500}
];

let p={pt:0,lv:1,cp:0,cn:20,ow:['j1','p1','s1','b1','k1'],ej:'j1',ep:'p1',es:'s1',eb:'b1',ek:'k1',num:'10',numCol:'#ffffff',ucl:null,nick:'',uid:'',lastBonus:0,opt:{snd:true,vib:true,fx:true}};

function loadWallet(){
  try{
    const v=JSON.parse(localStorage.getItem('pc_ucl1'));
    if(v)p=Object.assign(p,v);
  }catch(e){}
  if(!p.uid)p.uid='u'+Math.floor(100000+Math.random()*900000);
  if(isNaN(Number(p.cn)))p.cn=20;
  if(p.ucl && !Array.isArray(p.ucl.r16)){
    p.ucl=null;
  }
  save();
}
function save(){try{localStorage.setItem('pc_ucl1',JSON.stringify(p));}catch(e){}}
loadWallet();

async function pushScoreToCloud(){
  if(!p||!p.uid)return;
  try{
    const r=await fetch(API_URL+'/latest',{headers:{'X-Master-Key':API_KEY}});if(!r.ok)return;
    const j=await r.json(),list=Array.isArray(j.record)?j.record:[],map=new Map();
    list.forEach(u=>{if(u&&u.uid&&u.uid!=='init')map.set(u.uid,u);});
    map.set(p.uid,{uid:p.uid,n:p.nick||('Гравець #'+p.uid.slice(-4)),cn:Number(p.cn)||0,lv:Number(p.lv)||1,cp:Number(p.cp)||0});
    const top=Array.from(map.values()).sort((a,b)=>(b.cn-a.cn)||(b.cp-a.cp)||(b.lv-a.lv)).slice(0,100);
    await fetch(API_URL,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':API_KEY},body:JSON.stringify(top)});
  }catch(e){}
}

function updHeader(){
  lv.textContent=p.lv;cp.textContent=p.cp;cn.textContent=p.cn;
  const nxXp=p.lv*100;pt.textContent=p.pt;nx.textContent=nxXp;
  xb.style.width=Math.min(100,(p.pt/nxXp)*100)+'%';
}
function openConfirm(){
  confirmErr.style.display='none';
  mConfirm.classList.add('open');
}
function closeConfirm(){
  mConfirm.classList.remove('open');
}

function confirmStartUCL(){
  if((Number(p.cn)||0)<100){
    confirmErr.textContent=`❌ Недостатньо монет! Потрібно 100 💰 (у тебе ${p.cn} 💰). Зароби у спарингу або набиванням м’яча!`;
    confirmErr.style.display='block';
    return;
  }
  p.cn-=100;
  closeConfirm();
  initBracket();
  save();updHeader();pushScoreToCloud();render();
}

function initBracket(){
  const myTeam={
    n:p.nick||'Твій Клуб',
    i:'🇺🇦',
    c:'#1dd1a1',
    dark:'#0d8a68',
    str:90,
    isMe:true
  };

  const bots=[...CLUBS].sort(()=>Math.random()-0.5).slice(0,15).map(b=>({
    n:b.n,i:b.i,c:b.c,dark:b.dark,str:b.str,isMe:false
  }));

  const r16=[{a:myTeam,b:bots.at(0),sc:''}];
  for(let i=1;i<15;i+=2){
    r16.push({a:bots.at(i),b:bots.at(i+1),sc:''});
  }

  p.ucl={
    active:true,
    champ:null,
    rnd:0,
    r16:r16,
    qf:[],
    sf:[],
    fn:[]
  };
  viewRnd=0;
}
function playUCLMatch(){
  if(!p.ucl||!p.ucl.active)return;
  localStorage.setItem('pc_play_ucl','1');
  location.href='game.html?mode=ucl';
}

function getActiveMatch(){
  if(!p.ucl||!p.ucl.active)return null;
  const rObj=RNDS.at(p.ucl.rnd)||RNDS.at(0);
  const arr=p.ucl[rObj.key]||[];
  return arr.find(m=>m.a.isMe||m.b.isMe)||null;
}
let viewRnd=0;

function render(){
  updHeader();
  const app=document.getElementById('app');

  if(!p.ucl){
    app.innerHTML=`
      <div class="match-hero">
        <div class="mh-sub">UEFA CHAMPIONS LEAGUE • СЕЗОН</div>
        <div class="mh-vs">🏆 16 НАЙКРАЩИХ КЛУБІВ ЄВРОПИ</div>
        <p style="font-size:12px;color:#9fb0c7;margin:0 0 12px">
          Пройди плей-оф від 1/8 фіналу до Фіналу Ліги Чемпіонів та здобудь головний трофей!
        </p>
        <button class="btn-gold" onclick="openConfirm()">🏆 Грати Лігу Чемпіонів (100 💰)</button>
      </div>`;
    return;
  }

  if(p.ucl.champ){
    app.innerHTML=`
      <div class="match-hero" style="border-color:#feca57">
        <div class="mh-sub" style="color:#feca57">🏆 ЧЕМПІОН ЛІГИ ЧЕМПІОНІВ!</div>
        <div class="mh-vs">🇺🇦 ${p.nick||'Твій Клуб'} — Володар Кубка ЛЧ!</div>
        <button class="btn-gold" onclick="openConfirm()">🔄 Новий сезон Ліги Чемпіонів (100 💰)</button>
      </div>
      ${renderRoundTabs()}
      ${renderRoundMatches()}`;
    return;
  }
  const rObj=RNDS.at(p.ucl.rnd)||RNDS.at(0);
  const myM=getActiveMatch();
  const opp=myM?(myM.a.isMe?myM.b:myM.a):null;
  if(viewRnd>p.ucl.rnd)viewRnd=p.ucl.rnd;

  app.innerHTML=`
    <div class="match-hero">
      <div class="mh-sub">ПЛЕЙ-ОФ ЛЧ • ${rObj.n.toUpperCase()} (🏟 ВДОМА)</div>
      <div class="mh-vs">
        <span>🇺🇦 ${p.nick||'Твій Клуб'}</span>
        <span style="color:#70a1ff;font-size:13px">vs</span>
        <span>${opp?`${opp.i} ${opp.n}`:'—'}</span>
      </div>
      <button class="btn-blue" onclick="playUCLMatch()">⚽ Грати матч (${rObj.n})</button>
    </div>

    ${renderRoundTabs()}
    ${renderRoundMatches()}

    <button class="btn-sec" onclick="if(confirm('Завершити поточний розіграш ЛЧ?')){p.ucl=null;save();render();}">🗑 Завершити поточний сезон</button>`;
}

function renderRoundTabs(){
  const cur=p.ucl.champ?3:p.ucl.rnd;
  return `
    <div class="sub-tabs">
      ${RNDS.map((r,idx)=>{
        const cls=viewRnd===idx?'act':(idx<cur?'done':'');
        return `<button class="stab ${cls}" onclick="viewRnd=${idx};render()">${r.n}</button>`;
      }).join('')}
    </div>`;
}
function renderRoundMatches(){
  const rObj=RNDS.at(viewRnd)||RNDS.at(0);
  const list=p.ucl[rObj.key]||[];

  if(!list.length){
    return `
      <div class="grp-card" style="text-align:center;color:#8c9eb5;font-size:12px;padding:18px">
        Пари стадії <b>${rObj.n}</b> сформуються після завершення попереднього раунду.
      </div>`;
  }

  return `
    <div class="grp-card">
      <div class="grp-h">
        <span>${rObj.n.toUpperCase()}</span>
        <span>Нагорода: +${rObj.r} 💰</span>
      </div>
      ${list.map(m=>{
        const isMy=(m.a.isMe||m.b.isMe);
        const pts=m.sc?m.sc.split(':').map(Number):null;
        const aWin=pts?(pts.at(0)>pts.at(1)):false;
        const bWin=pts?(pts.at(1)>pts.at(0)):false;
        return `
          <div class="m-item ${isMy?'me':''}">
            <div class="t-name ${m.a.isMe?'t-me':''}" style="flex:1;justify-content:flex-start;opacity:${pts&&!aWin?.5:1}">
              <span>${m.a.i}</span><span>${m.a.n}</span>
            </div>
            <div class="sc-pill">${m.sc||'vs'}</div>
            <div class="t-name ${m.b.isMe?'t-me':''}" style="flex:1;justify-content:flex-end;opacity:${pts&&!bWin?.5:1}">
              <span>${m.b.n}</span><span>${m.b.i}</span>
            </div>
          </div>`;
      }).join('')}
    </div>`;
}
if(p.ucl){
  viewRnd=p.ucl.champ?3:(p.ucl.rnd||0);
}
localStorage.removeItem('pc_play_ucl');
render();
</script>
</body>
</html>
