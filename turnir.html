<script>
try{window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}catch(e){}
const CLUBS=[
  {n:'Реал Мадрид',i:'👑',c:'#f5f6fa',dark:'#cfd6de'},{n:'Барселона',i:'🔵🔴',c:'#a50044',dark:'#5e0026'},
  {n:'Баварія',i:'🔴⚪',c:'#dc052d',dark:'#85021a'},{n:'Манчестер Сіті',i:'🩵',c:'#6cabdd',dark:'#386c96'},
  {n:'ПСЖ',i:'🗼',c:'#004170',dark:'#00213b'},{n:'Арсенал',i:'🔫',c:'#ef0107',dark:'#910004'},
  {n:'Інтер Мілан',i:'🐍',c:'#010e80',dark:'#000747'},{n:'Ліверпуль',i:'🦅',c:'#c8102e',dark:'#78081a'},
  {n:'Атлетіко',i:'🔴⚪',c:'#cb3524',dark:'#7d1e13'},{n:'Боруссія Д',i:'🐝',c:'#fde100',dark:'#b5a000'},
  {n:'Ювентус',i:'🦓',c:'#e5e5e5',dark:'#999999'},{n:'Байєр',i:'💊',c:'#e32221',dark:'#8a1110'},
  {n:'Мілан',i:'⚫🔴',c:'#fb090b',dark:'#960304'},{n:'Бенфіка',i:'🦅',c:'#e83030',dark:'#8f1818'},
  {n:'Спортінг',i:'🦁',c:'#008057',dark:'#004730'},{n:'Аталанта',i:'🔵⚫',c:'#1e71b8',dark:'#0e3b63'},
  {n:'РБ Лейпциг',i:'🐂',c:'#dd0741',dark:'#820325'},{n:'Порту',i:'🐉',c:'#00428c',dark:'#00224a'},
  {n:'ПСВ',i:'💡',c:'#ed1c24',dark:'#8f0d12'},{n:'Феєнорд',i:'🔴⚪',c:'#e30613',dark:'#85030a'},
  {n:'Астон Вілла',i:'🦁',c:'#670e36',dark:'#3b061e'},{n:'Монако',i:'🇲🇨',c:'#e51b23',dark:'#8a0d12'},
  {n:'Лілль',i:'🐕',c:'#e01e13',dark:'#850f08'},{n:'Жирона',i:'⚪🔴',c:'#cc2229',dark:'#7a1116'},
  {n:'Штутгарт',i:'⚪🔴',c:'#e32219',dark:'#87110c'},{n:'Болонья',i:'🔴🔵',c:'#1a2f48',dark:'#0b1624'},
  {n:'Селтік',i:'☘️',c:'#018749',dark:'#004d29'},{n:'Брюгге',i:'🔵⚫',c:'#0070b8',dark:'#003e66'},
  {n:'Шахтар',i:'⚒️',c:'#f37021',dark:'#99400b'},{n:'Динамо Загреб',i:'🔵',c:'#005ca9',dark:'#003361'},
  {n:'Зальцбург',i:'🐂',c:'#d4002a',dark:'#7d0018'},{n:'Спарта Прага',i:'🔴',c:'#9c1c26',dark:'#5c0e14'}
];
const RNDS=[{n:'1/8 Фінал',r:60},{n:'1/4 Фінал',r:110},{n:'Півфінал',r:200},{n:'ФІНАЛ ЛЧ',r:500}];
const SHOP=[
  {id:'j1',col:'#1dd1a1',dark:'#0d8a68',trim:'#ffffff'},{id:'j2',col:'#f5f6fa',dark:'#cfd6de',trim:'#1e272e'},
  {id:'j3',col:'#d63031',dark:'#8e1b1c',trim:'#ffffff'},{id:'j4',col:'#1e3799',dark:'#0c1a52',trim:'#feca57'},
  {id:'j5',col:'#1e272e',dark:'#0b0f14',trim:'#1dd1a1'},{id:'j6',col:'#feca57',dark:'#c49014',trim:'#1e272e'},
  {id:'p1',col:'#ffffff',dark:'#cfd6de'},{id:'p2',col:'#1e272e',dark:'#0b0f14'},{id:'p3',col:'#1e3799',dark:'#0c1a52'},
  {id:'p4',col:'#d63031',dark:'#8e1b1c'},{id:'p5',col:'#00a8ff',dark:'#006299'},{id:'p6',col:'#feca57',dark:'#c49014'},
  {id:'s1',col:'#14181d',ac:'#1dd1a1'},{id:'s2',col:'#f5f6fa',ac:'#eb4d4b'},{id:'s3',col:'#00d2ff',ac:'#ffffff'},{id:'s4',col:'#feca57',ac:'#1e272e'},
  {id:'b1',bn:0,col:'#ffffff'},{id:'b2',bn:5,col:'#ff5e57'},{id:'b3',bn:12,col:'#00d2ff'},{id:'b4',bn:25,col:'#feca57'},
  {id:'k1',bn:0,col:'#1dd1a1'},{id:'k2',bn:10,col:'#ff9ff3'}
];
let p={pt:0,lv:1,cp:0,cn:20,ow:['j1','p1','s1','b1','k1'],ej:'j1',ep:'p1',es:'s1',eb:'b1',ek:'k1',num:'10',numCol:'#ffffff',ucl:null};
let freeOpp=CLUBS.at(Math.floor(Math.random()*15)),uclMatchActive=false,uclSubTab='mygrp';
function save(){try{localStorage.setItem('pc_ucl1',JSON.stringify(p))}catch(e){}}
try{
  const old=JSON.parse(localStorage.getItem('pc_3d8')),v=JSON.parse(localStorage.getItem('pc_ucl1'));
  if(v)p=Object.assign(p,v);else if(old){p=Object.assign(p,old);save();}
}catch(e){}
if(p.ucl&&p.ucl.active&&(!Array.isArray(p.ucl.groups)||!p.ucl.groups.length)){p.ucl=null;save();}
function getItem(id){return SHOP.find(x=>x.id===id)||SHOP.at(0);}
function getCurOpponent(){
  if(uclMatchActive&&p.ucl&&p.ucl.active){
    if(p.ucl.stage==='group'){
      const grp=p.ucl.groups.find(g=>g.teams.some(t=>t.isMe))||p.ucl.groups.at(0);
      const me=grp.teams.find(t=>t.isMe),rObj=grp.schedule.at(p.ucl.gRnd);
      const m=rObj.matches.find(x=>x.home===me.id||x.away===me.id);
      const isHome=(m.home===me.id),opp=grp.teams.find(t=>t.id===(isHome?m.away:m.home));
      return Object.assign({},opp,{isHome,tour:p.ucl.gRnd+1,grpName:grp.name});
    }
    const arr=[p.ucl.r16,p.ucl.qf,p.ucl.sf,p.ucl.fn].at(p.ucl.rnd)||[];
    const myM=arr.find(m=>m.a.isMe||m.b.isMe);
    if(myM)return myM.a.isMe?myM.b:myM.a;
  }
  return freeOpp;
}

function switchView(v){
  playView.style.display=v==='play'?'flex':'none';
  uclBox.style.display=v==='ucl'?'block':'none';
  tPlay.classList.toggle('on',v==='play');
  tUcl.classList.toggle('on',v==='ucl');
  if(v==='play'){rsz3D();updUI();renderCtrl();}else renderUCL();
}
function initUCL(){
  const pool=[...CLUBS].sort(()=>Math.random()-0.5).slice(0,31);
  const all32=[{n:'Твій Клуб',i:'🇺🇦',c:getItem(p.ej).col,dark:'#0b0f14',isMe:true},...pool];
  const letters=['A','B','C','D','E','F','G','H'],groups=[];
  for(let g=0;g<8;g++){
    const s=all32.slice(g*4,g*4+4).map((c,idx)=>({id:`g${g}_${idx}`,n:c.n,i:c.i,c:c.c,dark:c.dark||'#1e272e',isMe:!!c.isMe,pl:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));
    const t0=s.at(0),t1=s.at(1),t2=s.at(2),t3=s.at(3);
    groups.push({name:letters.at(g),teams:s,schedule:[
      {rnd:1,matches:[{home:t0.id,away:t1.id,sc:null},{home:t2.id,away:t3.id,sc:null}]},
      {rnd:2,matches:[{home:t3.id,away:t0.id,sc:null},{home:t1.id,away:t2.id,sc:null}]},
      {rnd:3,matches:[{home:t0.id,away:t2.id,sc:null},{home:t3.id,away:t1.id,sc:null}]},
      {rnd:4,matches:[{home:t1.id,away:t0.id,sc:null},{home:t3.id,away:t2.id,sc:null}]},
      {rnd:5,matches:[{home:t0.id,away:t3.id,sc:null},{home:t2.id,away:t1.id,sc:null}]},
      {rnd:6,matches:[{home:t2.id,away:t0.id,sc:null},{home:t1.id,away:t3.id,sc:null}]}
    ]});
  }
  p.ucl={active:true,stage:'group',gRnd:0,groups,rnd:0,r16:[],qf:[],sf:[],fn:[],champ:null,eliminated:false};
  uclSubTab='mygrp';save();renderUCL();
}
function sortGrp(grp){
  return [...grp.teams].sort((a,b)=>(b.pts-a.pts)||((b.gf-b.ga)-(a.gf-a.ga))||(b.gf-a.gf)||(a.isMe?-1:1));
}
function startUCLMatch(){
  uclMatchActive=true;pS=[];bS=[];ph='sh';resetPositions();
  ms.style.borderColor='#feca57';ms.textContent='⚽ Твій удар! Вибери кут';
  switchView('play');
}
function renderGroupCard(grp,showSched){
  const sorted=sortGrp(grp),me=grp.teams.find(t=>t.isMe),u=p.ucl;
  const rows=sorted.map((t,idx)=>`<tr class="${idx<2?'q-pass':''} ${t.isMe?'me-row':''}"><td>${idx+1}</td><td>${t.i} ${t.n}</td><td>${t.pl}</td><td>${t.w}</td><td>${t.d||0}</td><td>${t.l}</td><td>${t.gf}:${t.ga}</td><td><b>${t.pts}</b></td></tr>`).join('');
  let sched='';
  if(showSched&&me){
    sched='<div style="margin-top:6px;font-size:11px;color:#70a1ff;font-weight:bold">📅 Календар матчів групи:</div>';
    grp.schedule.forEach((rObj,rIdx)=>{
      const m=rObj.matches.find(x=>x.home===me.id||x.away===me.id);
      const isH=(m.home===me.id),opp=grp.teams.find(t=>t.id===(isH?m.away:m.home)),isN=(u.stage==='group'&&u.gRnd===rIdx&&!m.sc);
      sched+=`<div class="sched-item ${isN?'next':''}"><span>Т.${rObj.rnd} (${isH?'Вдома':'Виїзд'})</span><span>vs ${opp.i} ${opp.n}</span><b>${m.sc||(isN?'▶ Далі':'⏳')}</b></div>`;
    });
  }
  return `<div class="grp-card"><div class="grp-title"><span>ГРУПА ${grp.name}</span><span style="color:#1dd1a1">1–2 місця ➔ 1/8</span></div><table class="tbl"><thead><tr><th>#</th><th>Команда</th><th>І</th><th>В</th><th>Н</th><th>П</th><th>З:П</th><th>О</th></tr></thead><tbody>${rows}</tbody></table>${sched}</div>`;
}
function renderUCL(){
  const u=p.ucl;
  if(!u||!u.active){
    uclBox.innerHTML=`<div class="cup-banner"><div style="font-size:30px">🏆</div><b style="color:#feca57">ЛІГА ЧЕМПІОНІВ УЄФА</b><p style="font-size:12px;color:#a5b1c2">8 груп по 4 клуби (6 турів, вдома/виїзд).<br>1–2 місця виходять у 1/8 фіналу!</p><button class="btn full" style="background:#3867d6;color:#fff" onclick="initUCL()">⚽ Почати розіграш ЛЧ</button></div>`;
    return;
  }
  let h='';
  if(u.champ) h+=`<div class="cup-banner"><b>${u.champ.isMe?'🏆 ТИ ЧЕМПІОН ЛІГИ ЧЕМПІОНІВ!':`🏆 Чемпіон ЛЧ: ${u.champ.i} ${u.champ.n}`}</b><button class="btn full" style="background:#3867d6;color:#fff;margin-top:6px" onclick="initUCL()">🔄 Новий сезон ЛЧ</button></div>`;
  else if(u.eliminated) h+=`<div class="cup-banner" style="border-color:#ff5e57"><b style="color:#ff5e57">💔 Виліт із Ліги Чемпіонів</b><p style="font-size:11px;color:#a5b1c2">Вийшли лише 1 і 2 місця груп.</p><button class="btn full" style="background:#3867d6;color:#fff" onclick="initUCL()">🔄 Новий сезон ЛЧ</button></div>`;
  else if(u.stage==='group'){
    const opp=getCurOpponent();
    const myGrp=u.groups.find(g=>g.teams.some(t=>t.isMe)),me=myGrp.teams.find(t=>t.isMe),m=myGrp.schedule.at(u.gRnd).matches.find(x=>x.home===me.id||x.away===me.id);
    const isH=(m.home===me.id),opT=myGrp.teams.find(t=>t.id===(isH?m.away:m.home));
    h+=`<div class="cup-banner"><div style="font-size:11px;color:#70a1ff">ГРУПА ${myGrp.name} • ТУР ${u.gRnd+1}/6 (${isH?'🏟️ ВДОМА':'✈️ ВИЇЗД'})</div><div style="font-size:14px;font-weight:bold;margin:4px 0">🇺🇦 Твій Клуб vs ${opT.i} ${opT.n}</div><button class="btn full" style="background:#1dd1a1;color:#000" onclick="startUCLMatch()">⚽ Грати матч Туру ${u.gRnd+1}</button></div>`;
  }else{
    const rN=['1/8 Фіналу','1/4 Фіналу','Півфінал','ФІНАЛ ЛЧ'],arr=[u.r16,u.qf,u.sf,u.fn].at(u.rnd)||[],myM=arr.find(m=>m.a.isMe||m.b.isMe);
    if(myM){const opT=myM.a.isMe?myM.b:myM.a;h+=`<div class="cup-banner"><div style="font-size:11px;color:#70a1ff">${rN.at(u.rnd)}</div><div style="font-size:14px;font-weight:bold;margin:4px 0">🇺🇦 Твій Клуб vs ${opT.i} ${opT.n}</div><button class="btn full" style="background:#1dd1a1;color:#000" onclick="startUCLMatch()">⚽ Грати матч (${rN.at(u.rnd)})</button></div>`;}
  }
  h+=`<div class="sub-tabs"><div class="stab ${uclSubTab==='mygrp'?'on':''}" onclick="uclSubTab='mygrp';renderUCL()">🇺🇦 Моя група</div><div class="stab ${uclSubTab==='all'?'on':''}" onclick="uclSubTab='all';renderUCL()">📊 Усі групи</div><div class="stab ${uclSubTab==='ko'?'on':''}" onclick="uclSubTab='ko';renderUCL()">🏆 Плей-оф</div></div>`;
  if(uclSubTab==='mygrp') h+=renderGroupCard(u.groups.find(g=>g.teams.some(t=>t.isMe)),true);
  else if(uclSubTab==='all') u.groups.forEach(g=>{h+=renderGroupCard(g,false);});
  else [['🏆 ФІНАЛ',u.fn],['🔥 ПІВФІНАЛ',u.sf],['⚡ 1/4 ФІНАЛУ',u.qf],['⚔️ 1/8 ФІНАЛУ',u.r16]].forEach(([t,a])=>{
    if(a&&a.length){h+=`<div style="font-size:11px;color:#70a1ff;margin:6px 0"><b>${t}</b></div>`;a.forEach(m=>{h+=`<div class="match ${m.a.isMe||m.b.isMe?'me':''}"><span>${m.a.i} ${m.a.n}</span><b>${m.sc||'VS'}</b><span>${m.b.n} ${m.b.i}</span></div>`;});}
  });
  uclBox.innerHTML=h;
}

let ph='sh',pS=[],bS=[],ac=null,ambOn=false,crowdMood=0;
function startAmbience(){
  if(ambOn)return;
  try{

function drawRealisticFan(fx,fy,sc,fan,waveVal){
  const t=tAnim*fan.spd+fan.ph,sway=Math.sin(t)*1.6*sc,cheer=crowdMood===1?Math.max(0,Math.sin(t*2.8))*8*sc:0;

  ctx.fillStyle=fan.skin;ctx.fillRect(-1.1*sc,-13*sc,2.2*sc,2*sc);ctx.beginPath();ctx.ellipse(0,-15.4*sc,2.9*sc,3.6*sc,0,0,Math.PI*2);ctx.fill();

function getNetBulge(wx,wy){
  if(netWave.amp<=0.005)return 0;const dist=Math.hypot(wx-netWave.hitX,wy-netWave.hitY);
  return netWave.amp*0.85*Math.exp(-(dist*dist)/5.2)*(Math.cos(dist*1.4-netWave.phase*1.6)*0.55+0.45);
}
