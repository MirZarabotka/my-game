<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Champions Penalty — Ліга Чемпіонів</title>
<script>const tgS=document.createElement('script');tgS.src=['https:/','/telegram.org','/js/telegram-web-app.js'].join('');document.head.appendChild(tgS);</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:sans-serif;background:#070b14;color:#fff;margin:0;padding:8px;display:flex;flex-direction:column;min-height:100vh;user-select:none}
.box{background:#131b26;border:1px solid #243347;border-radius:12px;padding:8px 12px;margin-bottom:7px}
.row{display:flex;justify-content:space-between;align-items:center}
.bar{width:100%;height:5px;background:#1e2b3c;border-radius:4px;overflow:hidden;margin:4px 0}
.fill{height:100%;background:#1dd1a1;transition:width .3s}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.nbtn{background:#131b26;border:1px solid #2c3e55;color:#dce6f7;text-decoration:none;text-align:center;padding:8px 4px;border-radius:10px;font-size:11px;font-weight:bold}
.nbtn.act{background:linear-gradient(135deg,#192f5d,#0f1d3d);border-color:#4b7bec;color:#feca57}
.hero{background:linear-gradient(135deg,#132347,#0b1326);border:1.5px solid #3867d6;border-radius:14px;padding:12px;margin-bottom:8px;text-align:center}
.hero h2{margin:0 0 4px;font-size:16px;color:#feca57}
.hero p{margin:0 0 10px;font-size:12px;color:#b8c6db}
.btn{width:100%;padding:12px;border-radius:12px;border:none;font-weight:900;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.play{background:linear-gradient(135deg,#1dd1a1,#10ac84);color:#05140e}
.btn.gold{background:linear-gradient(135deg,#feca57,#ff9f43);color:#1e1302}
.btn.sec{background:#1e2b3c;color:#fff;border:1px solid #34495e;margin-top:6px;font-size:12px;padding:9px}
.tabs{display:flex;gap:5px;margin-bottom:8px;overflow-x:auto}
.tab{flex:1;padding:7px 8px;background:#131b26;border:1px solid #2c3e55;color:#8395a7;border-radius:9px;font-size:11px;font-weight:bold;cursor:pointer;white-space:nowrap}
.tab.act{background:#1b2d4a;color:#feca57;border-color:#feca57}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:#8395a7;font-size:10px;text-align:left;padding:5px 4px;border-bottom:1px solid #243347}
td{padding:7px 4px;border-bottom:1px solid #1a2433}
tr.me{background:rgba(29,209,161,.13);font-weight:bold;color:#1dd1a1}
tr.qual td:first-child{border-left:3px solid #1dd1a1}
.mcard{background:#182230;border:1px solid #2c3e55;border-radius:11px;padding:9px 11px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.mcard.me{border-color:#feca57;background:#1e2636}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.citem{background:#182230;border:1.5px solid #2c3e55;border-radius:11px;padding:9px;text-align:left;cursor:pointer;color:#fff;font-size:12px;font-weight:bold}
.citem:active{border-color:#1dd1a1;background:#132a27}
</style>
</head>
<body>
<div class="box">
  <div class="row"><b style="color:#feca57">Рівень <span id="lv">1</span> • 🏆 ЛЧ: <span id="cp">0</span></b><b style="color:#feca57">💰 <span id="cn">20</span></b></div>
  <div class="bar"><div class="fill" id="xb"></div></div>
  <div class="row" style="font-size:11px;color:#8395a7"><span>XP: <span id="pt">0</span>/<span id="nx">100</span></span><span>Групи (6 турів) + Плей-оф</span></div>
</div>

<div class="nav">
  <a href="index.html" class="nbtn">🏠 Головна</a>
  <a href="game.html" class="nbtn" onclick="localStorage.removeItem('pc_play_ucl')">⚽ Спаринг</a>
  <a href="turnir.html" class="nbtn act">🏆 Турнір ЛЧ</a>
  <a href="statustuca.html" class="nbtn">📊 Рейтинг</a>
</div>

<div id="app"></div>
<script>
try{window.Telegram.WebApp.ready();window.Telegram.WebApp.expand();}catch(e){}
const BIN_ID='6b01a76bffd5d16053d39022',API_KEY='$2a$10$FfzYgApncFFRJpoFkrYgyOZHPwjviuwu1N64Suvm4DneHJP..xKna',API_URL=['https:/','/api.jsonbin.io','/v3/b/',BIN_ID].join('');

const CLUBS=[
  {id:'shakhtar',n:'🇺🇦 Шахтар',str:82,col:'#fa8231'},{id:'dynamo',n:'🇺🇦 Динамо Київ',str:80,col:'#3867d6'},
  {id:'real',n:'🇪🇸 Реал Мадрид',str:95,col:'#f5f6fa'},{id:'barca',n:'🇪🇸 Барселона',str:92,col:'#eb4d4b'},
  {id:'mancity',n:'🇬🇧 Ман Сіті',str:94,col:'#00d2ff'},{id:'arsenal',n:'🇬🇧 Арсенал',str:90,col:'#eb4d4b'},
  {id:'liverpool',n:'🇬🇧 Ліверпуль',str:91,col:'#b33939'},{id:'bayern',n:'🇩🇪 Баварія',str:93,col:'#EA2027'},
  {id:'dortmund',n:'🇩🇪 Боруссія Д',str:87,col:'#feca57'},{id:'psg',n:'🇫🇷 ПСЖ',str:91,col:'#273c75'},
  {id:'inter',n:'🇮🇹 Інтер Мілан',str:90,col:'#0652DD'},{id:'milan',n:'🇮🇹 Мілан',str:88,col:'#eb4d4b'},
  {id:'juve',n:'🇮🇹 Ювентус',str:87,col:'#dfe4ea'},{id:'atletico',n:'🇪🇸 Атлетіко',str:89,col:'#eb4d4b'},
  {id:'benfica',n:'🇵🇹 Бенфіка',str:85,col:'#EA2027'},{id:'sporting',n:'🇵🇹 Спортінг',str:86,col:'#1dd1a1'}
];

let p={pt:0,lv:1,cp:0,cn:20,ow:['j1','p1','s1','b1','k1'],ej:'j1',ep:'p1',es:'s1',eb:'b1',ek:'k1',num:'10',numCol:'#ffffff',ucl:null,nick:'',uid:'',lastBonus:0,opt:{snd:true,vib:true,fx:true}};

function loadWallet(){
  try{
    const v=JSON.parse(localStorage.getItem('pc_ucl1'));
    if(v)p=Object.assign(p,v);
  }catch(e){}
  if(!p.uid)p.uid='u'+Math.floor(100000+Math.random()*900000);
  if(isNaN(Number(p.cn)))p.cn=20;
  save();
}
function save(){try{localStorage.setItem('pc_ucl1',JSON.stringify(p));}catch(e){}}
loadWallet();

async function pushScoreToCloud(){
  if(!p||!p.uid)return;
  try{
    const r=await fetch(API_URL+'/latest',{headers:{'X-Master-Key':API_KEY}});if(!r.ok)return;
    const j=await r.json(),list=Array.isArray(j.record)?j.record:[],map=new Map();
    list.forEach(u=>{if(u&&u.uid&&u.uid!=='init')map.set(u.uid,u);});
    map.set(p.uid,{uid:p.uid,n:p.nick||('Гравець #'+p.uid.slice(-4)),cn:Number(p.cn)||0,lv:Number(p.lv)||1,cp:Number(p.cp)||0});
    const top=Array.from(map.values()).sort((a,b)=>(b.cn-a.cn)||(b.cp-a.cp)||(b.lv-a.lv)).slice(0,100);
    await fetch(API_URL,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':API_KEY},body:JSON.stringify(top)});
  }catch(e){}
}

function updHeader(){
  lv.textContent=p.lv;cp.textContent=p.cp;cn.textContent=p.cn;
  const nxXp=p.lv*100;pt.textContent=p.pt;nx.textContent=nxXp;
  xb.style.width=Math.min(100,(p.pt/nxXp)*100)+'%';
}
function startNewUCL(myClubId){
  const myBase=CLUBS.find(c=>c.id===myClubId)||CLUBS.at(0);
  const myName=p.nick?`${myBase.n} (${p.nick})`:myBase.n;
  const pool=CLUBS.filter(c=>c.id!==myClubId).sort(()=>Math.random()-0.5);

  const grpA=[
    {id:'me',n:myName,str:88,col:myBase.col,me:true,g:0,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0},
    ...pool.slice(0,3).map(c=>({id:c.id,n:c.n,str:c.str,col:c.col,me:false,g:0,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}))
  ];

  // 6 турів групового етапу у вигляді рядків 'індекс1-індекс2'
  const rounds=[
    ['0-1','2-3'],
    ['0-2','1-3'],
    ['0-3','1-2'],
    ['1-0','3-2'],
    ['2-0','3-1'],
    ['3-0','2-1']
  ];

  p.ucl={
    stage:'group',
    round:0,
    myClub:myName,
    teams:grpA,
    rounds:rounds,
    results:[],
    poStage:0,
    poPool:pool.slice(3,11),
    poOpp:null,
    poHistory:[],
    champion:false
  };
  save();render();
}
function simBotMatch(t1,t2){
  const diff=(t1.str-t2.str)/18;
  const g1=Math.max(0,Math.min(5,Math.round(2.3+diff+(Math.random()*2.6-1.3))));
  const g2=Math.max(0,Math.min(5,Math.round(2.3-diff+(Math.random()*2.6-1.3))));
  applyMatchStats(t1,t2,g1,g2);
  return `${t1.n} ${g1}:${g2} ${t2.n}`;
}

function applyMatchStats(t1,t2,g1,g2){
  t1.p++;t2.p++;t1.gf+=g1;t1.ga+=g2;t2.gf+=g2;t2.ga+=g1;
  if(g1>g2){t1.w++;t1.pts+=3;t2.l++;}
  else if(g2>g1){t2.w++;t2.pts+=3;t1.l++;}
  else{t1.d++;t1.pts+=1;t2.d++;t2.pts+=1;}
}

function checkIncomingResult(){
  try{
    const raw=localStorage.getItem('pc_ucl_res');
    if(!raw||!p.ucl)return;
    localStorage.removeItem('pc_ucl_res');
    const res=JSON.parse(raw);
    const myGoals=Number(res.my)||0,oppGoals=Number(res.opp)||0;
    processMyMatchResult(myGoals,oppGoals);
  }catch(e){}
}

function processMyMatchResult(myG,oppG){
  const u=p.ucl;if(!u)return;
  if(u.stage==='group'&&u.round<6){
    const pairs=u.rounds.at(u.round);
    const log=[];
    pairs.forEach(pairStr=>{
      const pts=pairStr.split('-');
      const i1=Number(pts.at(0)),i2=Number(pts.at(1));
      const t1=u.teams.at(i1),t2=u.teams.at(i2);
      if(t1.me||t2.me){
        const g1=t1.me?myG:oppG,g2=t2.me?myG:oppG;
        applyMatchStats(t1,t2,g1,g2);
        log.push(`⭐ ${t1.n} ${g1}:${g2} ${t2.n}`);
      }else{
        log.push(simBotMatch(t1,t2));
      }
    });
    u.results.unshift({r:u.round+1,lines:log});
    u.round++;

    const bonusCn=myG>oppG?35:(myG===oppG?18:10);
    p.cn+=bonusCn;p.pt+=myG>oppG?30:15;
    if(p.pt>=p.lv*100){p.pt-=p.lv*100;p.lv++;}

    if(u.round>=6){
      const sorted=getSortedGroup();
      const myRank=sorted.findIndex(t=>t.me);
      if(myRank<=1){
        u.stage='po';u.poStage=0;
        u.poOpp=u.poPool.at(0)||CLUBS.at(2);
        p.cn+=60;
      }else{
        u.stage='done';u.champion=false;
      }
    }
  }else if(u.stage==='po'){
    const stages=['1/8 фіналу','1/4 фіналу','1/2 фіналу','ФІНАЛ ЛЧ'];
    let win=myG>oppG;
    if(myG===oppG)win=Math.random()>0.45;
    const finalMy=win&&myG===oppG?myG+1:myG;
    const finalOpp=!win&&myG===oppG?oppG+1:oppG;

    u.poHistory.push({st:stages.at(u.poStage),opp:u.poOpp.n,sc:`${finalMy}:${finalOpp}`,win});
    if(win){
      p.cn+=50+(u.poStage*25);p.pt+=45;
      if(p.pt>=p.lv*100){p.pt-=p.lv*100;p.lv++;}
      u.poStage++;
      if(u.poStage>=4){
        u.stage='done';u.champion=true;
        p.cp=(Number(p.cp)||0)+1;
        p.cn+=250;p.pt+=120;
        if(p.pt>=p.lv*100){p.pt-=p.lv*100;p.lv++;}
      }else{
        u.poOpp=u.poPool.at(u.poStage)||CLUBS.at(u.poStage+2);
      }
    }else{
      u.stage='done';u.champion=false;
    }
  }
  save();updHeader();pushScoreToCloud();
}
function getSortedGroup(){
  return [...p.ucl.teams].sort((a,b)=>(b.pts-a.pts)||((b.gf-b.ga)-(a.gf-a.ga))||(b.gf-a.gf));
}

function getNextOpponent(){
  const u=p.ucl;
  if(!u)return null;
  if(u.stage==='group'&&u.round<6){
    const pairs=u.rounds.at(u.round);
    for(const pairStr of pairs){
      const pts=pairStr.split('-');
      const i1=Number(pts.at(0)),i2=Number(pts.at(1));
      if(u.teams.at(i1).me)return u.teams.at(i2);
      if(u.teams.at(i2).me)return u.teams.at(i1);
    }
  }
  if(u.stage==='po')return u.poOpp;
  return null;
}

function playTournamentMatch(){
  const opp=getNextOpponent();
  if(!opp)return;
  const poNames=['1/8 фіналу','1/4 фіналу','1/2 фіналу','ФІНАЛ ЛЧ'];
  localStorage.setItem('pc_play_ucl',JSON.stringify({
    oppName:opp.n,
    oppCol:opp.col||'#eb4d4b',
    oppStr:opp.str||85,
    stage:p.ucl.stage==='group'?`Група • Тур ${p.ucl.round+1}/6`:poNames.at(p.ucl.poStage)
  }));
  location.href='game.html';
}

function quickSimMatch(){
  const opp=getNextOpponent();
  if(!opp)return;
  const myG=Math.floor(Math.random()*4)+1;
  const oppG=Math.floor(Math.random()*4);
  processMyMatchResult(myG,oppG);
  render();
}
let viewTab='table';

function render(){
  updHeader();
  const app=document.getElementById('app');

  if(!p.ucl){
    app.innerHTML=`
      <div class="hero">
        <h2>🏆 ЛІГА ЧЕМПІОНІВ УЄФА</h2>
        <p>Обери свій клуб та пройди шлях від групового етапу до Фіналу ЛЧ!</p>
      </div>
      <div class="box">
        <b style="font-size:13px;color:#70a1ff">Обери клуб для участі:</b>
        <div class="cgrid">
          ${CLUBS.map(c=>`<button class="citem" onclick="startNewUCL('${c.id}')">${c.n}<br><span style="font-size:10px;color:#8395a7">Рейтинг клубу: ${c.str}</span></button>`).join('')}
        </div>
      </div>`;
    return;
  }
  const u=p.ucl;
  const opp=getNextOpponent();
  const poNames=['1/8 фіналу','1/4 фіналу','1/2 фіналу','ФІНАЛ ЛЧ'];

  if(u.stage==='done'){
    app.innerHTML=`
      <div class="hero" style="border-color:${u.champion?'#feca57':'#eb4d4b'}">
        <h2>${u.champion?'🏆 ЧЕМПІОН ЛІГИ ЧЕМПІОНІВ!':'💔 ВИЛІТ ІЗ ТУРНІРУ'}</h2>
        <p>${u.champion?`Вітаємо! ${u.myClub} здобув Кубок ЛЧ (+1 🏆 та +250 💰)!`:'Не здавайся! Почни новий розіграш Ліги Чемпіонів.'}</p>
        <button class="btn gold" onclick="p.ucl=null;save();render()">🔄 Почати новий сезон ЛЧ</button>
      </div>
      ${renderGroupTableHtml()}`;
    return;
  }

  const stageTitle=u.stage==='group'?`Груповий етап • Тур ${u.round+1} з 6`:`Плей-оф • ${poNames.at(u.poStage)}`;

  app.innerHTML=`
    <div class="hero">
      <h2>${stageTitle}</h2>
      <p>Наступний суперник: <b style="color:#fff">${opp?opp.n:'—'}</b> (Сила: ${opp?opp.str:85})</p>
      <button class="btn play" onclick="playTournamentMatch()">⚽ ГРАТИ МАТЧ НА АРЕНІ</button>
      <button class="btn sec" onclick="quickSimMatch()">⚡ Швидка симуляція туру</button>
    </div>

    <div class="tabs">
      <button class="tab ${viewTab==='table'?'act':''}" onclick="viewTab='table';render()">📊 Таблиця групи</button>
      <button class="tab ${viewTab==='po'?'act':''}" onclick="viewTab='po';render()">🏆 Плей-оф</button>
      <button class="tab ${viewTab==='logs'?'act':''}" onclick="viewTab='logs';render()">📅 Результати</button>
    </div>

    ${viewTab==='table'?renderGroupTableHtml():(viewTab==='po'?renderPlayoffHtml():renderLogsHtml())}

    <button class="btn sec" style="color:#ff6b81;border-color:#4b2430;margin-top:8px" onclick="if(confirm('Скинути поточний сезон ЛЧ?')){p.ucl=null;save();render();}">🗑 Завершити поточний сезон</button>`;
}
function renderGroupTableHtml(){
  const sorted=getSortedGroup();
  return `
    <div class="box">
      <div style="font-size:11px;color:#1dd1a1;margin-bottom:6px">✔ Топ-2 команди групи виходять у плей-оф (1/8 фіналу)</div>
      <table>
        <thead><tr><th>#</th><th>Клуб</th><th>І</th><th>В</th><th>Н</th><th>П</th><th>М</th><th>О</th></tr></thead>
        <tbody>
          ${sorted.map((t,idx)=>`
            <tr class="${t.me?'me':''} ${idx<2?'qual':''}">
              <td>${idx+1}</td>
              <td>${t.n}</td>
              <td>${t.p}</td>
              <td>${t.w}</td>
              <td>${t.d}</td>
              <td>${t.l}</td>
              <td>${t.gf}:${t.ga}</td>
              <td><b>${t.pts}</b></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

function renderPlayoffHtml(){
  const u=p.ucl,stages=['1/8 фіналу','1/4 фіналу','1/2 фіналу','ФІНАЛ ЛЧ'];
  return `
    <div class="box">
      ${stages.map((st,idx)=>{
        const done=u.poHistory.at(idx);
        const isCur=(u.stage==='po'&&u.poStage===idx);
        if(done)return `<div class="mcard me"><span><b>${st}:</b> vs ${done.opp}</span><b style="color:${done.win?'#1dd1a1':'#ff5e57'}">${done.sc} ${done.win?'✔':'✖'}</b></div>`;
        if(isCur)return `<div class="mcard me"><span><b>${st}:</b> vs ${u.poOpp.n}</span><b style="color:#feca57">▶ Зараз</b></div>`;
        return `<div class="mcard" style="opacity:.55"><span><b>${st}</b></span><span>Очікується</span></div>`;
      }).join('')}
    </div>`;
}

function renderLogsHtml(){
  const logs=p.ucl.results||[];
  if(!logs.length)return `<div class="box" style="text-align:center;color:#8395a7;font-size:12px">Ще не зіграно жодного туру</div>`;
  return logs.map(l=>`
    <div class="box">
      <b style="font-size:12px;color:#feca57">Тур ${l.r}</b>
      ${l.lines.map(line=>`<div style="font-size:12px;margin-top:4px;color:#dce6f7">${line}</div>`).join('')}
    </div>`).join('');
}

checkIncomingResult();
render();
</script>
</body>
</html>
