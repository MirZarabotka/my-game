<script>
try{window.Telegram.WebApp.ready();window.Telegram.WebApp.expand();}catch(e){}
const BIN_ID='6b01a76bffd5d16053d39022',API_KEY='$2a$10$FfzYgApncFFRJpoFkrYgyOZHPwjviuwu1N64Suvm4DneHJP..xKna',API_URL=['https:/','/api.jsonbin.io','/v3/b/',BIN_ID].join('');

const ALL_CLUBS=[
  {n:'Астон Вілла',i:'🦁',str:85,col:'#9b2c48'},{n:'Атлетіко',i:'🔴⚪',str:89,col:'#eb4d4b'},{n:'Динамо Загреб',i:'🔵',str:79,col:'#3867d6'},
  {n:'Реал Мадрид',i:'👑',str:95,col:'#f5f6fa'},{n:'ПСВ',i:'💡',str:83,col:'#eb4d4b'},{n:'Спарта Прага',i:'🔴',str:78,col:'#b33939'},{n:'Монако',i:'🇲🇨',str:84,col:'#eb4d4b'},
  {n:'Зальцбург',i:'🐂',str:80,col:'#eb4d4b'},{n:'Барселона',i:'🔵🔴',str:92,col:'#0652DD'},{n:'Штурм Грац',i:'⚫',str:77,col:'#dfe4ea'},{n:'Боруссія Д',i:'🐝',str:88,col:'#feca57'},
  {n:'Шахтар',i:'💎',str:83,col:'#fa8231'},{n:'Манчестер Сіті',i:'🩵',str:94,col:'#00d2ff'},{n:'Арсенал',i:'🔫',str:90,col:'#eb4d4b'},{n:'Ліверпуль',i:'🦅',str:91,col:'#b33939'},
  {n:'Баварія',i:'🔴⚪',str:93,col:'#EA2027'},{n:'ПСЖ',i:'🗼',str:91,col:'#273c75'},{n:'Інтер Мілан',i:'🐍',str:90,col:'#0652DD'},{n:'Мілан',i:'⚫🔴',str:88,col:'#eb4d4b'},
  {n:'Ювентус',i:'🦓',str:87,col:'#dfe4ea'},{n:'Бенфіка',i:'🦅',str:85,col:'#EA2027'},{n:'Спортінг',i:'🦁',str:86,col:'#1dd1a1'},{n:'Байєр',i:'💊',str:90,col:'#EA2027'},
  {n:'Аталанта',i:'🔵',str:86,col:'#3867d6'},{n:'Штутгарт',i:'⚪',str:84,col:'#eb4d4b'},{n:'Феєнорд',i:'🔴',str:82,col:'#eb4d4b'},{n:'Брюгге',i:'🔵',str:80,col:'#3867d6'},
  {n:'Селтік',i:'🍀',str:80,col:'#1dd1a1'},{n:'Жирона',i:'🔴',str:83,col:'#eb4d4b'},{n:'Болонья',i:'🔴',str:82,col:'#273c75'},{n:'Лілль',i:'🔵',str:83,col:'#eb4d4b'}
];

let p={pt:0,lv:1,cp:0,cn:20,ow:['j1','p1','s1','b1','k1'],ej:'j1',ep:'p1',es:'s1',eb:'b1',ek:'k1',num:'10',numCol:'#ffffff',ucl:null,nick:'',uid:'',lastBonus:0,opt:{snd:true,vib:true,fx:true}};

function loadWallet(){
  try{
    const v=JSON.parse(localStorage.getItem('pc_ucl1'));
    if(v)p=Object.assign(p,v);
  }catch(e){}
  if(!p.uid)p.uid='u'+Math.floor(100000+Math.random()*900000);
  if(isNaN(Number(p.cn)))p.cn=20;
  // Якщо в збереженні старий формат без 8 груп — скидаємо
  if(p.ucl && !Array.isArray(p.ucl.groups)){
    p.ucl=null;
  }
  save();
}
function save(){try{localStorage.setItem('pc_ucl1',JSON.stringify(p));}catch(e){}}
loadWallet();
function absorbGameHtmlResult(){
  if(!p.ucl)return;
  // Коли game.html завершує матч, він записує рахунок у p.ucl.r16[0].sc (напр. "5:4")
  if(Array.isArray(p.ucl.r16) && p.ucl.r16.length && p.ucl.r16.at(0).sc){
    const scStr=String(p.ucl.r16.at(0).sc);
    const parts=scStr.split(':').map(Number);
    const myG=parts.at(0)||0;
    const oppG=parts.at(1)||0;

    // Очищаємо міст r16/qf, щоб не зарахувати двічі, і записуємо результат у групу або плей-оф
    p.ucl.r16=[];
    p.ucl.qf=[];
    p.ucl.rnd=0;

    // Якщо це був фінал ЛЧ у нашому турнірі, компенсуємо зайвий трофей, якщо game.html його ще не мав давати на стадії груп
    if(p.ucl.stage==='group' && p.cp>0 && p.ucl._cpBefore!==undefined){
      p.cp=p.ucl._cpBefore;
    }

    processUserMatch(myG,oppG);
    save();
  }
}

function updHeader(){
  lv.textContent=p.lv;cp.textContent=p.cp;cn.textContent=p.cn;
  const nxXp=p.lv*100;pt.textContent=p.pt;nx.textContent=nxXp;
  xb.style.width=Math.min(100,(p.pt/nxXp)*100)+'%';
}
function openConfirm(){
  confirmErr.style.display='none';
  mConfirm.classList.add('open');
}
function closeConfirm(){
  mConfirm.classList.remove('open');
}

function confirmStartUCL(){
  if((Number(p.cn)||0)<100){
    confirmErr.textContent=`❌ Недостатньо монет! Потрібно 100 💰 (у тебе ${p.cn} 💰). Зароби у спарингу або набиванням м’яча!`;
    confirmErr.style.display='block';
    return;
  }
  p.cn-=100;
  closeConfirm();
  create8GroupsSeason();
  save();updHeader();render();
}

function create8GroupsSeason(){
  const myTitle='🇺🇦 '+(p.nick||'Твій Клуб');
  const pool=[...ALL_CLUBS].sort(()=>Math.random()-0.5);
  const letters=['A','B','C','D','E','F','G','H'];
  let idx=0;

  const groups=letters.map((letName,gIdx)=>{
    const teams=[];
    if(gIdx===0){
      teams.push({n:myTitle,i:'🇺🇦',str:88,col:'#1dd1a1',me:true,p:0,w:0,l:0,gf:0,ga:0,pts:0});
      for(let k=0;k<3;k++){
        const c=pool.at(idx++);
        teams.push({n:c.n,i:c.i,str:c.str,col:c.col,me:false,p:0,w:0,l:0,gf:0,ga:0,pts:0});
      }
    }else{
      for(let k=0;k<4;k++){
        const c=pool.at(idx++);
        teams.push({n:c.n,i:c.i,str:c.str,col:c.col,me:false,p:0,w:0,l:0,gf:0,ga:0,pts:0});
      }
    }
    return{name:letName,teams};
  });

  p.ucl={
    active:true,
    stage:'group',
    round:0,
    myClub:myTitle,
    groups:groups,
    poStage:0,
    poPairs:[],
    poHistory:[],
    champion:false,
    r16:[],
    qf:[],
    sf:[],
    fn:[],
    rnd:0
  };
}
const SCHEDULE=[
  ['0-1','2-3'], // Тур 1: Вдома
  ['2-0','3-1'], // Тур 2: Виїзд
  ['0-3','1-2'], // Тур 3: Вдома
  ['1-0','3-2'], // Тур 4: Виїзд
  ['0-2','1-3'], // Тур 5: Вдома
  ['3-0','2-1']  // Тур 6: Виїзд
];

function applyMatch(t1,t2,g1,g2){
  t1.p++;t2.p++;t1.gf+=g1;t1.ga+=g2;t2.gf+=g2;t2.ga+=g1;
  if(g1>g2){t1.w++;t1.pts+=3;t2.l++;}
  else if(g2>g1){t2.w++;t2.pts+=3;t1.l++;}
  else{t1.pts+=1;t2.pts+=1;}
}

function simBotPair(t1,t2){
  const diff=(t1.str-t2.str)/18;
  const g1=Math.max(0,Math.min(5,Math.round(2.2+diff+(Math.random()*2.6-1.3))));
  const g2=Math.max(0,Math.min(5,Math.round(2.2-diff+(Math.random()*2.6-1.3))));
  applyMatch(t1,t2,g1,g2);
}

function sortTeams(teams){
  return [...teams].sort((a,b)=>(b.pts-a.pts)||((b.gf-b.ga)-(a.gf-a.ga))||(b.gf-a.gf));
}
function processUserMatch(myG,oppG){
  const u=p.ucl;if(!u)return;

  if(u.stage==='group'&&u.round<6){
    const pairs=SCHEDULE.at(u.round);
    u.groups.forEach(grp=>{
      pairs.forEach(ps=>{
        const sp=ps.split('-');
        const t1=grp.teams.at(Number(sp.at(0)));
        const t2=grp.teams.at(Number(sp.at(1)));
        if(t1.me||t2.me){
          applyMatch(t1,t2,t1.me?myG:oppG,t2.me?myG:oppG);
        }else{
          simBotPair(t1,t2);
        }
      });
    });

    u.round++;

    if(u.round>=6){
      const grpA=sortTeams(u.groups.at(0).teams);
      const myPos=grpA.findIndex(t=>t.me);
      if(myPos<=1){
        const qual=[];
        u.groups.forEach(g=>{
          const st=sortTeams(g.teams);
          qual.push(st.at(0),st.at(1));
        });
        const myTeam=qual.find(t=>t.me);
        const others=qual.filter(t=>!t.me).sort(()=>Math.random()-0.5);
        u.stage='po';u.poStage=0;
        u.poPairs=[[myTeam,others.at(0)]];
        for(let i=1;i<15;i+=2)u.poPairs.push([others.at(i),others.at(i+1)]);
        p.cn+=80;
      }else{
        u.stage='done';u.champion=false;u.active=false;
      }
    }
  }else if(u.stage==='po'){
    const stages=['1/8 фіналу','1/4 фіналу','1/2 фіналу','ФІНАЛ ЛЧ'];
    let win=myG>oppG;
    if(myG===oppG)win=Math.random()>0.45;
    const fMy=win&&myG===oppG?myG+1:myG;
    const fOpp=!win&&myG===oppG?oppG+1:oppG;

    const myPair=u.poPairs.at(0);
    const oppTeam=myPair.at(1);
    u.poHistory.push({st:stages.at(u.poStage),opp:oppTeam.n,sc:`${fMy}:${fOpp}`,win});

    if(win){
      u.poStage++;
      if(u.poStage>=4){
        u.stage='done';u.champion=true;u.active=false;
        p.cp=(Number(p.cp)||0)+1;
        p.cn+=300;
      }else{
        const nextWinners=[];
        for(let i=1;i<u.poPairs.length;i++){
          const pair=u.poPairs.at(i);
          const pick=Math.random()<(pair.at(0).str/(pair.at(0).str+pair.at(1).str))?pair.at(0):pair.at(1);
          nextWinners.push(pick);
        }
        const newPairs=[[myPair.at(0),nextWinners.at(0)]];
        for(let i=1;i<nextWinners.length;i+=2)newPairs.push([nextWinners.at(i),nextWinners.at(i+1)]);
        u.poPairs=newPairs;
      }
    }else{
      u.stage='done';u.champion=false;u.active=false;
    }
  }
  save();updHeader();
}
function getMyNextFixture(){
  const u=p.ucl;
  if(!u)return null;
  if(u.stage==='group'&&u.round<6){
    const grpA=u.groups.at(0);
    const pairs=SCHEDULE.at(u.round);
    for(const ps of pairs){
      const sp=ps.split('-');
      const i1=Number(sp.at(0)),i2=Number(sp.at(1));
      const t1=grpA.teams.at(i1),t2=grpA.teams.at(i2);
      if(t1.me)return{opp:t2,venue:'🏟 ВДОМА',label:`ГРУПА A • ТУР ${u.round+1} з 6 (🏟 ВДОМА)`,btn:`⚽ Грати матч Туру ${u.round+1}`};
      if(t2.me)return{opp:t1,venue:'✈ ВИЇЗД',label:`ГРУПА A • ТУР ${u.round+1} з 6 (✈ ВИЇЗД)`,btn:`⚽ Грати матч Туру ${u.round+1}`};
    }
  }
  if(u.stage==='po'){
    const stages=['1/8 ФІНАЛУ','1/4 ФІНАЛУ','1/2 ФІНАЛУ','ФІНАЛ ЛЧ'];
    const opp=u.poPairs.at(0).at(1);
    return{opp,venue:'🏟 ПЛЕЙ-ОФ',label:`ПЛЕЙ-ОФ • ${stages.at(u.poStage)}`,btn:`⚽ Грати ${stages.at(u.poStage)}`};
  }
  return null;
}

function startArenaMatch(){
  const fix=getMyNextFixture();
  if(!fix)return;

  // Підкладаємо міст r16 для game.html, щоб game.html показав суперника Ліги Чемпіонів і повернув рахунок після матчу
  p.ucl.active=true;
  p.ucl.rnd=0;
  p.ucl._cpBefore=p.cp;
  p.ucl.r16=[{
    a:{n:p.nick||'Твій Клуб',i:'🇺🇦',c:'#1dd1a1',dark:'#0d8a68',isMe:true},
    b:{n:fix.opp.n,i:fix.opp.i||'⚽',c:fix.opp.col||'#eb4d4b',dark:'#7a1c1c',isMe:false},
    sc:''
  }];
  save();

  localStorage.setItem('pc_play_ucl','1');
  location.href='game.html?mode=ucl';
}

function quickSimTour(){
  const fix=getMyNextFixture();
  if(!fix)return;
  const myG=Math.floor(Math.random()*4)+1;
  const oppG=Math.floor(Math.random()*4);
  processUserMatch(myG,oppG);
  render();
}
let subTab='my';

function render(){
  updHeader();
  const app=document.getElementById('app');

  if(!p.ucl){
    app.innerHTML=`
      <div class="match-hero">
        <div class="mh-sub">UEFA CHAMPIONS LEAGUE • НОВИЙ СЕЗОН</div>
        <div class="mh-vs">🏆 32 КЛУБИ • 8 ГРУП (A–H) • ПЛЕЙ-ОФ</div>
        <p style="font-size:12px;color:#9fb0c7;margin:0 0 12px">
          Зіграй 6 турів (Вдома/Виїзд) у Групі А, вийди з 1–2 місця в 1/8 фіналу та виграй Кубок Ліги Чемпіонів!
        </p>
        <button class="btn-gold" onclick="openConfirm()">🏆 Розпочати Лігу Чемпіонів (100 💰)</button>
      </div>`;
    return;
  }

  const u=p.ucl;

  if(u.stage==='done'){
    app.innerHTML=`
      <div class="match-hero" style="border-color:${u.champion?'#feca57':'#eb4d4b'}">
        <div class="mh-sub" style="color:${u.champion?'#feca57':'#ff6b81'}">${u.champion?'🏆 ЧЕМПІОН ЛІГИ ЧЕМПІОНІВ!':'💔 СЕЗОН ЗАВЕРШЕНО'}</div>
        <div class="mh-vs">${u.champion?`${u.myClub} здобув Кубок ЛЧ (+300 💰 та +1 🏆)!`:'На жаль, команда вибула з турніру.'}</div>
        <button class="btn-gold" onclick="openConfirm()">🔄 Новий сезон Ліги Чемпіонів (100 💰)</button>
      </div>
      ${renderGroupCard(u.groups.at(0))}`;
    return;
  }

  const fix=getMyNextFixture();

  app.innerHTML=`
    <div class="match-hero">
      <div class="mh-sub">${fix.label}</div>
      <div class="mh-vs">
        <span>${u.myClub}</span>
        <span style="color:#70a1ff;font-size:13px">vs</span>
        <span>${fix.opp.i||''} ${fix.opp.n}</span>
      </div>
      <button class="btn-blue" onclick="startArenaMatch()">${fix.btn}</button>
      <button class="btn-sec" onclick="quickSimTour()">⚡ Швидка симуляція туру</button>
    </div>

    <div class="sub-tabs">
      <button class="stab ${subTab==='my'?'act':''}" onclick="subTab='my';render()">🇺🇦 Моя група</button>
      <button class="stab ${subTab==='all'?'act':''}" onclick="subTab='all';render()">📊 Усі групи (A–H)</button>
      <button class="stab ${subTab==='po'?'act':''}" onclick="subTab='po';render()">🏆 Плей-оф</button>
    </div>

    ${subTab==='my'?renderGroupCard(u.groups.at(0)):(subTab==='all'?u.groups.map(g=>renderGroupCard(g)).join(''):renderPlayoffTree())}`;
}
function renderGroupCard(grp){
  const sorted=sortTeams(grp.teams);
  return `
    <div class="grp-card">
      <div class="grp-h">
        <span>ГРУПА ${grp.name}</span>
        <span>1–2 місця → 1/8 фіналу</span>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:22px">#</th>
            <th>Команда</th>
            <th style="width:24px">І</th>
            <th style="width:24px">В</th>
            <th style="width:24px">П</th>
            <th style="width:42px">З:П</th>
            <th style="width:26px">О</th>
          </tr>
        </thead>
        <tbody>
          ${sorted.map((t,idx)=>`
            <tr class="${t.me?'me':''} ${idx<2?'qual':''}">
              <td>${idx+1}</td>
              <td><span class="dot" style="background:${t.col||'#70a1ff'}"></span>${t.i?t.i+' ':''}${t.n}</td>
              <td>${t.p}</td>
              <td>${t.w}</td>
              <td>${t.l}</td>
              <td>${t.gf}:${t.ga}</td>
              <td style="color:${idx<2?'#1dd1a1':'#fff'};font-weight:bold">${t.pts}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}
function renderPlayoffTree(){
  const u=p.ucl;
  const stages=['1/8 фіналу','1/4 фіналу','1/2 фіналу','ФІНАЛ ЛЧ'];
  let html=`<div class="grp-card"><div class="grp-h"><span>СІТКА ПЛЕЙ-ОФ ЛЧ</span><span>На виліт</span></div>`;

  stages.forEach((st,idx)=>{
    const done=u.poHistory.at(idx);
    const isCur=(u.stage==='po'&&u.poStage===idx);
    if(done){
      html+=`<div class="po-row me"><span><b>${st}:</b> vs ${done.opp}</span><b style="color:${done.win?'#1dd1a1':'#ff6b81'}">${done.sc} ${done.win?'✔':'✖'}</b></div>`;
    }else if(isCur){
      const opp=u.poPairs.at(0).at(1);
      html+=`<div class="po-row me"><span><b>${st}:</b> vs ${opp.n}</span><b style="color:#feca57">▶ Зараз</b></div>`;
    }else{
      html+=`<div class="po-row" style="opacity:.55"><span><b>${st}</b></span><span>Очікується</span></div>`;
    }
  });

  if(u.stage==='po'&&u.poPairs.length>1){
    html+=`<div style="font-size:11px;color:#70a1ff;font-weight:bold;margin:8px 0 5px">Інші пари поточного раунду:</div>`;
    for(let i=1;i<u.poPairs.length;i++){
      const pair=u.poPairs.at(i);
      html+=`<div class="po-row"><span>${pair.at(0).n}</span><span style="color:#8c9eb5">vs</span><span>${pair.at(1).n}</span></div>`;
    }
  }

  html+=`</div>`;
  return html;
}

absorbGameHtmlResult();
localStorage.removeItem('pc_play_ucl');
render();
</script>
