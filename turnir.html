<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Champions Penalty — Ліга Чемпіонів</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:sans-serif;background:#070b14;color:#fff;margin:0;padding:8px;display:flex;flex-direction:column;height:100vh;user-select:none;overflow:hidden}
.box{background:#131b26;border:1px solid #243347;border-radius:12px;padding:7px 12px;margin-bottom:6px;flex-shrink:0}
.row{display:flex;justify-content:space-between;align-items:center}
.bar{width:100%;height:5px;background:#1e2b3c;border-radius:4px;overflow:hidden;margin:4px 0}
.fill{height:100%;background:#1dd1a1;transition:width .3s}
.ucl-box{flex:1;overflow-y:auto;background:linear-gradient(180deg,#091326,#0e1b33);border:1px solid #2b4c7e;border-radius:14px;padding:10px;margin-bottom:8px}
.sub-tabs{display:flex;gap:6px;margin-bottom:8px}
.stab{flex:1;padding:7px;background:#0d182d;border:1px solid #294166;color:#a5b1c2;border-radius:8px;font-size:11px;font-weight:bold;cursor:pointer;text-align:center}
.stab.on{background:#1e3799;color:#fff;border-color:#4b7bec}
.grp-card{background:#0c182e;border:1px solid #233c63;border-radius:11px;padding:8px;margin-bottom:8px}
.grp-title{font-size:12px;font-weight:bold;color:#70a1ff;margin-bottom:5px;display:flex;justify-content:space-between}
table.tbl{width:100%;border-collapse:collapse;font-size:11px}
table.tbl th{color:#778ca3;font-weight:normal;text-align:center;padding:3px 2px;border-bottom:1px solid #1e3354}
table.tbl th:nth-child(2),table.tbl td:nth-child(2){text-align:left;padding-left:4px}
table.tbl td{padding:5px 2px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04)}
tr.q-pass td:first-child{border-left:3px solid #1dd1a1;color:#1dd1a1;font-weight:bold}
tr.me-row{background:rgba(29,209,161,.14);font-weight:bold}
.sched-item{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:#091224;border-radius:7px;margin-top:4px;font-size:11px;border:1px solid #1b3154}
.sched-item.next{border-color:#feca57;background:rgba(254,202,87,.1)}
.match{background:#0c182e;border:1px solid #233c63;border-radius:10px;padding:7px 10px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.match.me{border-color:#feca57;background:rgba(254,202,87,.09)}
.cup-banner{text-align:center;padding:10px;background:rgba(254,202,87,.12);border:1px solid #feca57;border-radius:12px;margin-bottom:8px}
.btn{border:none;padding:12px;border-radius:12px;font-weight:bold;font-size:13px;cursor:pointer;width:100%;margin-top:6px}
.btn:active{transform:scale(.97)}
.tabs{display:flex;gap:6px;flex-shrink:0}
.tab{flex:1;padding:10px 4px;background:#131b26;border:1px solid #243347;color:#fff;border-radius:10px;font-weight:bold;font-size:11px;text-align:center;text-decoration:none}
.tab.on{background:#152547;color:#70a1ff;border-color:#3867d6}
</style>
</head>
<body>

<div class="box">
  <div class="row"><b style="color:#feca57">Рівень <span id="lv">1</span> • 🏆 ЛЧ: <span id="cp">0</span></b><b style="color:#feca57">💰 <span id="cn">20</span></b></div>
  <div class="bar"><div class="fill" id="xb"></div></div>
  <div class="row" style="font-size:11px;color:#8395a7"><span>XP: <span id="pt">0</span>/<span id="nx">100</span></span><span style="color:#70a1ff;font-weight:bold">Групи (6 турів) + Плей-оф</span></div>
</div>

<div class="ucl-box" id="uclBox"></div>

<div class="tabs">
  <a href="index.html" class="tab">🏠 Головна</a>
  <a href="game.html" class="tab">⚽ Спаринг</a>
  <a href="turnir.html" class="tab on">🏆 Турнір ЛЧ</a>
  <a href="statustuca.html" class="tab">📊 Рейтинг</a>
</div>
<!-- ================== [ КІНЕЦЬ TURNIR.HTML : ЧАСТИНА 1 ] ================= -->
<!-- ===================================================================== -->
<!-- ================== [ TURNIR.HTML : ЧАСТИНА 2 З 3 ] ================== -->
<!-- ===================================================================== -->
<script>
try{window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}catch(e){}

const CLUBS=[
  {n:'Реал Мадрид',i:'👑',c:'#f5f6fa',dark:'#cfd6de'},{n:'Барселона',i:'🔵🔴',c:'#a50044',dark:'#5e0026'},
  {n:'Баварія',i:'🔴⚪',c:'#dc052d',dark:'#85021a'},{n:'Манчестер Сіті',i:'🩵',c:'#6cabdd',dark:'#386c96'},
  {n:'ПСЖ',i:'🗼',c:'#004170',dark:'#00213b'},{n:'Арсенал',i:'🔫',c:'#ef0107',dark:'#910004'},
  {n:'Інтер Мілан',i:'🐍',c:'#010e80',dark:'#000747'},{n:'Ліверпуль',i:'🦅',c:'#c8102e',dark:'#78081a'},
  {n:'Атлетіко',i:'🔴⚪',c:'#cb3524',dark:'#7d1e13'},{n:'Боруссія Д',i:'🐝',c:'#fde100',dark:'#b5a000'},
  {n:'Ювентус',i:'🦓',c:'#e5e5e5',dark:'#999999'},{n:'Байєр',i:'💊',c:'#e32221',dark:'#8a1110'},
  {n:'Мілан',i:'⚫🔴',c:'#fb090b',dark:'#960304'},{n:'Бенфіка',i:'🦅',c:'#e83030',dark:'#8f1818'},
  {n:'Спортінг',i:'🦁',c:'#008057',dark:'#004730'},{n:'Аталанта',i:'🔵⚫',c:'#1e71b8',dark:'#0e3b63'},
  {n:'РБ Лейпциг',i:'🐂',c:'#dd0741',dark:'#820325'},{n:'Порту',i:'🐉',c:'#00428c',dark:'#00224a'},
  {n:'ПСВ',i:'💡',c:'#ed1c24',dark:'#8f0d12'},{n:'Феєнорд',i:'🔴⚪',c:'#e30613',dark:'#85030a'},
  {n:'Астон Вілла',i:'🦁',c:'#670e36',dark:'#3b061e'},{n:'Монако',i:'🇲🇨',c:'#e51b23',dark:'#8a0d12'},
  {n:'Лілль',i:'🐕',c:'#e01e13',dark:'#850f08'},{n:'Жирона',i:'⚪🔴',c:'#cc2229',dark:'#7a1116'},
  {n:'Штутгарт',i:'⚪🔴',c:'#e32219',dark:'#87110c'},{n:'Болонья',i:'🔴🔵',c:'#1a2f48',dark:'#0b1624'},
  {n:'Селтік',i:'☘️',c:'#018749',dark:'#004d29'},{n:'Брюгге',i:'🔵⚫',c:'#0070b8',dark:'#003e66'},
  {n:'Шахтар',i:'⚒️',c:'#f37021',dark:'#99400b'},{n:'Динамо Загреб',i:'🔵',c:'#005ca9',dark:'#003361'},
  {n:'Зальцбург',i:'🐂',c:'#d4002a',dark:'#7d0018'},{n:'Спарта Прага',i:'🔴',c:'#9c1c26',dark:'#5c0e14'}
];

const SHOP_COLS={j1:'#1dd1a1',j2:'#f5f6fa',j3:'#d63031',j4:'#1e3799',j5:'#1e272e',j6:'#feca57'};
let p={pt:0,lv:1,cp:0,cn:20,ow:['j1','p1','s1','b1','k1'],ej:'j1',ep:'p1',es:'s1',eb:'b1',ek:'k1',num:'10',numCol:'#ffffff',ucl:null};
let viewTab='mygrp';

function save(){try{localStorage.setItem('pc_ucl1',JSON.stringify(p))}catch(e){}}
try{
  const old=JSON.parse(localStorage.getItem('pc_3d8'));
  const v=JSON.parse(localStorage.getItem('pc_ucl1'));
  if(v)p=Object.assign(p,v);
  else if(old){p=Object.assign(p,old);save();}
}catch(e){}

function updUI(){
  lv.textContent=p.lv;cp.textContent=p.cp;cn.textContent=p.cn;
  const nxXp=p.lv*100;pt.textContent=p.pt;nx.textContent=nxXp;
  xb.style.width=Math.min(100,(p.pt/nxXp)*100)+'%';
}

function initUCL(){
  const pool=[...CLUBS].sort(()=>Math.random()-0.5).slice(0,31);
  const myCol=SHOP_COLS[p.ej]||'#1dd1a1';
  const all32=[{n:'Твій Клуб',i:'🇺🇦',c:myCol,dark:'#0b0f14',isMe:true},...pool];
  const letters=['A','B','C','D','E','F','G','H'],groups=[];

  for(let g=0;g<8;g++){
    const s=all32.slice(g*4,g*4+4).map((c,idx)=>({
      id:`g${g}_${idx}`,n:c.n,i:c.i,c:c.c,dark:c.dark||'#1e272e',isMe:!!c.isMe,
      pl:0,w:0,d:0,l:0,gf:0,ga:0,pts:0
    }));
    const t0=s.at(0),t1=s.at(1),t2=s.at(2),t3=s.at(3);
    groups.push({
      name:letters.at(g),
      teams:s,
      schedule:[
        {rnd:1,matches:[{home:t0.id,away:t1.id,sc:null},{home:t2.id,away:t3.id,sc:null}]},
        {rnd:2,matches:[{home:t3.id,away:t0.id,sc:null},{home:t1.id,away:t2.id,sc:null}]},
        {rnd:3,matches:[{home:t0.id,away:t2.id,sc:null},{home:t3.id,away:t1.id,sc:null}]},
        {rnd:4,matches:[{home:t1.id,away:t0.id,sc:null},{home:t3.id,away:t2.id,sc:null}]},
        {rnd:5,matches:[{home:t0.id,away:t3.id,sc:null},{home:t2.id,away:t1.id,sc:null}]},
        {rnd:6,matches:[{home:t2.id,away:t0.id,sc:null},{home:t1.id,away:t3.id,sc:null}]}
      ]
    });
  }

  p.ucl={active:true,stage:'group',gRnd:0,groups,rnd:0,r16:[],qf:[],sf:[],fn:[],champ:null,eliminated:false};
  viewTab='mygrp';save();renderUCL();
}

function sortGrp(grp){
  return [...grp.teams].sort((a,b)=>(b.pts-a.pts)||((b.gf-b.ga)-(a.gf-a.ga))||(b.gf-a.gf)||(a.isMe?-1:1));
}

function playMatch(){
  localStorage.setItem('pc_play_ucl','1');
  window.location.href='game.html?mode=ucl';
}
/* ================== [ КІНЕЦЬ TURNIR.HTML : ЧАСТИНА 2 ] ================= -->
/* ===================================================================== */
/* ================== [ TURNIR.HTML : ЧАСТИНА 3 З 3 ] ================== */
/* ===================================================================== */
function renderGroupCard(grp,showSched){
  const sorted=sortGrp(grp),me=grp.teams.find(t=>t.isMe),u=p.ucl;
  const rows=sorted.map((t,idx)=>`<tr class="${idx<2?'q-pass':''} ${t.isMe?'me-row':''}">
    <td>${idx+1}</td>
    <td>${t.i} ${t.n}</td>
    <td>${t.pl}</td>
    <td>${t.w}</td>
    <td>${t.d||0}</td>
    <td>${t.l}</td>
    <td>${t.gf}:${t.ga}</td>
    <td><b>${t.pts}</b></td>
  </tr>`).join('');

  let sched='';
  if(showSched&&me){
    sched='<div style="margin-top:6px;font-size:11px;color:#70a1ff;font-weight:bold">📅 Календар матчів групи (6 турів):</div>';
    grp.schedule.forEach((rObj,rIdx)=>{
      const m=rObj.matches.find(x=>x.home===me.id||x.away===me.id);
      const isH=(m.home===me.id),opp=grp.teams.find(t=>t.id===(isH?m.away:m.home));
      const isN=(u.stage==='group'&&u.gRnd===rIdx&&!m.sc);
      sched+=`<div class="sched-item ${isN?'next':''}">
        <span>Т.${rObj.rnd} (${isH?'🏟️ Вдома':'✈️ Виїзд'})</span>
        <span>vs ${opp.i} ${opp.n}</span>
        <b>${m.sc||(isN?'▶ Далі':'⏳')}</b>
      </div>`;
    });
  }

  return `<div class="grp-card">
    <div class="grp-title"><span>ГРУПА ${grp.name}</span><span style="color:#1dd1a1">1–2 місця ➔ 1/8</span></div>
    <table class="tbl">
      <thead><tr><th>#</th><th>Команда</th><th>І</th><th>В</th><th>Н</th><th>П</th><th>З:П</th><th>О</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${sched}
  </div>`;
}

function renderUCL(){
  const u=p.ucl;
  const valid=(u&&u.active&&Array.isArray(u.groups)&&u.groups.length>0);

  if(!valid){
    uclBox.innerHTML=`<div class="cup-banner">
      <div style="font-size:30px">🏆</div>
      <b style="color:#feca57">ЛІГА ЧЕМПІОНІВ УЄФА</b>
      <p style="font-size:12px;color:#a5b1c2">8 груп по 4 клуби (6 турів, вдома/виїзд).<br>1–2 місця виходять у 1/8 фіналу!</p>
      <button class="btn" style="background:#3867d6;color:#fff" onclick="initUCL()">⚽ Почати розіграш ЛЧ</button>
    </div>`;
    return;
  }

  let h='';
  if(u.champ){
    h+=`<div class="cup-banner">
      <b>${u.champ.isMe?'🏆 ТИ ЧЕМПІОН ЛІГИ ЧЕМПІОНІВ!':`🏆 Чемпіон ЛЧ: ${u.champ.i} ${u.champ.n}`}</b>
      <button class="btn" style="background:#3867d6;color:#fff" onclick="initUCL()">🔄 Новий сезон ЛЧ</button>
    </div>`;
  }else if(u.eliminated){
    h+=`<div class="cup-banner" style="border-color:#ff5e57">
      <b style="color:#ff5e57">💔 Виліт із Ліги Чемпіонів</b>
      <p style="font-size:11px;color:#a5b1c2">Вийшли лише 1 і 2 місця груп.</p>
      <button class="btn" style="background:#3867d6;color:#fff" onclick="initUCL()">🔄 Новий сезон ЛЧ</button>
    </div>`;
  }else if(u.stage==='group'){
    const myGrp=u.groups.find(g=>g.teams.some(t=>t.isMe))||u.groups.at(0);
    const me=myGrp.teams.find(t=>t.isMe),m=myGrp.schedule.at(u.gRnd).matches.find(x=>x.home===me.id||x.away===me.id);
    const isH=(m.home===me.id),opT=myGrp.teams.find(t=>t.id===(isH?m.away:m.home));
    h+=`<div class="cup-banner">
      <div style="font-size:11px;color:#70a1ff">ГРУПА ${myGrp.name} • ТУР ${u.gRnd+1}/6 (${isH?'🏟️ ВДОМА':'✈️ ВИЇЗД'})</div>
      <div style="font-size:14px;font-weight:bold;margin:4px 0">🇺🇦 Твій Клуб vs ${opT.i} ${opT.n}</div>
      <button class="btn" style="background:#1dd1a1;color:#000" onclick="playMatch()">⚽ Грати матч Туру ${u.gRnd+1}</button>
    </div>`;
  }else{
    const rN=['1/8 Фіналу','1/4 Фіналу','Півфінал','ФІНАЛ ЛЧ'];
    const arr=[u.r16,u.qf,u.sf,u.fn].at(u.rnd)||[];
    const myM=arr.find(m=>m.a.isMe||m.b.isMe);
    if(myM){
      const opT=myM.a.isMe?myM.b:myM.a;
      h+=`<div class="cup-banner">
        <div style="font-size:11px;color:#70a1ff">${rN.at(u.rnd)}</div>
        <div style="font-size:14px;font-weight:bold;margin:4px 0">🇺🇦 Твій Клуб vs ${opT.i} ${opT.n}</div>
        <button class="btn" style="background:#1dd1a1;color:#000" onclick="playMatch()">⚽ Грати матч (${rN.at(u.rnd)})</button>
      </div>`;
    }
  }

  h+=`<div class="sub-tabs">
    <div class="stab ${viewTab==='mygrp'?'on':''}" onclick="viewTab='mygrp';renderUCL()">🇺🇦 Моя група</div>
    <div class="stab ${viewTab==='all'?'on':''}" onclick="viewTab='all';renderUCL()">📊 Усі групи</div>
    <div class="stab ${viewTab==='ko'?'on':''}" onclick="viewTab='ko';renderUCL()">🏆 Плей-оф</div>
  </div>`;

  if(viewTab==='mygrp'){
    h+=renderGroupCard(u.groups.find(g=>g.teams.some(t=>t.isMe))||u.groups.at(0),true);
  }else if(viewTab==='all'){
    u.groups.forEach(g=>{h+=renderGroupCard(g,false);});
  }else{
    [['🏆 ФІНАЛ',u.fn],['🔥 ПІВФІНАЛ',u.sf],['⚡ 1/4 ФІНАЛУ',u.qf],['⚔️ 1/8 ФІНАЛУ',u.r16]].forEach(([t,a])=>{
      if(a&&a.length){
        h+=`<div style="font-size:11px;color:#70a1ff;margin:6px 0"><b>${t}</b></div>`;
        a.forEach(m=>{
          h+=`<div class="match ${m.a.isMe||m.b.isMe?'me':''}"><span>${m.a.i} ${m.a.n}</span><b>${m.sc||'VS'}</b><span>${m.b.n} ${m.b.i}</span></div>`;
        });
      }
    });
  }

  uclBox.innerHTML=h;
}

updUI();renderUCL();
</script>
</body>
</html>
