<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ліга Чемпіонів — Вхід у турнір</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:sans-serif;background:#070b14;color:#fff;margin:0;padding:10px;display:flex;flex-direction:column;min-height:100vh;user-select:none}
.top-bar{display:flex;gap:8px;margin-bottom:10px}
.nav-btn{flex:1;padding:10px;border:none;border-radius:10px;font-weight:bold;font-size:13px;cursor:pointer;text-decoration:none;text-align:center;background:#182230;color:#fff;border:1px solid #3c4f66}
.ucl-head{background:linear-gradient(135deg,#0c2461,#1e3799);border:1px solid #4b7bec;border-radius:14px;padding:14px;text-align:center;margin-bottom:10px}
.stats{display:flex;justify-content:space-around;background:rgba(7,11,20,.5);border-radius:8px;padding:7px;margin-top:10px;font-size:12px;color:#feca57;font-weight:bold}
.entry-box{background:#131b26;border:1px solid #243347;border-radius:14px;padding:20px 16px;text-align:center;margin-top:6px}
.prizes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0;text-align:left;font-size:12px}
.prize-item{background:#0b131e;border:1px solid #1e2b3c;padding:8px 10px;border-radius:8px;color:#d1d8e0}
.start-btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;font-size:15px;cursor:pointer;background:linear-gradient(135deg,#feca57,#ff9f43);color:#000;box-shadow:0 4px 15px rgba(254,202,87,.3);transition:transform .15s}
.start-btn:active{transform:scale(.97)}
.rnd-title{font-size:11px;font-weight:bold;color:#70a1ff;text-transform:uppercase;margin:10px 0 5px;letter-spacing:.5px}
.match-card{background:#131b26;border:1px solid #243347;border-radius:10px;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;font-size:13px;transition:transform .15s}
.match-card.my{border:2px solid #1dd1a1;background:linear-gradient(90deg,rgba(29,209,161,.18),rgba(19,27,38,.95));cursor:pointer;box-shadow:0 0 12px rgba(29,209,161,.2)}
.match-card.my:active{transform:scale(.98)}
.match-card.done{opacity:.72;cursor:default;box-shadow:none}
.badge{padding:4px 10px;border-radius:8px;background:#0b131e;color:#feca57;font-weight:bold;font-size:12px}
.play-pill{padding:5px 12px;border-radius:8px;background:#1dd1a1;color:#000;font-weight:bold;font-size:12px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.champ-box{background:linear-gradient(135deg,#b78628,#feca57);color:#000;border-radius:12px;padding:14px;text-align:center;font-weight:bold;margin-bottom:10px;font-size:14px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(7,11,20,.96);border:1px solid #ff5e57;color:#fff;padding:9px 16px;border-radius:12px;font-size:12px;display:none;white-space:nowrap;z-index:20}
.modal-bg{position:fixed;inset:0;background:rgba(4,7,14,.85);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}
.modal{background:#131b26;border:1px solid #4b7bec;border-radius:16px;padding:18px;max-width:340px;width:100%;text-align:center}
.modal-btns{display:flex;gap:8px;margin-top:16px}
.m-btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:bold;font-size:13px;cursor:pointer}
.m-yes{background:#1dd1a1;color:#000}
.m-no{background:#1e2b3c;color:#fff}
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="nav-btn" onclick="localStorage.removeItem('pc_play_ucl')">⚽ Вільна арена</a>
  <button id="quitBtn" class="nav-btn" style="display:none;color:#ff6b6b" onclick="askQuit()">🚪 Завершити турнір</button>
</div>

<div id="app"></div>
<div id="toast" class="toast"></div>

<div id="confirmModal" class="modal-bg">
  <div class="modal">
    <div style="font-size:32px;margin-bottom:6px">🏆</div>
    <div style="font-size:16px;font-weight:bold;color:#fff">Вступ до Ліги Чемпіонів</div>
    <div style="font-size:13px;color:#a5b1c2;margin-top:8px;line-height:1.4">
      Ви підтверджуєте участь у турнірі?<br>
      З вашого балансу буде списано <b style="color:#feca57">100 💰</b>, після чого відбудеться сліпе жеребкування 1/8 фіналу.
    </div>
    <div class="modal-btns">
      <button class="m-btn m-no" onclick="closeModal()">Скасувати</button>
      <button class="m-btn m-yes" onclick="confirmStart()">✅ Оплатити 100 💰</button>
    </div>
  </div>
</div>
<!-- ================ [ КІНЕЦЬ TURNIR.HTML : ЧАСТИНА 1 ] ================= -->
<!-- ===================================================================== -->
<!-- ================= [ TURNIR.HTML : ЧАСТИНА 2 З 2 ] =================== -->
<!-- ===================================================================== -->
<script>
try{window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}catch(e){}

const ENTRY_FEE=100;

const CLUBS=[
  {n:'Реал Мадрид',i:'👑',c:'#ffffff'},
  {n:'Барселона',i:'🔵🔴',c:'#a50044'},
  {n:'Баварія',i:'🔴⚪',c:'#dc052d'},
  {n:'Манчестер Сіті',i:'🩵',c:'#6cabdd'},
  {n:'ПСЖ',i:'🗼',c:'#004170'},
  {n:'Арсенал',i:'🔫',c:'#ef0107'},
  {n:'Інтер Мілан',i:'🐍',c:'#010e80'},
  {n:'Ліверпуль',i:'🦅',c:'#c8102e'},
  {n:'Атлетіко',i:'🔴⚪',c:'#cb3524'},
  {n:'Боруссія Д',i:'🐝',c:'#fde100'},
  {n:'Ювентус',i:'🦓',c:'#e5e5e5'},
  {n:'Байєр',i:'💊',c:'#e32221'},
  {n:'Мілан',i:'⚫🔴',c:'#fb090b'},
  {n:'Бенфіка',i:'🦅',c:'#e83030'},
  {n:'Спортінг',i:'🦁',c:'#008057'}
];

function emptyBracket(){
  return{active:false,rnd:0,r16:[],qf:[],sf:[],fn:[],champ:null};
}

function drawRandomBracket(){
  const pool=[...CLUBS].sort(()=>Math.random()-0.5);
  const myClub={n:'Твій Клуб',i:'🇺🇦',c:'#1dd1a1',isMe:true};
  const r16=[];
  r16.push({a:myClub,b:pool,sc:null});
  for(let i=1;i<15;i+=2){
    r16.push({a:pool[i],b:pool[i+1],sc:null});
  }
  return{active:true,rnd:0,r16,qf:[],sf:[],fn:[],champ:null};
}

let p={pt:0,lv:1,cp:0,cn:20,ow:['b1','k1'],eb:'b1',ek:'k1',ucl:null};

function loadWallet(){
  try{
    const old=JSON.parse(localStorage.getItem('pc_3d8'));
    const v=JSON.parse(localStorage.getItem('pc_ucl1'));
    if(v)p=Object.assign(p,v);
    else if(old){p=Object.assign(p,old);save();}
  }catch(e){}
  if(!p.ucl)p.ucl=emptyBracket();
}

function save(){
  try{localStorage.setItem('pc_ucl1',JSON.stringify(p))}catch(e){}
}

loadWallet();

window.addEventListener('pageshow',()=>{loadWallet();render();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadWallet();render();}});

function showMsg(txt,isOk=false){
  const el=document.getElementById('toast');
  el.textContent=txt;
  el.style.borderColor=isOk?'#1dd1a1':'#ff5e57';
  el.style.display='block';
  clearTimeout(window._t);
  window._t=setTimeout(()=>el.style.display='none',2500);
}

function openStartModal(){
  loadWallet();
  if(p.cn<ENTRY_FEE){
    showMsg(`Недостатньо монет! Потрібно ${ENTRY_FEE} 💰 (у вас ${p.cn} 💰)`);
    return;
  }
  document.getElementById('confirmModal').style.display='flex';
}

function closeModal(){
  document.getElementById('confirmModal').style.display='none';
}

function confirmStart(){
  closeModal();
  loadWallet();
  if(p.cn<ENTRY_FEE){
    showMsg(`Недостатньо монет! Потрібно ${ENTRY_FEE} 💰`);
    return;
  }
  p.cn-=ENTRY_FEE;
  p.ucl=drawRandomBracket();
  save();
  showMsg('🎲 Жеребкування проведено! Удачі в турнірі!',true);
  render();
}

function askQuit(){
  p.ucl=emptyBracket();
  save();
  render();
}

function startMyMatch(){
  localStorage.setItem('pc_play_ucl','1');
  location.href='index.html?mode=ucl';
}

function render(){
  const u=p.ucl;
  const quitBtn=document.getElementById('quitBtn');

  if(!u||!u.active||!u.r16||!u.r16.length){
    quitBtn.style.display='none';
    document.getElementById('app').innerHTML=`
      <div class="ucl-head">
        <div style="font-size:17px;font-weight:bold;color:#fff">🏆 UEFA CHAMPIONS PENALTY CUP</div>
        <div style="font-size:12px;color:#d1d8e0;margin-top:4px">Офіційний турнір на виліт серед 16 топ-клубів Європи</div>
        <div class="stats">
          <span>Рівень: ${p.lv}</span>
          <span>🏆 Кубків ЛЧ: ${p.cp}</span>
          <span>💰 Баланс: ${p.cn}</span>
        </div>
      </div>

      <div class="entry-box">
        <div style="font-size:42px;margin-bottom:8px">🏟</div>
        <div style="font-size:16px;font-weight:bold;color:#fff">Сліпе жеребкування плей-оф</div>
        <div style="font-size:12px;color:#8395a7;margin-top:6px;line-height:1.45">
          Суперники стануть відомі одразу після старту турніру. Пройдіть шлях від 1/8 фіналу до головного трофею!
        </div>

        <div class="prizes">
          <div class="prize-item">⚽ <b>1/8 фіналу:</b> +60 💰</div>
          <div class="prize-item">⚡️ <b>1/4 фіналу:</b> +110 💰</div>
          <div class="prize-item">🔥 <b>Півфінал:</b> +200 💰</div>
          <div class="prize-item" style="border-color:#feca57;color:#feca57">🏆 <b>Фінал ЛЧ:</b> +500 💰</div>
        </div>

        <button class="start-btn" onclick="openStartModal()">
          🏆 Розпочати турнір (Внесок ${ENTRY_FEE} 💰)
        </button>
      </div>`;
    return;
  }

  quitBtn.style.display='block';
  const curArr=[u.r16,u.qf,u.sf,u.fn][u.rnd]||u.r16;
  const myMatch=curArr.find(m=>m.a.isMe||m.b.isMe)||curArr;
  const opp=myMatch.a.isMe?myMatch.b:myMatch.a;

  let html=`
    <div class="ucl-head">
      <div style="font-size:16px;font-weight:bold;color:#fff">🏆 UEFA CHAMPIONS PENALTY CUP</div>
      <div style="font-size:12px;color:#d1d8e0;margin-top:4px">
        ${u.champ ? 'Турнір завершено!' : `Твій суперник: <b style="color:#feca57">${opp.i} ${opp.n}</b>`}
      </div>
      <div class="stats">
        <span>Рівень: ${p.lv}</span>
        <span>🏆 Кубків ЛЧ: ${p.cp}</span>
        <span>💰 ${p.cn}</span>
      </div>
    </div>`;

  if(u.champ){
    html+=`
      <div class="champ-box">
        🎉 ПЕРЕМОЖЕЦЬ СЕЗОНУ: ${u.champ.i} ${u.champ.n} 🎉
        <div style="margin-top:8px">
          <button class="start-btn" style="padding:10px;font-size:13px" onclick="openStartModal()">
            🔄 Новий сезон ЛЧ (Внесок ${ENTRY_FEE} 💰)
          </button>
        </div>
      </div>`;
  }

  const stages=[
    {title:'🏆 Фінал Ліги Чемпіонів (Приз 500 💰)',list:u.fn},
    {title:'🔥 Півфінали (Приз 200 💰)',list:u.sf},
    {title:'⚡️ 1/4 Фіналу (Приз 110 💰)',list:u.qf},
    {title:'⚽ 1/8 Фіналу (Приз 60 💰)',list:u.r16}
  ];

  stages.forEach(st=>{
    if(!st.list||!st.list.length)return;
    html+=`<div class="rnd-title">${st.title}</div>`;
    st.list.forEach(m=>{
      const isMy=(m.a.isMe||m.b.isMe);
      const isPlayable=(isMy && !m.sc && !u.champ);
      const clickAttr=isPlayable
        ? `onclick="startMyMatch()"`
        : `onclick="showMsg('Натисніть на зелений матч із вашим клубом, щоб грати!')"`;
      const centerTag=isPlayable
        ? `<span class="play-pill">⚽ ГРАТИ</span>`
        : `<span class="badge">${m.sc||'VS'}</span>`;

      html+=`
        <div class="match-card ${isMy?'my':''} ${m.sc?'done':''}" ${clickAttr}>
          <span>${m.a.i} <b>${m.a.n}</b></span>
          ${centerTag}
          <span><b>${m.b.n}</b> ${m.b.i}</span>
        </div>`;
    });
  });

  document.getElementById('app').innerHTML=html;
}

render();
</script>
</body>
</html>
<!-- ================ [ КІНЕЦЬ TURNIR.HTML : ЧАСТИНА 2 ] ================= -->
