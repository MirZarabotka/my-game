<!DOCTYPE html>
<html lang="uk">

    <meta charset="UTF-8">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }

        .title-box { text-align: center; }

        .header-right { display: flex; align-items: center; gap: 6px; }
        .refresh-btn {
            background: rgba(15, 23, 42, 0.88);
            color: #38bdf8; width: 36px; height: 36px; border-radius: 50%;

        .leaderboard-list {

        .player-row {

        .rank-1 .rank-badge { background: rgba(250, 204, 21, 0.2); color: #facc15; font-size: 1.15rem; }
        .rank-2 .rank-badge { background: rgba(226, 232, 240, 0.2); color: #e2e8f0; font-size: 1.15rem; }
        .rank-3 .rank-badge { background: rgba(245, 158, 11, 0.2); color: #fbbf24; font-size: 1.15rem; }

        .tg-avatar {
            width: 42px; height: 42px; border-radius: 50%;

            flex-shrink: 0; overflow: hidden; border: 1.5px solid rgba(255,255,255,0.22);
        }
        .tg-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .player-info { flex: 1; min-width: 0; }
        .player-name {
            font-weight: 800; font-size: 0.96rem; color: #f8fafc;

        .player-name-text {

            background: #0284c7; color: #fff; font-size: 0.65rem;

        }
        .edit-name-btn {
            background: rgba(56, 189, 248, 0.2); border: 1px solid rgba(56, 189, 248, 0.45);

        .player-coins {

            font-weight: 900; font-size: 0.88rem; white-space: nowrap;
        }

        .profile-card {

        .stat-val { font-size: 0.96rem; font-weight: 900; color: #f8fafc; }

        .stat-lbl { font-size: 0.68rem; color: #94a3b8; margin-top: 3px; font-weight: 700; }

<!-- ==================== КІНЕЦЬ ЧАСТИНИ 2 з 5 ==================== -->

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from './libs/GLTFLoader.js';
        import { DRACOLoader } from './libs/DRACOLoader.js';
        import { CATALOG } from './shop-catalog.js';

        const firebaseConfig = {
            databaseURL: 'https://firebasedatabase.app'
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        function formatTodayDate() {
            const d = new Date();
            const dd = String(d.getDate()).padStart(2, '0');
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const yyyy = d.getFullYear();
            return `${dd}.${mm}.${yyyy}`;
        }

        if (!localStorage.getItem('first_played_date')) {
            localStorage.setItem('first_played_date', formatTodayDate());
        }
        if (localStorage.getItem('player_coins') === null) {
            localStorage.setItem('player_coins', '500');
        }
        if (localStorage.getItem('matches_won') === null) {
            localStorage.setItem('matches_won', '0');
        }

        function getCurrentTelegramPlayer() {
            const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
            let fullName = '';
            let tgId = '';
            let avatarUrl = '';

            if (tgUser && tgUser.id) {
                tgId = 'tg_' + String(tgUser.id);
                fullName = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ').trim();
                if (!fullName && tgUser.username) fullName = '@' + tgUser.username;
                avatarUrl = tgUser.photo_url || '';
                localStorage.setItem('tg_player_id', tgId);
                if (fullName) localStorage.setItem('tg_player_name', fullName);
                if (avatarUrl) localStorage.setItem('tg_player_avatar', avatarUrl);
            } else {
                if (!localStorage.getItem('tg_player_id')) {
                    localStorage.setItem('tg_player_id', 'web_' + Math.floor(100000 + Math.random() * 900000));
                }
                tgId = localStorage.getItem('tg_player_id');
                fullName = localStorage.getItem('tg_player_name') || ('Гравець #' + tgId.slice(-4));
                avatarUrl = localStorage.getItem('tg_player_avatar') || '';
            }

            return {
                id: tgId,
                isMe: true,
                name: fullName,
                avatar: avatarUrl,
                coins: Number(localStorage.getItem('player_coins') || 500),
                wins: Number(localStorage.getItem('matches_won') || 0),
                joinedAt: localStorage.getItem('first_played_date') || formatTodayDate(),
                kit: {
                    jersey: localStorage.getItem('eq_jerseys') || 'j1',
                    shorts: localStorage.getItem('eq_shorts') || 's1',
                    boots: localStorage.getItem('eq_boots') || 'b1',
                    hair: localStorage.getItem('eq_hair') || 'h1',
                    number: localStorage.getItem('eq_number') || '10',
                    numColor: localStorage.getItem('eq_numColor') || '#ffffff'
                }
            };
        }

        let currentPlayer = getCurrentTelegramPlayer();
        document.getElementById('header-coins').textContent = `💰 ${currentPlayer.coins}`;

        async function syncAndLoadFirebaseLeaderboard() {
            currentPlayer = getCurrentTelegramPlayer();
            const listEl = document.getElementById('leaderboard-list');
            const subTitleEl = document.querySelector('.title-box p');
            listEl.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:24px;font-weight:700;">⏳ Підключення до Firebase...</div>';

            let players = [];

            try {
                const payload = {
                    id: currentPlayer.id,
                    name: currentPlayer.name,
                    avatar: currentPlayer.avatar,
                    coins: currentPlayer.coins,
                    wins: currentPlayer.wins,
                    joinedAt: currentPlayer.joinedAt,
                    kit: currentPlayer.kit,
                    updatedAt: Date.now()
                };

                await db.ref('players/' + currentPlayer.id).set(payload);

                const snapshot = await db.ref('players').once('value');
                const data = snapshot.val();

                if (data && typeof data === 'object') {
                    players = Object.values(data)
                        .filter(p => p && p.name)
                        .map(p => ({
                            ...p,
                            isMe: p.id === currentPlayer.id
                        }));
                }

                if (subTitleEl) {
                    subTitleEl.textContent = `🟢 База підключена • Гравців: ${players.length}`;
                    subTitleEl.style.color = '#4ade80';
                }
            } catch (err) {
                console.error('Firebase SDK error:', err);
                if (subTitleEl) {
                    subTitleEl.textContent = `🔴 Помилка бази: ${err.message}`;
                    subTitleEl.style.color = '#f87171';
                }
            }

            if (!players.length) {
                players = [currentPlayer];
            }

            players.sort((a, b) => (Number(b.coins) || 0) - (Number(a.coins) || 0));
            renderLeaderboard(players);
        }

        document.getElementById('refresh-btn').addEventListener('click', syncAndLoadFirebaseLeaderboard);
// ==================== КІНЕЦЬ ЧАСТИНИ 3 з 5 ====================
// ==================== ПОЧАТОК ЧАСТИНИ 4 з 5 ====================
        function getInitials(name) {
            const clean = String(name || '').replace(/^@/, '').trim();
            const words = clean.split(/\s+/).filter(Boolean);
            if (words.length >= 2) {
                return (words.at(0).slice(0, 1) + words.at(1).slice(0, 1)).toUpperCase();
            }
            return clean.slice(0, 2).toUpperCase() || '⚽';
        }

        function renderLeaderboard(players) {
            const listEl = document.getElementById('leaderboard-list');
            listEl.innerHTML = '';

            players.forEach((player, index) => {
                const rank = index + 1;
                const row = document.createElement('div');
                row.className = 'player-row' +
                    (player.isMe ? ' is-me' : '') +
                    (rank <= 3 ? ` rank-${rank}` : '');

                const medal = rank === 1 ? '🥇' : (rank === 2 ? '🥈' : (rank === 3 ? '🥉' : `#${rank}`));
                const avatarHtml = player.avatar
                    ? `<img src="${player.avatar}" alt="">`
                    : getInitials(player.name);

                row.innerHTML = `
                    <div class="rank-badge">${medal}</div>
                    <div class="tg-avatar">${avatarHtml}</div>
                    <div class="player-info">
                        <div class="player-name">
                            <span class="player-name-text">${player.name}</span>
                            ${player.isMe ? '<span class="me-tag">ТИ</span><button class="edit-name-btn" title="Змінити ім\'я">✏️</button>' : ''}
                        </div>
                        <div class="player-sub">🏆 Перемог: ${player.wins || 0} • У грі з ${player.joinedAt || 'нещодавно'}</div>
                    </div>
                    <div class="player-coins">💰 ${player.coins || 0}</div>
                `;

                if (player.isMe) {
                    const editBtn = row.querySelector('.edit-name-btn');
                    if (editBtn) {
                        editBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const newName = prompt('Введи своє ім\'я або нікнейм для рейтингу:', currentPlayer.name);
                            if (newName && newName.trim().length >= 2) {
                                localStorage.setItem('tg_player_name', newName.trim());
                                syncAndLoadFirebaseLeaderboard();
                            }
                        });
                    }
                }

                row.addEventListener('click', () => openPlayerProfile(player, rank));
                listEl.appendChild(row);
            });
        }

        const modalEl = document.getElementById('profile-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const canvasEl = document.getElementById('player-3d-canvas');
        const viewerWrap = document.getElementById('viewer-wrap');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(36, 1.4, 0.1, 50);
        camera.position.set(0, 1.05, 3.15);
        camera.lookAt(0, 0.92, 0);

        const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;

        scene.add(new THREE.AmbientLight(0xdbeafe, 1.35));
        const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
        keyLight.position.set(2.5, 4, 3);
        scene.add(keyLight);

        const backLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
        backLight.position.set(-2.5, 3, -3);
        scene.add(backLight);

        const podium = new THREE.Mesh(
            new THREE.CylinderGeometry(0.68, 0.75, 0.08, 32),
            new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.5, roughness: 0.3 })
        );
        podium.position.y = -0.04;
        scene.add(podium);

        const podiumRing = new THREE.Mesh(
            new THREE.RingGeometry(0.66, 0.72, 32),
            new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide })
        );
        podiumRing.rotation.x = -Math.PI / 2;
        podiumRing.position.y = 0.005;
        scene.add(podiumRing);

        const playerHolder = new THREE.Group();
        scene.add(playerHolder);

        let activeMixer = null;

        function createJerseyTexture(jersey) {
            const c = document.createElement('canvas');
            c.width = 512; c.height = 512;
            const ctx = c.getContext('2d');
            ctx.fillStyle = jersey.c1; ctx.fillRect(0, 0, 512, 512);
            ctx.fillStyle = jersey.c2;
            if (jersey.pattern === 'stripes') { for (let x = 0; x < 512; x += 44) ctx.fillRect(x, 0, 22, 512); }
            else if (jersey.pattern === 'hoops') { for (let y = 0; y < 512; y += 44) ctx.fillRect(0, y, 512, 22); }
            else if (jersey.pattern === 'half') { ctx.fillRect(105, 0, 60, 512); ctx.fillRect(265, 0, 85, 512); }
            else if (jersey.pattern === 'centerBand') { ctx.fillRect(85, 0, 45, 512); ctx.fillRect(245, 0, 45, 512); }
            else if (jersey.pattern === 'chestBand') { ctx.fillRect(0, 160, 512, 130); }
            else if (jersey.pattern === 'sash') { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(120, 0); ctx.lineTo(512, 512); ctx.lineTo(392, 512); ctx.closePath(); ctx.fill(); }
            else if (jersey.pattern === 'sleeves') { ctx.fillRect(203, 0, 22, 512); ctx.fillRect(398, 0, 114, 512); }
            const tex = new THREE.CanvasTexture(c);
            tex.flipY = false; tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createBackNumberTexture(num, numCol) {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = numCol;
            ctx.strokeStyle = numCol === '#000000' ? '#ffffff' : '#000000';
            ctx.lineWidth = 10;
            ctx.font = '900 165px "Segoe UI", sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.strokeText(num, 128, 128);
            ctx.fillText(num, 128, 128);
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }
// ==================== КІНЕЦЬ ЧАСТИНИ 4 з 5 ====================
// ==================== ПОЧАТОК ЧАСТИНИ 5 з 5 ====================
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('./libs/');
        const loader = new GLTFLoader();
        loader.setDRACOLoader(dracoLoader);

        function buildDressedPlayer(kit) {
            while (playerHolder.children.length) {
                playerHolder.remove(playerHolder.children.at(0));
            }
            activeMixer = null;

            loader.load('player.glb?v=' + Date.now(), (gltf) => {
                const model = gltf.scene || (gltf.scenes && gltf.scenes.at(0));
                if (!model) return;

                const anim = gltf.animations && gltf.animations.at(0);
                if (anim) {
                    activeMixer = new THREE.AnimationMixer(model);
                    activeMixer.clipAction(anim).play();
                    activeMixer.update(0.01);
                }

                const jersey = (CATALOG.jerseys || []).find(x => x.id === kit.jersey) || CATALOG.jerseys.at(0);
                const shortItem = (CATALOG.shorts || []).find(x => x.id === kit.shorts) || CATALOG.shorts.at(0);
                const bootItem = (CATALOG.boots || []).find(x => x.id === kit.boots) || CATALOG.boots.at(0);
                const jerseyTex = createJerseyTexture(jersey);

                let spineBone = null;
                model.traverse((child) => {
                    if (child.isBone && child.name) {
                        const n = child.name.toLowerCase();
                        if (n.includes('spine2') || (!spineBone && n.includes('spine1'))) spineBone = child;
                    }
                    if (!child.isMesh || !child.material) return;
                    const name = (child.name || '').toLowerCase();
                    if (name.includes('shirt') || name.includes('top') || name.includes('jersey') || name.includes('torso')) {
                        child.material = new THREE.MeshStandardMaterial({ map: jerseyTex, roughness: 0.65 });
                    } else if (name.includes('short') || name.includes('pant')) {
                        child.material = new THREE.MeshStandardMaterial({ color: shortItem.c1, roughness: 0.72 });
                    } else if (name.includes('shoe') || name.includes('boot')) {
                        child.material = new THREE.MeshStandardMaterial({ color: bootItem.c1, roughness: 0.38 });
                    }
                });

                const numMesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(30, 30),
                    new THREE.MeshBasicMaterial({
                        map: createBackNumberTexture(kit.number || '10', kit.numColor || '#ffffff'),
                        transparent: true, side: THREE.DoubleSide, depthWrite: false
                    })
                );
                if (spineBone) {
                    numMesh.position.set(0, 2.0, -13.2);
                    numMesh.rotation.set(0.08, Math.PI, 0);
                    spineBone.add(numMesh);
                }

                playerHolder.add(model);
            });
        }

        function resizeViewer() {
            const w = viewerWrap.clientWidth || 340;
            const h = viewerWrap.clientHeight || 270;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h, false);
        }

        function openPlayerProfile(player, rank) {
            document.getElementById('modal-player-name').textContent = player.name;
            document.getElementById('modal-player-rank').textContent = `Місце в рейтингу: #${rank}`;
            document.getElementById('modal-coins').textContent = `💰 ${player.coins || 0}`;
            document.getElementById('modal-wins').textContent = `${player.wins || 0}`;
            document.getElementById('modal-joined').textContent = player.joinedAt || 'Невідомо';

            playerHolder.rotation.y = 0.35;
            modalEl.classList.add('open');
            resizeViewer();
            buildDressedPlayer(player.kit || { jersey: 'j1', shorts: 's1', boots: 'b1', number: '10', numColor: '#ffffff' });
        }

        closeModalBtn.addEventListener('click', () => modalEl.classList.remove('open'));
        modalEl.addEventListener('click', (e) => {
            if (e.target === modalEl) modalEl.classList.remove('open');
        });

        let isDragging = false;
        let prevX = 0;
        viewerWrap.addEventListener('pointerdown', (e) => { isDragging = true; prevX = e.clientX; });
        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            playerHolder.rotation.y += (e.clientX - prevX) * 0.014;
            prevX = e.clientX;
        });
        window.addEventListener('pointerup', () => { isDragging = false; });

        let lastT = performance.now();
        function animateViewer(now) {
            requestAnimationFrame(animateViewer);
            const dt = Math.min(0.05, (now - lastT) * 0.001);
            lastT = now;

            if (modalEl.classList.contains('open')) {
                if (activeMixer) activeMixer.update(dt);
                if (!isDragging) playerHolder.rotation.y += dt * 0.55;
                renderer.render(scene, camera);
            }
        }

        syncAndLoadFirebaseLeaderboard();
        requestAnimationFrame(animateViewer);
    </script>
</body>
</html>
