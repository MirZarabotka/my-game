<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Penalty Master 3D — Гардероб</title>
    <link rel="stylesheet" href="shop.css">
</head>
<body>

    <div class="top-nav">
        <a href="index.html" class="back-btn">← На головну</a>
        <div class="header-stats">
            <span>👕 Гардероб</span>
            <span class="coins-badge" id="coins-display">💰 500</span>
        </div>
    </div>

    <div class="preview-card">
        <div class="viewport-box">
            <div id="canvas-container"></div>
            <button class="rotate-btn" id="flip-btn">🔄 Спина / Перед</button>
        </div>
        <div class="item-details">
            <div>
                <span class="status-tag" id="preview-status">✅ ОДЯГНЕНО НА ГРАВЦЯ</span>
                <h2 id="preview-title">Блауграна (Барса)</h2>
                <p id="preview-desc">Синьо-гранатові вертикальні смуги</p>
            </div>
            <button class="action-btn equipped" id="preview-action-btn">Одягнено ✓</button>
        </div>
    </div>

    <div class="tabs-bar" id="tabs-bar">
        <button class="tab-btn active" data-tab="jerseys">👕 Футболки (20)</button>
        <button class="tab-btn" data-tab="shorts">🩳 Шорти (20)</button>
        <button class="tab-btn" data-tab="boots">👟 Бутси (20)</button>
        <button class="tab-btn" data-tab="gloves">🧤 Рукавиці (20)</button>
        <button class="tab-btn" data-tab="balls">⚽ М'ячі (20)</button>
        <button class="tab-btn" data-tab="number">#️⃣ Номер</button>
    </div>

    <div class="items-scroll" id="items-scroll"></div>
    <div id="toast">Недостатньо монет! Зіграй матч, щоб заробити ⚽</div>

    <script type="importmap">
        {
            "imports": {
                "three": "./libs/three.module.js"
            }
        }
    </script>

    <script type="module" src="shop.js"></script>
</body>
</html>
