const NUM_COLORS=[
  {n:'Білий',c:'#ffffff'},{n:'Чорний',c:'#11161d'},
  {n:'Золотий',c:'#feca57'},{n:'Неон',c:'#00d2ff'},
  {n:'Червоний',c:'#ff5e57'},{n:'Смарагд',c:'#1dd1a1'}
];
let p={pt:0,lv:1,cp:0,cn:20,ow:['j1','p1','s1','b1','k1'],ej:'j1',ep:'p1',es:'s1',eb:'b1',ek:'k1',num:'10',numCol:'#ffffff',ucl:null,nick:'',uid:''};
let curCat='j';
let preview={};
let viewBack=false;

function loadWallet(){
  try{
    const old=JSON.parse(localStorage.getItem('pc_3d8'));
    const v=JSON.parse(localStorage.getItem('pc_ucl1'));
    if(v)p=Object.assign(p,v);
    else if(old){p=Object.assign(p,old);save();}
  }catch(e){}
  if(!p.ej)p.ej='j1';
  if(!p.ep)p.ep='p1';
  if(!p.es)p.es='s1';
  if(!p.eb)p.eb='b1';
  if(!p.ek)p.ek='k1';
  if(!p.num)p.num='10';
  if(!p.numCol)p.numCol='#ffffff';
  ['j1','p1','s1','b1','k1'].forEach(id=>{if(!p.ow.includes(id))p.ow.push(id);});
}

function save(){try{localStorage.setItem('pc_ucl1',JSON.stringify(p));}catch(e){}}
loadWallet();

function getItem(id){return SHOP.find(x=>x.id===id)||SHOP.at(0);}

function showToast(txt){
  const t=document.getElementById('toast');
  t.textContent=txt;t.style.display='block';
  setTimeout(()=>{t.style.display='none';},2200);
}

async function pushScoreToCloud(){
  if(!p||!p.uid)return;
  try{
    const r=await fetch(API_URL+'/latest',{headers:{'X-Master-Key':API_KEY}});
    if(!r.ok)return;
    const j=await r.json();
    const list=Array.isArray(j.record)?j.record:[];
    const map=new Map();
    list.forEach(u=>{if(u&&u.uid&&u.uid!=='init')map.set(u.uid,u);});
    map.set(p.uid,{uid:p.uid,n:p.nick||('Гравець #'+p.uid.slice(-4)),cn:Number(p.cn)||0,lv:Number(p.lv)||1,cp:Number(p.cp)||0});
    const top=Array.from(map.values()).sort((a,b)=>(b.cn-a.cn)||(b.cp-a.cp)||(b.lv-a.lv)).slice(0,100);
    await fetch(API_URL,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':API_KEY},body:JSON.stringify(top)});
  }catch(e){}
}

function flipModel(){
  viewBack=!viewBack;
  document.getElementById('flipBtn').textContent=viewBack?'🔄 Обличчя':'🔄 Спина';
}

function setCat(c){
  curCat=c;
  ['j','p','s','b','k','n'].forEach(k=>{
    document.getElementById('cat_'+k).className=(k===c)?'ctab act':'ctab';
  });
  if(c==='n' && !viewBack)flipModel();
  renderShop();
}

function isEquipped(item){
  return p['e'+item.cat]===item.id;
}

function tryItem(id){
  const item=getItem(id);
  preview[item.cat]=id;
  if(p.ow.includes(id)){
    p['e'+item.cat]=id;
    save();
  }
  updateFittingPanel(item);
  renderShop();
}

function cancelPreview(cat){
  delete preview[cat];
  const eqItem=getItem(p['e'+cat]);
  updateFittingPanel(eqItem);
  renderShop();
}

function confirmBuy(id){
  const item=getItem(id);
  if(p.ow.includes(id) || p.cn<item.p)return;
  p.cn-=item.p;
  p.ow.push(id);
  p['e'+item.cat]=id;
  delete preview[item.cat];
  save();
  pushScoreToCloud();
  showToast(`✅ Куплено: ${item.n}!`);
  updateFittingPanel(item);
  renderShop();
}

function updateFittingPanel(item){
  const st=document.getElementById('fitStatus');
  const nm=document.getElementById('fitName');
  const ds=document.getElementById('fitDesc');
  const ac=document.getElementById('fitActions');
  if(!item)return;

  const owned=p.ow.includes(item.id);
  nm.textContent=`${item.i} ${item.n}`;
  ds.textContent=item.d;

  if(owned){
    st.textContent='✅ Одягнено на гравця';
    st.style.color='#1dd1a1';
    ac.innerHTML='';
  }else{
    st.textContent='👀 Візуальна примірка';
    st.style.color='#feca57';
    const canBuy=p.cn>=item.p;
    ac.innerHTML=`
      <button class="confirm-btn" ${canBuy?'':'disabled'} onclick="confirmBuy('${item.id}')">
        ${canBuy?`✅ Підтвердити покупку (${item.p} 💰)`:`❌ Не вистачає (${item.p} 💰)`}
      </button>
      <button class="cancel-btn" onclick="cancelPreview('${item.cat}')">✖ Скасувати примірку</button>
    `;
  }
}
function updateNumber(val){
  let clean=String(val).replace(/[^0-9]/g,'').slice(0,2);
  if(clean==='0'||clean==='00')clean='1';
  if(!clean)clean='10';
  p.num=clean;
  save();
}

function setNumColor(col){
  p.numCol=col;
  save();
  renderShop();
}

function renderShop(){
  document.getElementById('cn').textContent=p.cn;
  const g=document.getElementById('shopGrid');

  if(curCat==='n'){
    document.getElementById('fitStatus').textContent='🔢 Номер на спині';
    document.getElementById('fitStatus').style.color='#70a1ff';
    document.getElementById('fitName').textContent=`Номер #${p.num}`;
    document.getElementById('fitDesc').textContent='Введи число від 1 до 99 та обери колір друку на формі';
    document.getElementById('fitActions').innerHTML='';

    const colsHtml=NUM_COLORS.map(c=>`
      <button class="col-btn ${p.numCol===c.c?'act':''}" onclick="setNumColor('${c.c}')">
        <span class="swatch" style="background:${c.c}"></span>${c.n}
      </button>
    `).join('');

    g.innerHTML=`
      <div class="num-panel">
        <div style="font-size:12px;color:#8395a7;margin-bottom:8px">Ігровий номер (від 1 до 99):</div>
        <input type="text" inputmode="numeric" maxlength="2" class="num-input" value="${p.num}" oninput="updateNumber(this.value)">
        <div style="font-size:12px;color:#8395a7;margin-top:14px">Колір номера на спині:</div>
        <div class="col-grid">${colsHtml}</div>
      </div>
    `;
    return;
  }

  const items=SHOP.filter(x=>x.cat===curCat);
  g.innerHTML=items.map(item=>{
    const owned=p.ow.includes(item.id);
    const eq=isEquipped(item);
    const isPrv=preview[item.cat]===item.id && !owned;
    const dotBg=item.ac?`linear-gradient(135deg,${item.col} 55%,${item.ac} 55%)`:item.col;

    let btnCls='sbtn';
    let btnTxt=`👀 Приміряти • ${item.p} 💰`;
    if(eq){btnCls+=' wear';btnTxt='✅ Одягнено';}
    else if(owned){btnCls+=' owned';btnTxt='👕 Одягти';}
    else if(isPrv){btnCls+=' prv';btnTxt=`⚡ Приміряється (${item.p} 💰)`;}

    return `<div class="card ${eq?'eq':''} ${isPrv?'prv':''}" onclick="tryItem('${item.id}')">
      <div>
        <div class="preview-dot" style="background:${dotBg}">${item.i}</div>
        <b style="font-size:12px">${item.n}</b>
        <div style="font-size:10px;color:#8395a7;margin-top:3px">${item.d}</div>
      </div>
      <button class="${btnCls}">${btnTxt}</button>
    </div>`;
  }).join('');
}

updateFittingPanel(getItem(p.ej));
renderShop();
const fCanvas=document.getElementById('fitCanvas'),fCtx=fCanvas.getContext('2d');
fCanvas.width=430;fCanvas.height=580;

function fCapsule(x1,y1,x2,y2,r1,r2,col){
  const ang=Math.atan2(y2-y1,x2-x1),perp=ang+Math.PI/2;
  fCtx.fillStyle=col;fCtx.beginPath();
  fCtx.arc(x1,y1,r1,perp,perp+Math.PI);
  fCtx.arc(x2,y2,r2,perp+Math.PI,perp);
  fCtx.closePath();fCtx.fill();
}

function drawMannequin(t){
  const W=fCanvas.width,H=fCanvas.height;
  fCtx.clearRect(0,0,W,H);

  const bg=fCtx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a1426');bg.addColorStop(0.62,'#142847');
  bg.addColorStop(0.62,'#1e5c24');bg.addColorStop(1,'#16441b');
  fCtx.fillStyle=bg;fCtx.fillRect(0,0,W,H);

  const curJ=getItem(preview.j||p.ej);
  const curP=getItem(preview.p||p.ep);
  const curS=getItem(preview.s||p.es);
  const curB=getItem(preview.b||p.eb);
  const curK=getItem(preview.k||p.ek);

  const cx=W*0.5,baseY=H*0.84,sc=3.85;
  const skin='#e4b487',shade='#be8450',light='#f6d3af';
  const breath=Math.sin(t*2.5)*2.2;

  fCtx.fillStyle='rgba(0,0,0,0.45)';
  fCtx.beginPath();fCtx.ellipse(cx,baseY+14,82,20,0,0,Math.PI*2);fCtx.fill();

  [-1,1].forEach(side=>{
    const xOff=side*16*sc;
    const hipY=baseY-46*sc,kneeY=baseY-24*sc,ankY=baseY-3*sc;
    fCapsule(cx+xOff,hipY,cx+xOff,kneeY,24,19,viewBack?(curP.dark||curP.col):curP.col);
    fCapsule(cx+xOff,kneeY,cx+xOff,kneeY+15,14.5,13.5,skin);
    fCapsule(cx+xOff,kneeY+13,cx+xOff,ankY,15.5,11,curJ.col);
    fCtx.fillStyle=curJ.trim||'#fff';
    fCtx.fillRect(cx+xOff-14.5,kneeY+13,29,6);

    fCtx.save();fCtx.translate(cx+xOff,ankY);
    fCtx.fillStyle='#111';fCtx.fillRect(-15,8,30,6.5);
    fCtx.fillStyle=curS.col;
    fCtx.beginPath();fCtx.roundRect(-17,-8,34,17,7);fCtx.fill();
    fCtx.fillStyle=curS.ac||'#1dd1a1';
    fCtx.fillRect(-10,-1.5,20,5);
    fCtx.restore();
  });

  const ty=baseY-46*sc+breath;
  const tG=fCtx.createLinearGradient(cx-64,ty-145,cx+64,ty);
  tG.addColorStop(0,curJ.col);tG.addColorStop(1,curJ.dark||curJ.col);
  fCtx.fillStyle=tG;
  fCtx.beginPath();
  fCtx.moveTo(cx-64,ty-130);fCtx.quadraticCurveTo(cx,ty-154,cx+64,ty-130);
  fCtx.lineTo(cx+54,ty);fCtx.quadraticCurveTo(cx,ty+8,cx-54,ty);fCtx.closePath();fCtx.fill();

  if(viewBack){
    fCtx.fillStyle=p.numCol||'#ffffff';
    fCtx.font='900 68px sans-serif';fCtx.textAlign='center';
    fCtx.fillText(p.num||'10',cx,ty-44);
  }else{
    fCtx.fillStyle=curJ.trim||'#fff';
    fCtx.beginPath();fCtx.ellipse(cx,ty-138,19,7,0,0,Math.PI);fCtx.fill();
    fCtx.fillStyle='rgba(255,255,255,0.88)';fCtx.font='bold 20px sans-serif';fCtx.textAlign='center';
    fCtx.fillText('CHAMPIONS',cx,ty-72);
    fCtx.fillStyle='#feca57';fCtx.beginPath();fCtx.arc(cx+28,ty-98,7.5,0,Math.PI*2);fCtx.fill();
  }

  [-1,1].forEach(side=>{
    const shX=cx+side*58,shY=ty-122;
    const elX=shX+side*22,elY=shY+51;
    const hdX=elX+side*8.5,hdY=elY+44;
    fCapsule(shX,shY,elX,elY,17,13.5,curJ.col);
    fCapsule(elX,elY,hdX,hdY,12.5,10,skin);

    fCtx.save();fCtx.translate(hdX,hdY);
    fCtx.fillStyle='#14181d';fCtx.fillRect(-9.5,-5,19,7.5);
    fCtx.fillStyle=curK.col;
    fCtx.beginPath();fCtx.roundRect(-10.5,2.5,21,13.5,4);fCtx.fill();
    [-7.2,-2.4,2.4,7.2].forEach(fx=>{
      fCtx.beginPath();fCtx.roundRect(fx-1.9,14.5,3.8,10.5,1.8);fCtx.fill();
    });
    fCtx.restore();
  });

  fCapsule(cx,ty-140,cx,ty-164,13.5,12.5,shade);
  fCtx.fillStyle='#191e26';
  fCtx.beginPath();fCtx.ellipse(cx,ty-194,31,32.5,0,0,Math.PI*2);fCtx.fill();

  const fG=fCtx.createRadialGradient(cx-7,ty-194,3.5,cx,ty-188,34);
  fG.addColorStop(0,light);fG.addColorStop(0.65,skin);fG.addColorStop(1,shade);
  fCtx.fillStyle=fG;fCtx.beginPath();fCtx.ellipse(cx,ty-188,28,32.5,0,0,Math.PI*2);fCtx.fill();

  if(!viewBack){
    fCtx.fillStyle='#1e272e';
    fCtx.beginPath();fCtx.arc(cx-9.5,ty-191,3.8,0,Math.PI*2);fCtx.arc(cx+9.5,ty-191,3.8,0,Math.PI*2);fCtx.fill();
    fCtx.strokeStyle='#a8683a';fCtx.lineWidth=3.8;
    fCtx.beginPath();fCtx.arc(cx,ty-176,7.6,0.12*Math.PI,0.88*Math.PI);fCtx.stroke();
    fCtx.fillStyle='#191e26';
    fCtx.beginPath();fCtx.ellipse(cx,ty-210,29,15.5,0,Math.PI*0.95,Math.PI*2.05);fCtx.fill();
  }else{
    fCtx.fillStyle='#191e26';
    fCtx.beginPath();fCtx.ellipse(cx,ty-191,30,33.5,0,0,Math.PI*2);fCtx.fill();
  }

  const bx=cx+72,by=baseY-17,rad=22;
  fCtx.fillStyle='rgba(0,0,0,0.4)';
  fCtx.beginPath();fCtx.ellipse(bx,baseY+8,20,7,0,0,Math.PI*2);fCtx.fill();
  const bG=fCtx.createRadialGradient(bx-7,by-7,3.5,bx,by,rad);
  bG.addColorStop(0,'#ffffff');bG.addColorStop(0.6,curB.col);bG.addColorStop(1,'#1e272e');
  fCtx.fillStyle=bG;fCtx.beginPath();fCtx.arc(bx,by,rad,0,Math.PI*2);fCtx.fill();
  fCtx.fillStyle='rgba(0,0,0,0.65)';
  fCtx.beginPath();fCtx.arc(bx,by,7,0,Math.PI*2);fCtx.fill();
}
let ft=0;
function fitLoop(){
  ft+=0.04;
  drawMannequin(ft);
  requestAnimationFrame(fitLoop);
}
fitLoop();
</script>
