<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Penalty Master 3D — Гардероб</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
        body {
            width: 100vw;
            height: 100vh;
            background: #0b1120;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #0f172a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            height: 48px;
            width: 100%;
        }
        .back-btn {
            text-decoration: none;
            background: #1e293b;
            color: #f8fafc;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .coins-badge {
            background: rgba(234, 179, 8, 0.15);
            color: #facc15;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(234, 179, 8, 0.4);
            font-weight: 800;
            font-size: 0.88rem;
        }
        .preview-card {
            display: flex;
            gap: 8px;
            padding: 8px 10px;
            background: #111827;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            height: 225px;
            width: 100%;
            overflow: hidden;
        }
        .viewport-box {
            position: relative;
            width: 145px;
            height: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: radial-gradient(circle at 50% 35%, #1d4ed8 0%, #0f172a 75%);
            border: 1px solid rgba(56, 189, 248, 0.25);
            flex-shrink: 0;
        }
        #canvas-container { width: 100%; height: 100%; cursor: grab; touch-action: none; }
        .swipe-hint {
            position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.75); color: #cbd5e1; padding: 2px 6px;
            border-radius: 6px; font-size: 0.62rem; pointer-events: none; white-space: nowrap;
        }
        .right-controls {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 5px;
            overflow: hidden;
        }
        .tabs-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 5px;
            flex: 1;
        }
        .tab-btn {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            padding: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tab-btn.active { background: #22c55e; color: #052e16; border-color: #4ade80; }
        .selected-name {
            font-size: 0.74rem; font-weight: 700; color: #94a3b8;
            text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .action-btn {
            width: 100%; padding: 8px; border-radius: 8px; border: none;
            font-weight: 800; font-size: 0.8rem; cursor: pointer;
        }
        .action-btn.equipped { background: #1e293b; color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.35); }
        .action-btn.equip { background: #22c55e; color: #052e16; }
        .action-btn.buy { background: #facc15; color: #422006; }
        .action-btn.no-coins { background: #334155; color: #94a3b8; }

        .items-scroll { flex: 1; width: 100%; overflow-y: auto; padding: 10px 12px 20px 12px; }
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 10px; }
        .card {
            background: #131c31; border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px; padding: 10px; display: flex; flex-direction: column;
            align-items: center; text-align: center; cursor: pointer;
        }
        .card.equipped { border-color: #22c55e; background: rgba(34, 197, 94, 0.08); }
        .card.inspecting { border-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        .card-icon {
            width: 44px; height: 44px; border-radius: 10px; margin-bottom: 6px;
            display: flex; align-items: center; justify-content: center; font-size: 1.25rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .card-title { font-size: 0.8rem; font-weight: 800; color: #f8fafc; margin-bottom: 3px; }
        .card-desc { font-size: 0.66rem; color: #94a3b8; margin-bottom: 8px; min-height: 24px; }
        .card-btn { width: 100%; padding: 6px; border-radius: 8px; border: none; font-size: 0.74rem; font-weight: 800; cursor: pointer; }
        .card-btn.equipped-btn { background: #1e293b; color: #4ade80; }
        .card-btn.owned-btn { background: #334155; color: #f8fafc; }
        .card-btn.buy-btn { background: #facc15; color: #422006; }

        .number-panel { background: #131c31; padding: 12px; border-radius: 12px; }
        .number-panel h4 { font-size: 0.82rem; margin-bottom: 8px; color: #cbd5e1; }
        .num-colors { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .num-color-dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
        .num-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; }
        .num-cell { background: #1e293b; color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 8px 0; border-radius: 8px; font-weight: 800; cursor: pointer; }
        .num-cell.selected { background: #22c55e; color: #052e16; }

        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
            background: #ef4444; color: white; padding: 8px 16px; border-radius: 20px;
            font-weight: 700; font-size: 0.82rem; transition: transform 0.3s; z-index: 100; white-space: nowrap;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="index.html" class="back-btn">← На головну</a>
        <span class="coins-badge" id="coins-display">💰 500</span>
    </div>

    <div class="preview-card">
        <div class="viewport-box">
            <div id="canvas-container"></div>
            <div class="swipe-hint">↔ Крути пальцем</div>
        </div>
        <div class="right-controls">
            <div class="tabs-grid" id="tabs-bar">
                <button class="tab-btn active" data-tab="jerseys">👕 Футболки</button>
                <button class="tab-btn" data-tab="shorts">🩳 Шорти</button>
                <button class="tab-btn" data-tab="boots">👟 Бутси</button>
                <button class="tab-btn" data-tab="gloves">🧤 Рукавиці</button>
                <button class="tab-btn" data-tab="balls">⚽ М'ячі</button>
                <button class="tab-btn" data-tab="number">#️⃣ Номер</button>
            </div>
            <div class="selected-name" id="preview-title">Блауграна (Барса)</div>
            <button class="action-btn equipped" id="preview-action-btn">Одягнено ✓</button>
        </div>
    </div>

    <div class="items-scroll" id="items-scroll"></div>
    <div id="toast">Недостатньо монет!</div>

    <script type="importmap">{ "imports": { "three": "./libs/three.module.js" } }</script>
    <script type="module" src="shop.js?v=10"></script>
</body>
</html>
