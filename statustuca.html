<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Champions Penalty — Рейтинг гравців</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:sans-serif;background:#070b14;color:#fff;margin:0;padding:8px;display:flex;flex-direction:column;height:100vh;user-select:none;overflow:hidden}
.box{background:#131b26;border:1px solid #243347;border-radius:12px;padding:9px 12px;margin-bottom:6px;flex-shrink:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.inp{background:#09101c;border:1px solid #2f435e;color:#fff;padding:7px 10px;border-radius:8px;font-size:12px;flex:1;outline:none}
.inp:focus{border-color:#1dd1a1}
.btn{background:#1e3799;border:1px solid #4b7bec;color:#fff;padding:7px 11px;border-radius:8px;font-weight:bold;font-size:12px;cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn.grn{background:#1dd1a1;border-color:#1dd1a1;color:#000}
.board{flex:1;overflow-y:auto;background:linear-gradient(180deg,#0b1322,#101c30);border:1px solid #243347;border-radius:14px;padding:8px;margin-bottom:8px}
.item{display:flex;align-items:center;justify-content:space-between;background:#131f33;border:1px solid #203454;border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.item.me{border:1.5px solid #1dd1a1;background:rgba(29,209,161,.14)}
.item.top1{border-color:#feca57;background:rgba(254,202,87,.12)}
.item.top2{border-color:#c8d6e5}
.item.top3{border-color:#e17055}
.rank{width:28px;font-weight:900;font-size:14px;text-align:center;flex-shrink:0}
.info{flex:1;min-width:0;padding:0 8px}
.name{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:10px;color:#8395a7;margin-top:2px}
.coins{font-weight:900;color:#feca57;font-size:14px;text-align:right;flex-shrink:0}
.tabs{display:flex;gap:6px;flex-shrink:0}
.tab{flex:1;padding:10px 6px;background:#131b26;border:1px solid #243347;color:#fff;border-radius:10px;font-weight:bold;font-size:12px;cursor:pointer;text-align:center;text-decoration:none}
.tab.on{background:#152547;color:#70a1ff;border-color:#3867d6}
.status{text-align:center;font-size:11px;color:#8395a7;padding:12px}
.toast{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);background:#1dd1a1;color:#000;padding:7px 16px;border-radius:14px;font-weight:bold;font-size:12px;display:none;z-index:99;text-align:center;max-width:90%}
</style>
</head>
<body>

<div class="box">
  <div class="row" style="margin-bottom:6px">
    <b style="color:#feca57;font-size:13px">🌍 Реальні гравці • Топ за монетами</b>
    <span id="myPos" style="font-size:11px;color:#1dd1a1;font-weight:bold">Місце: #—</span>
  </div>
  <div class="row">
    <input type="text" id="nickInp" class="inp" maxlength="18" placeholder="Твій нікнейм...">
    <button class="btn grn" onclick="saveNick()">💾 Зберегти</button>
    <button class="btn" onclick="syncLeaderboard(true)">🔄 Оновити</button>
  </div>
</div>

<div class="board" id="board">
  <div class="status">⏳ Завантаження реальних гравців...</div>
</div>

<div class="tabs">
  <a href="index.html" class="tab">🏠 Головна</a>
  <a href="game.html" class="tab">⚽ Грати</a>
  <a href="statustuca.html" class="tab on">📊 Рейтинг</a>
</div>

<div class="toast" id="toast">Оновлено!</div>

<script>
try{window.Telegram.WebApp.ready();window.Telegram.WebApp.expand();}catch(e){}

const BIN_ID  = '6b01a76bffd5d16053d39022';
const API_KEY = '$2a$10$FfzYgApncFFRJpoFkrYgyOZHPwjviuwu1N64Suvm4DneHJP..xKna';
const API_URL = 'https://jsonbin.io' + BIN_ID;


let p={pt:0,lv:1,cp:0,cn:20,nick:'',uid:''};
try{
  const v=JSON.parse(localStorage.getItem('pc_ucl1'));
  if(v)p=Object.assign(p,v);
}catch(e){}

try{
  const tgUser=window.Telegram?.WebApp?.initDataUnsafe?.user;
  if(tgUser){
    p.uid='tg_'+tgUser.id;
    if(!p.nick){
      p.nick=tgUser.first_name+(tgUser.username?` (@${tgUser.username})`:'');
    }
  }
}catch(e){}

if(!p.uid) p.uid='u_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
if(!p.nick) p.nick='Гравець #'+p.uid.slice(-4).toUpperCase();
try{localStorage.setItem('pc_ucl1',JSON.stringify(p));}catch(e){}

document.getElementById('nickInp').value=p.nick;

function esc(str){
  const map=new Map([['&','&amp;'],['<','&lt;'],['>','&gt;'],['"','&quot;'],["'",'&#39;']]);
  return String(str).replace(/[&<>"']/g,m=>map.get(m)||m);
}

function showToast(txt,isErr){
  const t=document.getElementById('toast');
  t.textContent=txt;
  t.style.background=isErr?'#ff6b6b':'#1dd1a1';
  t.style.color=isErr?'#fff':'#000';
  t.style.display='block';
  setTimeout(()=>{t.style.display='none';},2800);
}

function saveNick(){
  const val=document.getElementById('nickInp').value.trim();
  if(!val)return;
  p.nick=val;
  try{localStorage.setItem('pc_ucl1',JSON.stringify(p));}catch(e){}
  syncLeaderboard(true);
}

function renderList(players){
  const me={
    uid:p.uid,
    n:p.nick,
    cn:Number(p.cn)||0,
    lv:Number(p.lv)||1,
    cp:Number(p.cp)||0
  };

  const map=new Map();
  if(Array.isArray(players)){
    players.forEach(u=>{
      if(u && u.uid && u.uid!=='init' && u.n && typeof u.cn==='number') map.set(u.uid,u);
    });
  }
  map.set(me.uid,me);

  const all=Array.from(map.values());
  all.sort((a,b)=>(b.cn-a.cn)||(b.cp-a.cp)||(b.lv-a.lv));

  const myIdx=all.findIndex(x=>x.uid===me.uid);
  document.getElementById('myPos').textContent=`Твоє місце: #${myIdx+1} з ${all.length}`;

  const medals=['🥇','🥈','🥉'];
  const html=all.map((u,idx)=>{
    const isMe=(u.uid===me.uid);
    const rankStr=idx<3?medals.at(idx):`#${idx+1}`;
    const cls=`item ${isMe?'me':''} ${idx===0?'top1':(idx===1?'top2':(idx===2?'top3':''))}`;
    return `<div class="${cls}">
      <div class="rank">${rankStr}</div>
      <div class="info">
        <div class="name">${esc(u.n)}${isMe?' (Ти)':''}</div>
        <div class="sub">Рівень ${u.lv} • 🏆 Кубків ЛЧ: ${u.cp}</div>
      </div>
      <div class="coins">💰 ${u.cn}</div>
    </div>`;
  }).join('');

  document.getElementById('board').innerHTML=html;
  return all.slice(0,100);
}

async function syncLeaderboard(notify){
  let remote=[];
  let fetchOk=false;
  try{
    const res=await fetch(API_URL+'/latest',{
      headers:{
        'X-Master-Key':API_KEY,
        'X-Bin-Meta':'false'
      }
    });
    if(res.ok){
      const json=await res.json();
      remote=Array.isArray(json)?json:(Array.isArray(json.record)?json.record:[]);
      fetchOk=true;
    }else{
      showToast('⚠️ Помилка читання БД: код '+res.status,true);
    }
  }catch(e){
    showToast('⚠️ Немає зв\'язку з JSONBin',true);
  }

  const updatedTop=renderList(remote);

  if(!fetchOk) return;

  try{
    const putRes=await fetch(API_URL,{
      method:'PUT',
      headers:{
        'Content-Type':'application/json',
        'X-Master-Key':API_KEY
      },
      body:JSON.stringify(updatedTop)
    });
    if(putRes.ok && notify) showToast('✅ Онлайн-рейтинг оновлено!',false);
    else if(!putRes.ok) showToast('⚠️ Помилка запису БД: код '+putRes.status,true);
  }catch(e){
    if(notify) showToast('⚠️ Помилка запису на сервер',true);
  }
}

syncLeaderboard(false);
</script>
</body>
</html>
