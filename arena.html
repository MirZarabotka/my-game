    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from './libs/GLTFLoader.js';
        import { DRACOLoader } from './libs/DRACOLoader.js';
        import { CATALOG } from './shop-catalog.js';

        if (localStorage.getItem('player_coins') === null) {
            localStorage.setItem('player_coins', '500');
        }
        let coins = Number(localStorage.getItem('player_coins') || 500);
        let goalsCount = 0;
        let shotsCount = 0;

        const coinsEl = document.getElementById('arena-coins');
        const goalsEl = document.getElementById('goals-cnt');
        const shotsEl = document.getElementById('shots-cnt');
        const bannerEl = document.getElementById('status-banner');
        coinsEl.textContent = `💰 ${coins}`;

        function setBanner(text, type = '') {
            bannerEl.textContent = text;
            bannerEl.className = 'status-banner' + (type ? ' ' + type : '');
        }

        class ArenaAudio {
            constructor() {
                this.ctx = null;
                this.enabled = localStorage.getItem('stadium_sound') !== 'off';
            }
            init() {
                if (this.ctx || !this.enabled) return;
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) this.ctx = new AudioCtx();
            }
            playKick() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(34, now + 0.16);
                gain.gain.setValueAtTime(0.7, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.18);
            }
            playCrowd(isGoal) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                const dur = isGoal ? 2.1 : 1.1;
                const len = Math.floor(this.ctx.sampleRate * dur);
                const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
                const ch = buf.getChannelData(0);
                let last = 0;
                for (let i = 0; i < len; i++) {
                    last = (last + 0.04 * (Math.random() * 2 - 1)) / 1.04;
                    ch[i] = last * 3.8 * Math.sin(Math.PI * (i / len));
                }
                const src = this.ctx.createBufferSource();
                const flt = this.ctx.createBiquadFilter();
                const gn = this.ctx.createGain();
                src.buffer = buf;
                flt.type = 'lowpass';
                flt.frequency.setValueAtTime(isGoal ? 640 : 240, now);
                gn.gain.setValueAtTime(isGoal ? 0.52 : 0.28, now);
                gn.gain.exponentialRampToValueAtTime(0.001, now + dur);
                src.connect(flt);
                flt.connect(gn);
                gn.connect(this.ctx.destination);
                src.start(now);
            }
        }
        const arenaAudio = new ArenaAudio();

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x071326);
        scene.fog = new THREE.FogExp2(0x071326, 0.011);

        const SPOT_Z = -19.86;
        const GOAL_Z = -29.8;
        const GOAL_W = 7.32;
        const GOAL_H = 2.44;
        const GOAL_D = 1.9;

        const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.1, 180);
        const camBasePos = new THREE.Vector3(-0.75, 1.85, SPOT_Z + 4.55);
        const camLookTarget = new THREE.Vector3(0, 1.15, GOAL_Z);
        camera.position.copy(camBasePos);
        camera.lookAt(camLookTarget);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xdbeafe, 1.1));
        const sunLight = new THREE.DirectionalLight(0xffffff, 2.3);
        sunLight.position.set(10, 18, -8);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.set(2048, 2048);
        scene.add(sunLight);

        const rimLight = new THREE.DirectionalLight(0x93c5fd, 1.15);
        rimLight.position.set(-12, 14, -36);
        scene.add(rimLight);
// ==================== КІНЕЦЬ ЧАСТИНИ 2 з 9 ====================
// ==================== ПОЧАТОК ЧАСТИНИ 3 з 9 ====================
        function createPitchTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            const stripeCount = 12;
            const stripeH = 1024 / stripeCount;
            for (let i = 0; i < stripeCount; i++) {
                ctx.fillStyle = i % 2 === 0 ? '#15803d' : '#166534';
                ctx.fillRect(0, i * stripeH, 1024, stripeH);
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
            ctx.lineWidth = 7;
            ctx.strokeRect(48, 48, 928, 928);

            ctx.beginPath();
            ctx.moveTo(48, 512);
            ctx.lineTo(976, 512);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(512, 512, 95, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeRect(236, 48, 552, 210);
            ctx.strokeRect(374, 48, 276, 78);
            ctx.beginPath();
            ctx.arc(512, 204, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(512, 204, 88, 0.22 * Math.PI, 0.78 * Math.PI);
            ctx.stroke();

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = 8;
            return tex;
        }

        const stadiumGroup = new THREE.Group();
        scene.add(stadiumGroup);

        const pitch = new THREE.Mesh(
            new THREE.PlaneGeometry(46, 66),
            new THREE.MeshStandardMaterial({ map: createPitchTexture(), roughness: 0.85 })
        );
        pitch.rotation.x = -Math.PI / 2;
        pitch.receiveShadow = true;
        stadiumGroup.add(pitch);

        const track = new THREE.Mesh(
            new THREE.PlaneGeometry(66, 86),
            new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 })
        );
        track.rotation.x = -Math.PI / 2;
        track.position.y = -0.02;
        stadiumGroup.add(track);

        function createBannerTexture() {
            const c = document.createElement('canvas');
            c.width = 2048; c.height = 128;
            const ctx = c.getContext('2d');
            const g = ctx.createLinearGradient(0, 0, 2048, 0);
            g.addColorStop(0, '#0284c7'); g.addColorStop(0.5, '#1d4ed8'); g.addColorStop(1, '#0284c7');
            ctx.fillStyle = g; ctx.fillRect(0, 0, 2048, 128);
            ctx.fillStyle = '#38bdf8'; ctx.fillRect(0, 0, 2048, 10); ctx.fillRect(0, 118, 2048, 10);
            ctx.fillStyle = '#ffffff'; ctx.font = '900 54px "Segoe UI", sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('⚽ PENALTY 3D ARENA   ★   CHAMPIONS CUP   ★   GOAL TIME! 🔥', 1024, 66);
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping; tex.repeat.set(3, 1); tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }
        const bannerTex = createBannerTexture();
        const adMat = new THREE.MeshBasicMaterial({ map: bannerTex });

        const adBack = new THREE.Mesh(new THREE.BoxGeometry(52, 1.25, 0.25), adMat);
        adBack.position.set(0, 0.62, -32.4);
        const adLeft = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1.25, 66), adMat);
        adLeft.position.set(-24.2, 0.62, 0);
        const adRight = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1.25, 66), adMat);
        adRight.position.set(24.2, 0.62, 0);
        stadiumGroup.add(adBack, adLeft, adRight);
// ==================== КІНЕЦЬ ЧАСТИНИ 3 з 9 ====================
// ==================== ПОЧАТОК ЧАСТИНИ 4 з 9 ====================
        const tierMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85 });
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.6, roughness: 0.35 });
        const fanPositions = [];
        const seatPositions = [];
        const jerseyColors = [0xdc2626, 0x2563eb, 0xeab308, 0x16a34a, 0xf8fafc, 0xea580c, 0x0284c7, 0x9333ea];
        const skinColors = [0xffdbac, 0xf1c27d, 0xe0ac69, 0xc68642];
        const hairColors = [0x1c1917, 0x451a03, 0x78350f, 0xd97706];

        for (let r = 0; r < 8; r++) {
            const rowY = 1.35 + r * 0.68;
            const zDist = 33.6 + r * 1.02;
            const stepW = 54 + r * 2;
            const step = new THREE.Mesh(new THREE.BoxGeometry(stepW, 0.68, 1.05), tierMat);
            step.position.set(0, rowY - 0.34, -zDist);
            stadiumGroup.add(step);

            for (let x = -stepW * 0.46; x <= stepW * 0.46; x += 0.88) {
                if (Math.abs((Math.abs(x) % 11) - 5.5) < 0.75) continue;
                seatPositions.push({ x, y: rowY + 0.12, z: -zDist });
                if (Math.random() > 0.18) {
                    fanPositions.push({ x: x + (Math.random() - 0.5) * 0.12, y: rowY, z: -zDist + 0.08, phase: Math.random() * 6.28 });
                }
            }
        }

        const backRoof = new THREE.Mesh(new THREE.BoxGeometry(70, 0.45, 12), roofMat);
        backRoof.position.set(0, 8.8, -38.0);
        stadiumGroup.add(backRoof);

        const dummy = new THREE.Object3D();
        const tmpColor = new THREE.Color();

        const seatsInst = new THREE.InstancedMesh(new THREE.BoxGeometry(0.48, 0.34, 0.38), new THREE.MeshStandardMaterial({ color: 0x1d4ed8, roughness: 0.45 }), seatPositions.length);
        seatPositions.forEach((s, i) => {
            dummy.position.set(s.x, s.y, s.z);
            dummy.updateMatrix();
            seatsInst.setMatrixAt(i, dummy.matrix);
        });
        seatsInst.instanceMatrix.needsUpdate = true;
        stadiumGroup.add(seatsInst);

        const fCnt = fanPositions.length;
        const torsosInst = new THREE.InstancedMesh(new THREE.CapsuleGeometry(0.21, 0.34, 6, 10), new THREE.MeshStandardMaterial({ roughness: 0.72 }), fCnt);
        const headsInst = new THREE.InstancedMesh(new THREE.SphereGeometry(0.135, 10, 10), new THREE.MeshStandardMaterial({ roughness: 0.55 }), fCnt);
        const hairsInst = new THREE.InstancedMesh(new THREE.SphereGeometry(0.142, 10, 8, 0, Math.PI * 2, 0, Math.PI * 0.58), new THREE.MeshStandardMaterial({ roughness: 0.85 }), fCnt);
        const armsInst = new THREE.InstancedMesh(new THREE.CapsuleGeometry(0.05, 0.34, 4, 8), new THREE.MeshStandardMaterial({ roughness: 0.55 }), fCnt * 2);

        fanPositions.forEach((f, i) => {
            dummy.position.set(f.x, f.y + 0.34, f.z);
            dummy.scale.set(1.15, 1.0, 0.68);
            dummy.updateMatrix();
            torsosInst.setMatrixAt(i, dummy.matrix);
            tmpColor.setHex(jerseyColors.at(i % jerseyColors.length));
            torsosInst.setColorAt(i, tmpColor);

            dummy.position.set(f.x, f.y + 0.76, f.z);
            dummy.scale.set(0.95, 1.08, 0.98);
            dummy.updateMatrix();
            headsInst.setMatrixAt(i, dummy.matrix);
            tmpColor.setHex(skinColors.at(i % skinColors.length));
            headsInst.setColorAt(i, tmpColor);

            dummy.position.set(f.x, f.y + 0.775, f.z);
            dummy.scale.set(0.98, 1.05, 1.02);
            dummy.updateMatrix();
            hairsInst.setMatrixAt(i, dummy.matrix);
            tmpColor.setHex(hairColors.at(i % hairColors.length));
            hairsInst.setColorAt(i, tmpColor);

            dummy.scale.set(1, 1, 1);
            dummy.position.set(f.x - 0.27, f.y + 0.36, f.z);
            dummy.rotation.set(0, 0, 0.14);
            dummy.updateMatrix();
            armsInst.setMatrixAt(i * 2, dummy.matrix);
            armsInst.setColorAt(i * 2, tmpColor.setHex(skinColors.at(i % skinColors.length)));

            dummy.position.set(f.x + 0.27, f.y + 0.36, f.z);
            dummy.rotation.set(0, 0, -0.14);
            dummy.updateMatrix();
            armsInst.setMatrixAt(i * 2 + 1, dummy.matrix);
            armsInst.setColorAt(i * 2 + 1, tmpColor);
            dummy.rotation.set(0, 0, 0);
        });
        [torsosInst, headsInst, hairsInst, armsInst].forEach(m => {
            m.instanceMatrix.needsUpdate = true;
            if (m.instanceColor) m.instanceColor.needsUpdate = true;
            stadiumGroup.add(m);
        });

        const goalGroup = new THREE.Group();
        goalGroup.position.set(0, 0, GOAL_Z);
        scene.add(goalGroup);

        const postMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.25, metalness: 0.15 });
        const postGeo = new THREE.CylinderGeometry(0.085, 0.085, GOAL_H, 16);
        const barGeo = new THREE.CylinderGeometry(0.085, 0.085, GOAL_W + 0.17, 16);

        const leftPost = new THREE.Mesh(postGeo, postMat);
        leftPost.position.set(-GOAL_W / 2, GOAL_H / 2, 0);
        leftPost.castShadow = true;

        const rightPost = new THREE.Mesh(postGeo, postMat);
        rightPost.position.set(GOAL_W / 2, GOAL_H / 2, 0);
        rightPost.castShadow = true;

        const crossbar = new THREE.Mesh(barGeo, postMat);
        crossbar.rotation.z = Math.PI / 2;
        crossbar.position.set(0, GOAL_H, 0);
        crossbar.castShadow = true;

        const netTexCanvas = document.createElement('canvas');
        netTexCanvas.width = 64; netTexCanvas.height = 64;
        const nctx = netTexCanvas.getContext('2d');
        nctx.strokeStyle = 'rgba(255,255,255,0.55)';
        nctx.lineWidth = 3;
        nctx.strokeRect(0, 0, 64, 64);
        const netTex = new THREE.CanvasTexture(netTexCanvas);
        netTex.wrapS = THREE.RepeatWrapping;
        netTex.wrapT = THREE.RepeatWrapping;
        netTex.repeat.set(36, 12);

        const netPlaneMat = new THREE.MeshBasicMaterial({ map: netTex, transparent: true, side: THREE.DoubleSide, depthWrite: false });
        const backNetGeo = new THREE.PlaneGeometry(GOAL_W, GOAL_H, 24, 10);
        const backNetBase = backNetGeo.attributes.position.array.slice();
        const backNet = new THREE.Mesh(backNetGeo, netPlaneMat);
        backNet.position.set(0, GOAL_H / 2, -GOAL_D);

        const topNet = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_W, GOAL_D), netPlaneMat);
        topNet.rotation.x = Math.PI / 2;
        topNet.position.set(0, GOAL_H, -GOAL_D / 2);

        const sideNetMat = new THREE.MeshBasicMaterial({ map: netTex.clone(), transparent: true, side: THREE.DoubleSide, depthWrite: false });
        sideNetMat.map.repeat.set(10, 12);
        const leftNet = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_D, GOAL_H), sideNetMat);
        leftNet.rotation.y = Math.PI / 2;
        leftNet.position.set(-GOAL_W / 2, GOAL_H / 2, -GOAL_D / 2);

        const rightNet = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_D, GOAL_H), sideNetMat);
        rightNet.rotation.y = -Math.PI / 2;
        rightNet.position.set(GOAL_W / 2, GOAL_H / 2, -GOAL_D / 2);

        goalGroup.add(leftPost, rightPost, crossbar, backNet, topNet, leftNet, rightNet);
// ==================== КІНЕЦЬ ЧАСТИНИ 4 з 9 ====================
// ==================== ПОЧАТОК ЧАСТИНИ 5 з 9 ====================
        function createBallTexture(c1, c2) {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 128;
            const ctx = c.getContext('2d');
            ctx.fillStyle = c1; ctx.fillRect(0, 0, 256, 128);
            ctx.fillStyle = c2;
            for (let x = 16; x < 256; x += 48) {
                for (let y = 20; y < 128; y += 44) {
                    ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI * 2); ctx.fill();
                }
            }
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createJerseyTexture(jersey) {
            const c = document.createElement('canvas');
            c.width = 512; c.height = 512;
            const ctx = c.getContext('2d');
            ctx.fillStyle = jersey.c1; ctx.fillRect(0, 0, 512, 512);
            ctx.fillStyle = jersey.c2;
            if (jersey.pattern === 'stripes') { for (let x = 0; x < 512; x += 44) ctx.fillRect(x, 0, 22, 512); }
            else if (jersey.pattern === 'hoops') { for (let y = 0; y < 512; y += 44) ctx.fillRect(0, y, 512, 22); }
            else if (jersey.pattern === 'half') { ctx.fillRect(105, 0, 60, 512); ctx.fillRect(265, 0, 85, 512); }
            else if (jersey.pattern === 'centerBand') { ctx.fillRect(85, 0, 45, 512); ctx.fillRect(245, 0, 45, 512); }
            else if (jersey.pattern === 'chestBand') { ctx.fillRect(0, 160, 512, 130); }
            else if (jersey.pattern === 'sash') { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(120, 0); ctx.lineTo(512, 512); ctx.lineTo(392, 512); ctx.closePath(); ctx.fill(); }
            else if (jersey.pattern === 'sleeves') { ctx.fillRect(203, 0, 22, 512); ctx.fillRect(398, 0, 114, 512); }
            const tex = new THREE.CanvasTexture(c);
            tex.flipY = false; tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createBackNumberTexture(num, numCol) {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = numCol;
            ctx.strokeStyle = numCol === '#000000' ? '#ffffff' : '#000000';
            ctx.lineWidth = 10;
            ctx.font = '900 165px "Segoe UI", sans-serif';

            if (gkGlovesLoaded) {
                if (gkLeftHand) gkLeftHand.scale.setScalar(0.0001);
                if (gkRightHand) gkRightHand.scale.setScalar(0.0001);
            }

            gkState.modeTime += dt;

            let diveAmt = 0;
            let crouchAmt = 0;
            let celebrateAmt = 0;
            let despairAmt = 0;

            if (gkState.mode === 'ready') {
                gkState.readyTime += dt;
                gkState.x = THREE.MathUtils.lerp(gkState.x, 0, Math.min(1, dt * 8));
                gkState.y = 0;
                gkState.diveAngle = THREE.MathUtils.lerp(gkState.diveAngle, 0, Math.min(1, dt * 10));
                crouchAmt = 0.18 + Math.abs(Math.sin(gkState.readyTime * 3.2)) * 0.04;
            } else if (gkState.mode === 'dive') {
                const p = Math.min(1, gkState.modeTime / Math.max(0.38, shotDuration));
                const easeX = 1 - Math.pow(1 - p, 1.8);
                gkState.x = THREE.MathUtils.lerp(gkState.startX, gkState.targetX, easeX);
                gkState.y = Math.sin(p * Math.PI) * gkState.peakY;
                const maxAngle = gkState.isHigh ? 1.32 : 1.48;
                gkState.diveAngle = -gkState.diveDir * maxAngle * Math.min(1, p * 1.35);
                diveAmt = Math.min(1, p * 1.4);
            } else if (gkState.mode === 'land') {
                const p = Math.min(1, gkState.modeTime / 0.55);
                gkState.y = THREE.MathUtils.lerp(gkState.y, 0.02, Math.min(1, dt * 14));
                gkState.diveAngle = THREE.MathUtils.lerp(gkState.diveAngle, -gkState.diveDir * 1.54, Math.min(1, dt * 12));
                diveAmt = 1.0 - p * 0.25;
                if (p >= 1) {
                    gkState.mode = 'getup';
                    gkState.modeTime = 0;
                }
            } else if (gkState.mode === 'getup') {
                const p = Math.min(1, gkState.modeTime / 0.65);
                const ease = p * p * (3 - 2 * p);
                gkState.diveAngle = THREE.MathUtils.lerp(-gkState.diveDir * 1.54, 0, ease);
                gkState.y = Math.sin(p * Math.PI) * 0.08;
                diveAmt = (1 - ease) * 0.75;
                crouchAmt = Math.sin(p * Math.PI) * 0.35;
                if (p >= 1) {
                    gkState.mode = 'react';
                    gkState.modeTime = 0;
                }
            } else if (gkState.mode === 'react') {
                gkState.diveAngle = THREE.MathUtils.lerp(gkState.diveAngle, 0, Math.min(1, dt * 10));
                if (gkState.outcome === 'save') {
                    celebrateAmt = Math.min(1, gkState.modeTime * 4);
                    gkState.y = Math.abs(Math.sin(gkState.modeTime * 7.5)) * 0.14;
                } else {
                    despairAmt = Math.min(1, gkState.modeTime * 3.5);
                    gkState.y = 0;
                }
            }
// ==================== КІНЕЦЬ ЧАСТИНИ 9A з 9 ====================
// ==================== ПОЧАТОК ЧАСТИНИ 9B з 9 ====================
            const crouchSink = crouchAmt * 0.14;
            const lieLift = (Math.abs(gkState.diveAngle) / 1.54) * 0.22;
            gkContainer.position.set(gkState.x, Math.max(0, gkState.y + lieLift - crouchSink), GOAL_Z + 0.25);
            gkContainer.rotation.z = gkState.diveAngle;
            gkContainer.rotation.x = diveAmt * 0.12;

            const rArm = getBone(gkBones, 'rightarm');
            const lArm = getBone(gkBones, 'leftarm');
            const rForeArm = getBone(gkBones, 'rightforearm');
            const lForeArm = getBone(gkBones, 'leftforearm');
            const rUpLeg = getBone(gkBones, 'rightupleg');
            const lUpLeg = getBone(gkBones, 'leftupleg');
            const rLeg = getBone(gkBones, 'rightleg');
            const lLeg = getBone(gkBones, 'leftleg');
            const rFoot = getBone(gkBones, 'rightfoot');
            const lFoot = getBone(gkBones, 'leftfoot');
            const spine = getBone(gkBones, 'spine');
            const head = getBone(gkBones, 'head');

            if (rArm) {
                rArm.rotation.z += -crouchAmt * 0.45 - diveAmt * 2.55 - celebrateAmt * 2.5 + despairAmt * 0.35;
                rArm.rotation.x += -crouchAmt * 0.65 - diveAmt * 0.25 - despairAmt * 1.45;
            }
            if (lArm) {
                lArm.rotation.z += crouchAmt * 0.45 + diveAmt * 2.55 + celebrateAmt * 2.5 - despairAmt * 0.35;
                lArm.rotation.x += -crouchAmt * 0.65 - diveAmt * 0.25 - despairAmt * 1.45;
            }
            if (rForeArm) {
                rForeArm.rotation.y += -crouchAmt * 0.85;
                rForeArm.rotation.z += despairAmt * 1.65;
            }
            if (lForeArm) {
                lForeArm.rotation.y += crouchAmt * 0.85;
                lForeArm.rotation.z += -despairAmt * 1.65;
            }

            const trailBend = diveAmt * 0.42;
            const totalBend = crouchAmt + despairAmt * 0.22;
            if (rUpLeg) rUpLeg.rotation.x += -totalBend - (gkState.diveDir < 0 ? trailBend : 0);
            if (lUpLeg) lUpLeg.rotation.x += -totalBend - (gkState.diveDir > 0 ? trailBend : 0);
            if (rLeg) rLeg.rotation.x += -totalBend * 1.9 - (gkState.diveDir < 0 ? trailBend * 1.4 : 0);
            if (lLeg) lLeg.rotation.x += -totalBend * 1.9 - (gkState.diveDir > 0 ? trailBend * 1.4 : 0);
            if (rFoot) rFoot.rotation.x += totalBend * 0.9;
            if (lFoot) lFoot.rotation.x += totalBend * 0.9;

            if (spine) {
                spine.rotation.x += crouchAmt * 0.55 + despairAmt * 0.42 - celebrateAmt * 0.12;
            }
            if (head) {
                head.rotation.x += despairAmt * 0.38 - celebrateAmt * 0.15;
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            rszAim();
        });

        let lastTime = performance.now();
        function animate(now) {
            requestAnimationFrame(animate);
            const dt = Math.min(0.05, (now - lastTime) * 0.001);
            lastTime = now;

            updateStrikerAnim(dt);
            updateGoalkeeperAnim(dt);

            if (shotState === 'flying') {
                shotProgress = Math.min(1, shotProgress + dt / shotDuration);
                const ease = 1 - Math.pow(1 - shotProgress, 1.55);

                const curX = THREE.MathUtils.lerp(shotStart.x, shotTarget.x, ease) + Math.sin(shotProgress * Math.PI) * shotCurveX;
                const curY = THREE.MathUtils.lerp(shotStart.y, shotTarget.y, ease) + Math.sin(shotProgress * Math.PI) * shotArcY;
                const curZ = THREE.MathUtils.lerp(shotStart.z, shotTarget.z, ease);

                ballMesh.position.set(curX, curY, curZ);
                ballMesh.rotation.x -= dt * 20;
                ballMesh.rotation.y += shotCurveX * dt * 14;

                camera.position.z = THREE.MathUtils.lerp(camera.position.z, SPOT_Z + 3.4, dt * 3);
                camera.lookAt(curX * 0.25, 1.25, GOAL_Z);

                if (!checkLiveGoalkeeperSave() && shotProgress >= 1) {
                    evaluateShotResult();
                }
            } else if (shotState === 'rebound') {
                ballMesh.position.addScaledVector(reboundVel, dt);
                reboundVel.y -= 9.8 * dt;
                if (ballMesh.position.y < BALL_R) {
                    ballMesh.position.y = BALL_R;
                    reboundVel.y *= -0.45;
                    reboundVel.x *= 0.8;
                    reboundVel.z *= 0.8;
                }
                ballMesh.rotation.x += dt * 12;
                ballMesh.rotation.z -= reboundVel.x * dt * 4;
            } else if (shotState === 'in_net') {
                if (ballMesh.position.y > BALL_R) {
                    ballMesh.position.y = Math.max(BALL_R, ballMesh.position.y - 2.6 * dt);
                }
            }

            if (saveFlashAlpha > 0) {
                saveFlashAlpha = Math.max(0, saveFlashAlpha - dt * 2.8);
                saveFlashMesh.material.opacity = saveFlashAlpha;
                saveFlashMesh.scale.addScalar(dt * 3.5);
            }

            ballShadow.position.set(ballMesh.position.x, 0.01, ballMesh.position.z);
            const shScale = Math.max(0.35, 1 - (ballMesh.position.y - BALL_R) * 0.28);
            ballShadow.scale.setScalar(shScale);

            deformGoalNet(dt);
            bannerTex.offset.x += dt * 0.08;
            drawSwipeGuide();
            renderer.render(scene, camera);
        }

        requestAnimationFrame(animate);
    </script>
</body>
