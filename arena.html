    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from './libs/GLTFLoader.js';
        import { DRACOLoader } from './libs/DRACOLoader.js';
        import { CATALOG } from './shop-catalog.js';

        if (localStorage.getItem('player_coins') === null) {
            localStorage.setItem('player_coins', '500');
        }
        let coins = Number(localStorage.getItem('player_coins') || 500);

        const coinsEl = document.getElementById('arena-coins');
        const youScoreEl = document.getElementById('you-score');
        const botScoreEl = document.getElementById('bot-score');
        const youDotsEl = document.getElementById('you-dots');
        const botDotsEl = document.getElementById('bot-dots');
        const bannerEl = document.getElementById('status-banner');
        const hintEl = document.getElementById('bottom-hint');
        const matchModalEl = document.getElementById('match-modal');

        coinsEl.textContent = `💰 ${coins}`;

        function setBanner(text, type = '') {
            bannerEl.textContent = text;
            bannerEl.className = 'status-banner' + (type ? ' ' + type : '');
        }

        const series = {
            turnMode: 'attack',
            youGoals: 0,
            botGoals: 0,
            youHistory: [],
            botHistory: [],
            over: false
        };

        function renderSeriesHUD() {
            youScoreEl.textContent = series.youGoals;
            botScoreEl.textContent = series.botGoals;

            const totalSlots = Math.max(5, Math.max(series.youHistory.length, series.botHistory.length));
            youDotsEl.innerHTML = '';
            botDotsEl.innerHTML = '';

            for (let i = 0; i < totalSlots; i++) {
                const yd = document.createElement('div');
                yd.className = 'p-dot' + (series.youHistory[i] ? ' ' + series.youHistory[i] : '');
                youDotsEl.appendChild(yd);

                const bd = document.createElement('div');
                bd.className = 'p-dot' + (series.botHistory[i] ? ' ' + series.botHistory[i] : '');
                botDotsEl.appendChild(bd);
            }
        }
        renderSeriesHUD();

        function checkSeriesWinner() {
            const yShots = series.youHistory.length;
            const bShots = series.botHistory.length;

            if (yShots <= 5 && bShots <= 5) {
                const yRem = 5 - yShots;
                const bRem = 5 - bShots;
                if (series.youGoals > series.botGoals + bRem) return 'you';
                if (series.botGoals > series.youGoals + yRem) return 'bot';
                if (yShots === 5 && bShots === 5 && series.youGoals !== series.botGoals) {
                    return series.youGoals > series.botGoals ? 'you' : 'bot';
                }
            } else if (yShots === bShots && series.youGoals !== series.botGoals) {
                return series.youGoals > series.botGoals ? 'you' : 'bot';
            }
            return null;
        }
// ==================== КІНЕЦЬ ЧАСТИНИ 3 з 16 ====================
// ==================== ПОЧАТОК ЧАСТИНИ 4 з 16 ====================
        class ArenaAudio {
            constructor() {
                this.ctx = null;
                this.enabled = localStorage.getItem('stadium_sound') !== 'off';
                this.ambienceStarted = false;
            }
            init() {
                if (!this.enabled) return;
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                if (this.ctx && !this.ambienceStarted) {
                    this.startAmbience();
                }
            }
            startAmbience() {
                if (!this.ctx || this.ambienceStarted) return;
                this.ambienceStarted = true;
                const sr = this.ctx.sampleRate;
                const len = sr * 6;
                const buf = this.ctx.createBuffer(1, len, sr);
                const data = buf.getChannelData(0);
                let b0 = 0, b1 = 0, b2 = 0;
                for (let i = 0; i < len; i++) {
                    const t = i / sr;
                    const white = Math.random() * 2 - 1;
                    b0 = 0.997 * b0 + white * 0.025;
                    b1 = 0.985 * b1 + white * 0.045;
                    b2 = 0.950 * b2 + white * 0.080;
                    const chantWave = 0.72 + 0.28 * Math.sin(t * Math.PI * 1.33) * Math.sin(t * Math.PI * 0.33);
                    data[i] = (b0 + b1 + b2) * 0.55 * chantWave;
                }
                const src = this.ctx.createBufferSource();
                src.buffer = buf;
                src.loop = true;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 340;
                filter.Q.value = 0.65;
                const gain = this.ctx.createGain();
                gain.gain.value = 0.22;
                src.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                src.start();
            }
            playKick() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(165, now);
                osc.frequency.exponentialRampToValueAtTime(38, now + 0.14);
                gain.gain.setValueAtTime(0.95, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.16);

                const snapLen = Math.floor(this.ctx.sampleRate * 0.055);
                const snapBuf = this.ctx.createBuffer(1, snapLen, this.ctx.sampleRate);
                const ch = snapBuf.getChannelData(0);
                for (let i = 0; i < snapLen; i++) {
                    ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / snapLen, 2.2);
                }
                const snapSrc = this.ctx.createBufferSource();
                const snapFlt = this.ctx.createBiquadFilter();
                const snapGain = this.ctx.createGain();
                snapSrc.buffer = snapBuf;
                snapFlt.type = 'bandpass';
                snapFlt.frequency.value = 950;
                snapFlt.Q.value = 1.1;
                snapGain.gain.setValueAtTime(0.65, now);
                snapGain.gain.exponentialRampToValueAtTime(0.01, now + 0.055);
                snapSrc.connect(snapFlt);
                snapFlt.connect(snapGain);
                snapGain.connect(this.ctx.destination);
                snapSrc.start(now);
            }
            playPost() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;

                const thud = this.ctx.createOscillator();
                const thudGain = this.ctx.createGain();
                thud.type = 'triangle';
                thud.frequency.setValueAtTime(135, now);
                thud.frequency.exponentialRampToValueAtTime(48, now + 0.14);
                thudGain.gain.setValueAtTime(0.85, now);
                thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                thud.connect(thudGain);
                thudGain.connect(this.ctx.destination);
                thud.start(now);
                thud.stop(now + 0.16);

                const osc1 = this.ctx.createOscillator();
                const gain1 = this.ctx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(118, now);
                osc1.frequency.exponentialRampToValueAtTime(116.2, now + 0.36);
                gain1.gain.setValueAtTime(0.45, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
                osc1.connect(gain1);
                gain1.connect(this.ctx.destination);
                osc1.start(now);
                osc1.stop(now + 0.38);

                const osc2 = this.ctx.createOscillator();
                const gain2 = this.ctx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(236, now);
                osc2.frequency.exponentialRampToValueAtTime(232.4, now + 0.36);
                gain2.gain.setValueAtTime(0.18, now);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
                osc2.connect(gain2);
                gain2.connect(this.ctx.destination);
                osc2.start(now);
                osc2.stop(now + 0.38);
            }
            playCrowd(isHappy) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const dur = isHappy ? 2.2 : 1.4;
                const sr = this.ctx.sampleRate;
                const len = Math.floor(sr * dur);
                const buf = this.ctx.createBuffer(1, len, sr);
                const ch = buf.getChannelData(0);
                let last = 0;
                for (let i = 0; i < len; i++) {
                    const p = i / len;
                    last = (last + 0.05 * (Math.random() * 2 - 1)) / 1.05;
                    const env = isHappy
                        ? Math.min(1, p * 9) * Math.pow(1 - p, 0.75)
                        : Math.min(1, p * 7) * Math.pow(1 - p, 1.25);
                    ch[i] = last * 4.2 * env;
                }
                const src = this.ctx.createBufferSource();
                src.buffer = buf;
                const formant = this.ctx.createBiquadFilter();
                formant.type = 'bandpass';
                formant.Q.value = isHappy ? 1.4 : 2.1;
                if (isHappy) {
                    formant.frequency.setValueAtTime(360, now);
                    formant.frequency.exponentialRampToValueAtTime(680, now + 0.35);
                    formant.frequency.setValueAtTime(640, now + 1.3);
                    formant.frequency.exponentialRampToValueAtTime(420, now + dur);
                } else {
                    formant.frequency.setValueAtTime(470, now);
                    formant.frequency.exponentialRampToValueAtTime(205, now + dur);
                }
                const gn = this.ctx.createGain();
                gn.gain.setValueAtTime(isHappy ? 0.78 : 0.58, now);
                gn.gain.exponentialRampToValueAtTime(0.001, now + dur);
                src.connect(formant);
                formant.connect(gn);
                gn.connect(this.ctx.destination);
                src.start(now);
            }
        }
        const arenaAudio = new ArenaAudio();
// ==================== КІНЕЦЬ ЧАСТИНИ 4 з 16 ====================
// ==================== ПОЧАТОК ЧАСТИНИ 5 з 16 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x071326);
        scene.fog = new THREE.FogExp2(0x071326, 0.011);

        const SPOT_Z = -19.86;

        const GOAL_H = 2.44;
        const GOAL_D = 1.9;

        const attackCamPos = new THREE.Vector3(-0.95, 2.48, SPOT_Z + 4.95);

        const renderer = new THREE.WebGLRenderer({ antialias: true });

        function createPitchTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            const stripeCount = 12;
            const stripeH = 1024 / stripeCount;
            for (let i = 0; i < stripeCount; i++) {
                ctx.fillStyle = i % 2 === 0 ? '#15803d' : '#166534';
                ctx.fillRect(0, i * stripeH, 1024, stripeH);
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
            ctx.lineWidth = 7;
            ctx.strokeRect(48, 48, 928, 928);

            ctx.beginPath();
            ctx.moveTo(48, 512);
            ctx.lineTo(976, 512);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(512, 512, 95, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeRect(236, 48, 552, 210);
            ctx.strokeRect(374, 48, 276, 78);
            ctx.beginPath();
            ctx.arc(512, 204, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(512, 204, 88, 0.22 * Math.PI, 0.78 * Math.PI);
            ctx.stroke();

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = 8;
            return tex;
        }

        const stadiumGroup = new THREE.Group();
        scene.add(stadiumGroup);

        const pitch = new THREE.Mesh(

        function createBannerTexture() {
            const c = document.createElement('canvas');
            c.width = 2048; c.height = 128;
            const ctx = c.getContext('2d');
            const g = ctx.createLinearGradient(0, 0, 2048, 0);
            g.addColorStop(0, '#0284c7'); g.addColorStop(0.5, '#1d4ed8'); g.addColorStop(1, '#0284c7');
            ctx.fillStyle = g; ctx.fillRect(0, 0, 2048, 128);
            ctx.fillStyle = '#38bdf8'; ctx.fillRect(0, 0, 2048, 10); ctx.fillRect(0, 118, 2048, 10);
            ctx.fillStyle = '#ffffff'; ctx.font = '900 54px "Segoe UI", sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('⚽ PENALTY 3D ARENA   ★   CHAMPIONS CUP   ★   GOAL TIME! 🔥', 1024, 66);
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping; tex.repeat.set(3, 1); tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }
        const bannerTex = createBannerTexture();
        const adMat = new THREE.MeshBasicMaterial({ map: bannerTex });

        function triggerBotShot() {
            if (shotState !== 'ready' || series.turnMode !== 'defend' || series.over) return;

            const roll = Math.random();
            let bx = 0;

            let bPower = 0.85 + Math.random() * 0.25;

                by = 0.4 + Math.random() * 2.1;

                by = 0.25 + Math.random() * (GOAL_H - 0.45);

        function executeKick() {

        const aimRaycaster = new THREE.Raycaster();

        function triggerPlayerKeeperDive(dx, dy, speed) {
            if (series.turnMode !== 'defend' || playerGK.jumped) return;
            if (shotState !== 'runup' && shotState !== 'flying') return;

            playerGK.jumped = true;
            playerGK.jumpTime = 0;

            // Камера дивиться в +Z (з воріт у поле), тому ліворуч на екрані = +X, праворуч = -X
            const screenNormX = THREE.MathUtils.clamp(dx / (window.innerWidth * 0.24), -1.15, 1.15);
            const worldNormX = -screenNormX;
            const normY = THREE.MathUtils.clamp(dy / (window.innerHeight * 0.26), -0.35, 1.15);
            const reachBoost = THREE.MathUtils.clamp(0.88 + speed * 0.22, 0.88, 1.25);

            const targetX = THREE.MathUtils.clamp(worldNormX * (GOAL_W * 0.45) * reachBoost, -2.75, 2.75);
            const isCenter = Math.abs(worldNormX) < 0.20;

            gkState.mode = isCenter ? 'catch_center' : 'dive';
            gkState.modeTime = 0;
            gkState.outcome = 'none';
            gkState.diveDir = isCenter ? 0 : Math.sign(worldNormX);
            gkState.isHigh = normY > 0.35;
            gkState.startX = gkState.x;
            gkState.targetX = targetX;
            gkState.peakY = gkState.isHigh ? 0.56 : 0.14;
        }

            const halfW = GOAL_W / 2;

            gkContainer.updateMatrixWorld(true);

            if (gkLeftHand) {
                gkLeftHand.getWorldPosition(tmpHandPosL);

                if (dL < minDist) minDist = dL;

            if (gkRightHand) {
                gkRightHand.getWorldPosition(tmpHandPosR);
                const dR = ballMesh.position.distanceTo(tmpHandPosR);
                if (dR < minDist) minDist = dR;
            }

            tmpChestPos.set(
                gkState.x + gkState.diveDir * 0.35,
                gkState.y + (gkState.isHigh ? 0.95 : 0.72),
                GOAL_Z + 0.25

            const dBody = ballMesh.position.distanceTo(tmpChestPos);
            if (dBody < minDist) minDist = dBody;

            const catchRadius = isDefend ? 0.92 : 0.75;
            const diveRadius = isDefend ? 0.85 : 0.64;

            if (gkState.mode === 'catch_center' && minDist < catchRadius) {
                gkState.mode = 'react';

        function evaluateShotResult() {
            const halfW = GOAL_W / 2;
            const postR = 0.085;
            const hitZone = postR + BALL_R * 0.75;

            const distLeft = Math.abs(shotTarget.x + halfW);
            const distRight = Math.abs(shotTarget.x - halfW);
            const distTop = Math.abs(shotTarget.y - GOAL_H);

            const hitLeftPost = distLeft <= hitZone && shotTarget.y <= GOAL_H + hitZone;
            const hitRightPost = distRight <= hitZone && shotTarget.y <= GOAL_H + hitZone;
            const hitCrossbar = distTop <= hitZone && Math.abs(shotTarget.x) <= halfW + hitZone;

            const isCleanMiss = !hitLeftPost && !hitRightPost && !hitCrossbar &&
                (Math.abs(shotTarget.x) > halfW || shotTarget.y > GOAL_H);

            if (gkState.mode === 'catch_center') {
                gkState.mode = 'react';
                gkState.modeTime = 0;
            } else if (gkState.mode === 'dive') {
                gkState.mode = 'land';
                gkState.modeTime = 0;
            }

            postRicochet.active = false;

            if (isCleanMiss) {
                gkState.outcome = 'save';
                recordShotOutcome(false);
                if (series.turnMode === 'attack') {
                    setBanner(shotTarget.y > GOAL_H ? '🚀 ВИЩЕ ВОРІТ!' : '❌ МИМО ВОРІТ!', 'save');
                    arenaAudio.playCrowd(false);
                } else {
                    setBanner('😅 БОТ ПРОМАЗАВ!', 'goal');
                    arenaAudio.playCrowd(true);
                }
                netBounceVel.set(shotCurveX * 0.5, -0.8, -(10 + shotPower * 4));
                shotState = 'to_net';
                setTimeout(advanceSeriesTurn, 2300);
                return;
            }

            if (hitLeftPost || hitRightPost || hitCrossbar) {
                arenaAudio.playPost();
                triggerSaveFlash(ballMesh.position);

                let signedOffset = 0;
                let dirInward = 0;
                const isBarOnly = hitCrossbar && !hitLeftPost && !hitRightPost;

                if (hitLeftPost) {
                    signedOffset = (-halfW) - shotTarget.x;
                    dirInward = 1;
                } else if (hitRightPost) {
                    signedOffset = shotTarget.x - halfW;
                    dirInward = -1;
                } else if (hitCrossbar) {
                    signedOffset = shotTarget.y - GOAL_H;
                    dirInward = 0;
                }

                if (signedOffset < -0.05) {
                    registerGoal(isBarOnly ? '🔥 ГОООЛ ВІД ПЕРЕКЛАДИНИ! +25 💰' : '🔥 ГОООЛ ВІД ШТАНГИ! +25 💰');
                    const inX = isBarOnly ? (Math.random() - 0.5) * 1.2 : dirInward * 2.8;
                    const inY = isBarOnly ? -3.4 : 0.3;
                    netBounceVel.set(inX, inY, -(8.5 + shotPower * 3.5));
                    shotState = 'to_net';
                } else if (signedOffset < -0.015 && !isBarOnly) {
                    registerGoal('⚡ ВІД ДВОХ ШТАНГ У ВОРОТА! +25 💰');
                    postRicochet.active = true;
                    postRicochet.targetPostX = dirInward * (halfW - BALL_R * 0.9);
                    netBounceVel.set(dirInward * 13.5, 0.35, -1.65);
                    shotState = 'post_to_post';
                } else {
                    gkState.outcome = 'save';
                    recordShotOutcome(false);
                    setBanner(isBarOnly ? '💥 ПЕРЕКЛАДИНА!' : '💥 ШТАНГА!', series.turnMode === 'attack' ? 'save' : 'goal');
                    arenaAudio.playCrowd(series.turnMode === 'defend');
                    const outX = isBarOnly ? (Math.random() - 0.5) * 3.0 : -dirInward * 2.8;
                    const outY = isBarOnly ? 3.5 : 2.1;
                    reboundVel.set(outX, outY, 4.8 + shotPower * 1.5);
                    shotState = 'rebound';
                }

                setTimeout(advanceSeriesTurn, 2400);
            } else {
                registerGoal('⚽ ГОООЛ! +25 💰');
                const speedZ = 12 + shotPower * 4.5;
                netBounceVel.set(shotCurveX * 0.35, (shotTarget.y - ballMesh.position.y) * 2.0, -speedZ);
                shotState = 'to_net';
                setTimeout(advanceSeriesTurn, 2300);
            }
        }

        function drawSwipeGuide() {
            if (!swipeStart || !swipeCurr) return;
            aimCtx.clearRect(0, 0, aimCanvas.width, aimCanvas.height);

            const isDefend = series.turnMode === 'defend';

        const getBone = (map, part) => {
            const key = Object.keys(map).find(k => k.includes(part));

        function updateStrikerAnim(dt) {
            if (strikerMixer) strikerMixer.update(dt);

            const rUpLeg = getBone(strikerBones, 'rightupleg');
            const rLeg = getBone(strikerBones, 'rightleg');
            const lUpLeg = getBone(strikerBones, 'leftupleg');
            const lLeg = getBone(strikerBones, 'leftleg');
            const spine = getBone(strikerBones, 'spine');
            const rArm = getBone(strikerBones, 'rightarm');
            const lArm = getBone(strikerBones, 'leftarm');

            if (shotState === 'runup') {
                stateTimer += dt;
                const runDur = 0.56;
                const p = Math.min(1, stateTimer / runDur);
                const kickTarget = new THREE.Vector3(-0.22, 0, SPOT_Z + 0.32);
                strikerContainer.position.lerpVectors(STRIKER_START, kickTarget, p);
                strikerContainer.rotation.y = THREE.MathUtils.lerp(Math.PI - 0.25, Math.PI - 0.08, p);

                const stride = Math.sin(p * Math.PI * 3.5);
                const kickSwing = p > 0.72 ? Math.sin(((p - 0.72) / 0.28) * Math.PI) : 0;

                if (rUpLeg) rUpLeg.rotation.x += stride * 0.55 - kickSwing * 1.15;
                if (rLeg) rLeg.rotation.x -= Math.max(0, -stride * 0.65) + (p > 0.72 ? (1 - kickSwing) * 0.85 : 0);
                if (lUpLeg) lUpLeg.rotation.x += -stride * 0.55 + kickSwing * 0.25;
                if (lLeg) lLeg.rotation.x -= Math.max(0, stride * 0.65);
                if (spine) spine.rotation.z += -kickSwing * 0.16;
                if (rArm) rArm.rotation.z -= kickSwing * 0.35;
                if (lArm) lArm.rotation.z += kickSwing * 0.45;

                if (p >= 1) {
                    executeKick();
                }
            }
        }

            if (gkMixer) gkMixer.update(dt);

            if (gkGlovesLoaded) {
                if (gkLeftHand) gkLeftHand.scale.setScalar(0.0001);
                if (gkRightHand) gkRightHand.scale.setScalar(0.0001);
            }

            gkState.modeTime += dt;

            let diveAmt = 0;
            let crouchAmt = 0;
            let celebrateAmt = 0;
            let despairAmt = 0;

            if (gkState.mode === 'ready') {
                gkState.readyTime += dt;
                gkState.x = THREE.MathUtils.lerp(gkState.x, 0, Math.min(1, dt * 8));
                gkState.y = 0;
                gkState.diveAngle = THREE.MathUtils.lerp(gkState.diveAngle, 0, Math.min(1, dt * 10));
                crouchAmt = 0.18 + Math.abs(Math.sin(gkState.readyTime * 3.2)) * 0.04;
            } else if (gkState.mode === 'catch_center') {
                const p = Math.min(1, gkState.modeTime / 0.42);
                gkState.x = THREE.MathUtils.lerp(gkState.startX, gkState.targetX, p);
                gkState.y = Math.sin(p * Math.PI) * gkState.peakY;
                gkState.diveAngle = 0;
                crouchAmt = 0.32;
            } else if (gkState.mode === 'dive') {
                const p = Math.min(1, gkState.modeTime / 0.48);
                const easeX = 1 - Math.pow(1 - p, 1.8);
                gkState.x = THREE.MathUtils.lerp(gkState.startX, gkState.targetX, easeX);
                gkState.y = Math.sin(p * Math.PI) * gkState.peakY;
                const maxAngle = gkState.isHigh ? 1.32 : 1.48;
                gkState.diveAngle = -gkState.diveDir * maxAngle * Math.min(1, p * 1.35);
                diveAmt = Math.min(1, p * 1.4);
            } else if (gkState.mode === 'land') {
                const p = Math.min(1, gkState.modeTime / 0.55);
                gkState.y = THREE.MathUtils.lerp(gkState.y, 0.02, Math.min(1, dt * 14));
                gkState.diveAngle = THREE.MathUtils.lerp(gkState.diveAngle, -gkState.diveDir * 1.54, Math.min(1, dt * 12));
                diveAmt = 1.0 - p * 0.25;
                if (p >= 1) {
                    gkState.mode = 'getup';
                    gkState.modeTime = 0;
                }
            } else if (gkState.mode === 'getup') {
                const p = Math.min(1, gkState.modeTime / 0.65);
                const ease = p * p * (3 - 2 * p);
                gkState.diveAngle = THREE.MathUtils.lerp(-gkState.diveDir * 1.54, 0, ease);
                gkState.y = Math.sin(p * Math.PI) * 0.08;
                diveAmt = (1 - ease) * 0.75;
                crouchAmt = Math.sin(p * Math.PI) * 0.35;
                if (p >= 1) {
                    gkState.mode = 'react';
                    gkState.modeTime = 0;
                }
            } else if (gkState.mode === 'react') {
                gkState.diveAngle = THREE.MathUtils.lerp(gkState.diveAngle, 0, Math.min(1, dt * 10));
                if (shotState === 'caught') {
                    gkState.y = 0;
                    crouchAmt = 0.14;
                } else if (gkState.outcome === 'save') {
                    celebrateAmt = Math.min(1, gkState.modeTime * 4);
                    gkState.y = Math.abs(Math.sin(gkState.modeTime * 7.5)) * 0.14;
                } else {
                    despairAmt = Math.min(1, gkState.modeTime * 3.5);
                    gkState.y = 0;
                }
            }

            const crouchSink = crouchAmt * 0.14;
            const lieLift = (Math.abs(gkState.diveAngle) / 1.54) * 0.22;
            gkContainer.position.set(gkState.x, Math.max(0, gkState.y + lieLift - crouchSink), GOAL_Z + 0.25);
            gkContainer.rotation.z = gkState.diveAngle;
            gkContainer.rotation.x = diveAmt * 0.12;

            const rArm = getBone(gkBones, 'rightarm');
            const lArm = getBone(gkBones, 'leftarm');
            const rForeArm = getBone(gkBones, 'rightforearm');
            const lForeArm = getBone(gkBones, 'leftforearm');
            const rUpLeg = getBone(gkBones, 'rightupleg');
            const lUpLeg = getBone(gkBones, 'leftupleg');
            const rLeg = getBone(gkBones, 'rightleg');
            const lLeg = getBone(gkBones, 'leftleg');
            const spine = getBone(gkBones, 'spine');
            const head = getBone(gkBones, 'head');

            const isHoldingBall = shotState === 'caught' || gkState.mode === 'catch_center';
            if (rArm) {
                rArm.rotation.z += -crouchAmt * 0.45 - diveAmt * 2.55 - celebrateAmt * 2.5 + despairAmt * 0.35 + (isHoldingBall ? 0.35 : 0);
                rArm.rotation.x += -crouchAmt * 0.65 - diveAmt * 0.25 - despairAmt * 1.45 - (isHoldingBall ? 0.95 : 0);
            }
            if (lArm) {
                lArm.rotation.z += crouchAmt * 0.45 + diveAmt * 2.55 + celebrateAmt * 2.5 - despairAmt * 0.35 - (isHoldingBall ? 0.35 : 0);
                lArm.rotation.x += -crouchAmt * 0.65 - diveAmt * 0.25 - despairAmt * 1.45 - (isHoldingBall ? 0.95 : 0);
            }
            if (rForeArm) {
                rForeArm.rotation.y += -crouchAmt * 0.85;
                rForeArm.rotation.z += despairAmt * 1.65 + (isHoldingBall ? 0.55 : 0);
            }
            if (lForeArm) {
                lForeArm.rotation.y += crouchAmt * 0.85;
                lForeArm.rotation.z += -despairAmt * 1.65 - (isHoldingBall ? 0.55 : 0);
            }

            const trailBend = diveAmt * 0.42;
            const totalBend = crouchAmt + despairAmt * 0.22;
            if (rUpLeg) rUpLeg.rotation.x += -totalBend - (gkState.diveDir < 0 ? trailBend : 0);
            if (lUpLeg) lUpLeg.rotation.x += -totalBend - (gkState.diveDir > 0 ? trailBend : 0);
            if (rLeg) rLeg.rotation.x += -totalBend * 1.9 - (gkState.diveDir < 0 ? trailBend * 1.4 : 0);
            if (lLeg) lLeg.rotation.x += -totalBend * 1.9 - (gkState.diveDir > 0 ? trailBend * 1.4 : 0);

            if (spine) spine.rotation.x += crouchAmt * 0.55 + despairAmt * 0.42 - celebrateAmt * 0.12;
            if (head) head.rotation.x += despairAmt * 0.38 - celebrateAmt * 0.15;
        }
// ==================== КІНЕЦЬ ЧАСТИНИ 15 з 16 ====================
// ==================== ПОЧАТОК ЧАСТИНИ 16 з 16 ====================
        const camLookCurrent = new THREE.Vector3();

        function updateMatchCamera(dt) {
            const isBallActive = shotState === 'flying' || shotState === 'rebound' || shotState === 'to_net' || shotState === 'post_to_post' || shotState === 'caught';

            if (series.turnMode === 'attack') {
                if (!isBallActive) {
                    camera.position.lerp(attackCamPos, Math.min(1, dt * 8));
                    if (camLookCurrent.lengthSq() === 0) camLookCurrent.copy(attackLookAt);
                    camLookCurrent.lerp(attackLookAt, Math.min(1, dt * 8));
                    camera.lookAt(camLookCurrent);
                } else {
                    // Під час польоту та після удару камера супроводжує м'яч
                    const desiredPos = new THREE.Vector3(
                        THREE.MathUtils.clamp(-0.65 + ballMesh.position.x * 0.42, -3.2, 3.2),
                        THREE.MathUtils.clamp(2.35 + ballMesh.position.y * 0.22, 2.0, 3.4),
                        SPOT_Z + 3.4
                    );
                    camera.position.lerp(desiredPos, Math.min(1, dt * 4.5));

                    const desiredLook = new THREE.Vector3(
                        ballMesh.position.x * 0.88,
                        Math.max(0.35, ballMesh.position.y * 0.85),
                        ballMesh.position.z
                    );
                    camLookCurrent.lerp(desiredLook, Math.min(1, dt * 10));
                    camera.lookAt(camLookCurrent);
                }
            } else {
                // Режим захисту воріт: стежимо за м'ячем під час удару та після нього
                const isTrackingBall = isBallActive || shotState === 'runup';
                const desiredCamZ = (isBallActive && ballMesh.position.z < GOAL_Z + 0.6)
                    ? GOAL_Z - 4.75
                    : GOAL_Z - 3.35;

                const targetCamX = isTrackingBall
                    ? THREE.MathUtils.clamp(gkState.x * 0.28 + ballMesh.position.x * 0.32, -2.8, 2.8)
                    : gkState.x * 0.35;

                const targetCamY = isTrackingBall
                    ? THREE.MathUtils.clamp(2.25 + ballMesh.position.y * 0.22, 2.1, 3.3)
                    : 2.38;

                camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetCamX, Math.min(1, dt * 6));
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, targetCamY, Math.min(1, dt * 6));
                camera.position.z = THREE.MathUtils.lerp(camera.position.z, desiredCamZ, Math.min(1, dt * 5));

                const desiredLook = isTrackingBall
                    ? new THREE.Vector3(
                        ballMesh.position.x * 0.92,
                        Math.max(0.35, ballMesh.position.y * 0.88),
                        ballMesh.position.z
                    )
                    : new THREE.Vector3(gkState.x * 0.2, 1.15, SPOT_Z + 1.5);

                if (camLookCurrent.lengthSq() === 0) camLookCurrent.copy(desiredLook);
                camLookCurrent.lerp(desiredLook, Math.min(1, dt * 10));
                camera.lookAt(camLookCurrent);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            rszAim();
        });

        let lastTime = performance.now();
        function animate(now) {
            requestAnimationFrame(animate);
            const dt = Math.min(0.05, (now - lastTime) * 0.001);
            lastTime = now;

            updateStrikerAnim(dt);
            updateGoalkeeperAnim(dt);
            updateMatchCamera(dt);

            if (shotState === 'flying') {
                shotProgress = Math.min(1, shotProgress + dt / shotDuration);
                const ease = 1 - Math.pow(1 - shotProgress, 1.55);

                const curX = THREE.MathUtils.lerp(shotStart.x, shotTarget.x, ease) + Math.sin(shotProgress * Math.PI) * shotCurveX;
                const curY = THREE.MathUtils.lerp(shotStart.y, shotTarget.y, ease) + Math.sin(shotProgress * Math.PI) * shotArcY;
                const curZ = THREE.MathUtils.lerp(shotStart.z, shotTarget.z, ease);

                ballMesh.position.set(curX, curY, curZ);
                ballMesh.rotation.x -= dt * 22;
                ballMesh.rotation.y += shotCurveX * dt * 14;

                if (!checkLiveGoalkeeperSave() && shotProgress >= 1) {
                    evaluateShotResult();
                }
            } else if (shotState === 'post_to_post') {
                ballMesh.position.addScaledVector(netBounceVel, dt);
                ballMesh.rotation.z -= netBounceVel.x * dt * 5;

                const reachedSecondPost = netBounceVel.x > 0
                    ? ballMesh.position.x >= postRicochet.targetPostX
                    : ballMesh.position.x <= postRicochet.targetPostX;

                if (reachedSecondPost) {
                    ballMesh.position.x = postRicochet.targetPostX;
                    arenaAudio.playPost();
                    triggerSaveFlash(ballMesh.position);
                    netBounceVel.set(-Math.sign(netBounceVel.x) * 2.4, -0.5, -8.5);
                    shotState = 'to_net';
                }
            } else if (shotState === 'to_net') {
                ballMesh.position.addScaledVector(netBounceVel, dt);
                ballMesh.rotation.x -= dt * 15;

                if (gkState.outcome !== 'goal') {
                    netBounceVel.y -= 9.8 * dt;
                    if (ballMesh.position.y < BALL_R) {
                        ballMesh.position.y = BALL_R;
                        netBounceVel.y *= -0.35;
                        netBounceVel.z *= 0.85;
                    }
                } else {
                    const maxInX = GOAL_W / 2 - BALL_R * 1.2;
                    if (Math.abs(ballMesh.position.x) > maxInX) {
                        ballMesh.position.x = Math.sign(ballMesh.position.x) * maxInX;
                        netBounceVel.x *= -0.3;
                    }

                    const softPocketZ = GOAL_Z - GOAL_D - 0.28;
                    if (ballMesh.position.z <= softPocketZ) {
                        ballMesh.position.z = softPocketZ;

                        netImpact.active = true;
                        netImpact.x = THREE.MathUtils.clamp(ballMesh.position.x, -GOAL_W * 0.45, GOAL_W * 0.45);
                        netImpact.y = THREE.MathUtils.clamp(ballMesh.position.y, 0.2, GOAL_H - 0.1);
                        netImpact.amp = 0.85 + shotPower * 0.45;
                        netImpact.phase = 0;

                        reboundVel.set((Math.random() - 0.5) * 0.6, 0.2, 1.45);
                        shotState = 'rebound';
                    }
                }
            } else if (shotState === 'caught') {
                ballMesh.position.set(gkState.x, gkState.y + 1.05, GOAL_Z + 0.52);
            } else if (shotState === 'rebound') {
                ballMesh.position.addScaledVector(reboundVel, dt);
                reboundVel.y -= 9.8 * dt;
                if (ballMesh.position.y < BALL_R) {
                    ballMesh.position.y = BALL_R;
                    reboundVel.y *= -0.32;
                    reboundVel.x *= 0.84;
                    reboundVel.z *= 0.84;
                }
                ballMesh.rotation.x += reboundVel.z * dt * 5;
                ballMesh.rotation.z -= reboundVel.x * dt * 5;
            }

            if (saveFlashAlpha > 0) {
                saveFlashAlpha = Math.max(0, saveFlashAlpha - dt * 2.8);
                saveFlashMesh.material.opacity = saveFlashAlpha;
                saveFlashMesh.scale.addScalar(dt * 3.5);
            }

            ballShadow.position.set(ballMesh.position.x, 0.01, ballMesh.position.z);
            const shScale = Math.max(0.35, 1 - (ballMesh.position.y - BALL_R) * 0.28);
            ballShadow.scale.setScalar(shScale);

            deformGoalNet(dt);
            bannerTex.offset.x += dt * 0.08;
            drawSwipeGuide();
            renderer.render(scene, camera);
        }

        setupTurnState();
        requestAnimationFrame(animate);
    </script>
