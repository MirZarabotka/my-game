<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cyber Arena</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:sans-serif;background:#0b0c10;color:#fff;margin:0;padding:8px;display:flex;flex-direction:column;height:100vh;user-select:none;overflow:hidden}
.top,.tabs{display:flex;gap:6px;margin-bottom:8px}
.top{justify-content:space-between;align-items:center;background:#161822;border:1px solid #2a2d3d;border-radius:10px;padding:8px 12px}
.don{background:#00a8ff;border:none;color:#fff;padding:6px 10px;border-radius:8px;font-weight:bold;cursor:pointer}
.tab{flex:1;padding:8px;background:#161822;border:1px solid #2a2d3d;color:#8a8f9e;border-radius:10px;font-weight:bold;cursor:pointer}
.tab.active{background:#ff4757;color:#fff;border-color:#ff4757}
.scr{flex:1;display:flex;flex-direction:column;overflow-y:auto}
#cw{flex:1;position:relative;border-radius:12px;overflow:hidden;border:1px solid #2a2d3d;background:#13151f}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;font-size:12px;font-weight:bold;pointer-events:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#161822;border:1px solid #2a2d3d;border-radius:12px;padding:10px;text-align:center}
.card.eq{border-color:#2ed573}
.btn{width:100%;padding:8px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;background:#ff4757;color:#fff;margin-top:6px}
.btn.gem{background:#00a8ff}.btn.wear{background:#2ed573;color:#000}.btn:disabled{background:#2f3542;color:#57606f}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:16px}
.mbox{background:#161822;border:1px solid #00a8ff;border-radius:14px;padding:16px;width:100%;max-width:320px}
.pk{display:flex;justify-content:space-between;align-items:center;background:#1e2130;padding:10px;border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<div class="top">
  <b>💰 <span id="uC" style="color:#ffa502">0</span> &nbsp; 💎 <span id="uG" style="color:#00d2ff">0</span></b>
  <button class="don" onclick="bm.style.display='flex'">+ Купити 💎</button>
</div>
<div class="tabs">
  <button class="tab active" id="t1" onclick="tab(1)">🎮 Бій</button>
  <button class="tab" id="t2" onclick="tab(2)">🔫 Зброя</button>
  <button class="tab" id="t3" onclick="tab(3)">👕 Одяг</button>
</div>
<div class="scr" id="s1"><div id="cw"><div class="hud"><span>Хвиля: <b id="uW">1</b></span><span id="uWp">Пістолет</span></div><canvas id="cv"></canvas></div></div>
<div class="scr" id="s2" style="display:none"><div class="grid" id="wg"></div></div>
<div class="scr" id="s3" style="display:none"><div class="grid" id="sg"></div></div>
<div class="mod" id="bm"><div class="mbox">
  <div style="display:flex;justify-content:space-between"><b>💎 Купити кристали</b><b onclick="bm.style.display='none'" style="cursor:pointer">✖</b></div>
  <div class="pk"><span>💎 50 шт</span><button class="btn gem" style="width:auto" onclick="don(50)">25 ⭐</button></div>
  <div class="pk"><span>💎 150 шт</span><button class="btn gem" style="width:auto" onclick="don(150)">60 ⭐</button></div>
  <div class="pk"><span>💎 500 шт</span><button class="btn gem" style="width:auto" onclick="don(500)">150 ⭐</button></div>
</div></div>
<script>
try{window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}catch(e){}
const WPN=[{id:'p1',n:'Пістолет',i:'🔫',p:0,d:1,r:22,c:1,col:'#ffa502'},{id:'p2',n:'Подвійний',i:'🔫🔫',p:60,d:1.2,r:20,c:2,col:'#2ed573'},{id:'p3',n:'Дробовик',i:'🧨',p:180,d:1.5,r:28,c:3,col:'#ff4757'},{id:'p4',n:'Плазма',i:'⚡',p:450,d:3.5,r:14,c:2,col:'#00d2ff'}];
const SKN=[{id:'k1',n:'Боєць',i:'🪖',p:0,b:'x1 монет',m:1},{id:'k2',n:'Ніндзя',i:'🥷',p:50,b:'+25% монет',m:1.25},{id:'k3',n:'Десант',i:'🧑‍🚀',p:120,b:'+50% монет',m:1.5},{id:'k4',n:'Король',i:'🤴',p:300,b:'x2.5 монет',m:2.5}];
let st={c:0,g:0,w:1,k:0,ow:['p1'],ew:'p1',os:['k1'],es:'k1'};
try{const v=JSON.parse(localStorage.getItem('sh4'));if(v)st=Object.assign(st,v)}catch(e){}
function save(){try{localStorage.setItem('sh4',JSON.stringify(st))}catch(e){}uC.innerText=Math.floor(st.c);uG.innerText=st.g;uW.innerText=st.w;uWp.innerText=(WPN.find(x=>x.id===st.ew)||WPN[0]).n}
function tab(n){s1.style.display=n===1?'flex':'none';s2.style.display=n===2?'block':'none';s3.style.display=n===3?'block':'none';t1.classList.toggle('active',n===1);t2.classList.toggle('active',n===2);t3.classList.toggle('active',n===3);if(n===1)rsz();if(n===2)rW();if(n===3)rS()}
function rW(){wg.innerHTML='';WPN.forEach(w=>{const o=st.ow.includes(w.id),e=st.ew===w.id;wg.innerHTML+=`<div class="card${e?' eq':''}"><div style="font-size:32px">${w.i}</div><b>${w.n}</b><div style="font-size:11px;color:#8a8f9e">Шкода: ${w.d}</div>${e?'<button class="btn" disabled>Взято</button>':o?`<button class="btn wear" onclick="st.ew='${w.id}';save();rW()">Взяти</button>`:`<button class="btn" onclick="if(st.c>=${w.p}){st.c-=${w.p};st.ow.push('${w.id}');st.ew='${w.id}';save();rW()}" ${st.c<w.p?'disabled':''}>${w.p} 💰</button>`}</div>`})}
function rS(){sg.innerHTML='';SKN.forEach(k=>{const o=st.os.includes(k.id),e=st.es===k.id;sg.innerHTML+=`<div class="card${e?' eq':''}"><div style="font-size:32px">${k.i}</div><b>${k.n}</b><div style="font-size:11px;color:#00d2ff">${k.b}</div>${e?'<button class="btn" disabled>Одягнено</button>':o?`<button class="btn wear" onclick="st.es='${k.id}';save();rS()">Одягти</button>`:`<button class="btn gem" onclick="if(st.g>=${k.p}){st.g-=${k.p};st.os.push('${k.id}');st.es='${k.id}';save();rS()}" ${st.g<k.p?'disabled':''}>${k.p} 💎</button>`}</div>`})}
function don(a){st.g+=a;save();if(s3.style.display==='block')rS();bm.style.display='none'}
const ctx=cv.getContext('2d');let W=300,H=400,px=150,py=350,bul=[],enm=[],fr=0;
function rsz(){const r=cw.getBoundingClientRect();W=cv.width=r.width;H=cv.height=r.height;px=W/2;py=H-40}
function mv(x){const r=cv.getBoundingClientRect();px=Math.max(20,Math.min(W-20,x-r.left))}
cv.addEventListener('pointermove',e=>{if(e.buttons>0||e.pointerType==='touch')mv(e.clientX)});
cv.addEventListener('pointerdown',e=>mv(e.clientX));
function loop(){
  if(s1.style.display!=='none'){
    ctx.clearRect(0,0,W,H);fr++;
    const w=WPN.find(x=>x.id===st.ew)||WPN[0],sk=SKN.find(x=>x.id===st.es)||SKN[0];
    if(fr%w.r===0){
      if(w.c===1)bul.push({x:px,y:py-18,vx:0,vy:-8,d:w.d,c:w.col});
      else if(w.c===2){bul.push({x:px-9,y:py-16,vx:0,vy:-8,d:w.d,c:w.col});bul.push({x:px+9,y:py-16,vx:0,vy:-8,d:w.d,c:w.col})}
      else{bul.push({x:px,y:py-18,vx:0,vy:-8,d:w.d,c:w.col});bul.push({x:px-8,y:py-16,vx:-1.4,vy:-7.8,d:w.d,c:w.col});bul.push({x:px+8,y:py-16,vx:1.4,vy:-7.8,d:w.d,c:w.col})}
    }
    if(fr%Math.max(25,65-st.w*2)===0){const hp=Math.ceil(st.w*1.5);enm.push({x:25+Math.random()*(W-50),y:-25,hp:hp,mh:hp,sp:1.2+Math.min(2.2,st.w*.1),i:['👾','🛸','👹'][Math.floor(Math.random()*3)]})}
    for(let i=bul.length-1;i>=0;i--){const b=bul[i];b.x+=b.vx;b.y+=b.vy;ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(b.x,b.y,4,0,6.28);ctx.fill();if(b.y<-10)bul.splice(i,1)}
    for(let i=enm.length-1;i>=0;i--){
      const e=enm[i];e.y+=e.sp;
      for(let j=bul.length-1;j>=0;j--){const b=bul[j];if(Math.hypot(e.x-b.x,e.y-b.y)<22){e.hp-=b.d;bul.splice(j,1);if(e.hp<=0){st.c+=Math.ceil((2+st.w)*sk.m);st.k++;if(st.k%10===0)st.w++;enm.splice(i,1);save();break}}}
      if(!enm[i])continue;
      ctx.font='30px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e.i,e.x,e.y);
      ctx.fillStyle='#2f3542';ctx.fillRect(e.x-15,e.y-22,30,4);ctx.fillStyle='#ff4757';ctx.fillRect(e.x-15,e.y-22,30*(e.hp/e.mh),4);
      if(e.y>H-15){enm.splice(i,1);st.w=Math.max(1,st.w-1);save()}
    }
    ctx.font='38px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(sk.i,px,py);
  }
  requestAnimationFrame(loop);
}
rsz();window.addEventListener('resize',rsz);save();loop();
</script>
</body>
</html>
