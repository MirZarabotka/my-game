<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Champions Penalty — Головна</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:sans-serif;background:#070b14;color:#fff;margin:0;padding:10px;display:flex;flex-direction:column;height:100vh;user-select:none;overflow:hidden;position:relative}
#heroCanvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.top-card{position:relative;z-index:2;background:rgba(11,17,28,.84);backdrop-filter:blur(6px);border:1px solid rgba(75,123,236,.35);border-radius:14px;padding:9px 14px;flex-shrink:0}
.row{display:flex;justify-content:space-between;align-items:center}
.bar{width:100%;height:5px;background:#1e2b3c;border-radius:4px;overflow:hidden;margin:5px 0}
.fill{height:100%;background:#1dd1a1;transition:width .3s}
.stage-wrap{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;touch-action:none;cursor:pointer;padding-bottom:10px}
.juggle-badge{position:absolute;top:12px;background:rgba(12,36,97,.88);border:1px solid #4b7bec;color:#feca57;padding:5px 14px;border-radius:16px;font-weight:bold;font-size:13px;display:none;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.hint-pill{background:rgba(7,11,20,.78);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.18);padding:5px 13px;border-radius:20px;font-size:11px;color:#d1d8e0;pointer-events:none}
.menu-grid{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:8px;flex-shrink:0}
.m-btn{padding:14px 8px;border:none;border-radius:14px;font-weight:bold;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .12s;text-decoration:none}
.m-btn:active{transform:scale(.96)}
.btn-arena{grid-column:span 2;background:linear-gradient(135deg,#1dd1a1,#10ac84);color:#000;font-size:16px;box-shadow:0 4px 16px rgba(29,209,161,.35)}
.btn-ucl{background:linear-gradient(135deg,#1e3799,#3867d6);color:#fff;border:1px solid #4b7bec}
.btn-shop{background:rgba(24,34,48,.92);color:#feca57;border:1px solid #3c4f66}
</style>
</head>
<body>

<canvas id="heroCanvas"></canvas>

<div class="top-card">
  <div class="row">
    <b style="color:#feca57;font-size:14px">Рівень <span id="lv">1</span> • 🏆 ЛЧ: <span id="cp">0</span></b>
    <b style="color:#feca57;font-size:15px">💰 <span id="cn">20</span></b>

  </div>
</div>

<div class="stage-wrap" id="stage">
  <div class="juggle-badge" id="juggleBadge">⚽ Набивання: <span id="juggleCnt">0</span></div>

</div>

<div class="menu-grid">
  <a href="game.html" class="m-btn btn-arena" onclick="localStorage.removeItem('pc_play_ucl')">
    <span>⚽ ШВИДКИЙ МАТЧ (АРЕНА)</span>
    <span style="font-size:11px;font-weight:normal;opacity:.85">Тренування та заробіток монет</span>
  </a>
  <a href="turnir.html" class="m-btn btn-ucl">
    <span>🏆 ЛІГА ЧЕМПІОНІВ</span>
    <span style="font-size:10px;font-weight:normal;color:#d1d8e0">Турнір на виліт</span>
  </a>
  <a href="shop.html" class="m-btn btn-shop">
    <span>🛍 ГАРДЕРОБ / МАГАЗИН</span>
    <span style="font-size:10px;font-weight:normal;color:#a5b1c2">Форма, бутси, номер</span>
  </a>
</div>

<script>
try{window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}catch(e){}

const ITEMS={
  j1:{col:'#1dd1a1',dark:'#0d8a68',trim:'#ffffff'},
  j2:{col:'#f5f6fa',dark:'#cfd6de',trim:'#1e272e'},
  j3:{col:'#d63031',dark:'#8e1b1c',trim:'#ffffff'},
  j4:{col:'#1e3799',dark:'#0c1a52',trim:'#feca57'},
  j5:{col:'#1e272e',dark:'#0b0f14',trim:'#1dd1a1'},
  j6:{col:'#feca57',dark:'#c49014',trim:'#1e272e'},
  p1:{col:'#ffffff',dark:'#cfd6de'},p2:{col:'#1e272e',dark:'#0b0f14'},p3:{col:'#1e3799',dark:'#0c1a52'},
  p4:{col:'#d63031',dark:'#8e1b1c'},p5:{col:'#00a8ff',dark:'#006299'},p6:{col:'#feca57',dark:'#c49014'},
  s1:{col:'#14181d',ac:'#1dd1a1'},s2:{col:'#f5f6fa',ac:'#eb4d4b'},s3:{col:'#00d2ff',ac:'#ffffff'},s4:{col:'#feca57',ac:'#1e272e'},
  b1:{col:'#ffffff'},b2:{col:'#ff5e57'},b3:{col:'#00d2ff'},b4:{col:'#feca57'},
  k1:{col:'#1dd1a1'},k2:{col:'#ff9ff3'}
};

let p={pt:0,lv:1,cp:0,cn:20,ow:['j1','p1','s1','b1','k1'],ej:'j1',ep:'p1',es:'s1',eb:'b1',ek:'k1',num:'10',numCol:'#ffffff',ucl:null};

function loadWallet(){
  try{
    const old=JSON.parse(localStorage.getItem('pc_3d8'));
    const v=JSON.parse(localStorage.getItem('pc_ucl1'));
    if(v)p=Object.assign(p,v);
    else if(old){p=Object.assign(p,old);localStorage.setItem('pc_ucl1',JSON.stringify(p));}
  }catch(e){}
  if(!p.ej)p.ej='j1';
  if(!p.ep)p.ep='p1';
  if(!p.es)p.es='s1';
  if(!p.num)p.num='10';
  if(!p.numCol)p.numCol='#ffffff';
}

loadWallet();
window.addEventListener('pageshow',()=>{loadWallet();updUI();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadWallet();updUI();}});

function updUI(){
  document.getElementById('lv').textContent=p.lv;
  document.getElementById('cp').textContent=p.cp;
  document.getElementById('cn').textContent=p.cn;
  document.getElementById('heroNumTag').textContent=p.num||'10';
  const nxXp=p.lv*100;
  document.getElementById('pt').textContent=p.pt;
  document.getElementById('nx').textContent=nxXp;
  document.getElementById('xb').style.width=Math.min(100,(p.pt/nxXp)*100)+'%';
}

const cvs=document.getElementById('heroCanvas');
const ctx=cvs.getContext('2d');
let W=300,H=300;
function rsz(){
  W=cvs.width=window.innerWidth;
  H=cvs.height=window.innerHeight;
}
window.addEventListener('resize',rsz);

let ac=null;
function playTouchSound(){
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const now=ac.currentTime,osc=ac.createOscillator(),g=ac.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(145,now);
    osc.frequency.exponentialRampToValueAtTime(52,now+0.09);
    g.gain.setValueAtTime(0.28,now);
    g.gain.exponentialRampToValueAtTime(0.001,now+0.09);
    osc.connect(g);g.connect(ac.destination);
    osc.start(now);osc.stop(now+0.1);
  }catch(e){}
}

let rotY=0.22,velY=0.004,dragging=false,downX=0,lastX=0,tAnim=0;
let juggleTimer=0,jugglePhase=0,juggleBlend=0,juggleHits=0,lastCycle=-1;
const stageEl=document.getElementById('stage');

function triggerJuggle(){
  if(juggleTimer<=0){
    jugglePhase=0;
    juggleHits=0;
    lastCycle=-1;
  }
  juggleTimer=240; // ~4 секунди набивання при натисканні
  velY=0;
  playTouchSound();
}

stageEl.addEventListener('pointerdown',e=>{
  dragging=true;
  downX=lastX=e.clientX;
  velY=0;
});
window.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lastX;
  lastX=e.clientX;
  if(Math.abs(e.clientX-downX)>8){
    velY=dx*0.015;
    rotY+=velY;
  }
});
window.addEventListener('pointerup',e=>{
  if(dragging && Math.abs(e.clientX-downX)<=8){
    triggerJuggle();
  }
  dragging=false;
});
/* ================= [ КІНЕЦЬ INDEX.HTML : ЧАСТИНА 2 ] ================== -->
/* ===================================================================== */
/* ================== [ INDEX.HTML : ЧАСТИНА 4 З 5 ] =================== -->
/* ===================================================================== */
function drawCapsule(x1,y1,x2,y2,r1,r2,col){
  const dx=x2-x1,dy=y2-y1;
  const ang=Math.atan2(dy,dx);
  const perp=ang+Math.PI/2;
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.arc(x1,y1,r1,perp,perp+Math.PI);
  ctx.arc(x2,y2,r2,perp+Math.PI,perp);
  ctx.closePath();
  ctx.fill();
}

function drawGKGlove(x,y,sc,sgn,col){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(sgn*-0.08);

  ctx.fillStyle='#1e272e';
  ctx.beginPath();
  ctx.roundRect(-2.6*sc,-1.2*sc,5.2*sc,2.4*sc,1.0*sc);
  ctx.fill();
  ctx.fillStyle='#ffffff';
  ctx.fillRect(-1.8*sc,-0.4*sc,3.6*sc,0.8*sc);

  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.roundRect(-3.0*sc,1.0*sc,6.0*sc,4.6*sc,1.6*sc);
  ctx.fill();

  ctx.fillStyle='rgba(255,255,255,0.32)';
  ctx.beginPath();
  ctx.roundRect(-2.0*sc,1.6*sc,4.0*sc,3.0*sc,1.0*sc);
  ctx.fill();

  const fingerX=[-2.2,-0.75,0.75,2.2];
  const fingerLen=[2.6,3.2,3.0,2.3];
  fingerX.forEach((fx,idx)=>{
    drawCapsule(fx*sc,5.2*sc,fx*sc,(5.2+fingerLen[idx])*sc,0.72*sc,0.58*sc,col);
  });

  const thumbDir=-sgn;
  drawCapsule(thumbDir*2.6*sc,2.6*sc,thumbDir*4.3*sc,4.4*sc,0.85*sc,0.65*sc,col);

  ctx.restore();
}

function drawPlayerBody(sc,cosR,sinR,isBack,breath,jItem,pItem,sItem,kItem,jInfo){
  const skin='#e4b487',skinShade='#be8450';
  const wScale=Math.max(0.42,Math.abs(cosR));
  const depthShift=sinR*6*sc;

  // 1. АНАТОМІЧНІ НОГИ З АНІМАЦІЄЮ НАБИВАННЯ М'ЯЧА
  [-1,1].forEach(side=>{
    const sgn=side*(cosR>=0?1:-1);
    const isActiveLeg=(jInfo.blend>0.05 && side===jInfo.activeFoot);
    const kickLift=isActiveLeg?(jInfo.kick*jInfo.blend):0;

    const hipX=sgn*6.4*sc*wScale+depthShift*0.2;
    const hipY=-55*sc;
    const kneeX=sgn*7.0*sc*wScale+depthShift*0.35+(isActiveLeg?sinR*3*sc*kickLift:0);
    const kneeY=-30*sc-kickLift*11*sc;
    const ankleX=sgn*6.8*sc*wScale+depthShift*0.5+(isActiveLeg?sinR*5*sc*kickLift:0);
    const ankleY=-4.5*sc-kickLift*16*sc;

    const shGrad=ctx.createLinearGradient(hipX-8*sc,hipY,hipX+8*sc,hipY);
    shGrad.addColorStop(0,pItem.col);
    shGrad.addColorStop(0.82,pItem.col);
    shGrad.addColorStop(1,pItem.dark||'#1e272e');
    drawCapsule(hipX,hipY,kneeX,kneeY,8.0*sc,6.4*sc,shGrad);

    ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=1.1*sc;
    ctx.beginPath();ctx.moveTo(kneeX-6.0*sc,kneeY+0.5*sc);ctx.lineTo(kneeX+6.0*sc,kneeY+0.5*sc);ctx.stroke();

    drawCapsule(kneeX,kneeY,kneeX,kneeY+5.5*sc,4.5*sc,4.2*sc,skin);
    if(isBack){
      ctx.strokeStyle='rgba(120,75,40,0.45)';ctx.lineWidth=1.2*sc;
      ctx.beginPath();ctx.moveTo(kneeX-3.2*sc,kneeY+2.8*sc);ctx.quadraticCurveTo(kneeX,kneeY+3.6*sc,kneeX+3.2*sc,kneeY+2.8*sc);ctx.stroke();
    }else{
      ctx.fillStyle=skinShade;ctx.beginPath();ctx.arc(kneeX+sgn*1.0*sc,kneeY+3.0*sc,2.0*sc,0,Math.PI);ctx.fill();
    }

    const calfX=(kneeX+ankleX)*0.5-sinR*1.0*sc,calfY=(kneeY+ankleY)*0.5;
    drawCapsule(kneeX,kneeY+5*sc,calfX,calfY,4.5*sc,5.1*sc,jItem.col);
    drawCapsule(calfX,calfY,ankleX,ankleY,4.9*sc,3.2*sc,jItem.dark||jItem.col);

    ctx.fillStyle=jItem.trim||'#ffffff';
    ctx.fillRect(kneeX-4.4*sc,kneeY+5.2*sc,8.8*sc,2.0*sc);

    if(isBack){
      ctx.fillStyle='#0d1117';
      ctx.beginPath();ctx.ellipse(ankleX,ankleY+2.6*sc,4.4*sc,2.0*sc,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=sItem.col;
      ctx.beginPath();ctx.ellipse(ankleX,ankleY+1.0*sc,4.2*sc,3.0*sc,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=sItem.ac||'#1dd1a1';
      ctx.fillRect(ankleX-1.2*sc,ankleY-1.5*sc,2.4*sc,3.5*sc);
    }else{
      const bootDir=sinR*7*sc+sgn*2.0*sc;
      ctx.fillStyle='#0d1117';
      ctx.beginPath();ctx.ellipse(ankleX+bootDir*0.4,ankleY+3.0*sc,8.0*sc,2.1*sc,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=sItem.col;
      ctx.beginPath();ctx.ellipse(ankleX+bootDir*0.45,ankleY+1.4*sc,8.0*sc,3.4*sc,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=sItem.ac||'#1dd1a1';
      ctx.beginPath();ctx.ellipse(ankleX+bootDir*0.5,ankleY+0.9*sc,3.8*sc,1.3*sc,0.15,0,Math.PI*2);ctx.fill();
    }
  });

  // 2. АТЛЕТИЧНИЙ ТОРС
  const shW=(16.5*wScale+4.8)*sc,chestW=(15.5*wScale+4.5)*sc,waistW=(12.2*wScale+4.0)*sc;
  const torsoGrad=ctx.createLinearGradient(-shW,-100*sc,shW,-54*sc);
  torsoGrad.addColorStop(0,jItem.col);
  torsoGrad.addColorStop(0.68,jItem.col);
  torsoGrad.addColorStop(1,jItem.dark||'#090d14');

  ctx.fillStyle=torsoGrad;
  ctx.beginPath();
  ctx.moveTo(-shW,-93*sc+breath);
  ctx.quadraticCurveTo(-shW*0.45,-101*sc+breath,0,-101*sc+breath);
  ctx.quadraticCurveTo(shW*0.45,-101*sc+breath,shW,-93*sc+breath);
  ctx.lineTo(chestW,-78*sc+breath*0.5);
  ctx.lineTo(waistW,-55*sc);
  ctx.quadraticCurveTo(0,-52*sc,-waistW,-55*sc);
  ctx.lineTo(-chestW,-78*sc+breath*0.5);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle='rgba(0,0,0,0.13)';ctx.lineWidth=1.0*sc;
  ctx.beginPath();
  ctx.moveTo(-waistW*0.55,-62*sc);ctx.quadraticCurveTo(0,-65*sc,waistW*0.5,-60*sc);
  ctx.moveTo(-chestW*0.45,-75*sc);ctx.quadraticCurveTo(depthShift*0.3,-77*sc,chestW*0.4,-73*sc);
  ctx.stroke();

  ctx.fillStyle=jItem.trim||'#ffffff';
  if(isBack){
    ctx.beginPath();
    ctx.ellipse(-depthShift*0.4,-99.5*sc+breath,5.6*sc,2.2*sc,0,0,Math.PI);
    ctx.fill();
  }else{
    ctx.beginPath();
    ctx.moveTo(depthShift*0.4-5.8*sc,-100*sc+breath);
    ctx.lineTo(depthShift*0.4,-94*sc+breath);
    ctx.lineTo(depthShift*0.4+5.8*sc,-100*sc+breath);
    ctx.quadraticCurveTo(depthShift*0.4,-101.8*sc+breath,depthShift*0.4-5.8*sc,-100*sc+breath);
    ctx.fill();
  }

  if(isBack){
    ctx.fillStyle=p.numCol||'#ffffff';
    ctx.font=`900 ${Math.round(17*sc)}px sans-serif`;ctx.textAlign='center';
    ctx.fillText(p.num||'10',-depthShift*0.4,-71*sc+breath);
  }else{
    const crestX=depthShift*0.5+6.2*sc*wScale,crestY=-87*sc+breath;
    ctx.fillStyle='#feca57';ctx.beginPath();
    ctx.moveTo(crestX-2.6*sc,crestY-3.0*sc);ctx.lineTo(crestX+2.6*sc,crestY-3.0*sc);
    ctx.lineTo(crestX+2.2*sc,crestY+1.4*sc);ctx.lineTo(crestX,crestY+3.5*sc);ctx.lineTo(crestX-2.2*sc,crestY+1.4*sc);
    ctx.closePath();ctx.fill();ctx.strokeStyle='#1e272e';ctx.lineWidth=0.8*sc;ctx.stroke();

    ctx.fillStyle=jItem.trim||'#ffffff';ctx.globalAlpha=0.85;
    ctx.font=`bold ${Math.max(5,5.2*sc)}px sans-serif`;ctx.textAlign='center';
    ctx.fillText('CHAMPIONS',depthShift*0.45,-76*sc+breath);ctx.globalAlpha=1;
  }

  // 3. РЕАЛІСТИЧНІ РУКИ З БАЛАНСУВАННЯМ ПІД ЧАС ЧЕКАНКИ ТА ПЕРЧАТКАМИ
  [-1,1].forEach(side=>{
    const sgn=side*(cosR>=0?1:-1);
    const armSway=Math.sin(tAnim+side*0.5)*0.6*sc;
    const balOut=jInfo.blend*4.5*sc*sgn;
    const balUp=jInfo.blend*3.5*sc;

    const shX=sgn*(shW-3.0*sc),shY=-92*sc+breath;
    const slvX=sgn*(shW+1.4*sc)+depthShift*0.18+balOut*0.4,slvY=-81.5*sc+breath*0.7-balUp*0.3;
    const elX=sgn*(shW+2.6*sc)+depthShift*0.32+armSway+balOut*0.8,elY=-71.5*sc+breath*0.4-balUp*0.7;
    const wrX=sgn*(shW+1.2*sc)+depthShift*0.45+armSway*1.3+balOut,wrY=-57.5*sc-balUp;

    drawCapsule(shX,shY,slvX,slvY,5.6*sc,4.7*sc,jItem.col);
    ctx.strokeStyle=jItem.trim||'#ffffff';ctx.lineWidth=1.4*sc;
    ctx.beginPath();ctx.arc(slvX,slvY,4.6*sc,0.25,Math.PI-0.25);ctx.stroke();

    drawCapsule(slvX,slvY,elX,elY,4.1*sc,3.6*sc,skin);
    drawCapsule(elX,elY,wrX,wrY,3.5*sc,2.5*sc,skinShade);

    drawGKGlove(wrX,wrY,sc,sgn,kItem.col);
  });
}
/* ================= [ КІНЕЦЬ INDEX.HTML : ЧАСТИНА 4 ] ================== */

function drawPlayerHead(sc,sinR,isBack,breath){
  const skin='#e4b487',skinShade='#be8450',skinLight='#f6d3af';
  const headX=sinR*5.5*sc*0.45;

  const neckGrad=ctx.createLinearGradient(headX-4.5*sc,-102*sc,headX+4.5*sc,-102*sc);
  neckGrad.addColorStop(0,skinShade);
  neckGrad.addColorStop(0.5,skin);
  neckGrad.addColorStop(1,skinShade);
  drawCapsule(headX,-99*sc+breath,headX,-106.5*sc+breath,4.6*sc,4.2*sc,neckGrad);

  ctx.fillStyle=skinShade;ctx.beginPath();
  ctx.ellipse(headX-8.2*sc,-114.5*sc+breath,1.5*sc,2.7*sc,0,0,Math.PI*2);
  ctx.ellipse(headX+8.2*sc,-114.5*sc+breath,1.5*sc,2.7*sc,0,0,Math.PI*2);ctx.fill();

  const faceGrad=ctx.createRadialGradient(headX-2*sc,-117*sc+breath,2*sc,headX,-114*sc+breath,11.5*sc);
  faceGrad.addColorStop(0,skinLight);faceGrad.addColorStop(0.65,skin);faceGrad.addColorStop(1,skinShade);
  ctx.fillStyle=faceGrad;ctx.beginPath();
  ctx.moveTo(headX-8.2*sc,-117*sc+breath);
  ctx.quadraticCurveTo(headX-8.5*sc,-108.5*sc+breath,headX,-104.5*sc+breath);
  ctx.quadraticCurveTo(headX+8.5*sc,-108.5*sc+breath,headX+8.2*sc,-117*sc+breath);
  ctx.quadraticCurveTo(headX+8.0*sc,-124.5*sc+breath,headX,-124.5*sc+breath);
  ctx.quadraticCurveTo(headX-8.0*sc,-124.5*sc+breath,headX-8.2*sc,-117*sc+breath);
  ctx.closePath();ctx.fill();

  if(!isBack){
    const eyeOff=sinR*4.5*sc;

    ctx.fillStyle='#231710';ctx.beginPath();
    ctx.ellipse(headX+eyeOff-3.2*sc,-117.5*sc+breath,2.0*sc,0.5*sc,-0.08,0,Math.PI*2);
    ctx.ellipse(headX+eyeOff+3.2*sc,-117.5*sc+breath,2.0*sc,0.5*sc,0.08,0,Math.PI*2);ctx.fill();

    ctx.fillStyle='#ffffff';ctx.beginPath();
    ctx.ellipse(headX+eyeOff-3.1*sc,-115.5*sc+breath,1.5*sc,0.9*sc,0,0,Math.PI*2);
    ctx.ellipse(headX+eyeOff+3.1*sc,-115.5*sc+breath,1.5*sc,0.9*sc,0,0,Math.PI*2);ctx.fill();

    ctx.fillStyle='#3d2314';ctx.beginPath();
    ctx.arc(headX+eyeOff-3.0*sc,-115.5*sc+breath,0.8*sc,0,Math.PI*2);
    ctx.arc(headX+eyeOff+3.0*sc,-115.5*sc+breath,0.8*sc,0,Math.PI*2);ctx.fill();

    ctx.strokeStyle=skinShade;ctx.lineWidth=1.0*sc;ctx.beginPath();
    ctx.moveTo(headX+eyeOff,-115.5*sc+breath);
    ctx.lineTo(headX+eyeOff+sinR*1.1*sc,-112.0*sc+breath);
    ctx.lineTo(headX+eyeOff+sinR*0.4*sc,-111.6*sc+breath);ctx.stroke();

    ctx.fillStyle='rgba(35,23,16,0.13)';ctx.beginPath();
    ctx.arc(headX+eyeOff*0.5,-109.2*sc+breath,5.8*sc,0.15,Math.PI-0.15);ctx.fill();

    ctx.strokeStyle='#8d5524';ctx.lineWidth=1.1*sc;ctx.beginPath();
    ctx.moveTo(headX+eyeOff-2.0*sc,-109.0*sc+breath);
    ctx.quadraticCurveTo(headX+eyeOff,-108.3*sc+breath,headX+eyeOff+2.0*sc,-109.0*sc+breath);ctx.stroke();
  }

  ctx.fillStyle='#191e26';
  if(isBack){
    ctx.beginPath();
    ctx.moveTo(headX-8.1*sc,-115*sc+breath);
    ctx.quadraticCurveTo(headX-8.6*sc,-125.5*sc+breath,headX,-126.2*sc+breath);
    ctx.quadraticCurveTo(headX+8.6*sc,-125.5*sc+breath,headX+8.1*sc,-115*sc+breath);
    ctx.lineTo(headX+5.2*sc,-109.5*sc+breath);
    ctx.quadraticCurveTo(headX,-110.5*sc+breath,headX-5.2*sc,-109.5*sc+breath);
    ctx.closePath();
    ctx.fill();
  }else{
    ctx.beginPath();
    ctx.moveTo(headX-8.2*sc,-116*sc+breath);
    ctx.quadraticCurveTo(headX-8.8*sc,-126.0*sc+breath,headX,-126.8*sc+breath);
    ctx.quadraticCurveTo(headX+8.8*sc,-126.0*sc+breath,headX+8.2*sc,-116*sc+breath);
    ctx.quadraticCurveTo(headX+7.0*sc,-121.0*sc+breath,headX,-121.0*sc+breath);
    ctx.quadraticCurveTo(headX-7.0*sc,-121.0*sc+breath,headX-8.2*sc,-116*sc+breath);
    ctx.closePath();
    ctx.fill();
  }
}

function drawHero(){
  tAnim+=0.045;
  if(!dragging){rotY+=velY;velY*=0.95;}

  // Оновлення анімації набивання м'яча
  const badgeEl=document.getElementById('juggleBadge');
  const cntEl=document.getElementById('juggleCnt');
  let activeFoot=1,kickPower=0,ballArc=0;

  if(juggleTimer>0){
    juggleTimer--;
    juggleBlend=Math.min(1,juggleBlend+0.12);
    jugglePhase+=0.15;
    const cycle=Math.floor(jugglePhase/Math.PI);
    const sub=jugglePhase%Math.PI;
    activeFoot=(cycle%2===0)?1:-1;
    ballArc=Math.sin(sub)*36;
    // Нога підкидає м'яч у момент торкання внизу дуги
    kickPower=Math.max(0,1-Math.sin(sub)*2.4);

    if(cycle!==lastCycle){
      lastCycle=cycle;
      juggleHits++;
      playTouchSound();
    }
    badgeEl.style.display='block';
    cntEl.textContent=juggleHits;
  }else{
    juggleBlend=Math.max(0,juggleBlend-0.08);
    if(juggleBlend===0)badgeEl.style.display='none';
  }

  ctx.clearRect(0,0,W,H);
  drawStadiumBackground();

  const cx=W/2,cy=H*0.77;
  const sc=Math.min(W,H)*0.0038;
  const cosR=Math.cos(rotY),sinR=Math.sin(rotY);
  const isBack=cosR<0;
  const breath=Math.sin(tAnim)*1.0*sc;
  const wScale=Math.max(0.42,Math.abs(cosR));

  const shGrad=ctx.createRadialGradient(cx,cy+2*sc,3*sc,cx,cy+2*sc,34*sc);
  shGrad.addColorStop(0,'rgba(0,0,0,0.72)');shGrad.addColorStop(0.6,'rgba(0,0,0,0.28)');shGrad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=shGrad;ctx.beginPath();ctx.ellipse(cx,cy+2*sc,34*sc,9.5*sc,0,0,Math.PI*2);ctx.fill();

  const jItem=ITEMS[p.ej]||ITEMS.j1;
  const pItem=ITEMS[p.ep]||ITEMS.p1;
  const sItem=ITEMS[p.es]||ITEMS.s1;
  const bItem=ITEMS[p.eb]||ITEMS.b1;
  const kItem=ITEMS[p.ek]||ITEMS.k1;

  const jInfo={blend:juggleBlend,activeFoot:activeFoot,kick:kickPower};

  ctx.save();
  ctx.translate(cx,cy);
  drawPlayerBody(sc,cosR,sinR,isBack,breath,jItem,pItem,sItem,kItem,jInfo);
  drawPlayerHead(sc,sinR,isBack,breath);
  ctx.restore();

  // Плавний перехід м'яча з газону на ногу при набиванні
  const restBx=cx+31*sc,restBy=cy-5*sc;
  const sgnFoot=activeFoot*(cosR>=0?1:-1);
  const jugBx=cx+sgnFoot*7.2*sc*wScale+sinR*6*sc;
  const jugBy=cy-(22+ballArc)*sc;

  const bx=restBx+(jugBx-restBx)*juggleBlend;
  const by=restBy+(jugBy-restBy)*juggleBlend;
  const brad=9.0*sc;

  // Тінь м'яча на газоні (зменшується, коли м'яч високо в повітрі)
  const heightRatio=Math.max(0.35,1-(ballArc*juggleBlend)/55);
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath();ctx.ellipse(bx,cy+2*sc,9.2*sc*heightRatio,3.1*sc*heightRatio,0,0,Math.PI*2);ctx.fill();

  const bGrad=ctx.createRadialGradient(bx-3*sc,by-3*sc,1*sc,bx,by,brad);
  bGrad.addColorStop(0,'#ffffff');bGrad.addColorStop(0.65,bItem.col);bGrad.addColorStop(1,'#1e272e');
  ctx.fillStyle=bGrad;ctx.beginPath();ctx.arc(bx,by,brad,0,Math.PI*2);ctx.fill();

  // Обертання візерунка на м'ячі під час чеканки
  const spin=jugglePhase*0.6;
  ctx.fillStyle='rgba(15,20,30,0.78)';
  ctx.beginPath();ctx.arc(bx+Math.cos(spin)*2.2*sc,by+Math.sin(spin)*2.2*sc,2.4*sc,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(bx+Math.cos(spin+2.1)*4.2*sc,by+Math.sin(spin+2.1)*4.2*sc,1.8*sc,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(bx+Math.cos(spin+4.2)*4.2*sc,by+Math.sin(spin+4.2)*4.2*sc,1.8*sc,0,Math.PI*2);ctx.fill();

  requestAnimationFrame(drawHero);
}

rsz();updUI();drawHero();
</script>
