<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Berry Tycoon</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:sans-serif;background:#0f1015;color:#fff;margin:0;padding:14px;user-select:none}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{flex:1;padding:10px;background:#181a22;border:1px solid #2a2d3a;color:#8a8f9e;border-radius:10px;font-weight:bold;cursor:pointer}
.tab.active{background:#e84393;color:#fff;border-color:#e84393}
.card{background:#181a22;border:1px solid #2a2d3a;border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center}
.bar{width:100%;height:8px;background:#252834;border-radius:4px;overflow:hidden;margin:6px 0}
.fill{height:100%;background:#e84393;transition:width .2s}
.bal{text-align:center;font-size:34px;font-weight:900;color:#ffd32a;margin:8px 0 2px}
.sub{text-align:center;font-size:13px;color:#0be881;margin-bottom:12px}
.zone{display:flex;justify-content:center;margin:10px 0 16px;position:relative}
.tap{width:155px;height:155px;border-radius:50%;background:radial-gradient(circle,#ff4d79,#b31246);border:4px solid #ff85a2;color:#fff;font-weight:bold;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tap *{pointer-events:none}
.tap:active{transform:scale(.92)}
.upg{background:#181a22;border:1px solid #2a2d3a;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.btn{background:#e84393;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:bold;cursor:pointer;min-width:75px}
.btn:disabled{background:#252834;color:#57606f;cursor:not-allowed}
.flt{position:absolute;font-size:22px;font-weight:bold;color:#ffd32a;pointer-events:none;animation:up .6s forwards}
@keyframes up{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-45px)}}
.lrow{display:flex;justify-content:space-between;padding:10px;background:#181a22;border:1px solid #2a2d3a;border-radius:10px;margin-bottom:6px}
.lrow.me{border-color:#ffd32a;background:rgba(255,211,42,.12)}
</style>
</head>
<body>
<div class="tabs">
  <button class="tab active" id="t1" onclick="tab(1)">🍓 Гра</button>
  <button class="tab" id="t2" onclick="tab(2)">🏆 Турнірна таблиця</button>
</div>
<div id="g">
  <div class="card">
    <div class="row"><b id="rn" style="color:#fd79a8">🥉 Садівник</b><b style="color:#ffd32a">Рівень <span id="lv">1</span></b></div>
    <div class="bar"><div class="fill" id="xb"></div></div>
    <div class="row" style="font-size:11px;color:#8a8f9e"><span>XP: <span id="xp">0</span>/<span id="nx">100</span></span><span>x<span id="ml">1.0</span></span></div>
  </div>
  <div class="bal">💎 <span id="bl">0</span></div>
  <div class="sub">+<span id="ai">0</span>/сек • За тап: +<span id="ti">1</span></div>
  <div class="zone" id="zn"><button class="tap" onclick="hit()"><span style="font-size:50px" id="em">🍓</span><span>ЗІБРАТИ</span></button></div>
  <div style="margin-bottom:12px">
    <div class="row" style="font-size:12px"><b>⚡ Енергія</b><b><span id="en">100</span>/<span id="me">100</span></b></div>
    <div class="bar"><div class="fill" id="eb" style="background:#ffd32a;width:100%"></div></div>
  </div>
  <div class="upg"><div><b>👆 Сила (Lvl <span id="tl">1</span>)</b><div style="font-size:12px;color:#8a8f9e">+1 до кліку</div></div><button class="btn" id="bt" onclick="buy(1)">25 💎</button></div>
  <div class="upg"><div><b>🤖 Авто (Lvl <span id="al">0</span>)</b><div style="font-size:12px;color:#8a8f9e">+2/сек</div></div><button class="btn" id="ba" onclick="buy(2)">50 💎</button></div>
  <div class="upg"><div><b>🔋 Батарея (Lvl <span id="el">1</span>)</b><div style="font-size:12px;color:#8a8f9e">+50 енергії</div></div><button class="btn" id="be" onclick="buy(3)">40 💎</button></div>
</div>
<div id="t" style="display:none">
  <div class="row" style="margin-bottom:10px">
    <b>Топ гравців (Онлайн)</b>
    <div style="display:flex;gap:6px">
      <button class="btn" style="background:#2a2d3a;min-width:auto" onclick="changeName()">✏️ Нік</button>
      <button class="btn" style="min-width:auto" onclick="syncAndLoad()">🔄</button>
    </div>
  </div>
  <div id="ll" style="color:#8a8f9e">Завантаження...</div>
</div>
<script>
const API = 'https://getpantry.cloud';

let guestId = 'g_' + (localStorage.getItem('p_uid') || Math.floor(Math.random()*999999));
localStorage.setItem('p_uid', guestId.replace('g_',''));
let uid = guestId;
let un = localStorage.getItem('custom_nick') || ('Гравець #' + uid.slice(-4));

try {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready(); tg.expand();
    let u = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (!u && tg.initData) {
      const uStr = new URLSearchParams(tg.initData).get('user');
      if (uStr) u = JSON.parse(uStr);
    }
    if (u && u.id) {
      uid = 'u_' + u.id;
      un = localStorage.getItem('custom_nick') || (u.username ? '@' + u.username : [u.first_name, u.last_name].filter(Boolean).join(' '));
    }
  }
} catch(e) {}

function changeName() {
  const n = prompt('Введіть ваш нікнейм:', un);
  if (n && n.trim()) {
    un = n.trim().slice(0, 20);
    localStorage.setItem('custom_nick', un);
    syncAndLoad();
  }
}

let s = {b:0, x:0, l:1, t:1, a:0, e:1, n:100};
try { const v = JSON.parse(localStorage.getItem('b16')); if (v) s = Object.assign(s, v); } catch(e) {}

function rk() {
  if(s.l>=15) return {n:'🌌 Імператор', e:'👑', m:5};
  if(s.l>=10) return {n:'💎 Магнат', e:'🍓', m:3.5};
  if(s.l>=6) return {n:'🥇 Плантатор', e:'🍓', m:2.2};
  if(s.l>=3) return {n:'🥈 Фермер', e:'🍓', m:1.5};
  return {n:'🥉 Садівник', e:'🍓', m:1};
}
const nx=()=>Math.floor(100*Math.pow(1.45,s.l-1)), me=()=>100+(s.e-1)*50, tp=()=>Math.max(1,Math.floor(s.t*rk().m)), ap=()=>s.a?Math.floor(s.a*2*rk().m):0;
const c1=()=>Math.floor(25*Math.pow(1.4,s.t-1)), c2=()=>Math.floor(50*Math.pow(1.45,s.a)), c3=()=>Math.floor(40*Math.pow(1.5,s.e-1));

function ax(v) { s.x += v; while(s.x >= nx()) { s.x -= nx(); s.l++; s.n = me(); } }

function ui() {
  const r = rk(); rn.innerText = r.n; em.innerText = r.e; ml.innerText = r.m.toFixed(1); lv.innerText = s.l;
  xp.innerText = Math.floor(s.x); nx.innerText = nx(); xb.style.width = Math.min(100, s.x/nx()*100) + '%';
  bl.innerText = Math.floor(s.b); ai.innerText = ap(); ti.innerText = tp(); en.innerText = Math.floor(s.n);
  me.innerText = me(); eb.style.width = (s.n/me()*100) + '%'; tl.innerText = s.t; al.innerText = s.a; el.innerText = s.e;
  bt.innerText = c1() + ' 💎'; bt.disabled = s.b < c1();
  ba.innerText = c2() + ' 💎'; ba.disabled = s.b < c2();
  be.innerText = c3() + ' 💎'; be.disabled = s.b < c3();
  try { localStorage.setItem('b16', JSON.stringify(s)); } catch(e) {}
}

function hit() {
  if(s.n < 1) return; s.n--; const g = tp(); s.b += g; ax(2);
  const d = document.createElement('div'); d.className = 'flt'; d.innerText = '+' + g; d.style.left = '46%'; d.style.top = '20%';
  zn.appendChild(d); setTimeout(() => d.remove(), 600); ui();
}

function buy(i) {
  if(i===1 && s.b>=c1()) { s.b-=c1(); s.t++; ax(15); }
  if(i===2 && s.b>=c2()) { s.b-=c2(); s.a++; ax(15); }
  if(i===3 && s.b>=c3()) { s.b-=c3(); s.e++; s.n=me(); ax(15); }
  ui(); syncAndLoad();
}

function tab(i) {
  g.style.display = i===1 ? 'block' : 'none';
  t.style.display = i===2 ? 'block' : 'none';
  t1.classList.toggle('active', i===1);
  t2.classList.toggle('active', i===2);
  if(i===2) syncAndLoad();
}

async function syncAndLoad() {
  ll.innerText = 'Оновлення рейтингу...';
  try {
    const myEntry = {};
    myEntry[uid] = { id: uid, name: un, score: Math.floor(s.b), level: s.l };

    // PUT оновлює тільки ключ поточного гравця і повертає весь список
    const putRes = await fetch(API, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(myEntry)
    });

    let data = {};
    if (putRes.ok) {
      data = await putRes.json();
    } else {
      const getRes = await fetch(API + '?t=' + Date.now());
      if (getRes.ok) data = await getRes.json();
    }

    const list = Object.values(data).filter(p => p && p.name).sort((a,b) => b.score - a.score).slice(0, 30);
    if (!list.length) { ll.innerText = 'Поки порожньо!'; return; }

    ll.innerHTML = '';
    list.forEach((p, i) => {
      const medal = i < 3 ? ['🥇','🥈','🥉'][i] : '#' + (i+1);
      ll.innerHTML += `<div class="lrow${p.id===uid?' me':''}"><b>${medal} ${p.name} (Lvl ${p.level})</b><b style="color:#ffd32a">${Number(p.score).toLocaleString()} 💎</b></div>`;
    });
  } catch(e) {
    ll.innerText = 'Помилка з’єднання: ' + e.message;
  }
}

setInterval(() => {
  if(ap() > 0) { s.b += ap(); ax(1); }
  if(s.n < me()) s.n = Math.min(me(), s.n + 1 + Math.floor(s.e/2));
  ui();
}, 1000);

ui();
</script>
</body>
</html>
