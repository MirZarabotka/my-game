    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from './libs/GLTFLoader.js';
        import { DRACOLoader } from './libs/DRACOLoader.js';
        import { OrbitControls } from './libs/OrbitControls.js';
        import { CATALOG } from './shop-catalog.js';

        if (localStorage.getItem('player_coins') === null) {
            localStorage.setItem('player_coins', '500');
        }
        document.getElementById('home-coins').innerText = `💰 ${localStorage.getItem('player_coins')}`;

        class StadiumChantAudio {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.enabled = localStorage.getItem('stadium_sound') !== 'off';
                this.volume = Number(localStorage.getItem('stadium_vol') || 70) / 100;
                this.started = false;
            }

            init() {
                if (this.started || !this.enabled) return;
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;

                this.ctx = new AudioCtx();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = this.volume * 0.45;
                this.masterGain.connect(this.ctx.destination);

                const bufferSize = this.ctx.sampleRate * 4;
                const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                let b0 = 0, b1 = 0, b2 = 0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    b0 = 0.997 * b0 + white * 0.029;
                    b1 = 0.985 * b1 + white * 0.032;
                    b2 = 0.950 * b2 + white * 0.048;
                    output[i] = (b0 + b1 + b2) * 0.35;
                }

                const crowdNoise = this.ctx.createBufferSource();
                crowdNoise.buffer = noiseBuffer;
                crowdNoise.loop = true;

                const crowdFilter = this.ctx.createBiquadFilter();
                crowdFilter.type = 'bandpass';
                crowdFilter.frequency.value = 480;
                crowdFilter.Q.value = 0.7;

                crowdNoise.connect(crowdFilter);
                crowdFilter.connect(this.masterGain);
                crowdNoise.start();

                const chantNotes = [261.63, 293.66, 329.63, 293.66, 329.63, 392.00];
                let step = 0;
                setInterval(() => {
                    if (!this.enabled || !this.ctx || this.ctx.state !== 'running') return;
                    const now = this.ctx.currentTime;
                    const freq = chantNotes[step % chantNotes.length];
                    step++;

                    [-4, 0, 5].forEach((detune) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        const filter = this.ctx.createBiquadFilter();

                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now);
                        osc.detune.value = detune * 6;

                        filter.type = 'lowpass';
                        filter.frequency.value = 620;

                        gain.gain.setValueAtTime(0.0001, now);
                        gain.gain.linearRampToValueAtTime(0.045, now + 0.14);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.65);

                        osc.connect(filter);
                        filter.connect(gain);
                        gain.connect(this.masterGain);

                        osc.start(now);
                        osc.stop(now + 0.68);
                    });
                }, 720);

                this.started = true;
            }

            setVolume(v) {
                this.volume = v;
                localStorage.setItem('stadium_vol', String(Math.round(v * 100)));
                if (this.masterGain) this.masterGain.gain.value = this.enabled ? v * 0.45 : 0;
            }

            toggle() {
                this.enabled = !this.enabled;
                localStorage.setItem('stadium_sound', this.enabled ? 'on' : 'off');
                if (this.enabled && !this.started) this.init();
                if (this.ctx && this.ctx.state === 'suspended' && this.enabled) this.ctx.resume();
                if (this.masterGain) this.masterGain.gain.value = this.enabled ? this.volume * 0.45 : 0;
                return this.enabled;
            }
        }

        const stadiumAudio = new StadiumChantAudio();
        window.addEventListener('pointerdown', () => {
            stadiumAudio.init();
            if (stadiumAudio.ctx && stadiumAudio.ctx.state === 'suspended' && stadiumAudio.enabled) {
                stadiumAudio.ctx.resume();
            }
        }, { once: true });
        // ==================== КІНЕЦЬ ЧАСТИНИ 4 з 15 ====================
        // ==================== ПОЧАТОК ЧАСТИНИ 5 з 15 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x071326);
        scene.fog = new THREE.FogExp2(0x071326, 0.012);

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 180);
        camera.position.set(-0.45, 1.35, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xdbeafe, 1.05));
        const sunLight = new THREE.DirectionalLight(0xffffff, 2.3);
        sunLight.position.set(8, 16, 10);
        sunLight.castShadow = true;
        scene.add(sunLight);

        const backStadiumLight = new THREE.DirectionalLight(0x93c5fd, 1.1);
        backStadiumLight.position.set(-10, 12, -16);
        scene.add(backStadiumLight);

        function createPitchTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            const stripeCount = 12;
            const stripeH = 1024 / stripeCount;
            for (let i = 0; i < stripeCount; i++) {
                ctx.fillStyle = i % 2 === 0 ? '#15803d' : '#166534';
                ctx.fillRect(0, i * stripeH, 1024, stripeH);
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 7;

            ctx.strokeRect(48, 48, 928, 928);

            ctx.beginPath();
            ctx.moveTo(48, 512);
            ctx.lineTo(976, 512);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(512, 512, 95, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeRect(256, 48, 512, 180);
            ctx.strokeRect(384, 48, 256, 68);
            ctx.beginPath();
            ctx.arc(512, 175, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(512, 175, 85, 0.22 * Math.PI, 0.78 * Math.PI);
            ctx.stroke();

            ctx.strokeRect(256, 796, 512, 180);
            ctx.strokeRect(384, 908, 256, 68);
            ctx.beginPath();
            ctx.arc(512, 849, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(512, 849, 85, 1.22 * Math.PI, 1.78 * Math.PI);
            ctx.stroke();

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = 8;
            return tex;
        }

        const stadiumGroup = new THREE.Group();
        scene.add(stadiumGroup);

        const pitch = new THREE.Mesh(
            new THREE.PlaneGeometry(46, 66),
            new THREE.MeshStandardMaterial({ map: createPitchTexture(), roughness: 0.85 })
        );
        pitch.rotation.x = -Math.PI / 2;
        pitch.receiveShadow = true;
        stadiumGroup.add(pitch);

        const track = new THREE.Mesh(
            new THREE.PlaneGeometry(62, 82),
            new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 })
        );
        track.rotation.x = -Math.PI / 2;
        track.position.y = -0.02;
        stadiumGroup.add(track);

        function createGoal(zPos, rotY) {
            const goal = new THREE.Group();
            const postMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
            const postGeo = new THREE.CylinderGeometry(0.08, 0.08, 2.44, 16);
            const barGeo = new THREE.CylinderGeometry(0.08, 0.08, 7.32, 16);

            const leftPost = new THREE.Mesh(postGeo, postMat);
            leftPost.position.set(-3.66, 1.22, 0);
            const rightPost = new THREE.Mesh(postGeo, postMat);
            rightPost.position.set(3.66, 1.22, 0);
            const crossbar = new THREE.Mesh(barGeo, postMat);
            crossbar.rotation.z = Math.PI / 2;
            crossbar.position.set(0, 2.44, 0);

            const netMat = new THREE.MeshBasicMaterial({
                color: 0xe2e8f0,
                wireframe: true,
                transparent: true,
                opacity: 0.35
            });
            const net = new THREE.Mesh(new THREE.BoxGeometry(7.32, 2.44, 1.8, 18, 6, 5), netMat);
            net.position.set(0, 1.22, -0.9);

            goal.add(leftPost, rightPost, crossbar, net);
            goal.position.set(0, 0, zPos);
            goal.rotation.y = rotY;
            return goal;
        }
        stadiumGroup.add(createGoal(-29.8, 0));
        stadiumGroup.add(createGoal(29.8, Math.PI));
        // ==================== КІНЕЦЬ ЧАСТИНИ 5 з 15 ====================
        // ==================== ПОЧАТОК ЧАСТИНИ 6 з 15 ====================
        const tierMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85 });
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.6, roughness: 0.35 });
        const railMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8, roughness: 0.2 });

        function createBannerTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 2048, 0);
            grad.addColorStop(0, '#0284c7');
            grad.addColorStop(0.5, '#1d4ed8');
            grad.addColorStop(1, '#0284c7');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 2048, 128);

            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(0, 0, 2048, 10);
            ctx.fillRect(0, 118, 2048, 10);

            ctx.fillStyle = '#ffffff';
            ctx.font = '900 54px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('⚽ PENALTY 3D ARENA   ★   CHAMPIONS CUP   ★   MAKE YOUR SHOT! 🔥', 1024, 66);

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.ClampToEdgeWrapping;
            tex.repeat.set(3, 1);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        const bannerTex = createBannerTexture();
        const adBoardMat = new THREE.MeshBasicMaterial({ map: bannerTex });

        const adBack = new THREE.Mesh(new THREE.BoxGeometry(50, 1.25, 0.25), adBoardMat);
        adBack.position.set(0, 0.62, -31.8);
        const adFront = new THREE.Mesh(new THREE.BoxGeometry(50, 1.25, 0.25), adBoardMat);
        adFront.position.set(0, 0.62, 31.8);
        const adLeft = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1.25, 64), adBoardMat);
        adLeft.position.set(-24.0, 0.62, 0);
        const adRight = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1.25, 64), adBoardMat);
        adRight.position.set(24.0, 0.62, 0);
        stadiumGroup.add(adBack, adFront, adLeft, adRight);

        const railBack = new THREE.Mesh(new THREE.BoxGeometry(52, 0.08, 0.08), railMat);
        railBack.position.set(0, 1.55, -32.8);
        const railLeft = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 66), railMat);
        railLeft.position.set(-24.8, 1.55, 0);
        const railRight = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 66), railMat);
        railRight.position.set(24.8, 1.55, 0);
        stadiumGroup.add(railBack, railLeft, railRight);

        const seatPositions = [];
        const fanPositions = [];
        const phonePositions = [];
        const jerseyColors = [0xdc2626, 0x2563eb, 0xeab308, 0x16a34a, 0xf8fafc, 0xea580c, 0x0284c7, 0x9333ea, 0x1e293b];
        const skinColors = [0xffdbac, 0xf1c27d, 0xe0ac69, 0xc68642, 0x8d5524];
        const hairColors = [0x1c1917, 0x451a03, 0x78350f, 0xd97706, 0x57534e];

        const numRows = 9;
        for (let r = 0; r < numRows; r++) {
            const rowY = 1.35 + r * 0.68;
            const rowDepth = 1.05;

            const zDist = 33.4 + r * 1.02;
            const stepW = 54 + r * 2;
            const stepGeoZ = new THREE.BoxGeometry(stepW, 0.68, rowDepth);

            const backStep = new THREE.Mesh(stepGeoZ, tierMat);
            backStep.position.set(0, rowY - 0.34, -zDist);
            const frontStep = new THREE.Mesh(stepGeoZ, tierMat);

        function makeBrightDetailTexture(sourceTex) {
            if (!sourceTex || !sourceTex.image) return null;
            try {
                const img = sourceTex.image;
                const w = img.width || 512;
                const h = img.height || 512;
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);

                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const lum = (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) / 255;
                    const boosted = Math.min(255, Math.round((0.55 + lum * 0.45) * 255));
                    data[i] = boosted;
                    data[i + 1] = boosted;
                    data[i + 2] = boosted;
                }
                ctx.putImageData(imgData, 0, 0);

                const cleanTex = new THREE.CanvasTexture(canvas);
                cleanTex.flipY = sourceTex.flipY;
                cleanTex.colorSpace = THREE.SRGBColorSpace;
                cleanTex.needsUpdate = true;
                return cleanTex;
            } catch (e) {
                return null;
            }
        }

        function extractSingleGlove(gloveScene, pickLeft) {
            gloveScene.updateMatrixWorld(true);
            const fullBox = new THREE.Box3().setFromObject(gloveScene);
            const midX = (fullBox.min.x + fullBox.max.x) * 0.5;
            const isSingle = (fullBox.max.x - fullBox.min.x) < (fullBox.max.y - fullBox.min.y) * 1.1;

            const meshGroup = new THREE.Group();

            gloveScene.traverse((node) => {
                if (!node.isMesh || !node.geometry) return;
                const geo = node.geometry.clone();
                geo.applyMatrix4(node.matrixWorld);

                if (!isSingle && geo.index) {
                    const pos = geo.attributes.position;
                    const idx = geo.index.array;
                    const filtered = [];
                    for (let i = 0; i < idx.length; i += 3) {
                        const cx = (pos.getX(idx[i]) + pos.getX(idx[i + 1]) + pos.getX(idx[i + 2])) / 3;
                        if (pickLeft ? cx < midX : cx >= midX) {
                            filtered.push(idx[i], idx[i + 1], idx[i + 2]);
                        }
                    }
                    if (filtered.length === 0) return;
                    geo.setIndex(filtered);
                }

                geo.computeBoundingBox();
                const mats = Array.isArray(node.material) ? node.material : [node.material];
                const clonedMats = mats.map((m) => {
                    const detailMap = makeBrightDetailTexture(m.map);
                    const c = new THREE.MeshStandardMaterial({
                        map: detailMap,
                        normalMap: m.normalMap || null,
                        roughness: 0.55,
                        metalness: 0.05,
                        side: THREE.DoubleSide
                    });
                    gloveMaterials.push(c);
                    return c;
                });

                const mesh = new THREE.Mesh(geo, clonedMats.length === 1 ? clonedMats.at(0) : clonedMats);
                mesh.castShadow = true;
                mesh.frustumCulled = false;
                meshGroup.add(mesh);
            });

            const box = new THREE.Box3().setFromObject(meshGroup);
            const size = new THREE.Vector3();
            box.getSize(size);

            const cuffThresholdY = box.min.y + size.y * 0.15;
            let minCuffX = Infinity, maxCuffX = -Infinity;
            let minCuffZ = Infinity, maxCuffZ = -Infinity;
            let foundCuff = false;

            meshGroup.traverse((m) => {
                if (!m.isMesh || !m.geometry) return;
                const pos = m.geometry.attributes.position;
                const idx = m.geometry.index;
                if (idx) {
                    for (let i = 0; i < idx.count; i++) {
                        const vi = idx.getX(i);
                        const y = pos.getY(vi);
                        if (y <= cuffThresholdY) {
                            const x = pos.getX(vi);
                            const z = pos.getZ(vi);
                            if (x < minCuffX) minCuffX = x;
                            if (x > maxCuffX) maxCuffX = x;
                            if (z < minCuffZ) minCuffZ = z;
                            if (z > maxCuffZ) maxCuffZ = z;
                            foundCuff = true;
                        }
                    }
                }
            });

            const center = new THREE.Vector3();
            box.getCenter(center);
            const pivotX = foundCuff ? (minCuffX + maxCuffX) * 0.5 : center.x;
            const pivotZ = foundCuff ? (minCuffZ + maxCuffZ) * 0.5 : center.z;

            const maxDim = Math.max(size.x, size.y, size.z) || 1;
            const norm = 1.0 / maxDim;

            meshGroup.scale.setScalar(norm);
            meshGroup.position.set(-pivotX * norm, -box.min.y * norm, -pivotZ * norm);

            const unit = new THREE.Group();
            unit.add(meshGroup);
            unit.rotation.y = pickLeft ? Math.PI : 0;
            return unit;
        }

            armBone.add(holder);

        function createJerseyTexture(jersey, num, numCol, backUv) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = jersey.c1;
            ctx.fillRect(0, 0, 1024, 1024);

            ctx.fillStyle = jersey.c2;
            if (jersey.pattern === 'stripes') {
                for (let x = 0; x < 1024; x += 88) ctx.fillRect(x, 0, 44, 1024);
            } else if (jersey.pattern === 'hoops') {
                for (let y = 0; y < 1024; y += 88) ctx.fillRect(0, y, 1024, 44);
            } else if (jersey.pattern === 'half') {
                ctx.fillRect(210, 0, 120, 1024);
                ctx.fillRect(530, 0, 170, 1024);
            } else if (jersey.pattern === 'centerBand') {
                ctx.fillRect(170, 0, 90, 1024);
                ctx.fillRect(490, 0, 90, 1024);
            } else if (jersey.pattern === 'chestBand') {
                ctx.fillRect(0, 320, 1024, 260);
            } else if (jersey.pattern === 'sash') {
                ctx.beginPath();
                ctx.moveTo(0, 0); ctx.lineTo(240, 0); ctx.lineTo(1024, 1024); ctx.lineTo(784, 1024);
                ctx.closePath(); ctx.fill();
            } else if (jersey.pattern === 'sleeves') {
                ctx.fillRect(406, 0, 44, 1024);
                ctx.fillRect(796, 0, 228, 1024);
            }

            if (num && backUv) {
                const px = backUv.u * 1024;
                const py = backUv.v * 1024;
                const sizePx = Math.max(70, Math.min(240, backUv.scale || 135));

                ctx.save();
                ctx.translate(px, py);
                if (backUv.flipX) ctx.scale(-1, 1);
                if (backUv.flipY) ctx.scale(1, -1);
                ctx.fillStyle = numCol || '#ffffff';
                ctx.strokeStyle = (numCol === '#000000') ? '#ffffff' : '#000000';
                ctx.lineWidth = Math.max(6, sizePx * 0.08);
                ctx.lineJoin = 'round';
                ctx.font = `900 ${Math.round(sizePx)}px "Segoe UI", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.strokeText(String(num), 0, 0);
                ctx.fillText(String(num), 0, 0);
                ctx.restore();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.flipY = false;
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.needsUpdate = true;
            return tex;
        }

        function detectShirtBackUV(model) {
            model.updateMatrixWorld(true);
            const shirtMeshes = [];
            model.traverse((c) => {
                if (!c.isMesh || !c.geometry || !c.geometry.attributes.uv) return;
                const n = (c.name || '').toLowerCase();
                if (n.includes('shirt') || n.includes('top') || n.includes('jersey') || n.includes('torso')) {
                    shirtMeshes.push(c);
                }
            });
            const targets = shirtMeshes.length ? shirtMeshes : [];
            if (!targets.length) {
                model.traverse((c) => { if (c.isMesh && c.geometry && c.geometry.attributes.uv) targets.push(c); });
            }

            const box = new THREE.Box3().setFromObject(model);
            const center = new THREE.Vector3();
            const size = new THREE.Vector3();
            box.getCenter(center);
            box.getSize(size);

            const ray = new THREE.Raycaster();
            const origin = new THREE.Vector3(center.x, box.min.y + size.y * 0.68, box.min.z - 1.5);
            const dir = new THREE.Vector3(0, 0, 1);
            ray.set(origin, dir);

            const hits = ray.intersectObjects(targets, false);
            if (hits.length > 0 && hits.at(0).uv) {
                const hit = hits.at(0);
                const originRight = origin.clone().add(new THREE.Vector3(0.06, 0, 0));
                ray.set(originRight, dir);
                const hitsR = ray.intersectObjects(targets, false);

                const originUp = origin.clone().add(new THREE.Vector3(0, 0.06, 0));
                ray.set(originUp, dir);
                const hitsU = ray.intersectObjects(targets, false);

                let flipX = false;
                let flipY = false;
                let scale = 135;

                if (hitsR.length > 0 && hitsR.at(0).uv) {
                    const du = hitsR.at(0).uv.x - hit.uv.x;
                    if (du > 0) flipX = true;
                    const pxPerUnit = (Math.abs(du) * 1024) / 0.06;
                    if (pxPerUnit > 80 && pxPerUnit < 3000) {
                        scale = pxPerUnit * 0.19;
                    }
                }
                if (hitsU.length > 0 && hitsU.at(0).uv) {
                    const dv = hitsU.at(0).uv.y - hit.uv.y;
                    if (dv > 0) flipY = true;
                }

                return { u: hit.uv.x, v: hit.uv.y, flipX, flipY, scale };
            }
            return { u: 0.75, v: 0.35, flipX: false, flipY: false, scale: 135 };
        }

            const sId = localStorage.getItem('eq_shorts') || 's1';
            const bId = localStorage.getItem('eq_boots') || 'b1';
            const gId = localStorage.getItem('eq_gloves') || 'g1';
            const ballId = localStorage.getItem('eq_balls') || 'ball1';
            const num = localStorage.getItem('eq_number') || '10';
            const numCol = localStorage.getItem('eq_numColor') || '#ffffff';

            const jersey = (CATALOG.jerseys || []).find(x => x.id === jId) || CATALOG.jerseys.at(0);
            const shortItem = (CATALOG.shorts || []).find(x => x.id === sId) || CATALOG.shorts.at(0);
            const bootItem = (CATALOG.boots || []).find(x => x.id === bId) || CATALOG.boots.at(0);
            const gloveItem = (CATALOG.gloves || []).find(x => x.id === gId) || CATALOG.gloves.at(0);
            const ballItem = (CATALOG.balls || []).find(x => x.id === ballId) || CATALOG.balls.at(0);

            ballMesh.material.needsUpdate = true;

            const jerseyTex = createJerseyTexture(jersey, num, numCol, backUv);

            walkModel(playerModel, (child) => {
                if (child.isBone && child.name) {
                    const n = child.name.toLowerCase();
                    skeletonBones[n] = child;
                    baseBoneRot[n] = child.rotation.clone();

                    if (n.includes('forearm') && n.includes('left')) leftForeArmBone = child;
                    if (n.includes('forearm') && n.includes('right')) rightForeArmBone = child;

                    if (n.includes('hand') && n.includes('left') && !n.includes('middle') && !n.includes('index') && !n.includes('ring') && !n.includes('pinky') && !n.includes('thumb')) {
                        leftHandBone = child;
                    }
                    if (n.includes('hand') && n.includes('right') && !n.includes('middle') && !n.includes('index') && !n.includes('ring') && !n.includes('pinky') && !n.includes('thumb')) {
                        rightHandBone = child;
                    }
                }

                if (!child.isMesh || !child.material) return;
                child.castShadow = true;
                child.receiveShadow = true;
                const name = (child.name || '').toLowerCase();

                if (name.includes('shirt') || name.includes('top') || name.includes('jersey') || name.includes('torso')) {
                    child.material = new THREE.MeshStandardMaterial({ map: jerseyTex, roughness: 0.7 });
                } else if (name.includes('short') || name.includes('pant')) {
                    child.material = new THREE.MeshStandardMaterial({ color: shortItem.c1, roughness: 0.75 });
                } else if (name.includes('shoe') || name.includes('boot')) {
                    child.material = new THREE.MeshStandardMaterial({ color: bootItem.c1, roughness: 0.4 });
                } else if (Array.isArray(child.material)) {
                    child.material = child.material.map((m, idx) => {
                        const mName = (m.name || '').toLowerCase();
                        if (mName.includes('shirt') || mName.includes('top') || idx === 1) {
                            return new THREE.MeshStandardMaterial({ map: jerseyTex, roughness: 0.7 });
                        }
                        if (mName.includes('short') || idx === 2) {
                            return new THREE.MeshStandardMaterial({ color: shortItem.c1, roughness: 0.75 });
                        }
                        if (mName.includes('shoe') || mName.includes('boot') || idx === 3) {
                            return new THREE.MeshStandardMaterial({ color: bootItem.c1, roughness: 0.4 });
                        }
                        return m;
                    });
                }
            });

            scene.add(playerModel);
            // ==================== КІНЕЦЬ ЧАСТИНИ 11 з 15 ====================
            // ==================== ПОЧАТОК ЧАСТИНИ 12 з 15 ====================
            loader.load(
                './glove.glb?v=3',
                (gloveGltf) => {
                    try {
                        const gScene = gloveGltf.scene || (gloveGltf.scenes && gloveGltf.scenes.at(0));
                        if (gScene) mountGloveModel(gScene, gloveItem.c1);
                    } catch (e) {
                        console.error('Помилка рукавиць:', e);
                    }
                },
                undefined,
                (err) => console.error('Помилка завантаження glove.glb:', err)
            );

            const firstAnim = gltf.animations && gltf.animations.at(0);
            if (firstAnim) {
                mixer = new THREE.AnimationMixer(playerModel);
                mixer.clipAction(firstAnim).play();
            }

            hideLoader();
        }, undefined, (err) => {
            console.error('Помилка завантаження player.glb:', err);
            hideLoader();
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            window.location.href = 'game.html';
        });

        const settingsModal = document.getElementById('settings-modal');
        const quickSoundBtn = document.getElementById('quick-sound-btn');
        const toggleSoundBtn = document.getElementById('toggle-crowd-sound');
        const volSlider = document.getElementById('stadium-vol');
        const volLabel = document.getElementById('vol-label');
        const toggleShadowsBtn = document.getElementById('toggle-shadows');

        function syncSoundUI(isOn) {
            quickSoundBtn.textContent = isOn ? '🔊' : '🔇';
            toggleSoundBtn.textContent = isOn ? '🔊 Спів та гул трибун: УВІМК' : '🔇 Спів та гул трибун: ВИМК';
            toggleSoundBtn.classList.toggle('active', isOn);
        }
        syncSoundUI(stadiumAudio.enabled);
        volSlider.value = Math.round(stadiumAudio.volume * 100);
        volLabel.textContent = `${volSlider.value}%`;

        quickSoundBtn.addEventListener('click', () => syncSoundUI(stadiumAudio.toggle()));
        toggleSoundBtn.addEventListener('click', () => syncSoundUI(stadiumAudio.toggle()));
        volSlider.addEventListener('input', (e) => {
            const val = Number(e.target.value);
            volLabel.textContent = `${val}%`;
            stadiumAudio.setVolume(val / 100);
        });

        let highGraphics = true;
        toggleShadowsBtn.addEventListener('click', () => {
            highGraphics = !highGraphics;
            renderer.shadowMap.enabled = highGraphics;
            [torsosInstanced, headsInstanced, hairsInstanced, leftArmsInstanced, rightArmsInstanced, scarfsInstanced, phonesInstanced].forEach(m => {
                m.visible = highGraphics;
            });
            toggleShadowsBtn.textContent = highGraphics ? '✨ Тіні та деталізація: ВИСОКА' : '⚡ Тіні та деталізація: НИЗЬКА';
            toggleShadowsBtn.classList.toggle('active', highGraphics);
        });

        document.getElementById('settings-btn').addEventListener('click', () => settingsModal.classList.add('open'));
        document.getElementById('close-settings').addEventListener('click', () => settingsModal.classList.remove('open'));
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) settingsModal.classList.remove('open');
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        // ==================== КІНЕЦЬ ЧАСТИНИ 12 з 15 ====================
        // ==================== ПОЧАТОК ЧАСТИНИ 13 з 15 ====================
        let lastTime = performance.now();
        const worldAxisX = new THREE.Vector3(1, 0, 0);
        const worldAxisY = new THREE.Vector3(0, 1, 0);
        const worldAxisZ = new THREE.Vector3(0, 0, 1);

        const REST_BALL_POS = new THREE.Vector3(0.34, 0.103, 0.24);
        const startBouncePos = new THREE.Vector3();
        const targetBouncePos = new THREE.Vector3();
        const rollStartPos = new THREE.Vector3();
        let lastStepIndex = -1;

        let playerAction = 'idle';
        let actionTimer = 0;
        let waveBlend = 0;

        const JUG_SPEED = 2.6;
        const T_FLICK_UP = 0.42; // Коротке підведення носочка лівої бутси під м'яч (м'яч ще не підпригує!)
        const JUG_BEATS = 6;     // 6 ударів: права -> ліва -> права -> ліва -> права -> ліва
        const T_JUG_END = T_FLICK_UP + (JUG_BEATS * Math.PI) / JUG_SPEED;
        const T_ROLL_END = T_JUG_END + 1.05;

        function smooth01(x) {
            const c = Math.max(0, Math.min(1, x));
            return c * c * (3 - 2 * c);
        }

        function rotateBoneWorldAxis(bone, worldAxis, angleRad) {
            if (!bone || !bone.parent) return;
            const parentWorldQuat = new THREE.Quaternion();
            bone.parent.getWorldQuaternion(parentWorldQuat);
            const localAxis = worldAxis.clone().applyQuaternion(parentWorldQuat.invert()).normalize();
            const q = new THREE.Quaternion().setFromAxisAngle(localAxis, angleRad);
            bone.quaternion.premultiply(q);
        }

        function playerModelUpdateMatrix(rFoot, lFoot) {
            if (rFoot && rFoot.parent && rFoot.parent.parent) {
                rFoot.parent.parent.updateMatrixWorld(true);
            }
            if (lFoot && lFoot.parent && lFoot.parent.parent) {
                lFoot.parent.parent.updateMatrixWorld(true);
            }
        }

        function getFootStrikePos(toeBone, footBone, isRight) {
            const pos = new THREE.Vector3();
            const bone = toeBone || footBone;
            if (bone) {
                bone.getWorldPosition(pos);
                pos.y += 0.105;
                pos.z += toeBone ? 0.03 : 0.14;
            } else {
                pos.set(isRight ? -0.14 : 0.14, 0.38, 0.42);
            }
            return pos;
        }

        function animate(now) {
            requestAnimationFrame(animate);
            const dt = (now - lastTime) * 0.001;
            lastTime = now;
            const t = now * 0.001;

            if (mixer) mixer.update(dt);

            if (idleTimer < 0.05 && playerAction !== 'idle') {
                playerAction = 'idle';
                actionTimer = 0;
            }

            if (playerAction === 'idle') {
                idleTimer += dt;
                if (idleTimer >= 10.0) {
                    playerAction = 'juggling';
                    actionTimer = 0;
                    jugPhase = 0;
                    lastStepIndex = -1;
                }
            } else if (playerAction === 'juggling') {
                actionTimer += dt;
                if (actionTimer >= T_ROLL_END) {
                    playerAction = 'waving';
                    actionTimer = 0;
                }
            } else if (playerAction === 'waving') {
                actionTimer += dt;
                if (actionTimer >= 5.0) {
                    playerAction = 'idle';
                    actionTimer = 0;
                    idleTimer = 0;
                }
            }

            const targetWave = playerAction === 'waving' ? 1.0 : 0.0;
            waveBlend += (targetWave - waveBlend) * Math.min(1, dt * 3.8);

            const getBone = (part, exclude = '') => {
                const key = Object.keys(skeletonBones).find(k => k.includes(part) && (!exclude || !k.includes(exclude)));
                return key ? skeletonBones[key] : null;
            };

            const rUpLeg = getBone('rightupleg');
            const rLeg = getBone('rightleg');
            const rFoot = getBone('rightfoot');
            const rToe = getBone('righttoebase') || getBone('righttoe');

            const lUpLeg = getBone('leftupleg');
            const lLeg = getBone('leftleg');
            const lFoot = getBone('leftfoot');
            const lToe = getBone('lefttoebase') || getBone('lefttoe');

            const spine = getBone('spine');
            const head = getBone('head');
            const rArm = getBone('rightarm');
            const rForeArm = getBone('rightforearm');
            const lArm = getBone('leftarm');

            if (playerAction === 'juggling') {
                let rUpX = 0, rUpZ = 0, rKneeX = 0, rFootX = 0;
                let lUpX = 0, lUpZ = 0, lKneeX = 0, lFootX = 0;
                let spineZ = 0;

                if (actionTimer < T_FLICK_UP) {
                    // Ліва нога лише підводить носочок знизу під м'яч на землі — без зайвого підскоку м'яча!
                    const p = smooth01(actionTimer / T_FLICK_UP);
                    lUpX = -0.34 * p;
                    lUpZ = 0.14 * p;
                    lKneeX = 0.44 * p;
                    lFootX = 0.28 * p;
                    spineZ = 0.03 * p;

                    if (lUpLeg) rotateBoneWorldAxis(lUpLeg, worldAxisX, lUpX);
                    if (lUpLeg) rotateBoneWorldAxis(lUpLeg, worldAxisZ, lUpZ);
                    if (lLeg) rotateBoneWorldAxis(lLeg, worldAxisX, lKneeX);
                    if (lFoot) rotateBoneWorldAxis(lFoot, worldAxisX, lFootX);
                    playerModelUpdateMatrix(rFoot, lFoot);

                    ballMesh.position.copy(REST_BALL_POS);
                    lastStepIndex = -1;
                }
                // ==================== КІНЕЦЬ ЧАСТИНИ 13 з 15 ====================
                // ==================== ПОЧАТОК ЧАСТИНИ 14 з 15 ====================
                else if (actionTimer < T_JUG_END) {
                    jugPhase = (actionTimer - T_FLICK_UP) * JUG_SPEED;
                    const stepIndex = Math.min(JUG_BEATS - 1, Math.floor(jugPhase / Math.PI));
                    const localT = (jugPhase - stepIndex * Math.PI) / Math.PI;
                    const isLeftTarget = stepIndex % 2 === 1;

                    const dropProgress = Math.min(1, localT / 0.45);
                    const dropCurve = Math.cos(dropProgress * Math.PI * 0.5);
                    const riseProgress = Math.max(0, (localT - 0.55) / 0.45);
                    const riseCurve = Math.sin(riseProgress * Math.PI * 0.5);
                    const prevLegLift = stepIndex === 0 ? 0 : dropCurve;

                    const lLift = isLeftTarget ? riseCurve : prevLegLift;
                    const rLift = !isLeftTarget ? riseCurve : prevLegLift;

                    rUpX = -rLift * 0.78;
                    rKneeX = rLift * 0.98;
                    rFootX = -rLift * 0.22;

                    lUpX = -lLift * 0.78;
                    lKneeX = lLift * 0.98;
                    lFootX = -lLift * 0.22;

                    spineZ = isLeftTarget ? riseCurve * 0.05 : -riseCurve * 0.05;

                    if (rUpLeg) rotateBoneWorldAxis(rUpLeg, worldAxisX, rUpX);
                    if (rLeg) rotateBoneWorldAxis(rLeg, worldAxisX, rKneeX);
                    if (rFoot) rotateBoneWorldAxis(rFoot, worldAxisX, rFootX);
                    if (lUpLeg) rotateBoneWorldAxis(lUpLeg, worldAxisX, lUpX);
                    if (lLeg) rotateBoneWorldAxis(lLeg, worldAxisX, lKneeX);
                    if (lFoot) rotateBoneWorldAxis(lFoot, worldAxisX, lFootX);
                    playerModelUpdateMatrix(rFoot, lFoot);

                    const currentTargetPos = isLeftTarget
                        ? getFootStrikePos(lToe, lFoot, false)
                        : getFootStrikePos(rToe, rFoot, true);

                    if (stepIndex !== lastStepIndex) {
                        startBouncePos.copy(ballMesh.position);
                        lastStepIndex = stepIndex;
                    }
                    targetBouncePos.copy(currentTargetPos);

                    const arcWave = Math.sin(localT * Math.PI);
                    ballMesh.position.lerpVectors(startBouncePos, targetBouncePos, localT);
                    ballMesh.position.y += arcWave * 0.64;
                    ballMesh.position.z = Math.max(ballMesh.position.z, 0.36) + arcWave * 0.12;
                    ballMesh.rotation.x -= dt * 3.8;
                    ballMesh.rotation.z += (isLeftTarget ? 1 : -1) * dt * 1.4;
                    rollStartPos.copy(ballMesh.position);
                } else {
                    const p = smooth01((actionTimer - T_JUG_END) / (T_ROLL_END - T_JUG_END));
                    const footDownPhase = Math.min(1, p / 0.45);
                    const legRemain = 1 - smooth01(footDownPhase);

                    lUpX = -0.78 * legRemain;
                    lKneeX = 0.98 * legRemain;
                    lFootX = -0.22 * legRemain + 0.18 * Math.sin(footDownPhase * Math.PI);
                    spineZ = 0.05 * legRemain;

                    if (lUpLeg) rotateBoneWorldAxis(lUpLeg, worldAxisX, lUpX);
                    if (lLeg) rotateBoneWorldAxis(lLeg, worldAxisX, lKneeX);
                    if (lFoot) rotateBoneWorldAxis(lFoot, worldAxisX, lFootX);
                    playerModelUpdateMatrix(rFoot, lFoot);

                    const leftToeDropPos = getFootStrikePos(lToe, lFoot, false);
                    leftToeDropPos.y = Math.max(0.103, leftToeDropPos.y);

                    const prevX = ballMesh.position.x;
                    const prevZ = ballMesh.position.z;

                    if (p < 0.45) {
                        const sub = smooth01(p / 0.45);
                        ballMesh.position.lerpVectors(rollStartPos, leftToeDropPos, sub);
                    } else {
                        const sub = smooth01((p - 0.45) / 0.55);
                        ballMesh.position.lerpVectors(leftToeDropPos, REST_BALL_POS, sub);
                        ballMesh.position.y = 0.103;
                    }

                    const dx = ballMesh.position.x - prevX;
                    const dz = ballMesh.position.z - prevZ;
                    ballMesh.rotation.x += dz / 0.103;
                    ballMesh.rotation.z -= dx / 0.103;
                }

                if (spine) spine.rotation.z = (baseBoneRot[spine.name.toLowerCase()]?.z || 0) + spineZ;
                if (rArm) rArm.rotation.z = (baseBoneRot[rArm.name.toLowerCase()]?.z || 0) - 0.15;
                if (lArm) lArm.rotation.z = (baseBoneRot[lArm.name.toLowerCase()]?.z || 0) + 0.15;
            } else {
                lastStepIndex = -1;
                jugPhase = 0;
                ballMesh.position.lerp(REST_BALL_POS, Math.min(1, dt * 5));
                ballMesh.rotation.y += 0.01;
            }

            const wristSwing = waveBlend > 0.05 ? ((1 - Math.cos(actionTimer * 8.0)) * 0.5) * waveBlend : 0;

            if (waveBlend > 0.005) {
                if (rArm) {
                    rotateBoneWorldAxis(rArm, worldAxisX, -2.42 * waveBlend);
                    rotateBoneWorldAxis(rArm, worldAxisZ, -0.32 * waveBlend);
                }
                if (spine) {
                    rotateBoneWorldAxis(spine, worldAxisZ, 0.04 * waveBlend);
                }
                if (head) {
                    rotateBoneWorldAxis(head, worldAxisX, -0.05 * waveBlend);
                }
            }

            if (rightGloveHolder.children.length > 0) {
                const gloveUnit = rightGloveHolder.children.at(0);
                gloveUnit.rotation.y = -1.69 * waveBlend;
                gloveUnit.rotation.z = 0.55 * wristSwing;
            }
            // ==================== КІНЕЦЬ ЧАСТИНИ 14 з 15 ====================
            // ==================== ПОЧАТОК ЧАСТИНИ 15 з 15 ====================
            if (glovesLoaded) {
                if (leftHandBone) leftHandBone.scale.setScalar(0.0001);
                if (rightHandBone) rightHandBone.scale.setScalar(0.0001);
            }

            bannerTex.offset.x += dt * 0.08;

            if (torsosInstanced.visible) {
                for (let i = 0; i < fanPositions.length; i += 2) {
                    const f = fanPositions[i];
                    const wave = Math.sin(t * 4.2 + f.phase);
                    const bounce = Math.max(0, wave) * 0.13;
                    const cosR = Math.cos(f.rotY);
                    const sinR = Math.sin(f.rotY);

                    dummy.rotation.set(0, f.rotY, 0);
                    dummy.scale.set(1.15, 1.0, 0.68);
                    dummy.position.set(f.x, f.y + 0.34 + bounce, f.z);
                    dummy.updateMatrix();
                    torsosInstanced.setMatrixAt(i, dummy.matrix);

                    dummy.scale.set(0.95, 1.08, 0.98);
                    dummy.position.set(f.x, f.y + 0.76 + bounce, f.z);
                    dummy.updateMatrix();
                    headsInstanced.setMatrixAt(i, dummy.matrix);

                    dummy.scale.set(0.98, 1.05, 1.02);
                    dummy.position.set(f.x, f.y + 0.775 + bounce, f.z);
                    dummy.updateMatrix();
                    hairsInstanced.setMatrixAt(i, dummy.matrix);

                    dummy.scale.set(1, 1, 1);
                    const armRaise = (wave > 0.3 || f.hasScarf) ? 0.34 : 0;
                    dummy.position.set(f.x - 0.27 * cosR, f.y + 0.36 + bounce + armRaise, f.z + 0.27 * sinR);
                    dummy.rotation.set((wave > 0.3 || f.hasScarf) ? -2.65 : 0, f.rotY, 0.14);
                    dummy.updateMatrix();
                    leftArmsInstanced.setMatrixAt(i, dummy.matrix);

                    const rightRaise = (f.hasPhone || f.hasScarf) ? 0.38 : armRaise;
                    dummy.position.set(f.x + 0.27 * cosR, f.y + 0.36 + bounce + rightRaise, f.z - 0.27 * sinR);
                    dummy.rotation.set((f.hasPhone || wave > 0.3 || f.hasScarf) ? -2.45 : 0, f.rotY, -0.14);
                    dummy.updateMatrix();
                    rightArmsInstanced.setMatrixAt(i, dummy.matrix);
                }
                torsosInstanced.instanceMatrix.needsUpdate = true;
                headsInstanced.instanceMatrix.needsUpdate = true;
                hairsInstanced.instanceMatrix.needsUpdate = true;
                leftArmsInstanced.instanceMatrix.needsUpdate = true;
                rightArmsInstanced.instanceMatrix.needsUpdate = true;

                for (let i = 0; i < scarfFans.length; i++) {
                    const f = scarfFans[i];
                    const wave = Math.sin(t * 4.2 + f.phase);
                    const bounce = Math.max(0, wave) * 0.13;
                    dummy.position.set(f.x, f.y + 1.04 + bounce, f.z);
                    dummy.rotation.set(0, f.rotY, Math.sin(t * 6 + f.phase) * 0.08);
                    dummy.scale.set(1, 1, 1);
                    dummy.updateMatrix();
                    scarfsInstanced.setMatrixAt(i, dummy.matrix);
                }
                scarfsInstanced.instanceMatrix.needsUpdate = true;
            }

            if (phonesInstanced.visible) {
                for (let i = 0; i < phonePositions.length; i++) {
                    const p = phonePositions[i];
                    const flash = Math.sin(t * 10 + p.phase) > 0.9 ? 1.9 : 1.0;
                    dummy.position.set(p.x, p.y, p.z);
                    dummy.lookAt(0, 1.2, 0);
                    dummy.scale.setScalar(flash);
                    dummy.updateMatrix();
                    phonesInstanced.setMatrixAt(i, dummy.matrix);
                }
                phonesInstanced.instanceMatrix.needsUpdate = true;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        requestAnimationFrame(animate);
    </script>

                    joinedAt: localStorage.getItem('first_played_date'),
                    kit: {
                        jersey: localStorage.getItem('eq_jerseys') || 'j1',
                        shorts: localStorage.getItem('eq_shorts') || 's1',
                        boots: localStorage.getItem('eq_boots') || 'b1',
                        hair: localStorage.getItem('eq_hair') || 'h1',
                        number: localStorage.getItem('eq_number') || '10',
                        numColor: localStorage.getItem('eq_numColor') || '#ffffff'
                    },
                    updatedAt: Date.now()
                }
            };

            const xhr = new XMLHttpRequest();
            xhr.open('PATCH', `${FIREBASE_DB_URL}/players.json`, true);
            xhr.send(JSON.stringify(payload));
        })();
    </script>
</body>
</html>
