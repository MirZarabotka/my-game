<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Penalty Master 3D — Головна</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
        body {
            overflow: hidden;
            background: radial-gradient(circle at 50% 35%, #1e40af 0%, #0f172a 70%, #020617 100%);
            color: #ffffff;
        }
        #canvas-container { width: 100vw; height: 100vh; display: block; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }

        .ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 32px 24px;
        }

        .header { text-align: center; }
        .header h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(to right, #ffffff, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
        }

        .menu-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            pointer-events: auto;
            padding-bottom: 12px;
        }

        .btn {
            text-decoration: none;
            border: none;
            padding: 16px 40px;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 1px;
            border-radius: 50px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-play {
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.45);
        }
        .btn-play:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px rgba(34, 197, 94, 0.65);
        }

        .btn-shop {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            color: #f8fafc;
            border: 2px solid rgba(56, 189, 248, 0.5);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }
        .btn-shop:hover {
            transform: translateY(-3px);
            border-color: #38bdf8;
            background: rgba(30, 41, 59, 0.95);
        }

        #loader-screen {
            position: absolute;
            inset: 0;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            transition: opacity 0.4s;
        }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 540px) {
            .menu-actions { flex-direction: column; width: 100%; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="loader-screen">
        <div class="spinner"></div>
        <div id="loader-text">Завантаження гравця...</div>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <div class="header">
            <h1>PENALTY MASTER 3D</h1>
        </div>

        <div class="menu-actions">
            <a href="shop.html" class="btn btn-shop">👕 ПРИМІРОЧНА</a>
            <button class="btn btn-play" id="start-btn">ГРАТИ ⚽</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "./libs/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from './libs/GLTFLoader.js';
        import { DRACOLoader } from './libs/DRACOLoader.js';
        import { OrbitControls } from './libs/OrbitControls.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.25, 3.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.1));

        const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
        keyLight.position.set(3, 6, 4);
        keyLight.castShadow = true;
        scene.add(keyLight);

        const rimLight = new THREE.DirectionalLight(0x38bdf8, 1.3);
        rimLight.position.set(-3, 4, -4);
        scene.add(rimLight);

        const turf = new THREE.Mesh(
            new THREE.CylinderGeometry(1.15, 1.25, 0.12, 48),
            new THREE.MeshStandardMaterial({ color: 0x166534, roughness: 0.85 })
        );
        turf.position.y = -0.06;
        turf.receiveShadow = true;
        scene.add(turf);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enablePan = false;
        controls.minDistance = 2.0;
        controls.maxDistance = 4.5;
        controls.maxPolarAngle = Math.PI / 2 + 0.05;
        controls.target.set(0, 0.95, 0);
        controls.update();

        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('./libs/');

        const loader = new GLTFLoader();
        loader.setDRACOLoader(dracoLoader);

        let mixer;

        loader.load(
            'player.glb',
            (gltf) => {
                const playerModel = gltf.scene;
                const savedKit = localStorage.getItem('kitColor');
                const savedBoots = localStorage.getItem('bootsColor');

                playerModel.traverse((child) => {
                    if (child.isMesh && child.material) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        const name = child.name.toLowerCase();

                        if (savedBoots && name.includes('shoe')) {
                            child.material.color.set(savedBoots);
                        } else if (savedKit && !name.includes('shoe') && !name.includes('hair') && !name.includes('eye')) {
                            child.material.color.set(savedKit);
                        }
                    }
                });

                scene.add(playerModel);

                const firstAnim = gltf.animations.at(0);
                if (firstAnim) {
                    mixer = new THREE.AnimationMixer(playerModel);
                    mixer.clipAction(firstAnim).play();
                }

                const loaderScreen = document.getElementById('loader-screen');
                loaderScreen.style.opacity = '0';
                setTimeout(() => loaderScreen.style.display = 'none', 400);
            },
            undefined,
            (error) => {
                document.getElementById('loader-text').innerText = 'Помилка завантаження player.glb!';
                console.error(error);
            }
        );

        document.getElementById('start-btn').addEventListener('click', () => {
            alert('Перехід у матч! Далі створимо сцену зі стадіоном і ударом пенальті ⚽');
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            if (mixer) mixer.update(clock.getDelta());
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
