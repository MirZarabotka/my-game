<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Penalty Stadium</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:sans-serif;background:#070b14;color:#fff;margin:0;padding:8px;display:flex;flex-direction:column;height:100vh;user-select:none;overflow:hidden}
.tabs{display:flex;gap:6px;margin-bottom:6px;flex-shrink:0}
.tab{flex:1;padding:8px;background:#131b26;border:1px solid #243347;color:#8395a7;border-radius:10px;font-weight:bold;cursor:pointer}
.tab.act{background:#1dd1a1;color:#000;border-color:#1dd1a1}
.box{background:#131b26;border:1px solid #243347;border-radius:12px;padding:7px 12px;margin-bottom:6px;flex-shrink:0}
.row{display:flex;justify-content:space-between;align-items:center}
.bar{width:100%;height:5px;background:#1e2b3c;border-radius:4px;overflow:hidden;margin:4px 0}
.fill{height:100%;background:#1dd1a1;transition:width .3s}
.stgs{display:flex;justify-content:space-between;font-size:10px;font-weight:bold;color:#576574;margin-top:2px}
.stgs .act{color:#feca57;text-decoration:underline}.stgs .done{color:#1dd1a1}
.arena{flex:1;min-height:0;position:relative;border-radius:14px;overflow:hidden;border:2px solid #243347;margin-bottom:8px;background:#070b14}
#c3d{width:100%;height:100%;display:block}
.hud-top{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;background:rgba(7,11,20,.78);padding:6px 12px;border-radius:10px;font-size:12px;pointer-events:none}
.msg{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(7,11,20,.92);padding:7px 14px;border-radius:16px;font-weight:bold;font-size:13px;border:1px solid #feca57;text-align:center;white-space:nowrap}
.ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex-shrink:0}
.btn{background:#182230;border:2px solid #3c4f66;color:#fff;padding:12px 4px;border-radius:12px;font-weight:bold;font-size:13px;cursor:pointer}
.btn:active{transform:scale(.95)}.btn:disabled{opacity:.4}
.full{grid-column:span 3;border:none;font-size:14px;padding:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow-y:auto;padding-bottom:10px}
.card{background:#131b26;border:1px solid #243347;border-radius:12px;padding:10px;text-align:center}
.card.eq{border-color:#1dd1a1;background:rgba(29,209,161,.08)}
.sbtn{width:100%;padding:8px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;background:#feca57;color:#000;margin-top:6px}
.sbtn.wear{background:#1dd1a1}.sbtn:disabled{background:#1e2b3c;color:#576574}
</style>
</head>
<body>
<div class="tabs">
  <button class="tab act" id="t1" onclick="tab(1)">⚽ 3D Кубок</button>
  <button class="tab" id="t2" onclick="tab(2)">🛍 Магазин</button>
</div>
<div class="box">
  <div class="row"><b style="color:#feca57">Рівень <span id="lv">1</span> • 🏆 <span id="cp">0</span></b><b style="color:#feca57">💰 <span id="cn">20</span></b></div>
  <div class="bar"><div class="fill" id="xb"></div></div>
  <div class="row" style="font-size:11px;color:#8395a7"><span>XP: <span id="pt">0</span>/<span id="nx">100</span></span><span id="op" style="color:#ff9ff3">1/32: ФК Двір</span></div>
  <div class="stgs" id="sb"><span>1/32</span><span>1/16</span><span>1/8</span><span>1/4</span><span>1/2</span><span>ФІНАЛ</span></div>
</div>
<div id="gScr" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <div class="arena" id="ar">
    <div class="hud-top">
      <span>Ти: <span id="pd">⚪⚪⚪⚪⚪</span></span>
      <b style="color:#feca57;font-size:15px"><span id="ps">0</span> : <span id="bs">0</span></b>
      <span>Бот: <span id="bd">⚪⚪⚪⚪⚪</span></span>
    </div>
    <canvas id="c3d"></canvas>
    <div class="msg" id="ms">⚽ Твій удар! Вибери кут</div>
  </div>
  <div class="ctrl" id="ct"></div>
</div>
<div id="sScr" class="grid" style="display:none"></div>
<script>
try{window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}catch(e){}
const ST=[{n:'1/32',o:'ФК Двір',r:30},{n:'1/16',o:'ФК Район',r:50},{n:'1/8',o:'ФК Місто',r:80},{n:'1/4',o:'ФК Титан',r:120},{n:'1/2',o:'ФК Легенда',r:180},{n:'ФІНАЛ',o:'Чемпіон',r:300}];
const SHOP=[
  {id:'b1',t:'b',n:'Класика',i:'⚽',p:0,bn:0,col:'#ffffff',d:'Білий 3D м’яч'},
  {id:'b2',t:'b',n:'Вогняний',i:'🔥',p:20,bn:5,col:'#ff5e57',d:'+5 💰 за гол (червоний)'},
  {id:'b3',t:'b',n:'Блискавка',i:'⚡',p:60,bn:12,col:'#00d2ff',d:'+12 💰 за гол (неоновий)'},
  {id:'b4',t:'b',n:'Золотий',i:'🏆',p:150,bn:25,col:'#feca57',d:'+25 💰 за гол (золотий)'},
  {id:'k1',t:'k',n:'Базові',i:'🧤',p:0,bn:0,col:'#1dd1a1',d:'Звичайні рукавиці'},
  {id:'k2',t:'k',n:'Кібер-хват',i:'🦾',p:50,bn:10,col:'#ff9ff3',d:'+10 💰 за сейв (рожеві)'}
];
let p={pt:0,lv:1,cp:0,st:0,cn:20,ow:['b1','k1'],eb:'b1',ek:'k1'};
try{const v=JSON.parse(localStorage.getItem('pc_3d8'));if(v)p=Object.assign(p,v)}catch(e){}
let ph='sh',pS=[],bS=[],bz=0,ac=null,ambOn=false,crowdMood=0;
function startAmbience(){
  if(ambOn)return;
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    ambOn=true;
    const buf=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate),ch=buf.getChannelData(0);
    for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1);
    const ns=ac.createBufferSource();ns.buffer=buf;ns.loop=true;
    const flt=ac.createBiquadFilter();flt.type='bandpass';flt.frequency.value=360;flt.Q.value=1.5;
    const gn=ac.createGain();gn.gain.value=0.032;
    ns.connect(flt);flt.connect(gn);gn.connect(ac.destination);ns.start();
    const notes=[261.6,293.6,329.6,293.6,261.6,220.0];let idx=0;
    setInterval(()=>{
      if(!ac||ac.state!=='running')return;
      const now=ac.currentTime,f=notes.at(idx++%notes.length);
      [f,f*1.25].forEach(freq=>{
        const o=ac.createOscillator(),g=ac.createGain(),bf=ac.createBiquadFilter();
        o.type='sawtooth';o.frequency.setValueAtTime(freq,now);
        bf.type='lowpass';bf.frequency.value=480;
        g.gain.setValueAtTime(0.001,now);g.gain.linearRampToValueAtTime(0.014,now+0.25);g.gain.linearRampToValueAtTime(0.001,now+0.95);
        o.connect(bf);bf.connect(g);g.connect(ac.destination);o.start(now);o.stop(now+1.0);
      });
    },1100);
  }catch(e){}
}

function snd(type){
  startAmbience();
  try{
    const now=ac.currentTime,osc=ac.createOscillator(),og=ac.createGain();
    osc.frequency.setValueAtTime(140,now);osc.frequency.exponentialRampToValueAtTime(40,now+0.12);
    og.gain.setValueAtTime(0.45,now);og.gain.exponentialRampToValueAtTime(0.01,now+0.12);
    osc.connect(og);og.connect(ac.destination);osc.start(now);osc.stop(now+0.13);
    const dur=type==='cheer'?1.6:1.1,buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate),ch=buf.getChannelData(0);
    for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*Math.sin(Math.PI*(i/ch.length));
    const src=ac.createBufferSource(),flt=ac.createBiquadFilter(),gn=ac.createGain();
    src.buffer=buf;flt.type='bandpass';flt.Q.value=type==='cheer'?0.9:2.2;
    flt.frequency.setValueAtTime(type==='cheer'?550:520,now+0.1);
    flt.frequency.exponentialRampToValueAtTime(type==='cheer'?1250:190,now+0.1+dur);
    gn.gain.setValueAtTime(type==='cheer'?0.38:0.28,now+0.1);
    gn.gain.exponentialRampToValueAtTime(0.01,now+0.1+dur);
    src.connect(flt);flt.connect(gn);gn.connect(ac.destination);src.start(now+0.1);
  }catch(e){}
}

const ctx=c3d.getContext('2d');let W=300,H=300;
function rsz3D(){const r=ar.getBoundingClientRect();if(r.width>0&&r.height>0){W=c3d.width=r.width;H=c3d.height=r.height}}
window.addEventListener('resize',rsz3D);

function proj(x,y,z){
  const fov=W*0.88,camZ=11.5,camY=11.2,ang=0.72;
  const dz=z+camZ,dy=y-camY;
  const rz=dz*Math.cos(ang)-dy*Math.sin(ang);
  const ry=dz*Math.sin(ang)+dy*Math.cos(ang);
  const sc=fov/(fov+rz*46);
  return{x:W/2+x*46*sc,y:H*0.50-ry*46*sc,s:sc};
}

const SIDE_FANS=Array.from({length:160},(_,i)=>({
  side:i<80?-1:1,row:Math.floor((i%80)/16),idx:i%16,
  shirt:['#ff4757','#feca57','#1e90ff','#ffffff','#2ed573','#ff9ff3'][i%6],ph:Math.random()*6.28
}));

let ball={x:0,y:0.25,z:0,sx:0,sy:0.25,sz:0,tx:0,ty:0.25,tz:0,t:1,active:false};
let gk={x:0,y:0,tx:0,ty:0,dive:0,tdive:0};
let busy=false,tAnim=0;
function save(){try{localStorage.setItem('pc_3d8',JSON.stringify(p))}catch(e){}}
function getItem(id){return SHOP.find(x=>x.id===id)||SHOP[0]}

function tab(n){
  t1.className=n===1?'tab act':'tab';
  t2.className=n===2?'tab act':'tab';
  gScr.style.display=n===1?'flex':'none';
  sScr.style.display=n===2?'grid':'none';
  if(n===2)renderShop();else rsz3D();
}

function updUI(){
  lv.textContent=p.lv;cp.textContent=p.cp;cn.textContent=p.cn;
  const nxXp=p.lv*100;
  pt.textContent=p.pt;nx.textContent=nxXp;
  xb.style.width=Math.min(100,(p.pt/nxXp)*100)+'%';
  const cur=ST[p.st]||ST[0];
  op.textContent=`${cur.n}: ${cur.o}`;
  Array.from(sb.children).forEach((el,i)=>{el.className=i<p.st?'done':(i===p.st?'act':'')});
  pd.textContent=Array.from({length:5},(_,i)=>pS[i]===1?'🟢':(pS[i]===0?'🔴':'⚪')).join('');
  bd.textContent=Array.from({length:5},(_,i)=>bS[i]===1?'🟢':(bS[i]===0?'🔴':'⚪')).join('');
  ps.textContent=pS.filter(x=>x===1).length;
  bs.textContent=bS.filter(x=>x===1).length;
}

function renderCtrl(){
  ct.innerHTML='';
  if(ph==='over'){
    const won=pS.filter(x=>x===1).length>bS.filter(x=>x===1).length;
    ct.innerHTML=`<button class="btn full" style="background:${won?'#1dd1a1':'#ff5e57'};color:#000" onclick="nextMatch(${won})">${won?'🏆 Наступний етап':'🔄 Спробувати ще раз'}</button>`;
    return;
  }
  const zones=[
    {z:0,l:'↖️ Лів. Верх'},{z:1,l:'⬆️ Центр Верх'},{z:2,l:'↗️ Прав. Верх'},
    {z:3,l:'↙️ Лів. Низ'},{z:4,l:'⬇️ Центр Низ'},{z:5,l:'↘️ Прав. Низ'}
  ];
  zones.forEach(item=>{
    const b=document.createElement('button');
    b.className='btn';b.textContent=item.l;b.disabled=busy;
    b.onclick=()=>act(item.z);ct.appendChild(b);
  });
}

function zoneCoords(z){
  const col=(z%3)-1,row=z<3?1:0;
  return{x:col*2.15,y:row===1?1.85:0.42,dive:col};
}

function resetPositions(){
  ball={x:0,y:0.25,z:0,sx:0,sy:0.25,sz:0,tx:0,ty:0.25,tz:0,t:1,active:false};
  gk={x:0,y:0,tx:0,ty:0,dive:0,tdive:0};
}

function act(z){
  if(busy)return;
  busy=true;renderCtrl();
  const isPlayerShoot=(ph==='sh'),botZ=Math.floor(Math.random()*6);
  const shotZ=isPlayerShoot?z:botZ,saveZ=isPlayerShoot?botZ:z;
  const sc=zoneCoords(shotZ),kc=zoneCoords(saveZ);

  ball={x:0,y:0.25,z:0,sx:0,sy:0.25,sz:0,tx:sc.x,ty:sc.y,tz:8.5,t:0,active:true};
  gk.tx=kc.x*0.85;gk.ty=kc.y>1?0.55:0.1;gk.tdive=kc.dive;
  snd('kick');

  setTimeout(()=>{
    const isGoal=(shotZ!==saveZ);
    if(isPlayerShoot){
      pS.push(isGoal?1:0);
      if(isGoal){
        const winCoins=10+getItem(p.eb).bn;
        p.cn+=winCoins;p.pt+=25;crowdMood=1;snd('cheer');
        ms.textContent=`⚽ ГОЛ! +${winCoins} 💰`;ms.style.borderColor='#1dd1a1';
      }else{
        crowdMood=-1;snd('boo');ms.textContent='🧤 Воротар потягнув!';ms.style.borderColor='#ff5e57';
      }
    }else{
      bS.push(isGoal?1:0);
      if(isGoal){
        crowdMood=-1;snd('boo');ms.textContent='❌ Бот забив гол!';ms.style.borderColor='#ff5e57';
      }else{
        const saveCoins=5+getItem(p.ek).bn;
        p.cn+=saveCoins;p.pt+=20;crowdMood=1;snd('cheer');
        ms.textContent=`🧤 СЕЙВ! +${saveCoins} 💰`;ms.style.borderColor='#1dd1a1';
      }
    }
    if(p.pt>=p.lv*100){p.pt-=p.lv*100;p.lv++;}
    save();updUI();
    setTimeout(()=>{crowdMood=0;checkSeries();},1100);
  },650);
}

function checkSeries(){
  const pGoals=pS.filter(x=>x===1).length,bGoals=bS.filter(x=>x===1).length;
  const pRem=5-pS.length,bRem=5-bS.length;
  const earlyWin=(pGoals>bGoals+bRem)||(bGoals>pGoals+pRem);
  const fiveDone=(pS.length>=5&&bS.length>=5&&pGoals!==bGoals);

  if(earlyWin||fiveDone){
    ph='over';busy=false;
    const won=pGoals>bGoals;
    if(won){
      const reward=ST[p.st].r;
      p.cn+=reward;p.pt+=60;if(p.st===5)p.cp++;
      ms.textContent=`🏆 ПЕРЕМОГА! Нагорода +${reward} 💰`;ms.style.borderColor='#feca57';
    }else{
      ms.textContent='💔 Поразка в серії пенальті';ms.style.borderColor='#ff5e57';
    }
    if(p.pt>=p.lv*100){p.pt-=p.lv*100;p.lv++;}
    save();updUI();renderCtrl();return;
  }

  ph=(ph==='sh')?'sv':'sh';
  resetPositions();busy=false;
  ms.style.borderColor='#feca57';
  ms.textContent=ph==='sh'?'⚽ Твій удар! Вибери кут':'🧤 Твій сейв! Вгадай кут';
  renderCtrl();
}

function nextMatch(won){
  if(won)p.st=(p.st+1)%ST.length;
  pS=[];bS=[];ph='sh';resetPositions();updUI();renderCtrl();
  ms.style.borderColor='#feca57';ms.textContent='⚽ Твій удар! Вибери кут';
}

function renderShop(){
  sScr.innerHTML='';
  SHOP.forEach(item=>{
    const owned=p.ow.includes(item.id),eq=(p.eb===item.id||p.ek===item.id);
    const d=document.createElement('div');
    d.className=eq?'card eq':'card';
    d.innerHTML=`<div style="font-size:28px">${item.i}</div><div style="font-weight:bold;margin:4px 0;color:${item.col}">${item.n}</div><div style="font-size:11px;color:#8395a7;min-height:28px">${item.d}</div><button class="sbtn ${owned?'wear':''}" ${(!owned&&p.cn<item.p)?'disabled':''} onclick="buyOrWear('${item.id}')">${eq?'✅ Одягнено':(owned?'Одягнути':`Купити (${item.p} 💰)`)}</button>`;
    sScr.appendChild(d);
  });
}

function buyOrWear(id){
  const item=getItem(id);
  if(!p.ow.includes(id)){if(p.cn<item.p)return;p.cn-=item.p;p.ow.push(id);}
  if(item.t==='b')p.eb=id;else p.ek=id;
  save();updUI();renderShop();
}
function draw3D(){
  tAnim+=0.06;
  ctx.clearRect(0,0,W,H);

  const sky=ctx.createLinearGradient(0,0,0,H*0.45);
  sky.addColorStop(0,'#050811');sky.addColorStop(1,'#132238');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  [W*0.18,W*0.82].forEach(lx=>{
    const gl=ctx.createRadialGradient(lx,H*0.12,4,lx,H*0.12,W*0.35);
    gl.addColorStop(0,'rgba(255,255,255,0.22)');gl.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gl;ctx.fillRect(0,0,W,H*0.6);
  });

  for(let z=-2;z<12;z+=1.4){
    const p1=proj(-8,0,z),p2=proj(8,0,z),p3=proj(8,0,z+1.4),p4=proj(-8,0,z+1.4);
    ctx.fillStyle=(Math.floor(z*10)%2===0)?'#145a32':'#196f3d';
    ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.lineTo(p3.x,p3.y);ctx.lineTo(p4.x,p4.y);ctx.closePath();ctx.fill();
  }

  SIDE_FANS.forEach(f=>{
    const fz=-1+f.idx*0.75,fx=f.side*(4.6+f.row*0.55);
    const jump=crowdMood===1?Math.abs(Math.sin(tAnim*2.5+f.ph))*0.28:Math.sin(tAnim+f.ph)*0.04;
    const fy=0.3+f.row*0.45+jump,pt=proj(fx,fy,fz);
    if(pt.s>0){
      ctx.fillStyle=f.shirt;
      ctx.beginPath();ctx.arc(pt.x,pt.y,Math.max(2,4.5*pt.s),0,Math.PI*2);ctx.fill();
    }
  });

  ctx.strokeStyle='rgba(255,255,255,0.65)';ctx.lineWidth=2;
  const b1=proj(-4.5,0,8.5),b2=proj(-4.5,0,4.2),b3=proj(4.5,0,4.2),b4=proj(4.5,0,8.5);
  ctx.beginPath();ctx.moveTo(b1.x,b1.y);ctx.lineTo(b2.x,b2.y);ctx.lineTo(b3.x,b3.y);ctx.lineTo(b4.x,b4.y);ctx.stroke();
  const spot=proj(0,0,0);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(spot.x,spot.y,5*spot.s,2.5*spot.s,0,0,Math.PI*2);ctx.fill();

  const gw=2.8,gh=2.3,gz=8.5,gd=1.2;
  const gFL=proj(-gw,0,gz),gTL=proj(-gw,gh,gz),gTR=proj(gw,gh,gz),gFR=proj(gw,0,gz);
  const gBL=proj(-gw,0,gz+gd),gBTL=proj(-gw,gh*0.85,gz+gd),gBTR=proj(gw,gh*0.85,gz+gd),gBR=proj(gw,0,gz+gd);

  ctx.strokeStyle='rgba(255,255,255,0.22)';ctx.lineWidth=1;
  for(let i=0;i<=8;i++){
    const t=i/8,top1=proj(-gw+gw*2*t,gh,gz),top2=proj(-gw+gw*2*t,gh*0.85,gz+gd),bot2=proj(-gw+gw*2*t,0,gz+gd);
    ctx.beginPath();ctx.moveTo(top1.x,top1.y);ctx.lineTo(top2.x,top2.y);ctx.lineTo(bot2.x,bot2.y);ctx.stroke();
  }
  ctx.beginPath();ctx.moveTo(gBL.x,gBL.y);ctx.lineTo(gBTL.x,gBTL.y);ctx.lineTo(gBTR.x,gBTR.y);ctx.lineTo(gBR.x,gBR.y);ctx.stroke();

  ctx.strokeStyle='#ffffff';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(gFL.x,gFL.y);ctx.lineTo(gTL.x,gTL.y);ctx.lineTo(gTR.x,gTR.y);ctx.lineTo(gFR.x,gFR.y);ctx.stroke();

  gk.x+=(gk.tx-gk.x)*0.18;gk.y+=(gk.ty-gk.y)*0.18;gk.dive+=(gk.tdive-gk.dive)*0.18;

  const gp=proj(gk.x,gk.y,gz-0.15),gSh=proj(gk.x,0,gz-0.15);
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath();ctx.ellipse(gSh.x,gSh.y,18*gSh.s,6*gSh.s,0,0,Math.PI*2);ctx.fill();

  ctx.save();ctx.translate(gp.x,gp.y-22*gp.s);ctx.rotate(gk.dive*0.85);
  const kCol=getItem(p.ek).col;
  ctx.fillStyle='#ff9f43';ctx.fillRect(-10*gp.s,-16*gp.s,20*gp.s,28*gp.s);
  ctx.fillStyle='#feca57';ctx.beginPath();ctx.arc(0,-23*gp.s,7*gp.s,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=kCol;ctx.beginPath();ctx.arc(-16*gp.s,-10*gp.s,6*gp.s,0,Math.PI*2);ctx.arc(16*gp.s,-10*gp.s,6*gp.s,0,Math.PI*2);ctx.fill();
  ctx.restore();

  if(ball.active&&ball.t<1){
    ball.t=Math.min(1,ball.t+0.048);
    const ease=1-Math.pow(1-ball.t,2);
    const curveX=Math.sin(ball.t*Math.PI)*(ball.tx*0.22);
    const arcY=Math.sin(ball.t*Math.PI)*0.65;
    ball.x=ball.sx+(ball.tx-ball.sx)*ease+curveX;
    ball.y=ball.sy+(ball.ty-ball.sy)*ease+arcY;
    ball.z=ball.sz+(ball.tz-ball.sz)*ease;
  }

  const bSh=proj(ball.x,0,ball.z);
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.beginPath();ctx.ellipse(bSh.x,bSh.y,11*bSh.s,4.5*bSh.s,0,0,Math.PI*2);ctx.fill();

  const bp=proj(ball.x,ball.y,ball.z),rad=Math.max(4,11*bp.s),bCol=getItem(p.eb).col;
  const bGrad=ctx.createRadialGradient(bp.x-rad*0.3,bp.y-rad*0.3,rad*0.1,bp.x,bp.y,rad);
  bGrad.addColorStop(0,'#ffffff');bGrad.addColorStop(0.55,bCol);bGrad.addColorStop(1,'#1e272e');
  ctx.fillStyle=bGrad;ctx.beginPath();ctx.arc(bp.x,bp.y,rad,0,Math.PI*2);ctx.fill();

  requestAnimationFrame(draw3D);
}

rsz3D();updUI();renderCtrl();draw3D();
