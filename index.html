<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Penalty Stadium</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:sans-serif;background:#070b14;color:#fff;margin:0;padding:8px;display:flex;flex-direction:column;height:100vh;user-select:none;overflow:hidden}
.tabs{display:flex;gap:6px;margin-bottom:6px;flex-shrink:0}
.tab{flex:1;padding:8px;background:#131b26;border:1px solid #243347;color:#8395a7;border-radius:10px;font-weight:bold;cursor:pointer}
.tab.act{background:#1dd1a1;color:#000;border-color:#1dd1a1}
.box{background:#131b26;border:1px solid #243347;border-radius:12px;padding:7px 12px;margin-bottom:6px;flex-shrink:0}
.row{display:flex;justify-content:space-between;align-items:center}
.bar{width:100%;height:5px;background:#1e2b3c;border-radius:4px;overflow:hidden;margin:4px 0}
.fill{height:100%;background:#1dd1a1;transition:width .3s}
.stgs{display:flex;justify-content:space-between;font-size:10px;font-weight:bold;color:#576574;margin-top:2px}
.stgs .act{color:#feca57;text-decoration:underline}.stgs .done{color:#1dd1a1}
.arena{flex:1;min-height:0;position:relative;border-radius:14px;overflow:hidden;border:2px solid #243347;margin-bottom:8px;background:#070b14}
#c3d{width:100%;height:100%;display:block}
.hud-top{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;background:rgba(7,11,20,.78);padding:6px 12px;border-radius:10px;font-size:12px;pointer-events:none}
.msg{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(7,11,20,.92);padding:7px 14px;border-radius:16px;font-weight:bold;font-size:13px;border:1px solid #feca57;text-align:center;white-space:nowrap}
.ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex-shrink:0}
.btn{background:#182230;border:2px solid #3c4f66;color:#fff;padding:12px 4px;border-radius:12px;font-weight:bold;font-size:13px;cursor:pointer}
.btn:active{transform:scale(.95)}.btn:disabled{opacity:.4}
.full{grid-column:span 3;border:none;font-size:14px;padding:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow-y:auto;padding-bottom:10px}
.card{background:#131b26;border:1px solid #243347;border-radius:12px;padding:10px;text-align:center}
.card.eq{border-color:#1dd1a1;background:rgba(29,209,161,.08)}
.sbtn{width:100%;padding:8px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;background:#feca57;color:#000;margin-top:6px}
.sbtn.wear{background:#1dd1a1}.sbtn:disabled{background:#1e2b3c;color:#576574}
</style>
</head>
<body>
<div class="tabs">
  <button class="tab act" id="t1" onclick="tab(1)">⚽ 3D Кубок</button>
  <button class="tab" id="t2" onclick="tab(2)">🛍 Магазин</button>
</div>
<div class="box">
  <div class="row"><b style="color:#feca57">Рівень <span id="lv">1</span> • 🏆 <span id="cp">0</span></b><b style="color:#feca57">💰 <span id="cn">20</span></b></div>
  <div class="bar"><div class="fill" id="xb"></div></div>
  <div class="row" style="font-size:11px;color:#8395a7"><span>XP: <span id="pt">0</span>/<span id="nx">100</span></span><span id="op" style="color:#ff9ff3">1/32: ФК Двір</span></div>
  <div class="stgs" id="sb"><span>1/32</span><span>1/16</span><span>1/8</span><span>1/4</span><span>1/2</span><span>ФІНАЛ</span></div>
</div>
<div id="gScr" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <div class="arena" id="ar">
    <div class="hud-top">
      <span>Ти: <span id="pd">⚪⚪⚪⚪⚪</span></span>
      <b style="color:#feca57;font-size:15px"><span id="ps">0</span> : <span id="bs">0</span></b>
      <span>Бот: <span id="bd">⚪⚪⚪⚪⚪</span></span>
    </div>
    <canvas id="c3d"></canvas>
    <div class="msg" id="ms">⚽ Твій удар! Вибери кут</div>
  </div>
  <div class="ctrl" id="ct"></div>
</div>
<div id="sScr" class="grid" style="display:none"></div>
<script>
try{window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}catch(e){}
const ST=[{n:'1/32',o:'ФК Двір',r:30},{n:'1/16',o:'ФК Район',r:50},{n:'1/8',o:'ФК Місто',r:80},{n:'1/4',o:'ФК Титан',r:120},{n:'1/2',o:'ФК Легенда',r:180},{n:'ФІНАЛ',o:'Чемпіон',r:300}];
const SHOP=[
  {id:'b1',t:'b',n:'Класика',i:'⚽',p:0,bn:0,col:'#ffffff',d:'Білий 3D м’яч'},
  {id:'b2',t:'b',n:'Вогняний',i:'🔥',p:20,bn:5,col:'#ff5e57',d:'+5 💰 за гол (червоний)'},
  {id:'b3',t:'b',n:'Блискавка',i:'⚡',p:60,bn:12,col:'#00d2ff',d:'+12 💰 за гол (неоновий)'},
  {id:'b4',t:'b',n:'Золотий',i:'🏆',p:150,bn:25,col:'#feca57',d:'+25 💰 за гол (золотий)'},
  {id:'k1',t:'k',n:'Базові',i:'🧤',p:0,bn:0,col:'#1dd1a1',d:'Звичайні рукавиці'},
  {id:'k2',t:'k',n:'Кібер-хват',i:'🦾',p:50,bn:10,col:'#ff9ff3',d:'+10 💰 за сейв (рожеві)'}
];
let p={pt:0,lv:1,cp:0,st:0,cn:20,ow:['b1','k1'],eb:'b1',ek:'k1'};
try{const v=JSON.parse(localStorage.getItem('pc_3d8'));if(v)p=Object.assign(p,v)}catch(e){}
let ph='sh',pS=[],bS=[],bz=0,ac=null,ambOn=false,crowdMood=0;

function startAmbience(){
  if(ambOn)return;
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    ambOn=true;
    const buf=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate),ch=buf.getChannelData(0);
    for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1);
    const ns=ac.createBufferSource();ns.buffer=buf;ns.loop=true;
    const flt=ac.createBiquadFilter();flt.type='bandpass';flt.frequency.value=360;flt.Q.value=1.5;
    const gn=ac.createGain();gn.gain.value=0.032;
    ns.connect(flt);flt.connect(gn);gn.connect(ac.destination);ns.start();
    const notes=[261.6,293.6,329.6,293.6,261.6,220.0];let idx=0;
    setInterval(()=>{
      if(!ac||ac.state!=='running')return;
      const now=ac.currentTime,f=notes.at(idx++%notes.length);
      [f,f*1.25].forEach(freq=>{
        const o=ac.createOscillator(),g=ac.createGain(),bf=ac.createBiquadFilter();
        o.type='sawtooth';o.frequency.setValueAtTime(freq,now);
        bf.type='lowpass';bf.frequency.value=480;
        g.gain.setValueAtTime(0.001,now);g.gain.linearRampToValueAtTime(0.014,now+0.25);g.gain.linearRampToValueAtTime(0.001,now+0.95);
        o.connect(bf);bf.connect(g);g.connect(ac.destination);o.start(now);o.stop(now+1.0);
      });
    },1100);
  }catch(e){}
}

function snd(type){
  startAmbience();
  try{
    const now=ac.currentTime,osc=ac.createOscillator(),og=ac.createGain();
    osc.frequency.setValueAtTime(140,now);osc.frequency.exponentialRampToValueAtTime(40,now+0.12);
    og.gain.setValueAtTime(0.45,now);og.gain.exponentialRampToValueAtTime(0.01,now+0.12);
    osc.connect(og);og.connect(ac.destination);osc.start(now);osc.stop(now+0.13);
    const dur=type==='cheer'?1.6:1.1,buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate),ch=buf.getChannelData(0);
    for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*Math.sin(Math.PI*(i/ch.length));
    const src=ac.createBufferSource(),flt=ac.createBiquadFilter(),gn=ac.createGain();
    src.buffer=buf;flt.type='bandpass';flt.Q.value=type==='cheer'?0.9:2.2;
    flt.frequency.setValueAtTime(type==='cheer'?550:520,now+0.1);
    flt.frequency.exponentialRampToValueAtTime(type==='cheer'?1250:190,now+0.1+dur);
    gn.gain.setValueAtTime(type==='cheer'?0.38:0.28,now+0.1);
    gn.gain.exponentialRampToValueAtTime(0.01,now+0.1+dur);
    src.connect(flt);flt.connect(gn);gn.connect(ac.destination);src.start(now+0.1);
  }catch(e){}
}

const ctx=c3d.getContext('2d');let W=300,H=300;
function rsz3D(){const r=ar.getBoundingClientRect();if(r.width>0&&r.height>0){W=c3d.width=r.width;H=c3d.height=r.height}}
window.addEventListener('resize',rsz3D);

function proj(x,y,z){
  const fov=W*0.88,camZ=11.5,camY=11.2,ang=0.72;
  const dz=z+camZ,dy=y-camY;
  const rz=dz*Math.cos(ang)-dy*Math.sin(ang);
  const ry=dz*Math.sin(ang)+dy*Math.cos(ang);
  const sc=fov/(fov+rz*46);
  return{x:W/2+x*46*sc,y:H*0.50-ry*46*sc,s:sc};
}

// 160 фанатів на 5 ярусах з обох боків стадіону
const SIDE_FANS=Array.from({length:160},(_,i)=>({
  side:i<80?-1:1,
  row:Math.floor((i%80)/16),
  idx:i%16,
  shirt:['#ff4757','#feca57','#1e90ff','#ffffff','#2ed573','#ff9ff3'].at(i%6),
  phase:Math.random()*6.28,
  flag:i%5===0
}));
function drawHuman(x,z,opt){
  const pt=proj(x,0,z),s=pt.s*1.16;
  ctx.save();ctx.translate(pt.x,pt.y);if(opt.rot)ctx.rotate(opt.rot);
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.beginPath();ctx.ellipse(0,0,22*s,8*s,0,0,6.28);ctx.fill();

  const drawLimb=(lx,hipAng,kneeAng)=>{
    ctx.save();ctx.translate(lx*s,-34*s);ctx.rotate(hipAng);
    ctx.fillStyle=opt.shorts;ctx.beginPath();ctx.roundRect(-4.4*s,0,8.8*s,15*s,4.4*s);ctx.fill();
    ctx.translate(0,14*s);ctx.rotate(kneeAng);
    ctx.fillStyle='#e8b88a';ctx.beginPath();ctx.roundRect(-3.6*s,0,7.2*s,8*s,3.6*s);ctx.fill();
    ctx.fillStyle=opt.socks;ctx.beginPath();ctx.roundRect(-3.8*s,6*s,7.6*s,12*s,2*s);ctx.fill();
    ctx.fillStyle='#14161c';ctx.beginPath();ctx.roundRect(-4.5*s,16*s,10*s,5.5*s,2.5*s);ctx.fill();
    ctx.restore();
  };
  const rA=opt.run||0,kA=opt.kick||0;
  drawLimb(-5.8,-rA,Math.max(0,rA*0.7));
  drawLimb(5.8,rA-kA*1.15,Math.max(0,-rA*0.7)+kA*0.45);

  ctx.fillStyle=opt.shorts;ctx.beginPath();ctx.roundRect(-12*s,-41*s,24*s,12*s,5*s);ctx.fill();

  const drawArm=(ax,shAng,elAng)=>{
    ctx.save();ctx.translate(ax*s,-66*s);ctx.rotate(shAng);
    ctx.fillStyle=opt.shirt;ctx.beginPath();ctx.roundRect(-4*s,0,8*s,11*s,4*s);ctx.fill();
    ctx.translate(0,10*s);ctx.rotate(elAng);
    ctx.fillStyle='#e8b88a';ctx.beginPath();ctx.roundRect(-3.2*s,0,6.4*s,12*s,3.2*s);ctx.fill();
    ctx.fillStyle=opt.gloves||'#e8b88a';ctx.beginPath();ctx.arc(0,13*s,opt.gloves?6.2*s:3.8*s,0,6.28);ctx.fill();
    ctx.restore();
  };
  drawArm(-13.8,opt.armL||0.22,-0.25);
  drawArm(13.8,opt.armR||-0.22,0.25);

  ctx.fillStyle=opt.shirt;
  ctx.beginPath();ctx.moveTo(-13.5*s,-68*s);ctx.lineTo(13.5*s,-68*s);ctx.lineTo(10.8*s,-39*s);ctx.lineTo(-10.8*s,-39*s);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.16)';ctx.beginPath();ctx.moveTo(2*s,-68*s);ctx.lineTo(13.5*s,-68*s);ctx.lineTo(10.8*s,-39*s);ctx.lineTo(2*s,-39*s);ctx.closePath();ctx.fill();
  if(opt.num){ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font=`bold ${Math.max(8,Math.round(12*s))}px sans-serif`;ctx.textAlign='center';ctx.fillText(opt.num,0,-49*s)}

  ctx.fillStyle='#d9a066';ctx.fillRect(-3.4*s,-73*s,6.8*s,6*s);
  ctx.fillStyle='#e8b88a';ctx.beginPath();ctx.arc(-9.8*s,-80*s,2.3*s,0,6.28);ctx.arc(9.8*s,-80*s,2.3*s,0,6.28);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-81*s,9*s,10.5*s,0,0,6.28);ctx.fill();
  ctx.fillStyle=opt.hair||'#2c221e';
  if(opt.back){
    ctx.beginPath();ctx.ellipse(0,-82*s,9.5*s,10.2*s,0,0,6.28);ctx.fill();
    ctx.fillStyle='#e8b88a';ctx.fillRect(-5*s,-75*s,10*s,3*s);
  }else{
    ctx.beginPath();ctx.arc(0,-84*s,9.5*s,3.1,6.32);ctx.fill();
    ctx.fillStyle='#1c1c1c';ctx.beginPath();ctx.arc(-3.2*s,-81*s,1.2*s,0,6.28);ctx.arc(3.2*s,-81*s,1.2*s,0,6.28);ctx.fill();
    ctx.strokeStyle='#b57c52';ctx.lineWidth=1.2*s;ctx.beginPath();ctx.moveTo(-2.5*s,-76*s);ctx.lineTo(2.5*s,-76*s);ctx.stroke();
  }
  ctx.restore();
}

let bPos={x:0,y:0.35,z:4.5},bStart={x:0,y:0.35,z:4.5},bEnd={x:0,y:0.35,z:4.5};
let kX=0,kTargetX=0,kRot=0,kTargetRot=0,animT=1,spin=0,plPos={x:-0.9,z:2.5},plLeg=0,plRun=0;

function drawLine3D(x1,z1,x2,z2){
  const a=proj(x1,0,z1),b=proj(x2,0,z2);
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
}

function draw3D(t){
  requestAnimationFrame(draw3D);
  if(gScr.style.display==='none'||W<10)return;
  ctx.clearRect(0,0,W,H);
  const bgSky=ctx.createLinearGradient(0,0,0,H);bgSky.addColorStop(0,'#060a12');bgSky.addColorStop(1,'#0e1726');
  ctx.fillStyle=bgSky;ctx.fillRect(0,0,W,H);

  // Повне футбольне поле
  const f1=proj(-10.5,0,13.5),f2=proj(10.5,0,13.5),f3=proj(10.5,0,-10.5),f4=proj(-10.5,0,-10.5);
  const gGrad=ctx.createLinearGradient(0,f1.y,0,f3.y);gGrad.addColorStop(0,'#134e2c');gGrad.addColorStop(0.5,'#1e824c');gGrad.addColorStop(1,'#27ae60');
  ctx.fillStyle=gGrad;ctx.beginPath();ctx.moveTo(f1.x,f1.y);ctx.lineTo(f2.x,f2.y);ctx.lineTo(f3.x,f3.y);ctx.lineTo(f4.x,f4.y);ctx.closePath();ctx.fill();

  for(let z=-9;z<11;z+=2){
    const s1=proj(-8.5,0,z),s2=proj(8.5,0,z),s3=proj(8.5,0,z+1),s4=proj(-8.5,0,z+1);
    ctx.fillStyle='rgba(255,255,255,0.045)';ctx.beginPath();ctx.moveTo(s1.x,s1.y);ctx.lineTo(s2.x,s2.y);ctx.lineTo(s3.x,s3.y);ctx.lineTo(s4.x,s4.y);ctx.closePath();ctx.fill();
  }

  // Розмітка всього поля
  ctx.strokeStyle='rgba(255,255,255,0.75)';ctx.lineWidth=2;
  drawLine3D(-8.5,11,8.5,11);drawLine3D(8.5,11,8.5,-9);drawLine3D(8.5,-9,-8.5,-9);drawLine3D(-8.5,-9,-8.5,11);
  drawLine3D(-8.5,1,8.5,1);
  ctx.beginPath();
  for(let a=0;a<=32;a++){const ang=a/32*6.28,cp=proj(Math.cos(ang)*2.2,0,1+Math.sin(ang)*2.2);if(a===0)ctx.moveTo(cp.x,cp.y);else ctx.lineTo(cp.x,cp.y)}
  ctx.stroke();
  drawLine3D(-5.8,11,-5.8,6.2);drawLine3D(-5.8,6.2,5.8,6.2);drawLine3D(5.8,6.2,5.8,11);
  drawLine3D(-3.8,11,-3.8,8.8);drawLine3D(-3.8,8.8,3.8,8.8);drawLine3D(3.8,8.8,3.8,11);
  drawLine3D(-5.8,-9,-5.8,-4.5);drawLine3D(-5.8,-4.5,5.8,-4.5);drawLine3D(5.8,-4.5,5.8,-9);
  const sp=proj(0,0,4.5);ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(sp.x,sp.y,5*sp.s,3*sp.s,0,0,6.28);ctx.fill();

  // Великі 5-ярусні бічні трибуни на весь екран по боках
  [-1,1].forEach(side=>{
    const xIn=side*9.5,xOut=side*18.5;
    const b1=proj(xIn,0,13.5),b2=proj(xIn,0,-10.5),t2=proj(xOut,6.2,-10.5),t1=proj(xOut,6.2,13.5);
    const stGrad=ctx.createLinearGradient(b1.x,0,t1.x,0);
    stGrad.addColorStop(0,'#131d2d');stGrad.addColorStop(1,'#090e17');
    ctx.fillStyle=stGrad;ctx.beginPath();ctx.moveTo(b1.x,b1.y);ctx.lineTo(b2.x,b2.y);ctx.lineTo(t2.x,t2.y);ctx.lineTo(t1.x,t1.y);ctx.closePath();ctx.fill();
    // Сходинки ярусів
    ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1.5;
    for(let r=1;r<=5;r++){
      const rx=side*(9.5+r*1.75),ry=r*1.2;
      const l1=proj(rx,ry,13.5),l2=proj(rx,ry,-10.5);
      ctx.beginPath();ctx.moveTo(l1.x,l1.y);ctx.lineTo(l2.x,l2.y);ctx.stroke();
    }
    // Рекламний LED-борт
    const ad1=proj(side*9.2,0,12),ad2=proj(side*9.2,0,-9.8),ad3=proj(side*9.2,0.6,-9.8),ad4=proj(side*9.2,0.6,12);
    ctx.fillStyle='#1e90ff';ctx.beginPath();ctx.moveTo(ad1.x,ad1.y);ctx.lineTo(ad2.x,ad2.y);ctx.lineTo(ad3.x,ad3.y);ctx.lineTo(ad4.x,ad4.y);ctx.closePath();ctx.fill();
  });
  // 160 живих вболівальників на великих трибунах
  SIDE_FANS.forEach(f=>{
    const fx=f.side*(10.3+f.row*1.65),fz=-9.2+f.idx*1.38+(f.row%2)*0.45,fy=0.55+f.row*1.18;
    const jump=Math.abs(Math.sin(t*(crowdMood>0?0.015:0.004)+f.phase))*(crowdMood>0?0.38:0.1);
    const fp=proj(fx,fy+jump,fz),fs=fp.s*1.12;
    ctx.fillStyle=f.shirt;ctx.beginPath();ctx.roundRect(fp.x-5.5*fs,fp.y-13*fs,11*fs,13*fs,3*fs);ctx.fill();
    ctx.fillStyle='#e8b88a';ctx.beginPath();ctx.arc(fp.x,fp.y-17.5*fs,4.2*fs,0,6.28);ctx.fill();
    const wave=Math.sin(t*(crowdMood>0?0.018:0.005)+f.phase)*0.5;
    ctx.strokeStyle=f.shirt;ctx.lineWidth=2.3*fs;
    ctx.beginPath();ctx.moveTo(fp.x-4.5*fs,fp.y-11*fs);ctx.lineTo(fp.x-9*fs,fp.y-(19+wave*5)*fs);
    ctx.moveTo(fp.x+4.5*fs,fp.y-11*fs);ctx.lineTo(fp.x+9*fs,fp.y-(19-wave*5)*fs);ctx.stroke();
    if(f.flag){ctx.fillStyle='#feca57';ctx.fillRect(fp.x+8*fs,fp.y-(26-wave*5)*fs,12*fs,7*fs)}
  });

  // РЕАЛІСТИЧНІ ВЕЛИКІ 3D-ВОРОТА (ширина 7.2, висота 2.45, глибина сітки 2.2)
  const gW=3.55,gH=2.45,gD=2.2;
  const gBL=proj(-gW,0,11),gBR=proj(gW,0,11),gTL=proj(-gW,gH,11),gTR=proj(gW,gH,11);
  const nBL=proj(-gW,0,11+gD),nBR=proj(gW,0,11+gD),nTL=proj(-gW*0.95,gH*0.88,11+gD),nTR=proj(gW*0.95,gH*0.88,11+gD);

  // Тінь воріт та сітки на газоні
  ctx.fillStyle='rgba(0,0,0,0.28)';
  ctx.beginPath();ctx.moveTo(gBL.x,gBL.y);ctx.lineTo(gBR.x,gBR.y);ctx.lineTo(nBR.x,nBR.y);ctx.lineTo(nBL.x,nBL.y);ctx.closePath();ctx.fill();

  // Напівпрозора об'ємна сітка воріт (задня, верхня та бічні стінки)
  ctx.fillStyle='rgba(255,255,255,0.06)';
  ctx.beginPath();ctx.moveTo(gBL.x,gBL.y);ctx.lineTo(gTL.x,gTL.y);ctx.lineTo(nTL.x,nTL.y);ctx.lineTo(nBL.x,nBL.y);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(gBR.x,gBR.y);ctx.lineTo(gTR.x,gTR.y);ctx.lineTo(nTR.x,nTR.y);ctx.lineTo(nBR.x,nBR.y);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(nBL.x,nBL.y);ctx.lineTo(nBR.x,nBR.y);ctx.lineTo(nTR.x,nTR.y);ctx.lineTo(nTL.x,nTL.y);ctx.closePath();ctx.fill();

  // Осередки сітки (вертикальні та горизонтальні нитки)
  ctx.strokeStyle='rgba(255,255,255,0.34)';ctx.lineWidth=1;
  for(let i=0;i<=14;i++){
    const f=i/14,xTop=gTL.x+(gTR.x-gTL.x)*f,xBack=nTL.x+(nTR.x-nTL.x)*f,xBot=nBL.x+(nBR.x-nBL.x)*f;
    ctx.beginPath();ctx.moveTo(xTop,gTL.y);ctx.lineTo(xBack,nTL.y);ctx.lineTo(xBot,nBL.y);ctx.stroke();
  }
  for(let r=1;r<=5;r++){
    const f=r/5;
    const ySideL=gTL.y+(gBL.y-gTL.y)*f,yBackL=nTL.y+(nBL.y-nTL.y)*f;
    const ySideR=gTR.y+(gBR.y-gTR.y)*f,yBackR=nTR.y+(nBR.y-nTR.y)*f;
    ctx.beginPath();ctx.moveTo(gBL.x,ySideL);ctx.lineTo(nBL.x,yBackL);ctx.lineTo(nBR.x,yBackR);ctx.lineTo(gBR.x,ySideR);ctx.stroke();
  }
  // Задні розтяжки сітки
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(gTL.x,gTL.y);ctx.lineTo(nTL.x,nTL.y);ctx.lineTo(nBL.x,nBL.y);
  ctx.moveTo(gTR.x,gTR.y);ctx.lineTo(nTR.x,nTR.y);ctx.lineTo(nBR.x,nBR.y);ctx.stroke();

  // Головний каркас воріт (товсті білі штанги та перекладина з об'ємом)
  ctx.strokeStyle='#dfe4ea';ctx.lineWidth=7.5;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(gBL.x,gBL.y);ctx.lineTo(gTL.x,gTL.y);ctx.lineTo(gTR.x,gTR.y);ctx.lineTo(gBR.x,gBR.y);ctx.stroke();
  ctx.strokeStyle='#ffffff';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(gBL.x,gBL.y);ctx.lineTo(gTL.x,gTL.y);ctx.lineTo(gTR.x,gTR.y);ctx.lineTo(gBR.x,gBR.y);ctx.stroke();

  if(animT<1){
    animT=Math.min(1,animT+0.036);
    if(animT<0.32){
      const rt=animT/0.32;
      plPos.x=-0.9+0.68*rt;plPos.z=2.5+1.65*rt;
      plRun=Math.sin(rt*12)*0.48;plLeg=rt>0.75?(rt-0.75)*4:0;
    }else{
      const bt=(animT-0.32)/0.68;
      plLeg=Math.max(0,1-(bt*3));
      bPos.x=bStart.x+(bEnd.x-bStart.x)*bt;bPos.z=bStart.z+(bEnd.z-bStart.z)*bt;
      bPos.y=bStart.y+(bEnd.y-bStart.y)*bt+Math.sin(bt*Math.PI)*1.25;spin+=0.38;
    }
  }else if(kTargetX===0){kTargetX=Math.sin(t*0.005)*0.45}
  kX+=(kTargetX-kX)*0.18;kRot+=(kTargetRot-kRot)*0.18;

  const isMe=ph==='sh'||(bz&&pS.length>bS.length);
  drawHuman(kX,10.8,{shirt:isMe?'#2ed573':'#ffa502',shorts:'#1e272e',socks:'#fff',gloves:getIt(p.ek).col,rot:kRot,armL:Math.abs(kRot)>0.1?2.4:0.35,armR:Math.abs(kRot)>0.1?-2.4:-0.35,hair:'#3d2b1f'});

  const sh=proj(bPos.x,0,bPos.z),bp=proj(bPos.x,bPos.y,bPos.z),rad=16*bp.s;
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.beginPath();ctx.ellipse(sh.x,sh.y,rad,rad*0.55,0,0,6.28);ctx.fill();
  const bCol=getIt(p.eb).col,bg=ctx.createRadialGradient(bp.x-rad*0.3,bp.y-rad*0.3,rad*0.1,bp.x,bp.y,rad);
  bg.addColorStop(0,'#ffffff');bg.addColorStop(0.6,bCol);bg.addColorStop(1,'#111111');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(bp.x,bp.y,rad,0,6.28);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(bp.x,bp.y,rad*0.6,spin,spin+2.2);ctx.stroke();

  drawHuman(plPos.x,plPos.z,{shirt:isMe?'#ff4757':'#1e90ff',shorts:isMe?'#fff':'#1e272e',socks:isMe?'#ff4757':'#1e90ff',num:isMe?'10':'9',back:true,run:plRun,kick:plLeg,armL:0.35-plRun*0.5,armR:-0.35+plRun*0.5,hair:isMe?'#2c221e':'#d4a359'});

  [-0.85,0.85].forEach(sx=>{
    const lx=W/2+sx*W*0.44,ly=H*0.08;
    const lg=ctx.createRadialGradient(lx,ly,2,lx,ly,W*0.22);lg.addColorStop(0,'rgba(255,255,255,0.45)');lg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=lg;ctx.beginPath();ctx.arc(lx,ly,W*0.22,0,6.28);ctx.fill();
  });
}

const nx=()=>p.lv*100,getIt=id=>SHOP.find(x=>x.id===id)||SHOP.at(0);
const dots=a=>Array.from({length:Math.max(5,a.length)},(_,i)=>a.at(i)===1?'🟢':a.at(i)===0?'🔴':'⚪').join('');
function addP(v){p.pt+=v;p.cn+=v;while(p.pt>=nx()){p.pt-=nx();p.lv++}}
function tab(n){startAmbience();gScr.style.display=n===1?'flex':'none';sScr.style.display=n===2?'grid':'none';t1.classList.toggle('act',n===1);t2.classList.toggle('act',n===2);if(n===1)rsz3D();else rShop()}
function rShop(){
  sScr.innerHTML='';
  SHOP.forEach(it=>{
    const o=p.ow.includes(it.id),eq=p.eb===it.id||p.ek===it.id;
    const btn=eq?'<button class="sbtn" disabled>Одягнено</button>':o?`<button class="sbtn wear" onclick="eq('${it.id}','${it.t}')">Вибрати</button>`:`<button class="sbtn" onclick="buy('${it.id}','${it.t}',${it.p})" ${p.cn<it.p?'disabled':''}>${it.p} 💰</button>`;
    sScr.innerHTML+=`<div class="card${eq?' eq':''}"><div style="font-size:32px">${it.i}</div><b>${it.n}</b><div style="font-size:11px;color:#1dd1a1">${it.d}</div>${btn}</div>`;
  });
}
function buy(id,t,pr){if(p.cn>=pr){p.cn-=pr;p.ow.push(id);eq(id,t)}}
function eq(id,t){if(t==='b')p.eb=id;else p.ek=id;ui();rShop()}
function ui(){
  lv.innerText=p.lv;cp.innerText=p.cp;cn.innerText=p.cn;pt.innerText=p.pt;nx.innerText=nx();xb.style.width=Math.min(100,p.pt/nx()*100)+'%';
  const cur=ST.at(p.st)||ST.at(0);op.innerText=cur.n+': '+cur.o;
  sb.querySelectorAll('span').forEach((s,i)=>s.className=i<p.st?'done':i===p.st?'act':'');
  ps.innerText=pS.filter(x=>x).length;bs.innerText=bS.filter(x=>x).length;pd.innerText=dots(pS);bd.innerText=dots(bS);
  try{localStorage.setItem('pc_3d8',JSON.stringify(p))}catch(e){}
  if(ph==='win')return ct.innerHTML=`<button class="btn full" style="background:#1dd1a1;color:#000" onclick="rst()">➡️ Далі: ${ST.at(p.st).n}</button>`;
  if(ph==='cup')return ct.innerHTML=`<button class="btn full" style="background:#feca57;color:#000" onclick="rst()">🏆 Новий кубок (з 1/32)</button>`;
  if(ph==='los')return ct.innerHTML=`<button class="btn full" style="background:#ff6b6b" onclick="rst()">🔄 Виліт! Почати з 1/32</button>`;
  const s=ph==='sh',c=s?'#ff9f43':'#54a0ff',t=s?['⬅️ Вліво','⬆️ Центр','➡️ Вправо']:['🧤 Вліво','🧤 Центр','🧤 Вправо'];
  ct.innerHTML=Array.from({length:3},(_,i)=>`<button class="btn" style="border-color:${c}" onclick="go(${i})" ${bz?'disabled':''}>${t.at(i)}</button>`).join('');
}
function kick3D(bIdx,kIdx){
  const xs=[-2.5,0,2.5],rots=[-0.65,0,0.65];
  bStart={x:0,y:0.35,z:4.5};bEnd={x:xs.at(bIdx),y:1.15,z:11.6};
  kTargetX=xs.at(kIdx);kTargetRot=rots.at(kIdx);animT=0;
}
function rstPos(){bPos={x:0,y:0.35,z:4.5};bStart={x:0,y:0.35,z:4.5};bEnd={x:0,y:0.35,z:4.5};kTargetX=0;kTargetRot=0;plPos={x:-0.9,z:2.5};plLeg=0;plRun=0;animT=1;crowdMood=0}
function chk(){
  if(pS.length>=5&&pS.length===bS.length){
    const pg=pS.filter(x=>x).length,bg=bS.filter(x=>x).length,cur=ST.at(p.st);
    if(pg>bg){addP(cur.r);if(p.st>=5){p.cp++;p.st=0;ph='cup';ms.innerText=`🏆 ЧЕМПІОН 3D! +${cur.r} 💰`}else{p.st++;ph='win';ms.innerText=`✅ Перемога ${pg}:${bg}! +${cur.r} 💰`}return 1}
    if(bg>pg){addP(5);p.st=0;ph='los';ms.innerText=`❌ Виліт у ${cur.n} (${pg}:${bg})`;return 1}
    ms.innerText=`🔥 Нічия ${pg}:${bg}! До промаху!`;
  }return 0;
}
function go(c){
  if(bz)return;bz=1;ui();const bot=Math.floor(Math.random()*3);
  if(ph==='sh'){
    kick3D(c,bot);const g=c!==bot;pS.push(g?1:0);
    setTimeout(()=>{snd(g?'cheer':'groan');crowdMood=g?1:0},350);
    if(g){const bn=getIt(p.eb).bn;p.cn+=bn;ms.innerText=bn?`⚽ ГОООЛ! (+${bn}💰)`:'⚽ ГОООЛ! Стадіон реве!'}else ms.innerText='🧤 Сейв воротаря! Ууу...';
    setTimeout(()=>{rstPos();ph='sv';bz=0;ms.innerText='🧤 Ти на воротах! Куди стрибати?';ui()},1300);
  }else{
    kick3D(bot,c);const g=bot!==c;bS.push(g?1:0);
    setTimeout(()=>{snd(g?'groan':'cheer');crowdMood=g?0:1},350);
    if(!g){const bn=getIt(p.ek).bn;p.cn+=bn;ms.innerText=bn?`🔥 СЕЙВ! (+${bn}💰)`:'🔥 СЕЙВ! Трибуни шаленіють!'}else ms.innerText='❌ Бот забив!';
    setTimeout(()=>{rstPos();bz=0;if(!chk()){ph='sh';ms.innerText='⚽ Твій удар! Вибери кут'}ui()},1300);
  }
}
function rst(){ph='sh';pS=[];bS=[];bz=0;rstPos();ms.innerText='⚽ Твій удар! Вибери кут';ui()}
setTimeout(()=>{rsz3D();rstPos();ui();requestAnimationFrame(draw3D)},100);
</script>
