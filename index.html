<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Penalty Stadium</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:sans-serif;background:#070b14;color:#fff;margin:0;padding:8px;display:flex;flex-direction:column;height:100vh;user-select:none;overflow:hidden}
.tabs{display:flex;gap:6px;margin-bottom:6px;flex-shrink:0}
.tab{flex:1;padding:8px;background:#131b26;border:1px solid #243347;color:#8395a7;border-radius:10px;font-weight:bold;cursor:pointer}
.tab.act{background:#1dd1a1;color:#000;border-color:#1dd1a1}
.box{background:#131b26;border:1px solid #243347;border-radius:12px;padding:7px 12px;margin-bottom:6px;flex-shrink:0}
.row{display:flex;justify-content:space-between;align-items:center}
.bar{width:100%;height:5px;background:#1e2b3c;border-radius:4px;overflow:hidden;margin:4px 0}
.fill{height:100%;background:#1dd1a1;transition:width .3s}
.stgs{display:flex;justify-content:space-between;font-size:10px;font-weight:bold;color:#576574;margin-top:2px}
.stgs .act{color:#feca57;text-decoration:underline}.stgs .done{color:#1dd1a1}
.arena{flex:1;min-height:0;position:relative;border-radius:14px;overflow:hidden;border:2px solid #243347;margin-bottom:8px;background:#070b14}
#c3d{width:100%;height:100%;display:block}
.hud-top{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;background:rgba(7,11,20,.82);padding:7px 14px;border-radius:10px;font-size:13px;pointer-events:none;border:1px solid rgba(255,255,255,.1)}
.msg{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(7,11,20,.92);padding:8px 18px;border-radius:16px;font-weight:bold;font-size:14px;border:1px solid #feca57;text-align:center;white-space:nowrap}
.ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex-shrink:0}
.btn{background:#182230;border:2px solid #3c4f66;color:#fff;padding:12px 4px;border-radius:12px;font-weight:bold;font-size:13px;cursor:pointer}
.btn:active{transform:scale(.95)}.btn:disabled{opacity:.4}
.full{grid-column:span 3;border:none;font-size:14px;padding:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow-y:auto;padding-bottom:10px}
.card{background:#131b26;border:1px solid #243347;border-radius:12px;padding:10px;text-align:center}
.card.eq{border-color:#1dd1a1;background:rgba(29,209,161,.08)}
.sbtn{width:100%;padding:8px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;background:#feca57;color:#000;margin-top:6px}
.sbtn.wear{background:#1dd1a1}.sbtn:disabled{background:#1e2b3c;color:#576574}
</style>
</head>
<body>
<div class="tabs">
  <button class="tab act" id="t1" onclick="tab(1)">⚽ 3D Кубок</button>
  <button class="tab" id="t2" onclick="tab(2)">🛍 Магазин</button>
</div>
<div class="box">
  <div class="row"><b style="color:#feca57">Рівень <span id="lv">1</span> • 🏆 <span id="cp">0</span></b><b style="color:#feca57">💰 <span id="cn">20</span></b></div>
  <div class="bar"><div class="fill" id="xb"></div></div>
  <div class="row" style="font-size:11px;color:#8395a7"><span>XP: <span id="pt">0</span>/<span id="nx">100</span></span><span id="op" style="color:#ff9ff3">1/32: ФК Двір</span></div>
  <div class="stgs" id="sb"><span>1/32</span><span>1/16</span><span>1/8</span><span>1/4</span><span>1/2</span><span>ФІНАЛ</span></div>
</div>
<div id="gScr" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <div class="arena" id="ar">
    <div class="hud-top">
      <span>Ти: <span id="pd">⚪⚪⚪⚪⚪</span></span>
      <b style="color:#feca57;font-size:16px"><span id="ps">0</span> : <span id="bs">0</span></b>
      <span>Бот: <span id="bd">⚪⚪⚪⚪⚪</span></span>
    </div>
    <canvas id="c3d"></canvas>
    <div class="msg" id="ms">⚽ Твій удар! Вибери кут</div>
  </div>
  <div class="ctrl" id="ct"></div>
</div>
<div id="sScr" class="grid" style="display:none"></div>
<script>
try{window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}catch(e){}
const ST=[{n:'1/32',o:'ФК Двір',r:30},{n:'1/16',o:'ФК Район',r:50},{n:'1/8',o:'ФК Місто',r:80},{n:'1/4',o:'ФК Титан',r:120},{n:'1/2',o:'ФК Легенда',r:180},{n:'ФІНАЛ',o:'Чемпіон',r:300}];
const SHOP=[
  {id:'b1',t:'b',n:'Класика',i:'⚽',p:0,bn:0,col:'#ffffff',d:'Білий 3D м’яч'},
  {id:'b2',t:'b',n:'Вогняний',i:'🔥',p:20,bn:5,col:'#ff5e57',d:'+5 💰 за гол (червоний)'},
  {id:'b3',t:'b',n:'Блискавка',i:'⚡',p:60,bn:12,col:'#00d2ff',d:'+12 💰 за гол (неоновий)'},
  {id:'b4',t:'b',n:'Золотий',i:'🏆',p:150,bn:25,col:'#feca57',d:'+25 💰 за гол (золотий)'},
  {id:'k1',t:'k',n:'Базові',i:'🧤',p:0,bn:0,col:'#1dd1a1',d:'Звичайні рукавиці'},
  {id:'k2',t:'k',n:'Кібер-хват',i:'🦾',p:50,bn:10,col:'#ff9ff3',d:'+10 💰 за сейв (рожеві)'}
];
let p={pt:0,lv:1,cp:0,st:0,cn:20,ow:['b1','k1'],eb:'b1',ek:'k1'};
try{const v=JSON.parse(localStorage.getItem('pc_3d8'));if(v)p=Object.assign(p,v)}catch(e){}
let ph='sh',pS=[],bS=[],ac=null,ambOn=false,crowdMood=0;
function startAmbience(){
  if(ambOn)return;
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    ambOn=true;

    const len=ac.sampleRate*6,buf=ac.createBuffer(1,len,ac.sampleRate),ch=buf.getChannelData(0);
    let lastOut=0;
    for(let i=0;i<len;i++){
      const white=Math.random()*2-1;
      lastOut=(lastOut+(0.02*white))/1.02;
      const swell=0.65+0.35*Math.sin((i/len)*Math.PI*2);
      ch[i]=lastOut*3.2*swell;
    }

    const ns=ac.createBufferSource();ns.buffer=buf;ns.loop=true;
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=260;
    const gn=ac.createGain();gn.gain.value=0.16;
    ns.connect(lp);lp.connect(gn);gn.connect(ac.destination);ns.start();
  }catch(e){}
}
window.addEventListener('pointerdown',startAmbience,{once:true});

function whistle(dur=0.28){
  try{
    const now=ac.currentTime;
    const o1=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain();
    o1.type='sine';o2.type='sine';
    o1.frequency.setValueAtTime(2850,now);
    o2.frequency.setValueAtTime(2920,now);
    g.gain.setValueAtTime(0.001,now);
    g.gain.linearRampToValueAtTime(0.06,now+0.03);
    g.gain.setValueAtTime(0.06,now+dur-0.05);
    g.gain.exponentialRampToValueAtTime(0.001,now+dur);
    o1.connect(g);o2.connect(g);g.connect(ac.destination);
    o1.start(now);o2.start(now);o1.stop(now+dur);o2.stop(now+dur);
  }catch(e){}
}

function snd(type){
  startAmbience();
  try{
    const now=ac.currentTime;
    const osc=ac.createOscillator(),og=ac.createGain();
    osc.type='triangle';
    osc.frequency.setValueAtTime(115,now);
    osc.frequency.exponentialRampToValueAtTime(34,now+0.14);
    og.gain.setValueAtTime(0.55,now);
    og.gain.exponentialRampToValueAtTime(0.001,now+0.14);
    osc.connect(og);og.connect(ac.destination);osc.start(now);osc.stop(now+0.15);

    const dur=type==='cheer'?2.1:1.4,len=Math.floor(ac.sampleRate*dur);
    const buf=ac.createBuffer(1,len,ac.sampleRate),ch=buf.getChannelData(0);
    let last=0;
    for(let i=0;i<len;i++){
      const w=Math.random()*2-1;
      last=(last+(0.04*w))/1.04;
      const env=Math.sin(Math.PI*(i/len));
      ch[i]=last*3.5*env;
    }
    const src=ac.createBufferSource(),flt=ac.createBiquadFilter(),gn=ac.createGain();
    src.buffer=buf;
    flt.type='lowpass';
    flt.frequency.setValueAtTime(type==='cheer'?320:240,now+0.08);
    flt.frequency.linearRampToValueAtTime(type==='cheer'?680:160,now+0.45);
    flt.frequency.linearRampToValueAtTime(type==='cheer'?360:140,now+0.08+dur);
    gn.gain.setValueAtTime(type==='cheer'?0.48:0.32,now+0.08);
    gn.gain.exponentialRampToValueAtTime(0.001,now+0.08+dur);
    src.connect(flt);flt.connect(gn);gn.connect(ac.destination);src.start(now+0.08);

    if(type==='cheer')setTimeout(()=>whistle(0.32),350);
  }catch(e){}
}

const ctx=c3d.getContext('2d');let W=300,H=300;
function rsz3D(){const r=ar.getBoundingClientRect();if(r.width>0&&r.height>0){W=c3d.width=r.width;H=c3d.height=r.height}}
window.addEventListener('resize',rsz3D);

function proj(x,y,z){
  const camZ=-12.5,camY=13.0,pitch=0.68;
  const dz=z-camZ,dy=y-camY;
  const rz=dz*Math.cos(pitch)-dy*Math.sin(pitch);
  const ry=dz*Math.sin(pitch)+dy*Math.cos(pitch);
  const f=Math.min(W,H)*1.22;
  const sc=f/Math.max(1.0,rz);
  return{x:W/2+x*sc,y:H*0.58-ry*sc,s:sc};
}

const FANS=Array.from({length:240},(_,i)=>{
  const row=Math.floor(i/48),colIdx=i%48;
  const skins=['#f5cba7','#e0ac69','#8d5524','#ffdbac'];
  const hairs=['#1c1c1c','#4a2c11','#8d6e63','#d4ac0d'];
  const jerseys=['#154360','#ffffff','#1b4f72','#111822','#2471a3'];
  return{x:-24+colIdx*1.02+(row%2)*0.45,row:row,ph:Math.random()*6.28,skin:skins[i%4],hair:hairs[(i*3)%4],shirt:jerseys[(i*7)%5],scarf:(i%4===0)};
});

let ball={x:0,y:0.22,z:0,sx:0,sy:0.22,sz:0,tx:0,ty:0.22,tz:0,t:1,active:false};
let gk={x:0,y:0,tx:0,ty:0,dive:0,tdive:0};
let kicker={x:-1.5,z:-2.8,sx:-1.5,sz:-2.8,tx:-0.35,tz:-0.25,run:0,running:false,kickPose:0};
let busy=false,tAnim=0;
function save(){try{localStorage.setItem('pc_3d8',JSON.stringify(p))}catch(e){}}
function getItem(id){return SHOP.find(x=>x.id===id)||SHOP[0]}

function tab(n){
  t1.className=n===1?'tab act':'tab';
  t2.className=n===2?'tab act':'tab';
  gScr.style.display=n===1?'flex':'none';
  sScr.style.display=n===2?'grid':'none';
  if(n===2)renderShop();else rsz3D();
}

function updUI(){
  lv.textContent=p.lv;cp.textContent=p.cp;cn.textContent=p.cn;
  const nxXp=p.lv*100;pt.textContent=p.pt;nx.textContent=nxXp;
  xb.style.width=Math.min(100,(p.pt/nxXp)*100)+'%';
  const cur=ST[p.st]||ST[0];
  op.textContent=`${cur.n}: ${cur.o}`;
  Array.from(sb.children).forEach((el,i)=>{el.className=i<p.st?'done':(i===p.st?'act':'')});
  pd.textContent=Array.from({length:5},(_,i)=>pS[i]===1?'🟢':(pS[i]===0?'🔴':'⚪')).join('');
  bd.textContent=Array.from({length:5},(_,i)=>bS[i]===1?'🟢':(bS[i]===0?'🔴':'⚪')).join('');
  ps.textContent=pS.filter(x=>x===1).length;
  bs.textContent=bS.filter(x=>x===1).length;
}

function renderCtrl(){
  ct.innerHTML='';
  if(ph==='over'){
    const won=pS.filter(x=>x===1).length>bS.filter(x=>x===1).length;
    ct.innerHTML=`<button class="btn full" style="background:${won?'#1dd1a1':'#ff5e57'};color:#000" onclick="nextMatch(${won})">${won?'🏆 Наступний етап':'🔄 Спробувати ще раз'}</button>`;
    return;
  }
  const zones=[
    {z:0,l:'↖️ Лів. Верх'},{z:1,l:'⬆️ Центр Верх'},{z:2,l:'↗️ Прав. Верх'},
    {z:3,l:'↙️ Лів. Низ'},{z:4,l:'⬇️ Центр Низ'},{z:5,l:'↘️ Прав. Низ'}
  ];
  zones.forEach(item=>{
    const b=document.createElement('button');
    b.className='btn';b.textContent=item.l;b.disabled=busy;
    b.onclick=()=>act(item.z);ct.appendChild(b);
  });
}

function zoneCoords(z){
  const col=(z%3)-1,row=z<3?1:0;
  return{x:col*3.05,y:row===1?2.05:0.42,dive:col};
}

function resetPositions(){
  ball={x:0,y:0.22,z:0,sx:0,sy:0.22,sz:0,tx:0,ty:0.22,tz:0,t:1,active:false};
  gk={x:0,y:0,tx:0,ty:0,dive:0,tdive:0};
  kicker={x:-1.5,z:-2.8,sx:-1.5,sz:-2.8,tx:-0.35,tz:-0.25,run:0,running:false,kickPose:0};
}

function act(z){
  if(busy)return;
  busy=true;renderCtrl();
  const isPlayerShoot=(ph==='sh'),botZ=Math.floor(Math.random()*6);
  const shotZ=isPlayerShoot?z:botZ,saveZ=isPlayerShoot?botZ:z;
  const sc=zoneCoords(shotZ),kc=zoneCoords(saveZ);

  kicker.running=true;kicker.run=0;

  setTimeout(()=>{
    kicker.running=false;kicker.kickPose=1;
    ball={x:0,y:0.22,z:0,sx:0,sy:0.22,sz:0,tx:sc.x,ty:sc.y,tz:10.5,t:0,active:true};
    gk.tx=kc.x*0.88;gk.ty=kc.y>1?0.55:0.08;gk.tdive=kc.dive;
    snd('kick');

    setTimeout(()=>{
      const isGoal=(shotZ!==saveZ);
      if(isPlayerShoot){
        pS.push(isGoal?1:0);
        if(isGoal){
          const winCoins=10+getItem(p.eb).bn;
          p.cn+=winCoins;p.pt+=25;crowdMood=1;snd('cheer');
          ms.textContent=`⚽ ГОЛ! +${winCoins} 💰`;ms.style.borderColor='#1dd1a1';
        }else{
          crowdMood=-1;snd('boo');ms.textContent='🧤 Воротар потягнув!';ms.style.borderColor='#ff5e57';
        }
      }else{
        bS.push(isGoal?1:0);
        if(isGoal){
          crowdMood=-1;snd('boo');ms.textContent='❌ Бот забив гол!';ms.style.borderColor='#ff5e57';
        }else{
          const saveCoins=5+getItem(p.ek).bn;
          p.cn+=saveCoins;p.pt+=20;crowdMood=1;snd('cheer');
          ms.textContent=`🧤 СЕЙВ! +${saveCoins} 💰`;ms.style.borderColor='#1dd1a1';
        }
      }
      if(p.pt>=p.lv*100){p.pt-=p.lv*100;p.lv++;}
      save();updUI();
      setTimeout(()=>{crowdMood=0;checkSeries();},1050);
    },600);
  },380);
}

function checkSeries(){
  const pGoals=pS.filter(x=>x===1).length,bGoals=bS.filter(x=>x===1).length;
  const pRem=5-pS.length,bRem=5-bS.length;
  const earlyWin=(pGoals>bGoals+bRem)||(bGoals>pGoals+pRem);
  const fiveDone=(pS.length>=5&&bS.length>=5&&pGoals!==bGoals);

  if(earlyWin||fiveDone){
    ph='over';busy=false;
    const won=pGoals>bGoals;
    if(won){
      const reward=ST[p.st].r;
      p.cn+=reward;p.pt+=60;if(p.st===5)p.cp++;
      ms.textContent=`🏆 ПЕРЕМОГА! Нагорода +${reward} 💰`;ms.style.borderColor='#feca57';
    }else{
      ms.textContent='💔 Поразка в серії пенальті';ms.style.borderColor='#ff5e57';
    }
    if(p.pt>=p.lv*100){p.pt-=p.lv*100;p.lv++;}
    save();updUI();renderCtrl();return;
  }

  ph=(ph==='sh')?'sv':'sh';
  resetPositions();busy=false;
  ms.style.borderColor='#feca57';
  ms.textContent=ph==='sh'?'⚽ Твій удар! Вибери кут':'🧤 Твій сейв! Вгадай кут';
  renderCtrl();
}

function nextMatch(won){
  if(won)p.st=(p.st+1)%ST.length;
  pS=[];bS=[];ph='sh';resetPositions();updUI();renderCtrl();
  ms.style.borderColor='#feca57';ms.textContent='⚽ Твій удар! Вибери кут';
}

function renderShop(){
  sScr.innerHTML='';
  SHOP.forEach(item=>{
    const owned=p.ow.includes(item.id),eq=(p.eb===item.id||p.ek===item.id);
    const d=document.createElement('div');
    d.className=eq?'card eq':'card';
    d.innerHTML=`<div style="font-size:28px">${item.i}</div><div style="font-weight:bold;margin:4px 0;color:${item.col}">${item.n}</div><div style="font-size:11px;color:#8395a7;min-height:28px">${item.d}</div><button class="sbtn ${owned?'wear':''}" ${(!owned&&p.cn<item.p)?'disabled':''} onclick="buyOrWear('${item.id}')">${eq?'✅ Одягнено':(owned?'Одягнути':`Купити (${item.p} 💰)`)}</button>`;
    sScr.appendChild(d);
  });
}

function buyOrWear(id){
  const item=getItem(id);
  if(!p.ow.includes(id)){if(p.cn<item.p)return;p.cn-=item.p;p.ow.push(id);}
  if(item.t==='b')p.eb=id;else p.ek=id;
  save();updUI();renderShop();
}
function drawLimb(x1,y1,x2,y2,r1,r2,col){
  const ang=Math.atan2(y2-y1,x2-x1);
  const nx=-Math.sin(ang),ny=Math.cos(ang);
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(x1+nx*r1,y1+ny*r1);
  ctx.lineTo(x2+nx*r2,y2+ny*r2);
  ctx.arc(x2,y2,r2,ang-Math.PI/2,ang+Math.PI/2);
  ctx.lineTo(x1-nx*r1,y1-ny*r1);
  ctx.arc(x1,y1,r1,ang+Math.PI/2,ang-Math.PI/2);
  ctx.closePath();
  ctx.fill();
}

function drawRealisticPlayer(px,py,sc,jerseyCol,shortsCol,socksCol,gloveCol,diveAng,runPhase,isKicker){
  ctx.save();
  ctx.translate(px,py);
  ctx.rotate(diveAng);

  const isRunning=Math.abs(runPhase)>0.01;
  const swing=isRunning?Math.sin(runPhase)*9*sc:0;
  const lift=isRunning?Math.max(0,-Math.cos(runPhase))*5*sc:0;
  const skin='#e5b887';
  const skinShade='#c6905b';

  const lean=isRunning?0.08:(isKicker?0.04:0);
  ctx.rotate(lean);

  [-1,1].forEach(side=>{
    const dir=side===-1?1:-1;
    const stride=swing*dir;
    const footLift=side===-1?lift:(isRunning?Math.max(0,Math.cos(runPhase))*5*sc:0);

    const hipX=side*4.6*sc,hipY=-26*sc;
    const kneeX=side*5.2*sc+stride*0.45,kneeY=-14.5*sc-footLift*0.4;
    const ankleX=side*5.0*sc+stride*0.85,ankleY=-2.5*sc-footLift;

    drawLimb(hipX,hipY,kneeX,kneeY,4.4*sc,3.4*sc,shortsCol);
    ctx.fillStyle=skinShade;
    ctx.beginPath();ctx.arc(kneeX,kneeY,2.8*sc,0,Math.PI*2);ctx.fill();
    drawLimb(kneeX,kneeY+1*sc,ankleX,ankleY,3.2*sc,2.0*sc,socksCol);
    ctx.fillStyle='#ffffff';
    ctx.fillRect(kneeX-2.8*sc,kneeY+1*sc,5.6*sc,1.6*sc);

    ctx.fillStyle='#14181d';
    ctx.beginPath();
    ctx.ellipse(ankleX+(isKicker?0:side*1.2*sc),ankleY+1.2*sc,4.5*sc,2.1*sc,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#1dd1a1';
    ctx.fillRect(ankleX-2.5*sc,ankleY+0.5*sc,5*sc,1*sc);
  });

  const torsoGrad=ctx.createLinearGradient(-12*sc,-49*sc,12*sc,-25*sc);
  torsoGrad.addColorStop(0,jerseyCol);
  torsoGrad.addColorStop(0.75,jerseyCol);
  torsoGrad.addColorStop(1,'#090d14');
  ctx.fillStyle=torsoGrad;
  ctx.beginPath();
  ctx.moveTo(-11*sc,-47.5*sc);
  ctx.quadraticCurveTo(0,-50*sc,11*sc,-47.5*sc);
  ctx.lineTo(8*sc,-26*sc);
  ctx.quadraticCurveTo(0,-24.5*sc,-8*sc,-26*sc);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle='rgba(0,0,0,0.16)';
  ctx.fillRect(-1*sc,-46*sc,2*sc,19*sc);

  ctx.fillStyle='#ffffff';
  ctx.beginPath();ctx.arc(0,-48*sc,3.6*sc,0.1,Math.PI-0.1);ctx.fill();
  if(isKicker){
    ctx.fillStyle='rgba(255,255,255,0.92)';
    ctx.font=`bold ${Math.max(8,10.5*sc)}px sans-serif`;
    ctx.textAlign='center';
    ctx.fillText('10',0,-33*sc);
  }

  [-1,1].forEach(side=>{
    const isDiving=Math.abs(diveAng)>0.15;
    const armSwing=swing*(side===-1?-0.75:0.75);

    const shX=side*10.5*sc,shY=-45.5*sc;
    const elX=isDiving?side*18*sc:side*13.2*sc;
    const elY=isDiving?-53*sc:-36.5*sc+armSwing*0.4;
    const hdX=isDiving?side*25*sc:side*14.5*sc;
    const hdY=isDiving?-60*sc:-27.5*sc+armSwing*0.8;

    drawLimb(shX,shY,elX,elY,3.4*sc,2.7*sc,jerseyCol);
    drawLimb(elX,elY,hdX,hdY,2.5*sc,1.8*sc,skin);

    if(gloveCol){
      ctx.fillStyle='#ffffff';
      ctx.beginPath();ctx.arc(hdX,hdY,3.2*sc,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=gloveCol;
      ctx.beginPath();ctx.ellipse(hdX+side*1*sc,hdY-1*sc,4.6*sc,3.6*sc,side*0.3,0,Math.PI*2);ctx.fill();
    }else{
      ctx.fillStyle=skin;
      ctx.beginPath();ctx.arc(hdX,hdY,2.2*sc,0,Math.PI*2);ctx.fill();
    }
  });

  ctx.fillStyle=skinShade;
  ctx.fillRect(-2.6*sc,-51.5*sc,5.2*sc,4*sc);

  ctx.fillStyle=skin;
  ctx.beginPath();
  ctx.arc(-5.6*sc,-56.5*sc,1.4*sc,0,Math.PI*2);
  ctx.arc(5.6*sc,-56.5*sc,1.4*sc,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();ctx.ellipse(0,-56.5*sc,5.5*sc,6.6*sc,0,0,Math.PI*2);ctx.fill();

  if(!isKicker){
    ctx.fillStyle='#2c3e50';
    ctx.beginPath();
    ctx.arc(-2*sc,-56.8*sc,0.8*sc,0,Math.PI*2);
    ctx.arc(2*sc,-56.8*sc,0.8*sc,0,Math.PI*2);
    ctx.fill();
    ctx.fillRect(-3.2*sc,-58.4*sc,2.4*sc,0.7*sc);
    ctx.fillRect(0.8*sc,-58.4*sc,2.4*sc,0.7*sc);
  }

  ctx.fillStyle='#1b222c';
  ctx.beginPath();
  ctx.ellipse(0,-59.2*sc,5.8*sc,4.2*sc,0,Math.PI*0.92,Math.PI*2.08);
  ctx.fill();
  if(isKicker){
    ctx.beginPath();ctx.ellipse(0,-57.5*sc,5.5*sc,4.5*sc,0,0,Math.PI*2);ctx.fill();
  }

  ctx.restore();
}

function drawRealisticFan(fx,fy,sc,fan,jump){
  const y=fy-jump;
  ctx.fillStyle=fan.shirt;
  ctx.beginPath();
  ctx.moveTo(fx-5*sc,y-11*sc);
  ctx.quadraticCurveTo(fx,y-12.5*sc,fx+5*sc,y-11*sc);
  ctx.lineTo(fx+4*sc,y);
  ctx.lineTo(fx-4*sc,y);
  ctx.closePath();
  ctx.fill();

  if(crowdMood===1){
    drawLimb(fx-4.5*sc,y-10*sc,fx-7*sc,y-18*sc,1.4*sc,1.0*sc,fan.skin);
    drawLimb(fx+4.5*sc,y-10*sc,fx+7*sc,y-18*sc,1.4*sc,1.0*sc,fan.skin);
    if(fan.scarf){
      ctx.fillStyle='#1dd1a1';
      ctx.fillRect(fx-7.5*sc,y-20*sc,15*sc,2.4*sc);
    }
  }

  ctx.fillStyle=fan.skin;
  ctx.fillRect(fx-1.2*sc,y-13*sc,2.4*sc,2*sc);
  ctx.beginPath();ctx.ellipse(fx,y-15.2*sc,3.0*sc,3.6*sc,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=fan.hair;
  ctx.beginPath();ctx.ellipse(fx,y-16.2*sc,3.2*sc,2.4*sc,0,Math.PI,Math.PI*2);ctx.fill();
}
function draw3D(){
  tAnim+=0.07;
  ctx.clearRect(0,0,W,H);

  const horizonY=proj(0,0,15.5).y;
  const standTop=Math.max(46,horizonY-H*0.20);

  const sky=ctx.createLinearGradient(0,0,0,horizonY);
  sky.addColorStop(0,'#90a4ae');sky.addColorStop(1,'#455a64');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,horizonY);

  ctx.fillStyle='#456360';
  ctx.beginPath();
  ctx.moveTo(0,standTop+10);ctx.lineTo(W*0.20,standTop-25);ctx.lineTo(W*0.40,standTop-28);
  ctx.lineTo(W*0.56,standTop-52);ctx.lineTo(W*0.74,standTop-38);ctx.lineTo(W*0.92,standTop-20);
  ctx.lineTo(W,standTop-24);ctx.lineTo(W,horizonY);ctx.lineTo(0,horizonY);ctx.closePath();ctx.fill();

  ctx.fillStyle='#246124';ctx.fillRect(0,horizonY,W,H-horizonY);

  for(let z=-6;z<15.5;z+=1.6){
    const y1=proj(0,0,z).y,y2=proj(0,0,z+1.6).y;
    ctx.fillStyle=(Math.floor((z+6)*10)%2===0)?'#2d7a2d':'#388e3c';
    ctx.fillRect(0,Math.min(y1,y2),W,Math.abs(y1-y2)+1);
  }

  ctx.fillStyle='#0d1520';ctx.fillRect(0,standTop,W,horizonY-standTop);

  for(let r=0;r<5;r++){
    const ry=standTop+5+r*((horizonY-standTop-8)/5);
    ctx.fillStyle=r%2===0?'#152232':'#1c2d42';
    ctx.fillRect(0,ry,W,2.5);
  }

  FANS.forEach(f=>{
    const pt=proj(f.x,0.3+f.row*0.52,14.3+f.row*0.42);
    const jump=crowdMood===1?Math.abs(Math.sin(tAnim*2.5+f.ph))*7:Math.sin(tAnim+f.ph)*1.2;
    if(pt.x>-20&&pt.x<W+20)drawRealisticFan(pt.x,pt.y,pt.s*0.032,f,jump);
  });

  ctx.strokeStyle='#eceff1';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(0,standTop-3);ctx.quadraticCurveTo(W*0.5,standTop+12,W,standTop-3);ctx.stroke();

  const adL=proj(-18,0,12.6),adTop=proj(0,0.75,12.6).y;
  ctx.fillStyle='#0b131e';ctx.fillRect(0,adTop,W,adL.y-adTop);
  ctx.fillStyle='#1dd1a1';ctx.font='bold 10px sans-serif';ctx.textAlign='center';
  ctx.fillText('⚽ 3D PENALTY CUP  •  TELEGRAM STADIUM  •  LIVE ⚽',W/2,(adTop+adL.y)/2+3.5);

  ctx.strokeStyle='rgba(255,255,255,0.88)';ctx.lineWidth=2.5;
  const pBL=proj(-8.2,0,10.5),pFL=proj(-8.2,0,3.2),pFR=proj(8.2,0,3.2),pBR=proj(8.2,0,10.5);
  ctx.beginPath();ctx.moveTo(pBL.x,pBL.y);ctx.lineTo(pFL.x,pFL.y);ctx.lineTo(pFR.x,pFR.y);ctx.lineTo(pBR.x,pBR.y);ctx.stroke();
  const gBL=proj(-4.6,0,10.5),gFL=proj(-4.6,0,7.8),gFR=proj(4.6,0,7.8),gBR=proj(4.6,0,10.5);
  ctx.beginPath();ctx.moveTo(gBL.x,gBL.y);ctx.lineTo(gFL.x,gFL.y);ctx.lineTo(gFR.x,gFR.y);ctx.lineTo(gBR.x,gBR.y);ctx.stroke();
  const endL=proj(-22,0,10.5),endR=proj(22,0,10.5);
  ctx.beginPath();ctx.moveTo(endL.x,endL.y);ctx.lineTo(endR.x,endR.y);ctx.stroke();
  const spot=proj(0,0,0);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(spot.x,spot.y,0.22*spot.s,0.11*spot.s,0,0,Math.PI*2);ctx.fill();

  const gw=3.65,gh=2.44,gz=10.5,gd=1.5;
  const gFL2=proj(-gw,0,gz),gTL=proj(-gw,gh,gz),gTR=proj(gw,gh,gz),gFR2=proj(gw,0,gz);
  const gBL2=proj(-gw,0,gz+gd),gBTL=proj(-gw,gh*0.85,gz+gd),gBTR=proj(gw,gh*0.85,gz+gd),gBR2=proj(gw,0,gz+gd);

  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1;
  for(let i=0;i<=12;i++){
    const t=i/12,t1=proj(-gw+gw*2*t,gh,gz),t2=proj(-gw+gw*2*t,gh*0.85,gz+gd),b2=proj(-gw+gw*2*t,0,gz+gd);
    ctx.beginPath();ctx.moveTo(t1.x,t1.y);ctx.lineTo(t2.x,t2.y);ctx.lineTo(b2.x,b2.y);ctx.stroke();
  }
  for(let h=1;h<=4;h++){
    const hy=gh*(h/5),l1=proj(-gw,hy,gz),l2=proj(-gw,hy*0.85,gz+gd),r2=proj(gw,hy*0.85,gz+gd),r1=proj(gw,hy,gz);
    ctx.beginPath();ctx.moveTo(l1.x,l1.y);ctx.lineTo(l2.x,l2.y);ctx.lineTo(r2.x,r2.y);ctx.lineTo(r1.x,r1.y);ctx.stroke();
  }
  ctx.strokeStyle='#ffffff';ctx.lineWidth=5;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(gFL2.x,gFL2.y);ctx.lineTo(gTL.x,gTL.y);ctx.lineTo(gTR.x,gTR.y);ctx.lineTo(gFR2.x,gFR2.y);ctx.stroke();

  gk.x+=(gk.tx-gk.x)*0.18;gk.y+=(gk.ty-gk.y)*0.18;gk.dive+=(gk.tdive-gk.dive)*0.18;
  const gp=proj(gk.x,gk.y,gz-0.1),gSh=proj(gk.x,0,gz-0.1);
  ctx.fillStyle='rgba(0,0,0,0.42)';
  ctx.beginPath();ctx.ellipse(gSh.x,gSh.y,0.5*gSh.s,0.2*gSh.s,0,0,Math.PI*2);ctx.fill();
  drawRealisticPlayer(gp.x,gp.y,gp.s*0.036,'#ff6b00','#1e272e','#ff6b00',getItem(p.ek).col,gk.dive*0.95,busy?0:tAnim*0.6,false);

  if(ball.active&&ball.t<1){
    ball.t=Math.min(1,ball.t+0.048);
    const ease=1-Math.pow(1-ball.t,2);
    const curveX=Math.sin(ball.t*Math.PI)*(ball.tx*0.18);
    const arcY=Math.sin(ball.t*Math.PI)*0.85;
    ball.x=ball.sx+(ball.tx-ball.sx)*ease+curveX;
    ball.y=ball.sy+(ball.ty-ball.sy)*ease+arcY;
    ball.z=ball.sz+(ball.tz-ball.sz)*ease;
  }

  const bSh=proj(ball.x,0,ball.z);
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.beginPath();ctx.ellipse(bSh.x,bSh.y,0.24*bSh.s,0.11*bSh.s,0,0,Math.PI*2);ctx.fill();

  const bp=proj(ball.x,ball.y,ball.z),rad=Math.max(4,0.22*bp.s),bCol=getItem(p.eb).col;
  const bGrad=ctx.createRadialGradient(bp.x-rad*0.3,bp.y-rad*0.3,rad*0.1,bp.x,bp.y,rad);
  bGrad.addColorStop(0,'#ffffff');bGrad.addColorStop(0.55,bCol);bGrad.addColorStop(1,'#1e272e');
  ctx.fillStyle=bGrad;ctx.beginPath();ctx.arc(bp.x,bp.y,rad,0,Math.PI*2);ctx.fill();

  if(kicker.running){
    kicker.run=Math.min(1,kicker.run+0.08);
    kicker.x=kicker.sx+(kicker.tx-kicker.sx)*kicker.run;
    kicker.z=kicker.sz+(kicker.tz-kicker.sz)*kicker.run;
  }
  const kp=proj(kicker.x,0,kicker.z);
  ctx.fillStyle='rgba(0,0,0,0.42)';
  ctx.beginPath();ctx.ellipse(kp.x,kp.y,0.5*kp.s,0.2*kp.s,0,0,Math.PI*2);ctx.fill();
  const kJersey=(ph==='sh')?'#1dd1a1':'#ff4757';
  drawRealisticPlayer(kp.x,kp.y,kp.s*0.036,kJersey,'#ffffff',kJersey,null,kicker.kickPose*-0.18,kicker.running?tAnim*3.2:0,true);

  requestAnimationFrame(draw3D);
}

rsz3D();updUI();renderCtrl();draw3D();
</script>
