<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Penalty Master 3D — Головна</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
        body {
            overflow: hidden;
            background: radial-gradient(circle at 50% 35%, #1e40af 0%, #0f172a 70%, #020617 100%);
            color: #ffffff;
        }
        #canvas-container { width: 100vw; height: 100vh; display: block; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }

        .ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 28px 24px;
        }

        .top-hud {
            display: flex;
            justify-content: flex-end;
            width: 100%;
        }
        .coins-pill {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            color: #facc15;
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid rgba(250, 204, 21, 0.4);
            font-weight: 800;
            font-size: 1.05rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .header { text-align: center; margin-top: 8px; }
        .header h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(to right, #ffffff, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
        }

        .menu-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            pointer-events: auto;
            padding-bottom: 12px;
        }

        .btn {
            text-decoration: none;
            border: none;
            padding: 16px 40px;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 1px;
            border-radius: 50px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-play {
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.45);
        }
        .btn-play:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px rgba(34, 197, 94, 0.65);
        }

        .btn-shop {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            color: #f8fafc;
            border: 2px solid rgba(56, 189, 248, 0.5);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }
        .btn-shop:hover {
            transform: translateY(-3px);
            border-color: #38bdf8;
            background: rgba(30, 41, 59, 0.95);
        }

        #loader-screen {
            position: absolute;
            inset: 0;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            transition: opacity 0.4s;
        }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 540px) {
            .menu-actions { flex-direction: column; width: 100%; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="loader-screen">
        <div class="spinner"></div>
        <div id="loader-text">Завантаження гравця...</div>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <div>
            <div class="top-hud">
                <div class="coins-pill" id="home-coins">💰 500</div>
            </div>
            <div class="header">
                <h1>PENALTY MASTER 3D</h1>
            </div>
        </div>

        <div class="menu-actions">
            <a href="shop.html" class="btn btn-shop">👕 ГАРДЕРОБ</a>
            <button class="btn btn-play" id="start-btn">ГРАТИ ⚽</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "./libs/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from './libs/GLTFLoader.js';
        import { DRACOLoader } from './libs/DRACOLoader.js';
        import { OrbitControls } from './libs/OrbitControls.js';
        import { CATALOG } from './shop-catalog.js';

        if (localStorage.getItem('player_coins') === null) {
            localStorage.setItem('player_coins', '500');
        }
        document.getElementById('home-coins').innerText = `💰 ${localStorage.getItem('player_coins')}`;

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.25, 3.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.1));
        const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
        keyLight.position.set(3, 6, 4);
        keyLight.castShadow = true;
        scene.add(keyLight);

        const rimLight = new THREE.DirectionalLight(0x38bdf8, 1.3);
        rimLight.position.set(-3, 4, -4);
        scene.add(rimLight);

        const turf = new THREE.Mesh(
            new THREE.CylinderGeometry(1.15, 1.25, 0.12, 48),
            new THREE.MeshStandardMaterial({ color: 0x166534, roughness: 0.85 })
        );
        turf.position.y = -0.06;
        turf.receiveShadow = true;
        scene.add(turf);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enablePan = false;
        controls.minDistance = 2.0;
        controls.maxDistance = 4.5;
        controls.maxPolarAngle = Math.PI / 2 + 0.05;
        controls.target.set(0, 0.95, 0);
        controls.update();

        function walkModel(obj, callback) {
            if (!obj) return;
            callback(obj);
            if (Array.isArray(obj.children)) {
                const list = [...obj.children];
                for (const child of list) walkModel(child, callback);
            }
        }

        function drawJerseyPattern(ctx, jersey, width, height) {
            ctx.fillStyle = jersey.c1;
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = jersey.c2;
            if (jersey.pattern === 'stripes') {
                for (let x = 0; x < width; x += 28) ctx.fillRect(x, 0, 14, height);
            } else if (jersey.pattern === 'hoops') {
                for (let y = 0; y < height; y += 34) ctx.fillRect(0, y, width, 17);
            } else if (jersey.pattern === 'half') {
                ctx.fillRect(width * 0.25, 0, width * 0.25, height);
                ctx.fillRect(width * 0.75, 0, width * 0.25, height);
            } else if (jersey.pattern === 'centerBand') {
                ctx.fillRect(width * 0.16, 0, width * 0.18, height);
                ctx.fillRect(width * 0.66, 0, width * 0.18, height);
            } else if (jersey.pattern === 'chestBand') {
                ctx.fillRect(0, height * 0.3, width, height * 0.28);
            } else if (jersey.pattern === 'sash') {
                ctx.beginPath();
                ctx.moveTo(0, 0); ctx.lineTo(width * 0.15, 0);
                ctx.lineTo(width * 0.5, height); ctx.lineTo(width * 0.35, height);
                ctx.closePath(); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(width * 0.5, 0); ctx.lineTo(width * 0.65, 0);
                ctx.lineTo(width, height); ctx.lineTo(width * 0.85, height);
                ctx.closePath(); ctx.fill();
            } else if (jersey.pattern === 'sleeves') {
                ctx.fillRect(0, 0, width * 0.12, height);
                ctx.fillRect(width * 0.38, 0, width * 0.24, height);
                ctx.fillRect(width * 0.88, 0, width * 0.12, height);
            }
        }
        function createSmartKitTexture(baseImg) {
            const jId = localStorage.getItem('eq_jerseys') || 'j1';
            const sId = localStorage.getItem('eq_shorts') || 's1';
            const bId = localStorage.getItem('eq_boots') || 'b1';
            const num = localStorage.getItem('eq_number') || '10';
            const numCol = localStorage.getItem('eq_numColor') || '#ffffff';

            const jersey = CATALOG.jerseys.find(x => x.id === jId) || CATALOG.jerseys.at(0);
            const shortItem = CATALOG.shorts.find(x => x.id === sId) || CATALOG.shorts.at(0);
            const bootItem = CATALOG.boots.find(x => x.id === bId) || CATALOG.boots.at(0);

            const size = 512;
            const patternCanvas = document.createElement('canvas');
            patternCanvas.width = size;
            patternCanvas.height = size;
            const pCtx = patternCanvas.getContext('2d');

            drawJerseyPattern(pCtx, jersey, size, 330);

            pCtx.fillStyle = shortItem.c1;
            pCtx.fillRect(0, 330, size, 182);
            pCtx.fillStyle = shortItem.c2;
            pCtx.fillRect(0, 405, size, 24);

            pCtx.fillStyle = numCol;
            pCtx.strokeStyle = '#000000';
            pCtx.lineWidth = 6;
            pCtx.font = '900 72px "Segoe UI", sans-serif';
            pCtx.textAlign = 'center';
            pCtx.textBaseline = 'middle';
            pCtx.strokeText(num, 256, 150);
            pCtx.fillText(num, 256, 150);

            if (baseImg) {
                const outCanvas = document.createElement('canvas');
                outCanvas.width = size;
                outCanvas.height = size;
                const oCtx = outCanvas.getContext('2d');
                oCtx.drawImage(baseImg, 0, 0, size, size);

                const origData = oCtx.getImageData(0, 0, size, size);
                const patData = pCtx.getImageData(0, 0, size, size);
                const bootCol = new THREE.Color(bootItem.c1);
                const bR = Math.round(bootCol.r * 255);
                const bG = Math.round(bootCol.g * 255);
                const bB = Math.round(bootCol.b * 255);

                for (let i = 0; i < origData.data.length; i += 4) {
                    const r = origData.data[i];
                    const g = origData.data[i + 1];
                    const b = origData.data[i + 2];

                    const isSkin = (
                        r > 135 && g > 85 && b > 55 &&
                        r > g && g > b &&
                        (r - g) >= 12 && (r - g) <= 68 &&
                        (g - b) >= 8 && (g - b) <= 55
                    );
                    const py = Math.floor((i / 4) / size);
                    const isShoe = (py > 410 && r < 75 && g < 75 && b < 75);

                    if (isShoe) {
                        origData.data[i] = bR;
                        origData.data[i + 1] = bG;
                        origData.data[i + 2] = bB;
                    } else if (!isSkin) {
                        const shade = Math.min(1.25, Math.max(0.6, (r + g + b) / 360));
                        origData.data[i] = Math.min(255, patData.data[i] * shade);
                        origData.data[i + 1] = Math.min(255, patData.data[i + 1] * shade);
                        origData.data[i + 2] = Math.min(255, patData.data[i + 2] * shade);
                    }
                }
                oCtx.putImageData(origData, 0, 0);

                const tex = new THREE.CanvasTexture(outCanvas);
                tex.flipY = false;
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.needsUpdate = true;
                return tex;
            }

            const tex = new THREE.CanvasTexture(patternCanvas);
            tex.flipY = false;
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.needsUpdate = true;
            return tex;
        }

        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('./libs/');
        const loader = new GLTFLoader();
        loader.setDRACOLoader(dracoLoader);

        let mixer;

        loader.load('player.glb', (gltf) => {
            const playerModel = gltf.scene || (gltf.scenes && gltf.scenes.at(0));
            if (!playerModel) return;

            let baseImg = null;
            walkModel(playerModel, (child) => {
                if (child.isMesh && child.material) {
                    const name = (child.name || '').toLowerCase();
                    if (!name.includes('hair') && !name.includes('eye')) {
                        const mat = Array.isArray(child.material) ? child.material.at(0) : child.material;
                        if (mat && mat.map && mat.map.image) baseImg = mat.map.image;
                    }
                }
            });

            const kitTex = createSmartKitTexture(baseImg);
            const bId = localStorage.getItem('eq_boots') || 'b1';
            const bootItem = CATALOG.boots.find(x => x.id === bId) || CATALOG.boots.at(0);

            walkModel(playerModel, (child) => {
                if (child.isMesh && child.material) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    const name = (child.name || '').toLowerCase();
                    if (name.includes('hair') || name.includes('eye') || name.includes('lash')) return;

                    if (name.includes('shoe') || name.includes('boot')) {
                        child.material = new THREE.MeshStandardMaterial({ color: bootItem.c1, roughness: 0.45 });
                    } else {
                        child.material = new THREE.MeshStandardMaterial({ map: kitTex, roughness: 0.75 });
                    }
                }
            });

            scene.add(playerModel);

            const firstAnim = gltf.animations && gltf.animations.at(0);
            if (firstAnim) {
                mixer = new THREE.AnimationMixer(playerModel);
                mixer.clipAction(firstAnim).play();
            }

            const loaderScreen = document.getElementById('loader-screen');
            loaderScreen.style.opacity = '0';
            setTimeout(() => loaderScreen.style.display = 'none', 400);
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            alert('Екіпірування та монети збережено! Далі створюємо сам матч пенальті ⚽');
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            if (mixer) mixer.update(clock.getDelta());
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
