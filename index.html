<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Berry Tycoon</title>
<script src="https://telegram.org"></script>
<style>
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
body { font-family: sans-serif; background: #0f1015; color: #fff; margin: 0; padding: 16px; display: flex; flex-direction: column; min-height: 100vh; user-select: none; touch-action: manipulation; }
.card { background: #181a22; border: 1px solid #2a2d3a; border-radius: 14px; padding: 12px; margin-bottom: 12px; }
.row { display: flex; justify-content: space-between; align-items: center; }
.badge { background: rgba(232,67,147,0.2); color: #fd79a8; padding: 4px 10px; border-radius: 8px; font-weight: bold; font-size: 13px; }
.bar-bg { width: 100%; height: 8px; background: #252834; border-radius: 4px; overflow: hidden; margin: 8px 0 4px; }
.bar-fill { height: 100%; width: 0%; background: #e84393; transition: width 0.2s; }
.bal { text-align: center; font-size: 36px; font-weight: 900; color: #ffd32a; margin: 10px 0 4px; }
.sub { text-align: center; font-size: 13px; color: #0be881; margin-bottom: 14px; }
.tap-zone { display: flex; justify-content: center; margin: 10px 0 18px; position: relative; }
.tap-btn { width: 165px; height: 165px; border-radius: 50%; background: radial-gradient(circle, #ff4d79, #b31246); box-shadow: 0 0 30px rgba(232, 67, 147, 0.45); border: 4px solid #ff85a2; color: #fff; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.tap-btn:active { transform: scale(0.92); }
.upg { background: #181a22; border: 1px solid #2a2d3a; border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.btn { background: #e84393; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; min-width: 80px; }
.btn:disabled { background: #252834; color: #57606f; cursor: not-allowed; }
.float { position: absolute; font-size: 22px; font-weight: bold; color: #ffd32a; pointer-events: none; animation: up 0.6s ease-out forwards; }
@keyframes up { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }
</style>
</head>
<body>

<div class="card">
  <div class="row">
    <span class="badge" id="rankName">🥉 Ліга: Садівник</span>
    <span style="color:#ffd32a; font-weight:bold;">Рівень <span id="level">1</span></span>
  </div>
  <div class="bar-bg"><div class="bar-fill" id="xpBar"></div></div>
  <div class="row" style="font-size:11px; color:#8a8f9e;">
    <span>XP: <span id="xp">0</span> / <span id="nextXp">100</span></span>
    <span>Множник: x<span id="mult">1.0</span></span>
  </div>
</div>

<div class="bal">💎 <span id="balance">0</span></div>
<div class="sub">+<span id="autoInc">0</span>/сек • За тап: +<span id="tapInc">1</span></div>

<div class="tap-zone" id="zone">
  <button type="button" class="tap-btn" id="mainBtn">
    <span style="font-size:54px;" id="emoji">🍓</span>
    <span>ЗІБРАТИ</span>
  </button>
</div>

<div style="margin-bottom:14px;">
  <div class="row" style="font-size:12px; font-weight:bold;">
    <span>⚡ Енергія</span>
    <span><span id="en">100</span> / <span id="maxEn">100</span></span>
  </div>
  <div class="bar-bg"><div class="bar-fill" id="enBar" style="background:#ffd32a; width:100%;"></div></div>
</div>

<div class="upg">
  <div><b>👆 Сила збору (Lvl <span id="tLvl">1</span>)</b><div style="font-size:12px;color:#8a8f9e;">+1 до базового кліку</div></div>
  <button type="button" class="btn" id="bTap">25 💎</button>
</div>
<div class="upg">
  <div><b>🤖 Авто-збирач (Lvl <span id="aLvl">0</span>)</b><div style="font-size:12px;color:#8a8f9e;">+2 рубіни щосекунди</div></div>
  <button type="button" class="btn" id="bAuto">50 💎</button>
</div>
<div class="upg">
  <div><b>🔋 Батарея (Lvl <span id="eLvl">1</span>)</b><div style="font-size:12px;color:#8a8f9e;">+50 енергії та швидший заряд</div></div>
  <button type="button" class="btn" id="bEn">40 💎</button>
</div>

<script>
if (window.Telegram && window.Telegram.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}

let s = { bal: 0, xp: 0, lvl: 1, tLvl: 1, aLvl: 0, eLvl: 1, en: 100 };
try {
  const saved = JSON.parse(localStorage.getItem('tycoon_save'));
  if (saved) s = Object.assign(s, saved);
} catch (e) {}

function getRank() {
  if (s.lvl >= 15) return { n: '🌌 Ягідний Імператор', e: '👑', m: 5.0 };
  if (s.lvl >= 10) return { n: '💎 Малиновий Магнат', e: '🍓', m: 3.5 };
  if (s.lvl >= 6) return { n: '🥇 Власник плантації', e: '🍓', m: 2.2 };
  if (s.lvl >= 3) return { n: '🥈 Фермер', e: '🍓', m: 1.5 };
  return { n: '🥉 Ліга: Садівник', e: '🍓', m: 1.0 };
}

function nextXp() { return Math.floor(100 * Math.pow(1.45, s.lvl - 1)); }
function maxEn() { return 100 + (s.eLvl - 1) * 50; }
function tapPower() { return Math.max(1, Math.floor(s.tLvl * getRank().m)); }
function autoPower() { return s.aLvl === 0 ? 0 : Math.floor((s.aLvl * 2) * getRank().m); }
function costTap() { return Math.floor(25 * Math.pow(1.4, s.tLvl - 1)); }
function costAuto() { return Math.floor(50 * Math.pow(1.45, s.aLvl)); }
function costEn() { return Math.floor(40 * Math.pow(1.5, s.eLvl - 1)); }

function addXp(v) {
  s.xp += v;
  while (s.xp >= nextXp()) {
    s.xp -= nextXp();
    s.lvl++;
    s.en = maxEn();
  }
}

function render() {
  const r = getRank();
  document.getElementById('rankName').innerText = r.n;
  document.getElementById('emoji').innerText = r.e;
  document.getElementById('mult').innerText = r.m.toFixed(1);
  document.getElementById('level').innerText = s.lvl;
  document.getElementById('xp').innerText = Math.floor(s.xp);
  document.getElementById('nextXp').innerText = nextXp();
  document.getElementById('xpBar').style.width = Math.min(100, (s.xp / nextXp()) * 100) + '%';
  document.getElementById('balance').innerText = Math.floor(s.bal);
  document.getElementById('autoInc').innerText = autoPower();
  document.getElementById('tapInc').innerText = tapPower();
  document.getElementById('en').innerText = Math.floor(s.en);
  document.getElementById('maxEn').innerText = maxEn();
  document.getElementById('enBar').style.width = ((s.en / maxEn()) * 100) + '%';
  document.getElementById('tLvl').innerText = s.tLvl;
  document.getElementById('aLvl').innerText = s.aLvl;
  document.getElementById('eLvl').innerText = s.eLvl;

  const bt = document.getElementById('bTap');
  bt.innerText = costTap() + ' 💎';
  bt.disabled = s.bal < costTap();

  const ba = document.getElementById('bAuto');
  ba.innerText = costAuto() + ' 💎';
  ba.disabled = s.bal < costAuto();

  const be = document.getElementById('bEn');
  be.innerText = costEn() + ' 💎';
  be.disabled = s.bal < costEn();

  try { localStorage.setItem('tycoon_save', JSON.stringify(s)); } catch (e) {}
}

document.getElementById('mainBtn').onclick = function(e) {
  if (s.en < 1) return;
  s.en--;
  const gain = tapPower();
  s.bal += gain;
  addXp(2);

  const z = document.getElementById('zone');
  const el = document.createElement('div');
  el.className = 'float';
  el.innerText = '+' + gain;
  el.style.left = '45%';
  el.style.top = '20%';
  z.appendChild(el);
  setTimeout(() => el.remove(), 600);

  render();
};

document.getElementById('bTap').onclick = function() {
  if (s.bal >= costTap()) { s.bal -= costTap(); s.tLvl++; addXp(15); render(); }
};

document.getElementById('bAuto').onclick = function() {
  if (s.bal >= costAuto()) { s.bal -= costAuto(); s.aLvl++; addXp(15); render(); }
};

document.getElementById('bEn').onclick = function() {
  if (s.bal >= costEn()) { s.bal -= costEn(); s.eLvl++; s.en = maxEn(); addXp(15); render(); }
};

setInterval(function() {
  if (autoPower() > 0) { s.bal += autoPower(); addXp(1); }
  if (s.en < maxEn()) { s.en = Math.min(maxEn(), s.en + 1 + Math.floor(s.eLvl / 2)); }
  render();
}, 1000);

render();
</script>
</body>
</html>
