<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Champions Penalty — Головна</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:sans-serif;background:#070b14;color:#fff;margin:0;padding:10px;display:flex;flex-direction:column;height:100vh;user-select:none;overflow:hidden;position:relative}
#heroCanvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.top-card{position:relative;z-index:2;background:rgba(11,17,28,.82);backdrop-filter:blur(6px);border:1px solid rgba(75,123,236,.35);border-radius:14px;padding:9px 14px;flex-shrink:0}
.row{display:flex;justify-content:space-between;align-items:center}
.bar{width:100%;height:5px;background:#1e2b3c;border-radius:4px;overflow:hidden;margin:5px 0}
.fill{height:100%;background:#1dd1a1;transition:width .3s}
.stage-wrap{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;touch-action:none;cursor:grab;padding-bottom:10px}
.stage-wrap:active{cursor:grabbing}
.hint-pill{background:rgba(7,11,20,.78);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.18);padding:5px 13px;border-radius:20px;font-size:11px;color:#d1d8e0;pointer-events:none}
.menu-grid{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:8px;flex-shrink:0}
.m-btn{padding:14px 8px;border:none;border-radius:14px;font-weight:bold;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .12s;text-decoration:none}
.m-btn:active{transform:scale(.96)}
.btn-arena{grid-column:span 2;background:linear-gradient(135deg,#1dd1a1,#10ac84);color:#000;font-size:16px;box-shadow:0 4px 16px rgba(29,209,161,.35)}
.btn-ucl{background:linear-gradient(135deg,#1e3799,#3867d6);color:#fff;border:1px solid #4b7bec}
.btn-shop{background:rgba(24,34,48,.92);color:#feca57;border:1px solid #3c4f66}
</style>
</head>
<body>

<canvas id="heroCanvas"></canvas>

<div class="top-card">
  <div class="row">
    <b style="color:#feca57;font-size:14px">Рівень <span id="lv">1</span> • 🏆 ЛЧ: <span id="cp">0</span></b>
    <b style="color:#feca57;font-size:15px">💰 <span id="cn">20</span></b>
  </div>
  <div class="bar"><div class="fill" id="xb"></div></div>
  <div class="row" style="font-size:11px;color:#a5b1c2">
    <span>Досвід XP: <span id="pt">0</span>/<span id="nx">100</span></span>
    <span style="color:#1dd1a1;font-weight:bold">🇺🇦 Твій Клуб • №<span id="heroNumTag">10</span></span>
  </div>
</div>

<div class="stage-wrap" id="stage">
  <div class="hint-pill">👆 Проводь пальцем, щоб покрутити гравця</div>
</div>

<div class="menu-grid">
  <a href="game.html" class="m-btn btn-arena" onclick="localStorage.removeItem('pc_play_ucl')">
    <span>⚽ ШВИДКИЙ МАТЧ (АРЕНА)</span>
    <span style="font-size:11px;font-weight:normal;opacity:.85">Тренування та заробіток монет</span>
  </a>
  <a href="turnir.html" class="m-btn btn-ucl">
    <span>🏆 ЛІГА ЧЕМПІОНІВ</span>
    <span style="font-size:10px;font-weight:normal;color:#d1d8e0">Турнір на виліт</span>
  </a>
  <a href="shop.html" class="m-btn btn-shop">
    <span>🛍 ГАРДЕРОБ / МАГАЗИН</span>
    <span style="font-size:10px;font-weight:normal;color:#a5b1c2">Форма, бутси, номер</span>
  </a>
</div>

<script>
try{window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}catch(e){}

const ITEMS={
  j1:{col:'#1dd1a1'},j2:{col:'#f5f6fa'},j3:{col:'#eb4d4b'},j4:{col:'#3867d6'},j5:{col:'#1e272e'},j6:{col:'#feca57'},
  p1:{col:'#ffffff'},p2:{col:'#1e272e'},p3:{col:'#273c75'},p4:{col:'#eb4d4b'},p5:{col:'#00d2ff'},p6:{col:'#feca57'},
  s1:{col:'#14181d',ac:'#1dd1a1'},s2:{col:'#f5f6fa',ac:'#eb4d4b'},s3:{col:'#00d2ff',ac:'#ffffff'},s4:{col:'#feca57',ac:'#1e272e'},
  b1:{col:'#ffffff'},b2:{col:'#ff5e57'},b3:{col:'#00d2ff'},b4:{col:'#feca57'},
  k1:{col:'#1dd1a1'},k2:{col:'#ff9ff3'}
};

let p={pt:0,lv:1,cp:0,cn:20,ow:['j1','p1','s1','b1','k1'],ej:'j1',ep:'p1',es:'s1',eb:'b1',ek:'k1',num:'10',numCol:'#ffffff',ucl:null};

function loadWallet(){
  try{
    const old=JSON.parse(localStorage.getItem('pc_3d8'));
    const v=JSON.parse(localStorage.getItem('pc_ucl1'));
    if(v)p=Object.assign(p,v);
    else if(old){p=Object.assign(p,old);localStorage.setItem('pc_ucl1',JSON.stringify(p));}
  }catch(e){}
  if(!p.ej)p.ej='j1';
  if(!p.ep)p.ep='p1';
  if(!p.es)p.es='s1';
  if(!p.num)p.num='10';
  if(!p.numCol)p.numCol='#ffffff';
}

loadWallet();
window.addEventListener('pageshow',()=>{loadWallet();updUI();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadWallet();updUI();}});

function updUI(){
  document.getElementById('lv').textContent=p.lv;
  document.getElementById('cp').textContent=p.cp;
  document.getElementById('cn').textContent=p.cn;
  document.getElementById('heroNumTag').textContent=p.num||'10';
  const nxXp=p.lv*100;
  document.getElementById('pt').textContent=p.pt;
  document.getElementById('nx').textContent=nxXp;
  document.getElementById('xb').style.width=Math.min(100,(p.pt/nxXp)*100)+'%';
}

const cvs=document.getElementById('heroCanvas');
const ctx=cvs.getContext('2d');
let W=300,H=300;
function rsz(){
  W=cvs.width=window.innerWidth;
  H=cvs.height=window.innerHeight;
}
window.addEventListener('resize',rsz);

let rotY=0.28,velY=0.005,dragging=false,lastX=0,tAnim=0;
const stageEl=document.getElementById('stage');

stageEl.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;velY=0;});
window.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lastX;lastX=e.clientX;velY=dx*0.015;rotY+=velY;
});
window.addEventListener('pointerup',()=>{dragging=false;});

// Красивий панорамний фон вечірнього стадіону Ліги Чемпіонів
function drawStadiumBackground(){
  const horizon=H*0.54;

  // 1. Нічне небо стадіону
  const sky=ctx.createLinearGradient(0,0,0,horizon);
  sky.addColorStop(0,'#060b16');
  sky.addColorStop(0.55,'#0f2342');
  sky.addColorStop(1,'#1e3c6b');
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,horizon);

  // 2. Чаша трибун (верхній та нижній яруси)
  const standTop=horizon-H*0.24;
  ctx.fillStyle='#0a1220';
  ctx.beginPath();
  ctx.moveTo(0,standTop+18);
  ctx.quadraticCurveTo(W*0.5,standTop-14,W,standTop+18);
  ctx.lineTo(W,horizon);
  ctx.lineTo(0,horizon);
  ctx.closePath();
  ctx.fill();

  // Вогники вболівальників та спалахи камер на трибунах
  for(let r=0;r<7;r++){
    const ry=standTop+16+r*((horizon-standTop-22)/7);
    ctx.strokeStyle=r%2===0?'rgba(56,103,214,0.22)':'rgba(255,255,255,0.08)';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(0,ry+8);
    ctx.quadraticCurveTo(W*0.5,ry-6,W,ry+8);
    ctx.stroke();

    for(let i=0;i<26;i++){
      const fx=(W/26)*i+(r%2)*12;
      const fy=ry+4-Math.sin((i/26)*Math.PI)*10;
      const blink=Math.sin(tAnim*1.4+i*1.7+r*2.3);
      ctx.fillStyle=blink>0.85?'rgba(255,255,255,0.75)':(i%3===0?'rgba(75,123,236,0.45)':'rgba(29,209,161,0.3)');
      ctx.fillRect(fx,fy,3,3);
    }
  }

  // 3. Дах стадіону та потужні прожектори з променями світла
  ctx.strokeStyle='#cfd6de';
  ctx.lineWidth=3.5;
  ctx.beginPath();
  ctx.moveTo(0,standTop+14);
  ctx.quadraticCurveTo(W*0.5,standTop-18,W,standTop+14);
  ctx.stroke();

  [0.16,0.84].forEach(pos=>{
    const lx=W*pos,ly=standTop-6;
    // Промінь прожектора
    const beam=ctx.createRadialGradient(lx,ly,4,W*0.5,H*0.65,H*0.55);
    beam.addColorStop(0,'rgba(220,240,255,0.32)');
    beam.addColorStop(0.5,'rgba(120,170,255,0.08)');
    beam.addColorStop(1,'rgba(7,11,20,0)');
    ctx.fillStyle=beam;
    ctx.beginPath();
    ctx.moveTo(lx-14,ly);
    ctx.lineTo(lx+14,ly);
    ctx.lineTo(W*(pos<0.5?0.85:1.15),H);
    ctx.lineTo(W*(pos<0.5?-0.15:0.15),H);
    ctx.closePath();
    ctx.fill();

    // Лампи прожектора
    ctx.fillStyle='#ffffff';
    ctx.shadowColor='#70a1ff';
    ctx.shadowBlur=14;
    ctx.fillRect(lx-14,ly-5,28,8);
    ctx.shadowBlur=0;
  });

  // 4. Синій LED-борт Ліги Чемпіонів на межі поля
  ctx.fillStyle='#0c2461';
  ctx.fillRect(0,horizon-12,W,12);
  ctx.fillStyle='#4b7bec';
  ctx.fillRect(0,horizon-13,W,2);
  ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.font='bold 8px sans-serif';
  ctx.textAlign='center';
  ctx.fillText('★ UEFA CHAMPIONS LEAGUE  •  3D PENALTY CUP  •  OFFICIAL ARENA ★',W*0.5,horizon-3);

  // 5. Зелений газон із перспективою смуг трави
  const grass=ctx.createLinearGradient(0,horizon,0,H);
  grass.addColorStop(0,'#1b5e20');
  grass.addColorStop(0.45,'#2e7d32');
  grass.addColorStop(1,'#143d18');
  ctx.fillStyle=grass;
  ctx.fillRect(0,horizon,W,H-horizon);

  const stripes=8;
  for(let s=0;s<stripes;s++){
    const t1=s/stripes,t2=(s+1)/stripes;
    const y1=horizon+Math.pow(t1,1.35)*(H-horizon);
    const y2=horizon+Math.pow(t2,1.35)*(H-horizon);
    if(s%2===0){
      ctx.fillStyle='rgba(255,255,255,0.045)';
      ctx.fillRect(0,y1,W,y2-y1);
    }
  }

  // Біла розмітка центрального кола на газоні
  ctx.strokeStyle='rgba(255,255,255,0.32)';
  ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.ellipse(W*0.5,H*0.76,W*0.42,H*0.09,0,0,Math.PI*2);
  ctx.stroke();

  // Легке віньєтування знизу під кнопки меню
  const botFade=ctx.createLinearGradient(0,H*0.78,0,H);
  botFade.addColorStop(0,'rgba(7,11,20,0)');
  botFade.addColorStop(1,'rgba(7,11,20,0.88)');
  ctx.fillStyle=botFade;
  ctx.fillRect(0,H*0.78,W,H*0.22);
}
/* ================= [ КІНЕЦЬ INDEX.HTML : ЧАСТИНА 2 ] ================== */
/* ===================================================================== */
/* ================== [ INDEX.HTML : ЧАСТИНА 3 З 3 ] =================== */
/* ===================================================================== */
function drawLimb(x1,y1,x2,y2,r1,r2,col){
  const ang=Math.atan2(y2-y1,x2-x1);
  const nx=-Math.sin(ang),ny=Math.cos(ang);
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(x1+nx*r1,y1+ny*r1);
  ctx.lineTo(x2+nx*r2,y2+ny*r2);
  ctx.arc(x2,y2,r2,ang-Math.PI/2,ang+Math.PI/2);
  ctx.lineTo(x1-nx*r1,y1-ny*r1);
  ctx.arc(x1,y1,r1,ang+Math.PI/2,ang-Math.PI/2);
  ctx.closePath();
  ctx.fill();
}

function drawHero(){
  tAnim+=0.045;
  if(!dragging){rotY+=velY;velY*=0.95;}
  ctx.clearRect(0,0,W,H);

  // 1. Малюємо красивий вечірній стадіон на фоні
  drawStadiumBackground();

  const cx=W/2,cy=H*0.77;
  const sc=Math.min(W,H)*0.0038;
  const cosR=Math.cos(rotY);
  const sinR=Math.sin(rotY);
  const isBack=cosR<0;

  // 2. Реалістична тінь гравця на траві
  const shGrad=ctx.createRadialGradient(cx,cy+2*sc,4*sc,cx,cy+2*sc,38*sc);
  shGrad.addColorStop(0,'rgba(0,0,0,0.68)');
  shGrad.addColorStop(0.6,'rgba(0,0,0,0.28)');
  shGrad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=shGrad;
  ctx.beginPath();ctx.ellipse(cx,cy+2*sc,38*sc,11*sc,0,0,Math.PI*2);ctx.fill();

  const jerseyCol=(ITEMS[p.ej]||ITEMS.j1).col;
  const shortsCol=(ITEMS[p.ep]||ITEMS.p1).col;
  const sItem=ITEMS[p.es]||ITEMS.s1;
  const bItem=ITEMS[p.eb]||ITEMS.b1;
  const kItem=ITEMS[p.ek]||ITEMS.k1;

  const skin='#e6b88a',skinShade='#c48d59',skinLight='#f3cfa8';
  const breath=Math.sin(tAnim)*1.3*sc;

  ctx.save();
  ctx.translate(cx,cy);

  const wScale=Math.max(0.36,Math.abs(cosR));
  const depthShift=sinR*7*sc;

  // 3. АТЛЕТИЧНІ НОГИ (стегна в шортах, коліна, литкові м'язи в гетрах, бутси)
  [-1,1].forEach(side=>{
    const sgn=side*(cosR>=0?1:-1);
    const stance=side*1.5*sc;
    const hipX=sgn*7.2*sc*wScale+depthShift*0.25;
    const hipY=-58*sc;
    const kneeX=sgn*8.6*sc*wScale+stance*wScale+depthShift*0.45;
    const kneeY=-31*sc;
    const ankleX=sgn*8.4*sc*wScale+stance*1.4*wScale+depthShift*0.65;
    const ankleY=-4.5*sc;

    // Шорти (ширші зверху, об'ємні на стегнах)
    drawLimb(hipX,hipY,kneeX,kneeY+2*sc,8.8*sc,6.8*sc,shortsCol);
    // Тінь між штанинами
    ctx.strokeStyle='rgba(0,0,0,0.22)';
    ctx.lineWidth=1.2*sc;
    ctx.beginPath();ctx.moveTo(0,-54*sc);ctx.lineTo(0,-34*sc);ctx.stroke();

    // Коліно з м'язовим рельєфом
    ctx.fillStyle=skin;
    ctx.beginPath();ctx.arc(kneeX,kneeY+2*sc,4.6*sc,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=skinShade;
    ctx.beginPath();ctx.arc(kneeX+sgn*1*sc,kneeY+3*sc,3.2*sc,0,Math.PI);ctx.fill();

    // Гетри (з анатомічним потовщенням литкового м'яза)
    const calfX=(kneeX+ankleX)*0.5-sinR*1.5*sc;
    const calfY=(kneeY+ankleY)*0.5-2*sc;
    drawLimb(kneeX,kneeY+4*sc,calfX,calfY,5.4*sc,5.8*sc,jerseyCol);
    drawLimb(calfX,calfY,ankleX,ankleY,5.6*sc,3.6*sc,jerseyCol);

    // Біла смужка зверху гетрів
    ctx.fillStyle='#ffffff';
    ctx.fillRect(kneeX-4.8*sc,kneeY+4*sc,9.6*sc,2.5*sc);

    // Реалістичні футбольні бутси з шипами
    const bootDir=sinR*9*sc+(cosR>=0?sgn*2.2*sc:0);
    ctx.fillStyle='#0d1117'; // підошва з шипами
    ctx.fillRect(ankleX-5*sc+bootDir*0.35,ankleY+3.2*sc,11*sc,1.8*sc);

    ctx.fillStyle=sItem.col;
    ctx.beginPath();
    ctx.ellipse(ankleX+bootDir*0.45,ankleY+1.6*sc,8.8*sc,3.8*sc,0,0,Math.PI*2);
    ctx.fill();

    // Дизайнерська вставка та шнурівка на бутсах
    ctx.fillStyle=sItem.ac||'#1dd1a1';
    ctx.beginPath();
    ctx.ellipse(ankleX+bootDir*0.5,ankleY+1.2*sc,4.5*sc,1.5*sc,0.2,0,Math.PI*2);
    ctx.fill();
  });

  // 4. АНАТОМІЧНИЙ ТОРС (V-подібна спортивна статура з м'якими тінями)
  const shW=(19.5*wScale+5.5)*sc;
  const chestW=(17.5*wScale+5)*sc;
  const waistW=(12.5*wScale+4)*sc;

  const torsoGrad=ctx.createLinearGradient(-shW,-106*sc,shW,-55*sc);
  torsoGrad.addColorStop(0,jerseyCol);
  torsoGrad.addColorStop(0.5,jerseyCol);
  torsoGrad.addColorStop(1,'#090d14');

  ctx.fillStyle=torsoGrad;
  ctx.beginPath();
  ctx.moveTo(-shW,-102*sc+breath);
  ctx.quadraticCurveTo(0,-108*sc+breath,shW,-102*sc+breath);
  ctx.lineTo(chestW,-84*sc+breath*0.6);
  ctx.lineTo(waistW,-56*sc);
  ctx.quadraticCurveTo(0,-53*sc,-waistW,-56*sc);
  ctx.lineTo(-chestW,-84*sc+breath*0.6);
  ctx.closePath();
  ctx.fill();

  // Вертикальна тінь хребта / преса для об'єму
  ctx.fillStyle='rgba(0,0,0,0.14)';
  ctx.fillRect(depthShift*0.3-1.5*sc,-98*sc+breath,3*sc,40*sc);

  // Комірець футболки
  ctx.fillStyle='#ffffff';
  ctx.beginPath();ctx.arc(depthShift*0.4,-103*sc+breath,6.2*sc,0.15,Math.PI-0.15);ctx.fill();

  // Номер на спині або клубна емблема на грудях
  if(isBack){
    ctx.fillStyle=p.numCol||'#ffffff';
    ctx.font=`900 ${Math.round(19*sc)}px sans-serif`;
    ctx.textAlign='center';
    ctx.fillText(p.num||'10',-depthShift*0.5,-72*sc+breath);
  }else{
    // Емблема клубу та спонсорська смуга на грудях
    ctx.fillStyle='#feca57';
    ctx.beginPath();ctx.arc(depthShift*0.5+6.5*sc*wScale,-89*sc+breath,3.4*sc,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#ffffff';ctx.lineWidth=1*sc;ctx.stroke();
  }

  // 5. РЕЛЬЄФНІ РУКИ (плече, біцепс, передпліччя, кисть/рукавиця)
  [-1,1].forEach(side=>{
    const sgn=side*(cosR>=0?1:-1);
    const shX=sgn*(shW-2.5*sc),shY=-98*sc+breath;
    const elX=sgn*(shW+6.5*sc)+depthShift*0.4,elY=-77*sc+breath*0.5;
    const hdX=sgn*(shW+8.2*sc)+depthShift*0.8,hdY=-57*sc;

    // Рукав футболки
    drawLimb(shX,shY,(shX+elX)*0.55,(shY+elY)*0.55,6.8*sc,5.6*sc,jerseyCol);
    // Біцепс і передпліччя
    drawLimb((shX+elX)*0.55,(shY+elY)*0.55,elX,elY,5.0*sc,4.3*sc,skin);
    drawLimb(elX,elY,hdX,hdY,4.2*sc,3.1*sc,skinShade);

    // Рукавиця (або відкрита кисть, якщо одягнуті базові)
    ctx.fillStyle=kItem.col;
    ctx.beginPath();ctx.ellipse(hdX,hdY+1*sc,4.6*sc,5.4*sc,sgn*0.15,0,Math.PI*2);ctx.fill();
  });

  // 6. ШИЯ, РЕАЛІСТИЧНЕ ОБЛИЧЧЯ ТА ЗАЧІСКА
  const headX=depthShift*0.5;
  ctx.fillStyle=skinShade;
  ctx.fillRect(headX-4.6*sc,-111*sc+breath,9.2*sc,9*sc);

  // Вуха
  ctx.fillStyle=skinShade;
  ctx.beginPath();
  ctx.ellipse(headX-10.2*sc,-120*sc+breath,2.1*sc,3.4*sc,0,0,Math.PI*2);
  ctx.ellipse(headX+10.2*sc,-120*sc+breath,2.1*sc,3.4*sc,0,0,Math.PI*2);
  ctx.fill();

  // Овал обличчя з м'яким світлом
  const faceGrad=ctx.createRadialGradient(headX-2*sc,-122*sc+breath,2*sc,headX,-120*sc+breath,13*sc);
  faceGrad.addColorStop(0,skinLight);
  faceGrad.addColorStop(0.7,skin);
  faceGrad.addColorStop(1,skinShade);
  ctx.fillStyle=faceGrad;
  ctx.beginPath();ctx.ellipse(headX,-120*sc+breath,10.2*sc,12.6*sc,0,0,Math.PI*2);ctx.fill();

  if(!isBack){
    const eyeOff=sinR*5.5*sc;
    // Брови
    ctx.fillStyle='#2c1e16';
    ctx.fillRect(headX+eyeOff-5.5*sc,-123.5*sc+breath,3.8*sc,1.1*sc);
    ctx.fillRect(headX+eyeOff+1.7*sc,-123.5*sc+breath,3.8*sc,1.1*sc);

    // Очі (білок + зіниця)
    ctx.fillStyle='#ffffff';
    ctx.beginPath();
    ctx.ellipse(headX+eyeOff-3.6*sc,-121*sc+breath,1.8*sc,1.2*sc,0,0,Math.PI*2);
    ctx.ellipse(headX+eyeOff+3.6*sc,-121*sc+breath,1.8*sc,1.2*sc,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle='#1e272e';
    ctx.beginPath();
    ctx.arc(headX+eyeOff-3.5*sc,-121*sc+breath,1.0*sc,0,Math.PI*2);
    ctx.arc(headX+eyeOff+3.5*sc,-121*sc+breath,1.0*sc,0,Math.PI*2);
    ctx.fill();

    // Тінь носа
    ctx.strokeStyle=skinShade;ctx.lineWidth=1.3*sc;
    ctx.beginPath();
    ctx.moveTo(headX+eyeOff,-121*sc+breath);
    ctx.lineTo(headX+eyeOff+sinR*1.5*sc,-117.5*sc+breath);
    ctx.stroke();

    // Впевнена усмішка
    ctx.strokeStyle='#8d5524';ctx.lineWidth=1.4*sc;
    ctx.beginPath();ctx.arc(headX+eyeOff,-115*sc+breath,2.8*sc,0.2,Math.PI-0.2);ctx.stroke();
  }

  // Сучасна об'ємна зачіска
  ctx.fillStyle='#1b222c';
  ctx.beginPath();
  ctx.ellipse(headX,-126*sc+breath,11.2*sc,7.5*sc,0,Math.PI*0.88,Math.PI*2.12);
  ctx.fill();
  // Чубчик зверху
  ctx.beginPath();
  ctx.ellipse(headX+sinR*2*sc,-130.5*sc+breath,7.5*sc,4.2*sc,-0.15,0,Math.PI*2);
  ctx.fill();
  if(isBack){
    ctx.beginPath();ctx.ellipse(headX,-121*sc+breath,10.4*sc,9.2*sc,0,0,Math.PI*2);ctx.fill();
  }

  ctx.restore();

  // 7. ОБ'ЄМНИЙ 3D-М'ЯЧ БІЛЯ НОГИ НА ГАЗОНІ
  const bx=cx+34*sc,by=cy-5*sc,brad=9.5*sc;
  // Тінь м'яча
  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.beginPath();ctx.ellipse(bx,cy+2*sc,10*sc,3.5*sc,0,0,Math.PI*2);ctx.fill();

  const bGrad=ctx.createRadialGradient(bx-3*sc,by-3*sc,1*sc,bx,by,brad);
  bGrad.addColorStop(0,'#ffffff');
  bGrad.addColorStop(0.65,bItem.col);
  bGrad.addColorStop(1,'#1e272e');
  ctx.fillStyle=bGrad;
  ctx.beginPath();ctx.arc(bx,by,brad,0,Math.PI*2);ctx.fill();

  // Футбольні п'ятикутники на м'ячі
  ctx.fillStyle='rgba(15,20,30,0.75)';
  ctx.beginPath();ctx.arc(bx-1*sc,by-1*sc,2.6*sc,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(bx+4.5*sc,by-3*sc,2.0*sc,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(bx-5*sc,by+3*sc,2.0*sc,0,Math.PI*2);ctx.fill();

  requestAnimationFrame(drawHero);
}

rsz();updUI();drawHero();
</script>
