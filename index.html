<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Penalty Cup</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:sans-serif;background:#0d131a;color:#fff;margin:0;padding:10px;display:flex;flex-direction:column;height:100vh;user-select:none;overflow:hidden}
.box{background:#161f29;border:1px solid #263445;border-radius:12px;padding:8px 12px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center}
.bar{width:100%;height:6px;background:#222f3e;border-radius:4px;overflow:hidden;margin:5px 0}
.fill{height:100%;background:#1dd1a1;transition:width .3s}
.stgs{display:flex;justify-content:space-between;font-size:10px;font-weight:bold;color:#576574;margin-top:4px}
.stgs .act{color:#feca57;text-decoration:underline}.stgs .done{color:#1dd1a1}
.pitch{flex:1;position:relative;border-radius:14px;border:2px solid #2ecc71;background:linear-gradient(#1e824c,#2ecc71);margin-bottom:8px;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.goal{width:82%;height:44%;border:4px solid #fff;border-bottom:none;margin-top:14px;position:relative;background:rgba(255,255,255,.06)}
.kp,.bl{position:absolute;left:50%;transform:translateX(-50%);transition:all .3s}
.kp{bottom:4px;font-size:44px}.bl{bottom:16px;font-size:34px}
.msg{position:absolute;top:52%;background:rgba(13,19,26,.9);padding:7px 14px;border-radius:16px;font-weight:bold;font-size:13px;border:1px solid #feca57;text-align:center}
.ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{background:#1e272e;border:2px solid #485460;color:#fff;padding:12px 4px;border-radius:12px;font-weight:bold;font-size:13px;cursor:pointer}
.btn:active{transform:scale(.95)}.btn:disabled{opacity:.4}
.full{grid-column:span 3;border:none;font-size:15px;padding:13px}
</style>
</head>
<body>
<div class="box">
  <div class="row"><b style="color:#54a0ff">⚽ Кубок Пенальті</b><b style="color:#feca57">Рівень <span id="lv">1</span> • 🏆 <span id="cp">0</span></b></div>
  <div class="bar"><div class="fill" id="xb"></div></div>
  <div class="row" style="font-size:11px;color:#8395a7"><span>Очки: <b style="color:#fff" id="pt">0</b>/<span id="nx">100</span></span><span id="op" style="color:#ff9ff3">1/32: ФК Двір</span></div>
  <div class="stgs" id="sb"><span>1/32</span><span>1/16</span><span>1/8</span><span>1/4</span><span>1/2</span><span>ФІНАЛ</span></div>
</div>
<div class="box" style="text-align:center">
  <div style="font-size:26px;font-weight:900;color:#feca57"><span id="ps">0</span> : <span id="bs">0</span></div>
  <div class="row" style="font-size:12px"><span>Ти: <span id="pd">⚪⚪⚪⚪⚪</span></span><span>Бот: <span id="bd">⚪⚪⚪⚪⚪</span></span></div>
</div>
<div class="pitch">
  <div class="goal"><div class="kp" id="kp">🧤</div></div>
  <div class="msg" id="ms">⚽ Твій удар! Вибери кут</div>
  <div class="bl" id="bl">⚽</div>
</div>
<div class="ctrl" id="ct"></div>
<script>
try{window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}catch(e){}
const ST=[{n:'1/32',o:'ФК Двір',r:30},{n:'1/16',o:'ФК Район',r:50},{n:'1/8',o:'ФК Місто',r:80},{n:'1/4',o:'ФК Титан',r:120},{n:'1/2',o:'ФК Легенда',r:180},{n:'ФІНАЛ',o:'Чемпіон',r:300}];
let p={pt:0,lv:1,cp:0,st:0};try{const v=JSON.parse(localStorage.getItem('pc80'));if(v)p=Object.assign(p,v)}catch(e){}
let ph='sh',pS=[],bS=[],bz=0;
const nx=()=>p.lv*100,dots=a=>[0,1,2,3,4].concat(a.length>5?a.slice(5).map((_,i)=>i+5):[]).map(i=>a[i]===1?'🟢':a[i]===0?'🔴':'⚪').join('');
function addP(v){p.pt+=v;while(p.pt>=nx()){p.pt-=nx();p.lv++}}
function ui(){
  lv.innerText=p.lv;cp.innerText=p.cp;pt.innerText=p.pt;nx.innerText=nx();xb.style.width=Math.min(100,p.pt/nx()*100)+'%';
  const cur=ST[p.st]||ST[0];op.innerText=cur.n+': '+cur.o;
  sb.querySelectorAll('span').forEach((s,i)=>s.className=i<p.st?'done':i===p.st?'act':'');
  ps.innerText=pS.filter(x=>x).length;bs.innerText=bS.filter(x=>x).length;pd.innerText=dots(pS);bd.innerText=dots(bS);
  try{localStorage.setItem('pc80',JSON.stringify(p))}catch(e){}
  if(ph==='win')return ct.innerHTML=`<button class="btn full" style="background:#1dd1a1;color:#000" onclick="rst()">➡️ Далі: ${ST[p.st].n}</button>`;
  if(ph==='cup')return ct.innerHTML=`<button class="btn full" style="background:#feca57;color:#000" onclick="rst()">🏆 Новий кубок (з 1/32)</button>`;
  if(ph==='los')return ct.innerHTML=`<button class="btn full" style="background:#ff6b6b" onclick="rst()">🔄 Виліт! Почати з 1/32</button>`;
  const s=ph==='sh',c=s?'#ff9f43':'#54a0ff',t=s?['⬅️ Вліво','⬆️ Центр','➡️ Вправо']:['🧤 Вліво','🧤 Центр','🧤 Вправо'];
  ct.innerHTML=[0,1,2].map(i=>`<button class="btn" style="border-color:${c}" onclick="go(${i})" ${bz?'disabled':''}>${t[i]}</button>`).join('');
}
function anim(b,k){
  const x=['22%','50%','78%'],r=['-30deg','0deg','30deg'];
  kp.style.left=x[k];kp.style.transform=`translateX(-50%) rotate(${r[k]})`;
  bl.style.left=x[b];bl.style.bottom='68%';bl.style.transform='translateX(-50%) scale(.6)';
}
function rstPos(){bl.style.cssText='';kp.style.cssText=''}
function chk(){
  if(pS.length>=5&&pS.length===bS.length){
    const pg=pS.filter(x=>x).length,bg=bS.filter(x=>x).length,cur=ST[p.st];
    if(pg>bg){addP(cur.r);if(p.st>=5){p.cp++;p.st=0;ph='cup';ms.innerText=`🏆 ЧЕМПІОН! +${cur.r} очок!`}else{p.st++;ph='win';ms.innerText=`✅ Перемога ${pg}:${bg}! +${cur.r} очок`}return 1}
    if(bg>pg){addP(5);p.st=0;ph='los';ms.innerText=`❌ Виліт у ${cur.n} (${pg}:${bg})`;return 1}
    ms.innerText=`🔥 Нічия ${pg}:${bg}! До промаху!`;
  }return 0;
}
function go(c){
  if(bz)return;bz=1;ui();const bot=Math.floor(Math.random()*3);
  if(ph==='sh'){anim(c,bot);const g=c!==bot;pS.push(g?1:0);ms.innerText=g?'⚽ ГОООЛ!':'🧤 Сейв воротаря!';setTimeout(()=>{rstPos();ph='sv';bz=0;ms.innerText='🧤 Ти на воротах! Куди стрибати?';ui()},900)}
  else{anim(bot,c);const g=bot!==c;bS.push(g?1:0);ms.innerText=g?'❌ Бот забив!':'🔥 СЕЙВ! Відбив!';setTimeout(()=>{rstPos();bz=0;if(!chk()){ph='sh';ms.innerText='⚽ Твій удар! Вибери кут'}ui()},900)}
}
function rst(){ph='sh';pS=[];bS=[];bz=0;rstPos();ms.innerText='⚽ Твій удар! Вибери кут';ui()}
ui();
</script>
</body>
</html>
