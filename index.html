<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Penalty 3D — Головна</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
        body {
            overflow: hidden;
            background: #071326;
            color: #ffffff;
        }
        #canvas-container { width: 100vw; height: 100vh; display: block; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }

        .ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .top-hud {
            position: absolute;
            top: 18px;
            right: 18px;
            display: flex;
            justify-content: flex-end;
        }
        .coins-pill {
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(10px);
            color: #facc15;
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(250, 204, 21, 0.45);
            font-weight: 800;
            font-size: 1rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.45);
        }

        .menu-actions {
            position: absolute;
            left: 16px;
            top: 52%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: auto;
            z-index: 10;
        }

        .nav-card {
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(12px);
            padding: 12px 16px 12px 14px;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 158px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s, border-color 0.2s, background 0.2s;
        }

        .nav-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 16%;
            bottom: 16%;
            width: 4px;
            border-radius: 0 4px 4px 0;
        }

        .nav-card.play-card::before { background: #22c55e; box-shadow: 0 0 12px #22c55e; }
        .nav-card.shop-card::before { background: #38bdf8; box-shadow: 0 0 12px #38bdf8; }

        .nav-card:hover {
            transform: translateX(5px);
            background: rgba(30, 41, 59, 0.88);
        }
        .nav-card.play-card:hover { border-color: rgba(34, 197, 94, 0.65); }
        .nav-card.shop-card:hover { border-color: rgba(56, 189, 248, 0.65); }

        .nav-icon {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            flex-shrink: 0;
        }
        .play-card .nav-icon { background: rgba(34, 197, 94, 0.2); }
        .shop-card .nav-icon { background: rgba(56, 189, 248, 0.2); }

        .nav-text {
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        .nav-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .nav-sub {
            font-size: 0.68rem;
            font-weight: 600;
            color: #94a3b8;
        }

        #loader-screen {
            position: absolute;
            inset: 0;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            transition: opacity 0.4s;
        }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader-screen">
        <div class="spinner"></div>
        <div id="loader-text">Вихід на стадіон...</div>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <div class="top-hud">
            <div class="coins-pill" id="home-coins">💰 500</div>
        </div>

        <div class="menu-actions">
            <button class="nav-card play-card" id="start-btn">
                <div class="nav-icon">⚽</div>
                <div class="nav-text">
                    <span class="nav-title">ГРАТИ</span>
                    <span class="nav-sub">Серія пенальті</span>
                </div>
            </button>
            <a href="shop.html" class="nav-card shop-card">
                <div class="nav-icon">👕</div>
                <div class="nav-text">
                    <span class="nav-title">ГАРДЕРОБ</span>
                    <span class="nav-sub">Форма та бутси</span>
                </div>
            </a>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "./libs/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from './libs/GLTFLoader.js';
        import { DRACOLoader } from './libs/DRACOLoader.js';
        import { OrbitControls } from './libs/OrbitControls.js';
        import { CATALOG } from './shop-catalog.js';

        if (localStorage.getItem('player_coins') === null) {
            localStorage.setItem('player_coins', '500');
        }
        document.getElementById('home-coins').innerText = `💰 ${localStorage.getItem('player_coins')}`;

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x09162e);
        scene.fog = new THREE.FogExp2(0x09162e, 0.014);

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 180);
        camera.position.set(-0.45, 1.35, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        container.appendChild(renderer.domElement);

        // Освітлення стадіону
        scene.add(new THREE.AmbientLight(0xdbeafe, 1.05));
        const sunLight = new THREE.DirectionalLight(0xffffff, 2.3);
        sunLight.position.set(8, 16, 10);
        sunLight.castShadow = true;
        scene.add(sunLight);

        const backStadiumLight = new THREE.DirectionalLight(0x93c5fd, 1.1);
        backStadiumLight.position.set(-10, 12, -16);
        scene.add(backStadiumLight);

        // Текстура смугастого газону з розміткою штрафного майданчика
        function createPitchTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // Смуги трави
            const stripeCount = 12;
            const stripeH = 1024 / stripeCount;
            for (let i = 0; i < stripeCount; i++) {
                ctx.fillStyle = i % 2 === 0 ? '#15803d' : '#166534';
                ctx.fillRect(0, i * stripeH, 1024, stripeH);
            }

            // Біла розмітка поля
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 7;

            // Зовнішній периметр поля
            ctx.strokeRect(48, 48, 928, 928);

            // Центральна лінія та коло
            ctx.beginPath();
            ctx.moveTo(48, 512);
            ctx.lineTo(976, 512);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(512, 512, 95, 0, Math.PI * 2);
            ctx.stroke();

            // Штрафний майданчик (далекий — позаду гравця)
            ctx.strokeRect(256, 48, 512, 180);
            ctx.strokeRect(384, 48, 256, 68);
            ctx.beginPath();
            ctx.arc(512, 175, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(512, 175, 85, 0.22 * Math.PI, 0.78 * Math.PI);
            ctx.stroke();

            // Штрафний майданчик (ближній — перед гравцем)
            ctx.strokeRect(256, 796, 512, 180);
            ctx.strokeRect(384, 908, 256, 68);
            ctx.beginPath();
            ctx.arc(512, 849, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(512, 849, 85, 1.22 * Math.PI, 1.78 * Math.PI);
            ctx.stroke();

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = 8;
            return tex;
        }

        const stadiumGroup = new THREE.Group();
        scene.add(stadiumGroup);

        // Поле (44x64 м, гравець стоїть у центрі поля біля 11-метрової/центральної зони)
        const pitch = new THREE.Mesh(
            new THREE.PlaneGeometry(46, 66),
            new THREE.MeshStandardMaterial({ map: createPitchTexture(), roughness: 0.85 })
        );
        pitch.rotation.x = -Math.PI / 2;
        pitch.receiveShadow = true;
        stadiumGroup.add(pitch);

        // Бігова доріжка навколо газону
        const track = new THREE.Mesh(
            new THREE.PlaneGeometry(58, 78),
            new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 })
        );
        track.rotation.x = -Math.PI / 2;
        track.position.y = -0.02;
        stadiumGroup.add(track);

        // Ворота позаду гравця (на лінії z = -29.8)
        function createGoal(zPos, rotY) {
            const goal = new THREE.Group();
            const postMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
            const postGeo = new THREE.CylinderGeometry(0.08, 0.08, 2.44, 16);
            const barGeo = new THREE.CylinderGeometry(0.08, 0.08, 7.32, 16);

            const leftPost = new THREE.Mesh(postGeo, postMat);
            leftPost.position.set(-3.66, 1.22, 0);
            const rightPost = new THREE.Mesh(postGeo, postMat);
            rightPost.position.set(3.66, 1.22, 0);
            const crossbar = new THREE.Mesh(barGeo, postMat);
            crossbar.rotation.z = Math.PI / 2;
            crossbar.position.set(0, 2.44, 0);

            const netMat = new THREE.MeshBasicMaterial({
                color: 0xe2e8f0,
                wireframe: true,
                transparent: true,
                opacity: 0.35
            });
            const net = new THREE.Mesh(new THREE.BoxGeometry(7.32, 2.44, 1.8, 18, 6, 5), netMat);
            net.position.set(0, 1.22, -0.9);

            goal.add(leftPost, rightPost, crossbar, net);
            goal.position.set(0, 0, zPos);
            goal.rotation.y = rotY;
            return goal;
        }
        stadiumGroup.add(createGoal(-29.8, 0));
        stadiumGroup.add(createGoal(29.8, Math.PI));

        // 360° трибуни навколо всього стадіону
        const standMat1 = new THREE.MeshStandardMaterial({ color: 0x1e3a8a, roughness: 0.8 });
        const standMat2 = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.85 });
        const adBoardMat = new THREE.MeshBasicMaterial({ color: 0x0284c7 });

        // Задня та передня трибуни
        [-36, 36].forEach((z) => {
            const lowerTier = new THREE.Mesh(new THREE.BoxGeometry(56, 5.5, 8), standMat1);
            lowerTier.position.set(0, 2.75, z);
            const upperTier = new THREE.Mesh(new THREE.BoxGeometry(62, 6.5, 9), standMat2);
            upperTier.position.set(0, 8.2, z + (z < 0 ? -3 : 3));
            const ad = new THREE.Mesh(new THREE.BoxGeometry(48, 0.9, 0.2), adBoardMat);
            ad.position.set(0, 0.45, z + (z < 0 ? 4.2 : -4.2));
            stadiumGroup.add(lowerTier, upperTier, ad);
        });

        // Ліва та права трибуни
        [-27, 27].forEach((x) => {
            const lowerTier = new THREE.Mesh(new THREE.BoxGeometry(8, 5.5, 76), standMat1);
            lowerTier.position.set(x, 2.75, 0);
            const upperTier = new THREE.Mesh(new THREE.BoxGeometry(9, 6.5, 82), standMat2);
            upperTier.position.set(x + (x < 0 ? -3 : 3), 8.2, 0);
            const ad = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.9, 68), adBoardMat);
            ad.position.set(x + (x < 0 ? 4.2 : -4.2), 0.45, 0);
            stadiumGroup.add(lowerTier, upperTier, ad);
        });

        // 4 прожекторні щогли по кутах стадіону
        const poleMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.6, roughness: 0.4 });
        const lampMat = new THREE.MeshBasicMaterial({ color: 0xf0f9ff });
        [[-26, -35], [26, -35], [-26, 35], [26, 35]].forEach(([px, pz]) => {
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 19, 10), poleMat);
            pole.position.set(px, 9.5, pz);
            const panel = new THREE.Mesh(new THREE.BoxGeometry(3.6, 1.8, 0.4), lampMat);
            panel.position.set(px, 18.8, pz);
            panel.lookAt(0, 0, 0);
            stadiumGroup.add(pole, panel);
        });
        const ballMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.14, 24, 24),
            new THREE.MeshStandardMaterial({ roughness: 0.4 })
        );
        ballMesh.position.set(0.38, 0.14, 0.26);
        ballMesh.castShadow = true;
        scene.add(ballMesh);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enablePan = false;
        controls.minDistance = 2.2;
        controls.maxDistance = 5.0;
        controls.maxPolarAngle = Math.PI / 2 - 0.02;
        controls.target.set(-0.32, 0.95, 0);
        controls.update();

        function walkModel(obj, callback) {
            if (!obj) return;
            callback(obj);
            if (Array.isArray(obj.children)) {
                for (const child of [...obj.children]) walkModel(child, callback);
            }
        }

        const leftGloveHolder = new THREE.Group();
        const rightGloveHolder = new THREE.Group();
        let leftHandBone = null;
        let rightHandBone = null;
        let leftForeArmBone = null;
        let rightForeArmBone = null;
        let glovesLoaded = false;
        const gloveMaterials = [];

        function makeBrightDetailTexture(sourceTex) {
            if (!sourceTex || !sourceTex.image) return null;
            try {
                const img = sourceTex.image;
                const w = img.width || 512;
                const h = img.height || 512;
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);

                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const lum = (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) / 255;
                    const boosted = Math.min(255, Math.round((0.55 + lum * 0.45) * 255));
                    data[i] = boosted;
                    data[i + 1] = boosted;
                    data[i + 2] = boosted;
                }
                ctx.putImageData(imgData, 0, 0);

                const cleanTex = new THREE.CanvasTexture(canvas);
                cleanTex.flipY = sourceTex.flipY;
                cleanTex.colorSpace = THREE.SRGBColorSpace;
                cleanTex.needsUpdate = true;
                return cleanTex;
            } catch (e) {
                return null;
            }
        }

        function extractSingleGlove(gloveScene, pickLeft) {
            gloveScene.updateMatrixWorld(true);
            const fullBox = new THREE.Box3().setFromObject(gloveScene);
            const midX = (fullBox.min.x + fullBox.max.x) * 0.5;
            const isSingle = (fullBox.max.x - fullBox.min.x) < (fullBox.max.y - fullBox.min.y) * 1.1;

            const meshGroup = new THREE.Group();

            gloveScene.traverse((node) => {
                if (!node.isMesh || !node.geometry) return;
                const geo = node.geometry.clone();
                geo.applyMatrix4(node.matrixWorld);

                if (!isSingle && geo.index) {
                    const pos = geo.attributes.position;
                    const idx = geo.index.array;
                    const filtered = [];
                    for (let i = 0; i < idx.length; i += 3) {
                        const cx = (pos.getX(idx[i]) + pos.getX(idx[i + 1]) + pos.getX(idx[i + 2])) / 3;
                        if (pickLeft ? cx < midX : cx >= midX) {
                            filtered.push(idx[i], idx[i + 1], idx[i + 2]);
                        }
                    }
                    if (filtered.length === 0) return;
                    geo.setIndex(filtered);
                }

                geo.computeBoundingBox();
                const mats = Array.isArray(node.material) ? node.material : [node.material];
                const clonedMats = mats.map((m) => {
                    const detailMap = makeBrightDetailTexture(m.map);
                    const c = new THREE.MeshStandardMaterial({
                        map: detailMap,
                        normalMap: m.normalMap || null,
                        roughness: 0.55,
                        metalness: 0.05,
                        side: THREE.DoubleSide
                    });
                    gloveMaterials.push(c);
                    return c;
                });

                const mesh = new THREE.Mesh(geo, clonedMats.length === 1 ? clonedMats.at(0) : clonedMats);
                mesh.castShadow = true;
                mesh.frustumCulled = false;
                meshGroup.add(mesh);
            });

            const box = new THREE.Box3().setFromObject(meshGroup);
            const size = new THREE.Vector3();
            box.getSize(size);

            const cuffThresholdY = box.min.y + size.y * 0.15;
            let minCuffX = Infinity, maxCuffX = -Infinity;
            let minCuffZ = Infinity, maxCuffZ = -Infinity;
            let foundCuff = false;

            meshGroup.traverse((m) => {
                if (!m.isMesh || !m.geometry) return;
                const pos = m.geometry.attributes.position;
                const idx = m.geometry.index;
                if (idx) {
                    for (let i = 0; i < idx.count; i++) {
                        const vi = idx.getX(i);
                        const y = pos.getY(vi);
                        if (y <= cuffThresholdY) {
                            const x = pos.getX(vi);
                            const z = pos.getZ(vi);
                            if (x < minCuffX) minCuffX = x;
                            if (x > maxCuffX) maxCuffX = x;
                            if (z < minCuffZ) minCuffZ = z;
                            if (z > maxCuffZ) maxCuffZ = z;
                            foundCuff = true;
                        }
                    }
                }
            });

            const center = new THREE.Vector3();
            box.getCenter(center);
            const pivotX = foundCuff ? (minCuffX + maxCuffX) * 0.5 : center.x;
            const pivotZ = foundCuff ? (minCuffZ + maxCuffZ) * 0.5 : center.z;

            const maxDim = Math.max(size.x, size.y, size.z) || 1;
            const norm = 1.0 / maxDim;

            meshGroup.scale.setScalar(norm);
            meshGroup.position.set(-pivotX * norm, -box.min.y * norm, -pivotZ * norm);

            const unit = new THREE.Group();
            unit.add(meshGroup);
            unit.rotation.y = pickLeft ? Math.PI : 0;
            return unit;
        }

        function attachToSleeveEnd(holder, foreArmBone, handBone) {
            const armBone = foreArmBone || (handBone && handBone.parent);
            if (!armBone) return;

            const wristPos = handBone ? handBone.position.clone() : new THREE.Vector3(0, 24, 0);
            const foreLen = wristPos.length() || 24;
            const dir = wristPos.length() > 0.001 ? wristPos.clone().normalize() : new THREE.Vector3(0, 1, 0);

            const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
            holder.quaternion.copy(q);

            const gloveSize = foreLen * 2.2;
            holder.scale.setScalar(gloveSize);
            holder.position.copy(wristPos).addScaledVector(dir, -gloveSize * 0.25);
            armBone.add(holder);
        }

        function mountGloveModel(gloveScene, gloveColorHex) {
            gloveMaterials.length = 0;
            const rightUnit = extractSingleGlove(gloveScene, false);
            const leftUnit = extractSingleGlove(gloveScene, true);

            rightGloveHolder.clear();
            leftGloveHolder.clear();
            rightGloveHolder.add(rightUnit);
            leftGloveHolder.add(leftUnit);

            attachToSleeveEnd(rightGloveHolder, rightForeArmBone, rightHandBone);
            attachToSleeveEnd(leftGloveHolder, leftForeArmBone, leftHandBone);

            const cleanColor = new THREE.Color(gloveColorHex);
            gloveMaterials.forEach((m) => {
                m.color.copy(cleanColor);
                m.needsUpdate = true;
            });

            glovesLoaded = true;
        }

        function createJerseyTexture(jersey) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = jersey.c1;
            ctx.fillRect(0, 0, 512, 512);

            ctx.fillStyle = jersey.c2;
            if (jersey.pattern === 'stripes') {
                for (let x = 0; x < 512; x += 44) ctx.fillRect(x, 0, 22, 512);
            } else if (jersey.pattern === 'hoops') {
                for (let y = 0; y < 512; y += 44) ctx.fillRect(0, y, 512, 22);
            } else if (jersey.pattern === 'half') {
                ctx.fillRect(105, 0, 60, 512);
                ctx.fillRect(265, 0, 85, 512);
            } else if (jersey.pattern === 'centerBand') {
                ctx.fillRect(85, 0, 45, 512);
                ctx.fillRect(245, 0, 45, 512);
            } else if (jersey.pattern === 'chestBand') {
                ctx.fillRect(0, 160, 512, 130);
            } else if (jersey.pattern === 'sash') {
                ctx.beginPath();
                ctx.moveTo(0, 0); ctx.lineTo(120, 0); ctx.lineTo(512, 512); ctx.lineTo(392, 512);
                ctx.closePath(); ctx.fill();
            } else if (jersey.pattern === 'sleeves') {
                ctx.fillRect(203, 0, 22, 512);
                ctx.fillRect(398, 0, 114, 512);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.flipY = false;
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.needsUpdate = true;
            return tex;
        }
        function createBackNumberTexture(num, numCol) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 256, 256);

            ctx.fillStyle = numCol;
            ctx.strokeStyle = numCol === '#000000' ? '#ffffff' : '#000000';
            ctx.lineWidth = 10;
            ctx.font = '900 165px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.strokeText(num, 128, 128);
            ctx.fillText(num, 128, 128);

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.needsUpdate = true;
            return tex;
        }

        function createBallTexture(c1, c2) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = c1;
            ctx.fillRect(0, 0, 256, 128);
            ctx.fillStyle = c2;
            for (let x = 16; x < 256; x += 48) {
                for (let y = 20; y < 128; y += 44) {
                    ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI * 2); ctx.fill();
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.needsUpdate = true;
            return tex;
        }

        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('./libs/');
        const loader = new GLTFLoader();
        loader.setDRACOLoader(dracoLoader);

        let mixer;

        loader.load('player.glb', (gltf) => {
            const playerModel = gltf.scene || (gltf.scenes && gltf.scenes.at(0));
            if (!playerModel) return;

            const jId = localStorage.getItem('eq_jerseys') || 'j1';
            const sId = localStorage.getItem('eq_shorts') || 's1';
            const bId = localStorage.getItem('eq_boots') || 'b1';
            const gId = localStorage.getItem('eq_gloves') || 'g1';
            const ballId = localStorage.getItem('eq_balls') || 'ball1';
            const num = localStorage.getItem('eq_number') || '10';
            const numCol = localStorage.getItem('eq_numColor') || '#ffffff';

            const jersey = CATALOG.jerseys.find(x => x.id === jId) || CATALOG.jerseys.at(0);
            const shortItem = CATALOG.shorts.find(x => x.id === sId) || CATALOG.shorts.at(0);
            const bootItem = CATALOG.boots.find(x => x.id === bId) || CATALOG.boots.at(0);
            const gloveItem = CATALOG.gloves.find(x => x.id === gId) || CATALOG.gloves.at(0);
            const ballItem = CATALOG.balls.find(x => x.id === ballId) || CATALOG.balls.at(0);

            ballMesh.material.map = createBallTexture(ballItem.c1, ballItem.c2);
            ballMesh.material.needsUpdate = true;

            const jerseyTex = createJerseyTexture(jersey);
            let spineBone = null;

            walkModel(playerModel, (child) => {
                if (child.isBone && child.name) {
                    const n = child.name.toLowerCase();
                    if (n.includes('forearm') && n.includes('left')) leftForeArmBone = child;
                    if (n.includes('forearm') && n.includes('right')) rightForeArmBone = child;

                    if (n.includes('hand') && n.includes('left') && !n.includes('middle') && !n.includes('index') && !n.includes('ring') && !n.includes('pinky') && !n.includes('thumb')) {
                        leftHandBone = child;
                    }
                    if (n.includes('hand') && n.includes('right') && !n.includes('middle') && !n.includes('index') && !n.includes('ring') && !n.includes('pinky') && !n.includes('thumb')) {
                        rightHandBone = child;
                    }

                    if (n.includes('spine2') || (!spineBone && n.includes('spine1'))) {
                        spineBone = child;
                    }
                }

                if (!child.isMesh || !child.material) return;
                child.castShadow = true;
                child.receiveShadow = true;
                const name = (child.name || '').toLowerCase();

                if (name.includes('shirt') || name.includes('top') || name.includes('jersey') || name.includes('torso')) {
                    child.material = new THREE.MeshStandardMaterial({ map: jerseyTex, roughness: 0.7 });
                } else if (name.includes('short') || name.includes('pant')) {
                    child.material = new THREE.MeshStandardMaterial({ color: shortItem.c1, roughness: 0.75 });
                } else if (name.includes('shoe') || name.includes('boot')) {
                    child.material = new THREE.MeshStandardMaterial({ color: bootItem.c1, roughness: 0.4 });
                } else if (Array.isArray(child.material)) {
                    child.material = child.material.map((m, idx) => {
                        const mName = (m.name || '').toLowerCase();
                        if (mName.includes('shirt') || mName.includes('top') || idx === 1) {
                            return new THREE.MeshStandardMaterial({ map: jerseyTex, roughness: 0.7 });
                        }
                        if (mName.includes('short') || idx === 2) {
                            return new THREE.MeshStandardMaterial({ color: shortItem.c1, roughness: 0.75 });
                        }
                        if (mName.includes('shoe') || mName.includes('boot') || idx === 3) {
                            return new THREE.MeshStandardMaterial({ color: bootItem.c1, roughness: 0.4 });
                        }
                        return m;
                    });
                }
            });

            const backNumberMat = new THREE.MeshBasicMaterial({
                map: createBackNumberTexture(num, numCol),
                transparent: true,
                side: THREE.DoubleSide,
                polygonOffset: true,
                polygonOffsetFactor: -4
            });
            const backNumberMesh = new THREE.Mesh(new THREE.PlaneGeometry(34, 34), backNumberMat);

            if (spineBone) {
                backNumberMesh.position.set(0, 1.5, -11.3);
                backNumberMesh.rotation.set(0, Math.PI, 0);
                spineBone.add(backNumberMesh);
            } else {
                backNumberMesh.scale.set(0.01, 0.01, 0.01);
                backNumberMesh.position.set(0, 1.21, -0.113);
                backNumberMesh.rotation.y = Math.PI;
                playerModel.add(backNumberMesh);
            }

            scene.add(playerModel);

            loader.load(
                './glove.glb?v=3',
                (gloveGltf) => {
                    try {
                        const gScene = gloveGltf.scene || (gloveGltf.scenes && gloveGltf.scenes.at(0));
                        if (gScene) mountGloveModel(gScene, gloveItem.c1);
                    } catch (e) {
                        console.error('Помилка рукавиць:', e);
                    }
                },
                undefined,
                (err) => console.error('Помилка завантаження glove.glb:', err)
            );

            const firstAnim = gltf.animations && gltf.animations.at(0);
            if (firstAnim) {
                mixer = new THREE.AnimationMixer(playerModel);
                mixer.clipAction(firstAnim).play();
            }

            const loaderScreen = document.getElementById('loader-screen');
            loaderScreen.style.opacity = '0';
            setTimeout(() => loaderScreen.style.display = 'none', 400);
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            window.location.href = 'game.html';
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        let lastTime = performance.now();
        function animate(now) {
            requestAnimationFrame(animate);
            const dt = (now - lastTime) * 0.001;
            lastTime = now;

            if (mixer) mixer.update(dt);
            if (glovesLoaded) {
                if (leftHandBone) leftHandBone.scale.setScalar(0.0001);
                if (rightHandBone) rightHandBone.scale.setScalar(0.0001);
            }
            ballMesh.rotation.y += 0.01;
            controls.update();
            renderer.render(scene, camera);
        }
        requestAnimationFrame(animate);
    </script>
</body>
</html>
