<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Champions Penalty — Головна</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:sans-serif;background:#070b14;color:#fff;margin:0;padding:10px;display:flex;flex-direction:column;height:100vh;user-select:none;overflow:hidden;position:relative}
#heroCanvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.top-card{position:relative;z-index:2;background:rgba(11,17,28,.84);backdrop-filter:blur(6px);border:1px solid rgba(75,123,236,.35);border-radius:14px;padding:9px 14px;flex-shrink:0}
.row{display:flex;justify-content:space-between;align-items:center}
.bar{width:100%;height:5px;background:#1e2b3c;border-radius:4px;overflow:hidden;margin:5px 0}
.fill{height:100%;background:#1dd1a1;transition:width .3s}
.stage-wrap{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;touch-action:none;cursor:grab;padding-bottom:10px}
.stage-wrap:active{cursor:grabbing}
.hint-pill{background:rgba(7,11,20,.78);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.18);padding:5px 13px;border-radius:20px;font-size:11px;color:#d1d8e0;pointer-events:none}
.menu-grid{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:8px;flex-shrink:0}
.m-btn{padding:14px 8px;border:none;border-radius:14px;font-weight:bold;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .12s;text-decoration:none}
.m-btn:active{transform:scale(.96)}
.btn-arena{grid-column:span 2;background:linear-gradient(135deg,#1dd1a1,#10ac84);color:#000;font-size:16px;box-shadow:0 4px 16px rgba(29,209,161,.35)}
.btn-ucl{background:linear-gradient(135deg,#1e3799,#3867d6);color:#fff;border:1px solid #4b7bec}
.btn-shop{background:rgba(24,34,48,.92);color:#feca57;border:1px solid #3c4f66}
</style>
</head>
<body>

<canvas id="heroCanvas"></canvas>

<div class="top-card">
  <div class="row">
    <b style="color:#feca57;font-size:14px">Рівень <span id="lv">1</span> • 🏆 ЛЧ: <span id="cp">0</span></b>
    <b style="color:#feca57;font-size:15px">💰 <span id="cn">20</span></b>
  </div>
  <div class="bar"><div class="fill" id="xb"></div></div>
  <div class="row" style="font-size:11px;color:#a5b1c2">
    <span>Досвід XP: <span id="pt">0</span>/<span id="nx">100</span></span>
    <span style="color:#1dd1a1;font-weight:bold">🇺🇦 Твій Клуб • №<span id="heroNumTag">10</span></span>
  </div>
</div>

<div class="stage-wrap" id="stage">
  <div class="hint-pill">👆 Проводь пальцем, щоб покрутити гравця</div>
</div>

<div class="menu-grid">
  <a href="game.html" class="m-btn btn-arena" onclick="localStorage.removeItem('pc_play_ucl')">
    <span>⚽ ШВИДКИЙ МАТЧ (АРЕНА)</span>
    <span style="font-size:11px;font-weight:normal;opacity:.85">Тренування та заробіток монет</span>
  </a>
  <a href="turnir.html" class="m-btn btn-ucl">
    <span>🏆 ЛІГА ЧЕМПІОНІВ</span>
    <span style="font-size:10px;font-weight:normal;color:#d1d8e0">Турнір на виліт</span>
  </a>
  <a href="shop.html" class="m-btn btn-shop">
    <span>🛍 ГАРДЕРОБ / МАГАЗИН</span>

<script>
try{window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}catch(e){}

const ITEMS={
  j1:{col:'#1dd1a1',dark:'#0d8a68',trim:'#ffffff'},
  j2:{col:'#f5f6fa',dark:'#cfd6de',trim:'#1e272e'},
  j3:{col:'#d63031',dark:'#8e1b1c',trim:'#ffffff'},
  j4:{col:'#1e3799',dark:'#0c1a52',trim:'#feca57'},
  j5:{col:'#1e272e',dark:'#0b0f14',trim:'#1dd1a1'},
  j6:{col:'#feca57',dark:'#c49014',trim:'#1e272e'},
  p1:{col:'#ffffff',dark:'#cfd6de'},p2:{col:'#1e272e',dark:'#0b0f14'},p3:{col:'#1e3799',dark:'#0c1a52'},
  p4:{col:'#d63031',dark:'#8e1b1c'},p5:{col:'#00a8ff',dark:'#006299'},p6:{col:'#feca57',dark:'#c49014'},
  s1:{col:'#14181d',ac:'#1dd1a1'},s2:{col:'#f5f6fa',ac:'#eb4d4b'},s3:{col:'#00d2ff',ac:'#ffffff'},s4:{col:'#feca57',ac:'#1e272e'},
  b1:{col:'#ffffff'},b2:{col:'#ff5e57'},b3:{col:'#00d2ff'},b4:{col:'#feca57'},
  k1:{col:'#1dd1a1'},k2:{col:'#ff9ff3'}
};

let p={pt:0,lv:1,cp:0,cn:20,ow:['j1','p1','s1','b1','k1'],ej:'j1',ep:'p1',es:'s1',eb:'b1',ek:'k1',num:'10',numCol:'#ffffff',ucl:null};

function loadWallet(){
  try{
    const old=JSON.parse(localStorage.getItem('pc_3d8'));
    const v=JSON.parse(localStorage.getItem('pc_ucl1'));
    if(v)p=Object.assign(p,v);
    else if(old){p=Object.assign(p,old);localStorage.setItem('pc_ucl1',JSON.stringify(p));}
  }catch(e){}
  if(!p.ej)p.ej='j1';
  if(!p.ep)p.ep='p1';
  if(!p.es)p.es='s1';
  if(!p.num)p.num='10';
  if(!p.numCol)p.numCol='#ffffff';
}

loadWallet();
window.addEventListener('pageshow',()=>{loadWallet();updUI();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadWallet();updUI();}});

function updUI(){
  document.getElementById('lv').textContent=p.lv;
  document.getElementById('cp').textContent=p.cp;
  document.getElementById('cn').textContent=p.cn;
  document.getElementById('heroNumTag').textContent=p.num||'10';
  const nxXp=p.lv*100;
  document.getElementById('pt').textContent=p.pt;
  document.getElementById('nx').textContent=nxXp;
  document.getElementById('xb').style.width=Math.min(100,(p.pt/nxXp)*100)+'%';
}

const cvs=document.getElementById('heroCanvas');
const ctx=cvs.getContext('2d');
let W=300,H=300;
function rsz(){
  W=cvs.width=window.innerWidth;
  H=cvs.height=window.innerHeight;
}
window.addEventListener('resize',rsz);

let rotY=0.22,velY=0.004,dragging=false,lastX=0,tAnim=0;
const stageEl=document.getElementById('stage');

stageEl.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;velY=0;});
window.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lastX;lastX=e.clientX;velY=dx*0.015;rotY+=velY;
});
window.addEventListener('pointerup',()=>{dragging=false;});
/* ================= [ КІНЕЦЬ INDEX.HTML : ЧАСТИНА 2 ] ================== */

/* ================== [ INDEX.HTML : ЧАСТИНА 3 З 5 ] =================== */
/* ===================================================================== */
function drawStadiumBackground(){
  const horizon=H*0.54;

  const sky=ctx.createLinearGradient(0,0,0,horizon);
  sky.addColorStop(0,'#050a14');
  sky.addColorStop(0.55,'#0d2140');
  sky.addColorStop(1,'#1b3b69');
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,horizon);

  const standTop=horizon-H*0.24;
  ctx.fillStyle='#0a1220';
  ctx.beginPath();
  ctx.moveTo(0,standTop+18);
  ctx.quadraticCurveTo(W*0.5,standTop-14,W,standTop+18);
  ctx.lineTo(W,horizon);
  ctx.lineTo(0,horizon);
  ctx.closePath();
  ctx.fill();

  for(let r=0;r<7;r++){
    const ry=standTop+16+r*((horizon-standTop-22)/7);
    ctx.strokeStyle=r%2===0?'rgba(56,103,214,0.22)':'rgba(255,255,255,0.08)';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(0,ry+8);
    ctx.quadraticCurveTo(W*0.5,ry-6,W,ry+8);
    ctx.stroke();

    for(let i=0;i<26;i++){
      const fx=(W/26)*i+(r%2)*12;
      const fy=ry+4-Math.sin((i/26)*Math.PI)*10;
      const blink=Math.sin(tAnim*1.4+i*1.7+r*2.3);
      ctx.fillStyle=blink>0.85?'rgba(255,255,255,0.75)':(i%3===0?'rgba(75,123,236,0.45)':'rgba(29,209,161,0.3)');
      ctx.fillRect(fx,fy,3,3);
    }
  }

  ctx.strokeStyle='#cfd6de';
  ctx.lineWidth=3.5;
  ctx.beginPath();
  ctx.moveTo(0,standTop+14);
  ctx.quadraticCurveTo(W*0.5,standTop-18,W,standTop+14);
  ctx.stroke();

  [0.16,0.84].forEach(pos=>{
    const lx=W*pos,ly=standTop-6;
    const beam=ctx.createRadialGradient(lx,ly,4,W*0.5,H*0.65,H*0.55);
    beam.addColorStop(0,'rgba(220,240,255,0.32)');
    beam.addColorStop(0.5,'rgba(120,170,255,0.08)');
    beam.addColorStop(1,'rgba(7,11,20,0)');
    ctx.fillStyle=beam;
    ctx.beginPath();
    ctx.moveTo(lx-14,ly);ctx.lineTo(lx+14,ly);
    ctx.lineTo(W*(pos<0.5?0.85:1.15),H);ctx.lineTo(W*(pos<0.5?-0.15:0.15),H);
    ctx.closePath();ctx.fill();

    ctx.fillStyle='#ffffff';ctx.shadowColor='#70a1ff';ctx.shadowBlur=14;
    ctx.fillRect(lx-14,ly-5,28,8);ctx.shadowBlur=0;
  });

  ctx.fillStyle='#0c2461';
  ctx.fillRect(0,horizon-12,W,12);
  ctx.fillStyle='#4b7bec';
  ctx.fillRect(0,horizon-13,W,2);
  ctx.fillStyle='rgba(255,255,255,0.82)';
  ctx.font='bold 8px sans-serif';
  ctx.textAlign='center';
  ctx.fillText('★ UEFA CHAMPIONS LEAGUE  •  3D PENALTY CUP  •  OFFICIAL ARENA ★',W*0.5,horizon-3);

  const grass=ctx.createLinearGradient(0,horizon,0,H);
  grass.addColorStop(0,'#1b5e20');
  grass.addColorStop(0.45,'#2e7d32');
  grass.addColorStop(1,'#143d18');
  ctx.fillStyle=grass;
  ctx.fillRect(0,horizon,W,H-horizon);

  for(let s=0;s<8;s++){
    const y1=horizon+Math.pow(s/8,1.35)*(H-horizon);
    const y2=horizon+Math.pow((s+1)/8,1.35)*(H-horizon);
    if(s%2===0){ctx.fillStyle='rgba(255,255,255,0.045)';ctx.fillRect(0,y1,W,y2-y1);}
  }

  ctx.strokeStyle='rgba(255,255,255,0.32)';
  ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.ellipse(W*0.5,H*0.76,W*0.42,H*0.09,0,0,Math.PI*2);
  ctx.stroke();

  const botFade=ctx.createLinearGradient(0,H*0.78,0,H);
  botFade.addColorStop(0,'rgba(7,11,20,0)');
  botFade.addColorStop(1,'rgba(7,11,20,0.88)');
  ctx.fillStyle=botFade;
  ctx.fillRect(0,H*0.78,W,H*0.22);
}

function drawCapsule(x1,y1,x2,y2,r1,r2,col){
  const dx=x2-x1,dy=y2-y1;
  const ang=Math.atan2(dy,dx);
  const perp=ang+Math.PI/2;
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.arc(x1,y1,r1,perp,perp+Math.PI);
  ctx.arc(x2,y2,r2,perp+Math.PI,perp);
  ctx.closePath();
  ctx.fill();
}

function drawPlayerBody(sc,cosR,sinR,isBack,breath,jItem,pItem,sItem,kItem){
  const skin='#e4b487',skinShade='#be8450',skinLight='#f6d3af';
  const wScale=Math.max(0.42,Math.abs(cosR));
  const depthShift=sinR*6*sc;

  // 1. АТЛЕТИЧНІ НОГИ (суцільні шорти, плавні коліна, м'язисті литки, бутси)
  [-1,1].forEach(side=>{
    const sgn=side*(cosR>=0?1:-1);
    const hipX=sgn*7.2*sc*wScale+depthShift*0.2,hipY=-56*sc;
    const kneeX=sgn*7.8*sc*wScale+depthShift*0.4,kneeY=-31*sc;
    const ankleX=sgn*7.6*sc*wScale+depthShift*0.55,ankleY=-5*sc;

    // Шорти (об'ємний суцільний крій)
    const shGrad=ctx.createLinearGradient(hipX-9*sc,hipY,hipX+9*sc,hipY);
    shGrad.addColorStop(0,pItem.col);
    shGrad.addColorStop(0.82,pItem.col);
    shGrad.addColorStop(1,pItem.dark||'#1e272e');
    drawCapsule(hipX,hipY,kneeX,kneeY,8.5*sc,6.8*sc,shGrad);

    // Окантовка низу шортів
    ctx.strokeStyle='rgba(255,255,255,0.28)';ctx.lineWidth=1.2*sc;
    ctx.beginPath();ctx.moveTo(kneeX-6.5*sc,kneeY+1*sc);ctx.lineTo(kneeX+6.5*sc,kneeY+1*sc);ctx.stroke();

    // Коліно (плавна шкіра з м'якою тінню)
    drawCapsule(kneeX,kneeY,kneeX,kneeY+6.5*sc,5.0*sc,4.6*sc,skin);
    ctx.fillStyle=skinShade;ctx.beginPath();ctx.arc(kneeX+sgn*1.2*sc,kneeY+3.5*sc,2.2*sc,0,Math.PI);ctx.fill();

    // Гетри з плавним анатомічним вигином литки
    const calfX=(kneeX+ankleX)*0.5-sinR*1.2*sc,calfY=(kneeY+ankleY)*0.5;
    drawCapsule(kneeX,kneeY+6*sc,calfX,calfY,4.8*sc,5.4*sc,jItem.col);
    drawCapsule(calfX,calfY,ankleX,ankleY,5.3*sc,3.4*sc,jItem.dark||jItem.col);

    // Манжет гетрів
    ctx.fillStyle=jItem.trim||'#ffffff';
    ctx.fillRect(kneeX-4.8*sc,kneeY+6*sc,9.6*sc,2.4*sc);

    // Реалістична бутса
    const bootDir=sinR*8*sc+(cosR>=0?sgn*2.2*sc:0);
    ctx.fillStyle='#0d1117';
    ctx.beginPath();ctx.ellipse(ankleX+bootDir*0.4,ankleY+3.2*sc,8.4*sc,2.2*sc,0,0,Math.PI*2);ctx.fill();

    ctx.fillStyle=sItem.col;
    ctx.beginPath();ctx.ellipse(ankleX+bootDir*0.45,ankleY+1.4*sc,8.4*sc,3.6*sc,0,0,Math.PI*2);ctx.fill();

    ctx.fillStyle=sItem.ac||'#1dd1a1';
    ctx.beginPath();ctx.ellipse(ankleX+bootDir*0.5,ankleY+0.9*sc,4.2*sc,1.4*sc,0.15,0,Math.PI*2);ctx.fill();
  });

  // 2. АТЛЕТИЧНИЙ ТОРС У СТИЛІ FIFA
  const shW=(18.5*wScale+5.2)*sc,chestW=(16.5*wScale+4.8)*sc,waistW=(12.4*wScale+4.2)*sc;
  const torsoGrad=ctx.createLinearGradient(-shW,-104*sc,shW,-54*sc);
  torsoGrad.addColorStop(0,jItem.col);
  torsoGrad.addColorStop(0.65,jItem.col);
  torsoGrad.addColorStop(1,jItem.dark||'#090d14');

  ctx.fillStyle=torsoGrad;
  ctx.beginPath();
  ctx.moveTo(-shW,-98*sc+breath);
  ctx.quadraticCurveTo(-shW*0.5,-105*sc+breath,0,-105*sc+breath);
  ctx.quadraticCurveTo(shW*0.5,-105*sc+breath,shW,-98*sc+breath);
  ctx.lineTo(chestW,-80*sc+breath*0.5);
  ctx.lineTo(waistW,-55*sc);
  ctx.quadraticCurveTo(0,-52*sc,-waistW,-55*sc);
  ctx.lineTo(-chestW,-80*sc+breath*0.5);
  ctx.closePath();
  ctx.fill();

  // Складки тканини на футболці
  ctx.strokeStyle='rgba(0,0,0,0.14)';ctx.lineWidth=1.1*sc;
  ctx.beginPath();
  ctx.moveTo(-waistW*0.6,-62*sc);ctx.quadraticCurveTo(0,-66*sc,waistW*0.5,-60*sc);
  ctx.moveTo(-chestW*0.5,-75*sc);ctx.quadraticCurveTo(depthShift*0.3,-78*sc,chestW*0.4,-73*sc);
  ctx.stroke();

  // Спортивний комірець
  ctx.fillStyle=jItem.trim||'#ffffff';
  ctx.beginPath();
  ctx.moveTo(depthShift*0.4-6.2*sc,-103*sc+breath);
  ctx.lineTo(depthShift*0.4,-96.5*sc+breath);
  ctx.lineTo(depthShift*0.4+6.2*sc,-103*sc+breath);
  ctx.quadraticCurveTo(depthShift*0.4,-105*sc+breath,depthShift*0.4-6.2*sc,-103*sc+breath);
  ctx.fill();

  // Номер на спині або емблема та спонсор спереду
  if(isBack){
    ctx.fillStyle=p.numCol||'#ffffff';
    ctx.font=`900 ${Math.round(18*sc)}px sans-serif`;ctx.textAlign='center';
    ctx.fillText(p.num||'10',-depthShift*0.45,-72*sc+breath);
  }else{
    const crestX=depthShift*0.5+6.5*sc*wScale,crestY=-89*sc+breath;
    ctx.fillStyle='#feca57';ctx.beginPath();
    ctx.moveTo(crestX-2.8*sc,crestY-3.2*sc);ctx.lineTo(crestX+2.8*sc,crestY-3.2*sc);
    ctx.lineTo(crestX+2.4*sc,crestY+1.5*sc);ctx.lineTo(crestX,crestY+3.8*sc);ctx.lineTo(crestX-2.4*sc,crestY+1.5*sc);
    ctx.closePath();ctx.fill();ctx.strokeStyle='#1e272e';ctx.lineWidth=0.8*sc;ctx.stroke();

    ctx.fillStyle=jItem.trim||'#ffffff';ctx.globalAlpha=0.85;
    ctx.font=`bold ${Math.max(5,5.5*sc)}px sans-serif`;ctx.textAlign='center';
    ctx.fillText('CHAMPIONS',depthShift*0.45,-77*sc+breath);ctx.globalAlpha=1;
  }

  // 3. ПЛАВНІ, ОБ'ЄМНІ РУКИ (без жодних перекручувань!)
  [-1,1].forEach(side=>{
    const sgn=side*(cosR>=0?1:-1);
    const shX=sgn*(shW-2.5*sc),shY=-97*sc+breath;
    const slvX=sgn*(shW+3.0*sc)+depthShift*0.2,slvY=-85*sc+breath*0.7;
    const elX=sgn*(shW+4.2*sc)+depthShift*0.35,elY=-74*sc+breath*0.4;
    const wrX=sgn*(shW+2.8*sc)+depthShift*0.5,wrY=-57*sc;

    // Рукав футболки
    drawCapsule(shX,shY,slvX,slvY,6.6*sc,5.5*sc,jItem.col);
    // Окантовка манжети рукава
    ctx.strokeStyle=jItem.trim||'#ffffff';ctx.lineWidth=1.5*sc;
    ctx.beginPath();ctx.arc(slvX,slvY,5.4*sc,0.2,Math.PI-0.2);ctx.stroke();

    // Плавний біцепс і передпліччя
    drawCapsule(slvX,slvY,elX,elY,4.8*sc,4.2*sc,skin);
    drawCapsule(elX,elY,wrX,wrY,4.1*sc,2.9*sc,skinShade);

    // Кисть або рукавиця
    ctx.fillStyle=kItem.col;
    ctx.beginPath();ctx.ellipse(wrX,wrY+1.5*sc,3.6*sc,4.5*sc,sgn*-0.1,0,Math.PI*2);ctx.fill();
  });
}
/* ================= [ КІНЕЦЬ INDEX.HTML : ЧАСТИНА 4 ] ================== */

/* ================== [ INDEX.HTML : ЧАСТИНА 5 З 5 ] =================== */

function drawPlayerHead(sc,sinR,isBack,breath){
  const skin='#e4b487',skinShade='#be8450',skinLight='#f6d3af';
  const headX=sinR*6*sc*0.45;

  // Плавна, анатомічна шия з тіньовим градієнтом
  const neckGrad=ctx.createLinearGradient(headX-5*sc,-106*sc,headX+5*sc,-106*sc);
  neckGrad.addColorStop(0,skinShade);
  neckGrad.addColorStop(0.5,skin);
  neckGrad.addColorStop(1,skinShade);
  drawCapsule(headX,-102*sc+breath,headX,-113*sc+breath,5.0*sc,4.5*sc,neckGrad);

  // Вуха
  ctx.fillStyle=skinShade;ctx.beginPath();
  ctx.ellipse(headX-8.8*sc,-120.5*sc+breath,1.7*sc,3.0*sc,0,0,Math.PI*2);
  ctx.ellipse(headX+8.8*sc,-120.5*sc+breath,1.7*sc,3.0*sc,0,0,Math.PI*2);ctx.fill();

  // Реалістичний овал голови з вилицями і підборіддям
  const faceGrad=ctx.createRadialGradient(headX-2*sc,-123*sc+breath,2*sc,headX,-120*sc+breath,12*sc);
  faceGrad.addColorStop(0,skinLight);faceGrad.addColorStop(0.65,skin);faceGrad.addColorStop(1,skinShade);
  ctx.fillStyle=faceGrad;ctx.beginPath();
  ctx.moveTo(headX-8.8*sc,-123*sc+breath);
  ctx.quadraticCurveTo(headX-9.2*sc,-114*sc+breath,headX,-109.5*sc+breath);
  ctx.quadraticCurveTo(headX+9.2*sc,-114*sc+breath,headX+8.8*sc,-123*sc+breath);
  ctx.quadraticCurveTo(headX+8.5*sc,-131*sc+breath,headX,-131*sc+breath);
  ctx.quadraticCurveTo(headX-8.5*sc,-131*sc+breath,headX-8.8*sc,-123*sc+breath);
  ctx.closePath();ctx.fill();

  if(!isBack){
    const eyeOff=sinR*4.8*sc;

    // Виразні брови
    ctx.fillStyle='#231710';ctx.beginPath();
    ctx.ellipse(headX+eyeOff-3.4*sc,-123.5*sc+breath,2.2*sc,0.55*sc,-0.08,0,Math.PI*2);
    ctx.ellipse(headX+eyeOff+3.4*sc,-123.5*sc+breath,2.2*sc,0.55*sc,0.08,0,Math.PI*2);ctx.fill();

    // Очі
    ctx.fillStyle='#ffffff';ctx.beginPath();
    ctx.ellipse(headX+eyeOff-3.3*sc,-121.4*sc+breath,1.6*sc,0.95*sc,0,0,Math.PI*2);
    ctx.ellipse(headX+eyeOff+3.3*sc,-121.4*sc+breath,1.6*sc,0.95*sc,0,0,Math.PI*2);ctx.fill();

    ctx.fillStyle='#3d2314';ctx.beginPath();
    ctx.arc(headX+eyeOff-3.2*sc,-121.4*sc+breath,0.85*sc,0,Math.PI*2);
    ctx.arc(headX+eyeOff+3.2*sc,-121.4*sc+breath,0.85*sc,0,Math.PI*2);ctx.fill();

    // Тінь носа
    ctx.strokeStyle=skinShade;ctx.lineWidth=1.1*sc;ctx.beginPath();
    ctx.moveTo(headX+eyeOff,-121.5*sc+breath);
    ctx.lineTo(headX+eyeOff+sinR*1.2*sc,-117.6*sc+breath);
    ctx.lineTo(headX+eyeOff+sinR*0.5*sc,-117.2*sc+breath);ctx.stroke();

    // Спортивна щетина
    ctx.fillStyle='rgba(35,23,16,0.14)';ctx.beginPath();
    ctx.arc(headX+eyeOff*0.5,-114.5*sc+breath,6.2*sc,0.15,Math.PI-0.15);ctx.fill();

    // Природні губи
    ctx.strokeStyle='#8d5524';ctx.lineWidth=1.2*sc;ctx.beginPath();
    ctx.moveTo(headX+eyeOff-2.2*sc,-114.4*sc+breath);
    ctx.quadraticCurveTo(headX+eyeOff,-113.6*sc+breath,headX+eyeOff+2.2*sc,-114.4*sc+breath);ctx.stroke();
  }

  // Сучасна футбольна зачіска
  ctx.fillStyle='#191e26';ctx.beginPath();
  ctx.moveTo(headX-8.8*sc,-122*sc+breath);
  ctx.quadraticCurveTo(headX-9.5*sc,-132.5*sc+breath,headX,-133.5*sc+breath);
  ctx.quadraticCurveTo(headX+9.5*sc,-132.5*sc+breath,headX+8.8*sc,-122*sc+breath);
  ctx.quadraticCurveTo(headX+7.5*sc,-127.5*sc+breath,headX,-127.5*sc+breath);
  ctx.quadraticCurveTo(headX-7.5*sc,-127.5*sc+breath,headX-8.8*sc,-122*sc+breath);
  ctx.closePath();ctx.fill();

  if(isBack){
    ctx.beginPath();ctx.ellipse(headX,-121.5*sc+breath,8.8*sc,9.5*sc,0,0,Math.PI*2);ctx.fill();
  }
}

function drawHero(){
  tAnim+=0.045;
  if(!dragging){rotY+=velY;velY*=0.95;}
  ctx.clearRect(0,0,W,H);

  drawStadiumBackground();

  const cx=W/2,cy=H*0.77;
  const sc=Math.min(W,H)*0.0038;
  const cosR=Math.cos(rotY),sinR=Math.sin(rotY);
  const isBack=cosR<0;
  const breath=Math.sin(tAnim)*1.1*sc;

  const shGrad=ctx.createRadialGradient(cx,cy+2*sc,3*sc,cx,cy+2*sc,36*sc);
  shGrad.addColorStop(0,'rgba(0,0,0,0.72)');shGrad.addColorStop(0.6,'rgba(0,0,0,0.28)');shGrad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=shGrad;ctx.beginPath();ctx.ellipse(cx,cy+2*sc,36*sc,10*sc,0,0,Math.PI*2);ctx.fill();

  const jItem=ITEMS[p.ej]||ITEMS.j1;
  const pItem=ITEMS[p.ep]||ITEMS.p1;
  const sItem=ITEMS[p.es]||ITEMS.s1;
  const bItem=ITEMS[p.eb]||ITEMS.b1;
  const kItem=ITEMS[p.ek]||ITEMS.k1;

  ctx.save();
  ctx.translate(cx,cy);
  drawPlayerBody(sc,cosR,sinR,isBack,breath,jItem,pItem,sItem,kItem);
  drawPlayerHead(sc,sinR,isBack,breath);
  ctx.restore();

  const bx=cx+32*sc,by=cy-5*sc,brad=9.2*sc;
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.beginPath();ctx.ellipse(bx,cy+2*sc,9.5*sc,3.2*sc,0,0,Math.PI*2);ctx.fill();

  const bGrad=ctx.createRadialGradient(bx-3*sc,by-3*sc,1*sc,bx,by,brad);
  bGrad.addColorStop(0,'#ffffff');bGrad.addColorStop(0.65,bItem.col);bGrad.addColorStop(1,'#1e272e');
  ctx.fillStyle=bGrad;ctx.beginPath();ctx.arc(bx,by,brad,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='rgba(15,20,30,0.78)';
  ctx.beginPath();ctx.arc(bx-1*sc,by-1*sc,2.5*sc,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(bx+4.2*sc,by-2.8*sc,1.9*sc,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(bx-4.6*sc,by+2.8*sc,1.9*sc,0,Math.PI*2);ctx.fill();

  requestAnimationFrame(drawHero);
}

rsz();updUI();drawHero();
</script>
