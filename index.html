<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Penalty 3D — Головна</title>
    <script src="https://telegram.org"></script>
    <style>
        /* ==================== ПОЧАТОК ЧАСТИНИ 1 з 9 ==================== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            overflow: hidden;
            background: #071326;
            color: #ffffff;
        }
        #canvas-container { width: 100vw; height: 100vh; display: block; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }

        .ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .top-hud {
            position: absolute;
            top: 18px;
            right: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }
        .sound-btn {
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(10px);
            color: #f8fafc;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.45);
        }
        .coins-pill {
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(10px);
            color: #facc15;
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(250, 204, 21, 0.45);
            font-weight: 800;
            font-size: 1rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.45);
        }

        .menu-actions {
            position: absolute;
            left: 16px;
            top: 52%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 11px;
            pointer-events: auto;
            z-index: 10;
        }
        /* ==================== КІНЕЦЬ ЧАСТИНИ 1 з 9 ==================== */
        /* ==================== ПОЧАТОК ЧАСТИНИ 2 з 9 ==================== */
        .nav-card {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 196px;
            padding: 12px 15px;
            border-radius: 18px;
            text-decoration: none;
            color: #ffffff;
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(10px);
            border: 1.5px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 10px 24px rgba(0,0,0,0.45);
            cursor: pointer;
            transition: transform 0.16s, border-color 0.16s;
            text-align: left;
        }
        .nav-card:active { transform: scale(0.96); }
        .play-card {
            background: linear-gradient(135deg, #16a34a, #15803d);
            border-color: #4ade80;
            box-shadow: 0 12px 28px rgba(22, 163, 74, 0.45);
        }
        .rank-card { border-color: rgba(250, 204, 21, 0.45); }
        .shop-card { border-color: rgba(56, 189, 248, 0.4); }
        .nav-icon { font-size: 1.45rem; }
        .nav-text { display: flex; flex-direction: column; }
        .nav-title { font-weight: 900; font-size: 0.92rem; letter-spacing: 0.3px; }
        .nav-sub { font-size: 0.72rem; color: rgba(255,255,255,0.75); font-weight: 600; }

        #settings-modal {
            position: fixed;
            inset: 0;
            background: rgba(4, 11, 23, 0.84);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 40;
        }
        #settings-modal.open { display: flex; }
        .modal-box {
            width: 100%;
            max-width: 350px;
            background: #0f172a;
            border: 1.5px solid rgba(56, 189, 248, 0.4);
            border-radius: 22px;
            padding: 20px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.7);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .modal-header h3 { font-size: 1.1rem; font-weight: 800; }
        .close-modal {
            background: #1e293b;
            color: #cbd5e1;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: 800;
            cursor: pointer;
        }
        .setting-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }
        .setting-row label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
        }
        .setting-row input[type="range"] {
            width: 100%;
            accent-color: #22c55e;
            cursor: pointer;
        }
        .toggle-btn {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            background: #1e293b;
            color: #f8fafc;
            font-weight: 800;
            cursor: pointer;
        }
        .toggle-btn.active {
            background: rgba(34, 197, 94, 0.2);
            border-color: #22c55e;
            color: #4ade80;
        }

        #loader-screen {
            position: absolute;
            inset: 0;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            transition: opacity 0.4s;
        }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* ==================== КІНЕЦЬ ЧАСТИНИ 2 з 9 ==================== */
    </style>
</head>
<body>

    <div id="loader-screen">
        <div class="spinner"></div>
        <div id="loader-text">Завантаження стадіону...</div>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <div class="top-hud">
            <button class="sound-btn" id="quick-sound-btn" title="Звук трибун">🔊</button>
            <div class="coins-pill" id="home-coins">💰 500</div>
        </div>

        <div class="menu-actions">
            <button class="nav-card play-card" id="start-btn">
                <div class="nav-icon">⚽</div>
                <div class="nav-text">
                    <span class="nav-title">ГРАТИ</span>
                    <span class="nav-sub">Серія пенальті</span>
                </div>
            </button>
            <a href="statustuka.html" class="nav-card rank-card">
                <div class="nav-icon">🏆</div>
                <div class="nav-text">
                    <span class="nav-title">РЕЙТИНГ</span>
                    <span class="nav-sub">ТОП гравців</span>
                </div>
            </a>
            <a href="shop.html" class="nav-card shop-card">
                <div class="nav-icon">👕</div>
                <div class="nav-text">
                    <span class="nav-title">ГАРДЕРОБ</span>
                    <span class="nav-sub">Форма та бутси</span>
                </div>
            </a>
            <button class="nav-card settings-card" id="settings-btn">
                <div class="nav-icon">⚙️</div>
                <div class="nav-text">
                    <span class="nav-title">НАЛАШТУВАННЯ</span>
                    <span class="nav-sub">Звук та графіка</span>
                </div>
            </button>
        </div>
    </div>

    <div id="settings-modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>⚙️ Налаштування</h3>
                <button class="close-modal" id="close-settings">✕</button>
            </div>
            <div class="setting-row">
                <label>Гучність трибун <span id="vol-label">70%</span></label>
                <input type="range" id="stadium-vol" min="0" max="100" value="70">
            </div>
            <div class="setting-row">
                <button class="toggle-btn active" id="toggle-crowd-sound">🔊 Спів та гул трибун: УВІМК</button>
            </div>
            <div class="setting-row">
                <button class="toggle-btn active" id="toggle-shadows">✨ Тіні та деталізація: ВИСОКА</button>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "./libs/three.module.js"
            }
        }
    </script>
    <script type="module">
        // ==================== ПОЧАТОК ЧАСТИНИ 3 з 9 ====================
        import * as THREE from 'three';
        import { GLTFLoader } from './libs/GLTFLoader.js';
        import { DRACOLoader } from './libs/DRACOLoader.js';
        import { OrbitControls } from './libs/OrbitControls.js';
        import { CATALOG } from './shop-catalog.js';

        if (localStorage.getItem('player_coins') === null) {
            localStorage.setItem('player_coins', '500');
        }
        document.getElementById('home-coins').innerText = `💰 ${localStorage.getItem('player_coins')}`;

        class StadiumChantAudio {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.enabled = localStorage.getItem('stadium_sound') !== 'off';
                this.volume = Number(localStorage.getItem('stadium_vol') || 70) / 100;
                this.started = false;
            }

            init() {
                if (this.started || !this.enabled) return;
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;

                this.ctx = new AudioCtx();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = this.volume * 0.45;
                this.masterGain.connect(this.ctx.destination);

                const bufferSize = this.ctx.sampleRate * 4;
                const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                let b0 = 0, b1 = 0, b2 = 0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    b0 = 0.997 * b0 + white * 0.029;
                    b1 = 0.985 * b1 + white * 0.032;
                    b2 = 0.950 * b2 + white * 0.048;
                    output[i] = (b0 + b1 + b2) * 0.35;
                }

                const crowdNoise = this.ctx.createBufferSource();
                crowdNoise.buffer = noiseBuffer;
                crowdNoise.loop = true;

                const crowdFilter = this.ctx.createBiquadFilter();
                crowdFilter.type = 'bandpass';
                crowdFilter.frequency.value = 480;
                crowdFilter.Q.value = 0.7;

                crowdNoise.connect(crowdFilter);
                crowdFilter.connect(this.masterGain);
                crowdNoise.start();

                const chantNotes = new Array(261.63, 293.66, 329.63, 293.66, 329.63, 392.00);
                let step = 0;
                setInterval(() => {
                    if (!this.enabled || !this.ctx || this.ctx.state !== 'running') return;
                    const now = this.ctx.currentTime;
                    const freq = chantNotes[step % chantNotes.length];
                    step++;

                    new Array(-4, 0, 5).forEach((detune) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        const filter = this.ctx.createBiquadFilter();

                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now);
                        osc.detune.value = detune * 6;

                        filter.type = 'lowpass';
                        filter.frequency.value = 620;

                        gain.gain.setValueAtTime(0.0001, now);
                        gain.gain.linearRampToValueAtTime(0.045, now + 0.14);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.65);

                        osc.connect(filter);
                        filter.connect(gain);
                        gain.connect(this.masterGain);

                        osc.start(now);
                        osc.stop(now + 0.68);
                    });
                }, 720);

                this.started = true;
            }

            setVolume(v) {
                this.volume = v;
                localStorage.setItem('stadium_vol', String(Math.round(v * 100)));
                if (this.masterGain) this.masterGain.gain.value = this.enabled ? v * 0.45 : 0;
            }

            toggle() {
                this.enabled = !this.enabled;
                localStorage.setItem('stadium_sound', this.enabled ? 'on' : 'off');
                if (this.enabled && !this.started) this.init();
                if (this.ctx && this.ctx.state === 'suspended' && this.enabled) this.ctx.resume();
                if (this.masterGain) this.masterGain.gain.value = this.enabled ? this.volume * 0.45 : 0;
                return this.enabled;
            }
        }

        const stadiumAudio = new StadiumChantAudio();
        window.addEventListener('pointerdown', () => {
            stadiumAudio.init();
            if (stadiumAudio.ctx && stadiumAudio.ctx.state === 'suspended' && stadiumAudio.enabled) {
                stadiumAudio.ctx.resume();
            }
        }, { once: true });

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x071326);
        scene.fog = new THREE.FogExp2(0x071326, 0.011);

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(1.15, 1.55, 4.15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.enablePan = false;
        controls.minDistance = 2.4;
        controls.maxDistance = 6.2;
        controls.minPolarAngle = Math.PI * 0.28;
        controls.maxPolarAngle = Math.PI * 0.48;
        controls.target.set(-0.35, 1.05, 0);
        controls.update();

        scene.add(new THREE.AmbientLight(0xdbeafe, 1.05));
        const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
        keyLight.position.set(6, 12, 8);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.set(2048, 2048);
        scene.add(keyLight);

        const rimLight = new THREE.DirectionalLight(0x38bdf8, 1.3);
        rimLight.position.set(-7, 8, -9);
        scene.add(rimLight);
        // ==================== КІНЕЦЬ ЧАСТИНИ 3 з 9 ====================
        // ==================== ПОЧАТОК ЧАСТИНИ 4 з 9 ====================
        function createPitchTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            const stripeCount = 12;
            const stripeH = 1024 / stripeCount;
            for (let i = 0; i < stripeCount; i++) {
                ctx.fillStyle = i % 2 === 0 ? '#15803d' : '#166534';
                ctx.fillRect(0, i * stripeH, 1024, stripeH);
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
            ctx.lineWidth = 7;
            ctx.strokeRect(48, 48, 928, 928);

            ctx.beginPath();
            ctx.moveTo(48, 512);
            ctx.lineTo(976, 512);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(512, 512, 95, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeRect(236, 48, 552, 210);
            ctx.strokeRect(374, 48, 276, 78);
            ctx.beginPath();
            ctx.arc(512, 204, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(512, 204, 88, 0.22 * Math.PI, 0.78 * Math.PI);
            ctx.stroke();

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = 8;
            return tex;
        }

        const stadiumGroup = new THREE.Group();
        scene.add(stadiumGroup);

        const pitch = new THREE.Mesh(
            new THREE.PlaneGeometry(46, 66),
            new THREE.MeshStandardMaterial({ map: createPitchTexture(), roughness: 0.85 })
        );
        pitch.rotation.x = -Math.PI / 2;
        pitch.receiveShadow = true;
        stadiumGroup.add(pitch);

        const track = new THREE.Mesh(
            new THREE.PlaneGeometry(66, 86),
            new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 })
        );
        track.rotation.x = -Math.PI / 2;
        track.position.y = -0.02;
        stadiumGroup.add(track);

        const goalMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
        const goalGroup = new THREE.Group();
        const postGeo = new THREE.CylinderGeometry(0.08, 0.08, 2.44, 16);
        const barGeo = new THREE.CylinderGeometry(0.08, 0.08, 7.32, 16);
        const p1 = new THREE.Mesh(postGeo, goalMat); p1.position.set(-3.66, 1.22, -29.8);
        const p2 = new THREE.Mesh(postGeo, goalMat); p2.position.set(3.66, 1.22, -29.8);
        const bar = new THREE.Mesh(barGeo, goalMat); bar.rotation.z = Math.PI / 2; bar.position.set(0, 2.44, -29.8);
        const net = new THREE.Mesh(
            new THREE.BoxGeometry(7.32, 2.44, 1.8),
            new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.25 })
        );
        net.position.set(0, 1.22, -30.7);
        goalGroup.add(p1, p2, bar, net);
        stadiumGroup.add(goalGroup);

        function createBannerTexture() {
            const c = document.createElement('canvas');
            c.width = 2048; c.height = 128;
            const ctx = c.getContext('2d');
            const g = ctx.createLinearGradient(0, 0, 2048, 0);
            g.addColorStop(0, '#0284c7'); g.addColorStop(0.5, '#1d4ed8'); g.addColorStop(1, '#0284c7');
            ctx.fillStyle = g; ctx.fillRect(0, 0, 2048, 128);
            ctx.fillStyle = '#38bdf8'; ctx.fillRect(0, 0, 2048, 10); ctx.fillRect(0, 118, 2048, 10);
            ctx.fillStyle = '#ffffff'; ctx.font = '900 54px "Segoe UI", sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('⚽ PENALTY 3D ARENA   ★   CHAMPIONS CUP   ★   GOAL TIME! 🔥', 1024, 66);
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping; tex.repeat.set(3, 1); tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }
        const bannerTex = createBannerTexture();
        const adMat = new THREE.MeshBasicMaterial({ map: bannerTex });

        const adBack = new THREE.Mesh(new THREE.BoxGeometry(52, 1.25, 0.25), adMat);
        adBack.position.set(0, 0.62, -32.4);
        const adFront = new THREE.Mesh(new THREE.BoxGeometry(52, 1.25, 0.25), adMat);
        adFront.position.set(0, 0.62, 32.4);
        const adLeft = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1.25, 66), adMat);
        adLeft.position.set(-24.2, 0.62, 0);
        const adRight = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1.25, 66), adMat);
        adRight.position.set(24.2, 0.62, 0);
        stadiumGroup.add(adBack, adFront, adLeft, adRight);

        const tierMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85 });
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.6, roughness: 0.35 });
        const fanPositions = [];
        const seatPositions = [];
        const phonePositions = [];

        function buildSideStand(side) {
            const rows = 9;
            const standLen = 68;
            for (let r = 0; r < rows; r++) {
                const rowY = 1.35 + r * 0.68;
                const xDist = 25.4 + r * 1.02;
                const step = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.68, standLen), tierMat);
                step.position.set(side * xDist, rowY - 0.34, 0);
                stadiumGroup.add(step);

                for (let z = -31.5; z <= 31.5; z += 0.86) {
                    const aisle = Math.abs((Math.abs(z) % 13) - 6.5);
                    if (aisle < 0.72) continue;

                    seatPositions.push({ x: side * xDist, y: rowY + 0.12, z: z, rotY: side === -1 ? Math.PI / 2 : -Math.PI / 2 });

                    if (Math.random() > 0.14) {
                        const px = side * (xDist - 0.08) + (Math.random() - 0.5) * 0.1;
                        const pz = z + (Math.random() - 0.5) * 0.14;
                        const rotY = side === -1 ? Math.PI / 2 : -Math.PI / 2;
                        const hasPhone = Math.random() < 0.12;
                        const hasScarf = !hasPhone && Math.random() < 0.18;
                        fanPositions.push({ x: px, y: rowY, z: pz, rotY, phase: Math.random() * Math.PI * 2, hasPhone, hasScarf });
                        if (hasPhone) phonePositions.push({ x: px - side * 0.25, y: rowY + 0.92, z: pz, phase: Math.random() * 6.28 });
                    }
                }
            }
            const roof = new THREE.Mesh(new THREE.BoxGeometry(11.5, 0.45, standLen + 2), roofMat);
            roof.position.set(side * 30.2, 8.8, 0);
            roof.rotation.z = side * -0.14;
            stadiumGroup.add(roof);
        }

        function buildEndStand(endSide) {
            const rows = 8;
            const standW = 54;
            for (let r = 0; r < rows; r++) {
                const rowY = 1.35 + r * 0.68;
                const zDist = 33.6 + r * 1.02;
                const step = new THREE.Mesh(new THREE.BoxGeometry(standW, 0.68, 1.05), tierMat);
                step.position.set(0, rowY - 0.34, endSide * zDist);
                stadiumGroup.add(step);

                for (let x = -24.5; x <= 24.5; x += 0.88) {
                    const aisle = Math.abs((Math.abs(x) % 11) - 5.5);
                    if (aisle < 0.75) continue;

                    seatPositions.push({ x: x, y: rowY + 0.12, z: endSide * zDist, rotY: endSide === -1 ? 0 : Math.PI });

                    if (Math.random() > 0.16) {
                        const px = x + (Math.random() - 0.5) * 0.14;
                        const pz = endSide * (zDist - 0.08) + (Math.random() - 0.5) * 0.1;
                        const rotY = endSide === -1 ? 0 : Math.PI;
                        const hasPhone = Math.random() < 0.12;
                        const hasScarf = !hasPhone && Math.random() < 0.18;
                        fanPositions.push({ x: px, y: rowY, z: pz, rotY, phase: Math.random() * Math.PI * 2, hasPhone, hasScarf });
                        if (hasPhone) phonePositions.push({ x: px, y: rowY + 0.92, z: pz - endSide * 0.25, phase: Math.random() * 6.28 });
                    }
                }
            }
            const roof = new THREE.Mesh(new THREE.BoxGeometry(standW + 18, 0.45, 11.5), roofMat);
            roof.position.set(0, 8.8, endSide * 38.0);
            roof.rotation.x = endSide * 0.14;
            stadiumGroup.add(roof);
        }

        buildSideStand(-1);
        buildSideStand(1);
        buildEndStand(-1);
        buildEndStand(1);
        // ==================== КІНЕЦЬ ЧАСТИНИ 4 з 9 ====================
        // ==================== ПОЧАТОК ЧАСТИНИ 5 з 9 ====================
        const dummy = new THREE.Object3D();
        const tmpColor = new THREE.Color();

        function createJerseyTexture(jersey) {
            const c = document.createElement('canvas');
            c.width = 512; c.height = 512;
            const ctx = c.getContext('2d');
            ctx.fillStyle = jersey.c1; ctx.fillRect(0, 0, 512, 512);
            ctx.fillStyle = jersey.c2;

            if (jersey.pattern === 'stripes') {
                for (let x = 0; x < 512; x += 44) ctx.fillRect(x, 0, 22, 512);
            } else if (jersey.pattern === 'hoops') {
                for (let y = 0; y < 512; y += 44) ctx.fillRect(0, y, 512, 22);
            } else if (jersey.pattern === 'half') {
                ctx.fillRect(105, 0, 60, 512);
                ctx.fillRect(265, 0, 85, 512);
            } else if (jersey.pattern === 'centerBand') {
                ctx.fillRect(85, 0, 45, 512);
                ctx.fillRect(245, 0, 45, 512);
            } else if (jersey.pattern === 'chestBand') {
                ctx.fillRect(0, 160, 512, 130);
            } else if (jersey.pattern === 'sash') {
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(120, 0); ctx.lineTo(512, 512); ctx.lineTo(392, 512); ctx.closePath(); ctx.fill();
            } else if (jersey.pattern === 'sleeves') {
                ctx.fillRect(203, 0, 22, 512);
                ctx.fillRect(398, 0, 114, 512);
            }

            const tex = new THREE.CanvasTexture(c);
            tex.flipY = false;
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createBackNumberTexture(num, numCol) {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = numCol;
            ctx.strokeStyle = numCol === '#000000' ? '#ffffff' : '#000000';
            ctx.lineWidth = 10;
            ctx.font = '900 165px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.strokeText(num, 128, 128);
            ctx.fillText(num, 128, 128);
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createBallTexture(c1, c2) {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 128;
            const ctx = c.getContext('2d');
            ctx.fillStyle = c1; ctx.fillRect(0, 0, 256, 128);
            ctx.fillStyle = c2;
            for (let x = 16; x < 256; x += 48) {
                for (let y = 20; y < 128; y += 44) {
                    ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI * 2); ctx.fill();
                }
            }
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function mountGlovePair(gloveScene, gloveColorHex) {
            gloveScene.updateMatrixWorld(true);
            const fullBox = new THREE.Box3().setFromObject(gloveScene);
            const midX = (fullBox.min.x + fullBox.max.x) * 0.5;
            const isSingle = (fullBox.max.x - fullBox.min.x) < (fullBox.max.y - fullBox.min.y) * 1.1;

            function buildHalf(pickLeft) {
                const grp = new THREE.Group();
                gloveScene.traverse((node) => {
                    if (!node.isMesh || !node.geometry) return;
                    const geo = node.geometry.clone();
                    geo.applyMatrix4(node.matrixWorld);
                    if (!isSingle && geo.index) {
                        const pos = geo.attributes.position;
                        const idx = geo.index.array;
                        const filtered = [];
                        for (let i = 0; i < idx.length; i += 3) {
                            const cx = (pos.getX(idx.at(i)) + pos.getX(idx.at(i + 1)) + pos.getX(idx.at(i + 2))) / 3;
                            if (pickLeft ? cx < midX : cx >= midX) {
                                filtered.push(idx.at(i), idx.at(i + 1), idx.at(i + 2));
                            }
                        }
                        if (!filtered.length) return;
                        geo.setIndex(filtered);
                    }
                    const mat = new THREE.MeshStandardMaterial({
                        color: gloveColorHex,
                        roughness: 0.45,
                        side: THREE.DoubleSide
                    });
                    const m = new THREE.Mesh(geo, mat);
                    m.castShadow = true;
                    grp.add(m);
                });

                const box = new THREE.Box3().setFromObject(grp);
                const size = new THREE.Vector3(); box.getSize(size);
                const center = new THREE.Vector3(); box.getCenter(center);
                const norm = 1.0 / (Math.max(size.x, size.y, size.z) || 1);
                grp.scale.setScalar(norm);
                grp.position.set(-center.x * norm, -box.min.y * norm, -center.z * norm);

                const u = new THREE.Group();
                u.add(grp);
                u.rotation.y = pickLeft ? Math.PI : 0;
                return u;
            }

            function attachToArm(unit, foreArm, hand) {
                const arm = foreArm || (hand && hand.parent);
                if (!arm) return;
                const wristPos = hand ? hand.position.clone() : new THREE.Vector3(0, 24, 0);
                const len = wristPos.length() || 24;
                const dir = wristPos.length() > 0.001 ? wristPos.clone().normalize() : new THREE.Vector3(0, 1, 0);

                const holder = new THREE.Group();
                holder.add(unit);
                holder.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);

                const sz = len * 2.25;
                holder.scale.setScalar(sz);
                holder.position.copy(wristPos).addScaledVector(dir, -sz * 0.04);
                arm.add(holder);
            }

            attachToArm(buildHalf(false), rightForeArmBone, rightHandBone);
            attachToArm(buildHalf(true), leftForeArmBone, leftHandBone);
            glovesLoaded = true;
        }

        let lastTime = performance.now();
        function animate(now) {
            requestAnimationFrame(animate);
            const dt = (now - lastTime) * 0.001;
            const t = now * 0.001;
            lastTime = now;

            if (mixer) mixer.update(dt);

            if (glovesLoaded) {
                if (leftHandBone) leftHandBone.scale.setScalar(0.0001);
                if (rightHandBone) rightHandBone.scale.setScalar(0.0001);

            bannerTex.offset.x += dt * 0.08;

                for (let i = 0; i < fanPositions.length; i += 2) {
                    const f = fanPositions[i];
                    const wave = Math.sin(t * 4.2 + f.phase);
                    const bounce = Math.max(0, wave) * 0.13;
                    const cosR = Math.cos(f.rotY);
                    const sinR = Math.sin(f.rotY);

                    dummy.rotation.set(0, f.rotY, 0);
                    dummy.scale.set(1.15, 1.0, 0.68);
                    dummy.position.set(f.x, f.y + 0.34 + bounce, f.z);
                    dummy.updateMatrix();
                    torsosInstanced.setMatrixAt(i, dummy.matrix);

                    dummy.scale.set(0.95, 1.08, 0.98);
                    dummy.position.set(f.x, f.y + 0.76 + bounce, f.z);
                    dummy.updateMatrix();
                    headsInstanced.setMatrixAt(i, dummy.matrix);

                    dummy.scale.set(0.98, 1.05, 1.02);
                    dummy.position.set(f.x, f.y + 0.775 + bounce, f.z);
                    dummy.updateMatrix();
                    hairsInstanced.setMatrixAt(i, dummy.matrix);

                    dummy.scale.set(1, 1, 1);
                    const armRaise = (wave > 0.3 || f.hasScarf) ? 0.34 : 0;
                    dummy.position.set(f.x - 0.27 * cosR, f.y + 0.36 + bounce + armRaise, f.z + 0.27 * sinR);
                    dummy.rotation.set((wave > 0.3 || f.hasScarf) ? -2.65 : 0, f.rotY, 0.14);
                    dummy.updateMatrix();
                    leftArmsInstanced.setMatrixAt(i, dummy.matrix);

                    const rightRaise = (f.hasPhone || f.hasScarf) ? 0.38 : armRaise;
                    dummy.position.set(f.x + 0.27 * cosR, f.y + 0.36 + bounce + rightRaise, f.z - 0.27 * sinR);
                    dummy.rotation.set((f.hasPhone || wave > 0.3 || f.hasScarf) ? -2.45 : 0, f.rotY, -0.14);
                    dummy.updateMatrix();
                    rightArmsInstanced.setMatrixAt(i, dummy.matrix);
                }
                torsosInstanced.instanceMatrix.needsUpdate = true;
                headsInstanced.instanceMatrix.needsUpdate = true;
                hairsInstanced.instanceMatrix.needsUpdate = true;
                leftArmsInstanced.instanceMatrix.needsUpdate = true;
                rightArmsInstanced.instanceMatrix.needsUpdate = true;

                for (let i = 0; i < scarfFans.length; i++) {
                    const f = scarfFans[i];
                    const wave = Math.sin(t * 4.2 + f.phase);
                    const bounce = Math.max(0, wave) * 0.13;
                    dummy.position.set(f.x, f.y + 1.04 + bounce, f.z);
                    dummy.rotation.set(0, f.rotY, Math.sin(t * 6 + f.phase) * 0.08);
                    dummy.scale.set(1, 1, 1);
                    dummy.updateMatrix();
                    scarfsInstanced.setMatrixAt(i, dummy.matrix);
                }
                scarfsInstanced.instanceMatrix.needsUpdate = true;
            }

            if (phonesInstanced.visible) {
                for (let i = 0; i < phonePositions.length; i++) {
                    const p = phonePositions[i];
                    const flash = Math.sin(t * 10 + p.phase) > 0.9 ? 1.9 : 1.0;
                    dummy.position.set(p.x, p.y, p.z);
                    dummy.lookAt(0, 1.2, 0);
                    dummy.scale.setScalar(flash);
                    dummy.updateMatrix();
                    phonesInstanced.setMatrixAt(i, dummy.matrix);
                }
                phonesInstanced.instanceMatrix.needsUpdate = true;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        requestAnimationFrame(animate);
    </script>

        (function () {
            const DB_HOST = 'test-d54a5-default-rtdb.europe-west1.firebasedatabase.app';
            const FIREBASE_DB_URL = 'https://' + DB_HOST;

            const tg = window.Telegram && window.Telegram.WebApp;
            if (tg) {
                tg.ready();
                tg.expand();

            if (!localStorage.getItem('first_played_date')) {
                const d = new Date();

            }

            let tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
            if (!tgUser) {
                try {
                    const raw = (window.location.hash || window.location.search || '').replace(/^[#?]/, '');
                    const webAppData = new URLSearchParams(raw).get('tgWebAppData');
                    if (webAppData) {
                        const userStr = new URLSearchParams(webAppData).get('user');
                        if (userStr) tgUser = JSON.parse(userStr);
                    }
                } catch (e) {}
            }

            let tgId = localStorage.getItem('tg_player_id') || '';
            let fullName = localStorage.getItem('tg_player_name') || '';
            let avatarUrl = localStorage.getItem('tg_player_avatar') || '';

            if (tgUser && tgUser.id) {
                tgId = 'tg_' + String(tgUser.id);
                const nameParts = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ').trim();
                const login = tgUser.username ? ('@' + tgUser.username) : '';
                fullName = nameParts ? (login ? `${nameParts} (${login})` : nameParts) : login;
                avatarUrl = tgUser.photo_url || '';

                localStorage.setItem('tg_player_id', tgId);
                if (fullName) localStorage.setItem('tg_player_name', fullName);
                if (avatarUrl) localStorage.setItem('tg_player_avatar', avatarUrl);
            }

            if (!tgId) return;

            const payload = {
                [tgId]: {
                    id: tgId,
                    name: fullName || ('Гравець #' + tgId.slice(-4)),
                    avatar: avatarUrl,
                    coins: Number(localStorage.getItem('player_coins') || 500),
                    wins: Number(localStorage.getItem('matches_won') || 0),
                    joinedAt: localStorage.getItem('first_played_date'),
                    kit: {
                        jersey: localStorage.getItem('eq_jerseys') || 'j1',
                        shorts: localStorage.getItem('eq_shorts') || 's1',
                        boots: localStorage.getItem('eq_boots') || 'b1',
                        hair: localStorage.getItem('eq_hair') || 'h1',
                        number: localStorage.getItem('eq_number') || '10',
                        numColor: localStorage.getItem('eq_numColor') || '#ffffff'
                    },
                    updatedAt: Date.now()
                }
            };

            const xhr = new XMLHttpRequest();
            xhr.open('PATCH', `${FIREBASE_DB_URL}/players.json`, true);
            xhr.send(JSON.stringify(payload));
        })();
