function startAmbience(){
  if(ambOn)return;
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();ambOn=true;
    const len=ac.sampleRate*6,buf=ac.createBuffer(1,len,ac.sampleRate),ch=buf.getChannelData(0);let last=0;
    for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;ch[i]=last*3.2*(0.65+0.35*Math.sin((i/len)*Math.PI*2));}
    const ns=ac.createBufferSource();ns.buffer=buf;ns.loop=true;
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=260;
    const gn=ac.createGain();gn.gain.value=0.16;ns.connect(lp);lp.connect(gn);gn.connect(ac.destination);ns.start();
  }catch(e){}
}

  }catch(e){}
}
